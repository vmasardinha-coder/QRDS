name: GATE BTC WIN WDO Cross Asset Regime Bundle Seal

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/WIN_WDO_CROSS_ASSET_REGIME_BUNDLE_SEAL_20260915.txt'
      - 'tools/gate_btc_factory/test_win_wdo_cross_asset_regime_bundle_seal.py'
      - '.github/workflows/gate-btc-win-wdo-cross-asset-regime-bundle-seal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-seal-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bundle seal
        run: python -m pytest -q tools/gate_btc_factory/test_win_wdo_cross_asset_regime_bundle_seal.py
