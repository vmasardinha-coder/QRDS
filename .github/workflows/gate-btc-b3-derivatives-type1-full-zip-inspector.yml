name: GATE BTC B3 Derivatives Type1 Full ZIP Inspector

on:
  pull_request:
    paths:
      - tools/gate_btc_factory/b3_derivatives_type1_full_zip_inspector.py
      - tests/test_gate_btc_b3_derivatives_type1_full_zip_inspector.py
      - .github/workflows/gate-btc-b3-derivatives-type1-full-zip-inspector.yml
  push:
    branches: [main]
    paths:
      - tools/gate_btc_factory/b3_derivatives_type1_full_zip_inspector.py
      - .github/workflows/gate-btc-b3-derivatives-type1-full-zip-inspector.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  RESEARCH_ONLY: 'true'
  SHADOW_ONLY: 'true'
  NOT_APPROVED: 'true'
  ENGINE_FEED: 'false'
  ORDERS: '0'
  REAL_CAPITAL: '0'
  NO_RETUNE: 'true'
  NO_BACKFILL: 'true'
  NO_COUNTER_RESET: 'true'
  FAIL_CLOSED: 'true'
  H1_ECONOMICS_READ: 'false'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert immutable research boundary
        run: |
          test "$RESEARCH_ONLY" = true
          test "$SHADOW_ONLY" = true
          test "$NOT_APPROVED" = true
          test "$ENGINE_FEED" = false
          test "$ORDERS" = 0
          test "$REAL_CAPITAL" = 0
          test "$NO_RETUNE" = true
          test "$NO_BACKFILL" = true
          test "$NO_COUNTER_RESET" = true
          test "$FAIL_CLOSED" = true
          test "$H1_ECONOMICS_READ" = false
      - name: Test type1 DRV full ZIP inspector
        run: |
          python -m pip install -q requests pytest
          python -m py_compile tools/gate_btc_factory/b3_derivatives_type1_full_zip_inspector.py
          pytest -q tests/test_gate_btc_b3_derivatives_type1_full_zip_inspector.py
      - name: Inspect exact recent official DRV ZIP
        if: github.event_name != 'pull_request'
        run: |
          python tools/gate_btc_factory/b3_derivatives_type1_full_zip_inspector.py \
            --date 2026-09-04 \
            --output artifacts/gate_btc_factory/b3_derivatives_type1_full_zip_inspection.json
      - name: Assert zero-credit boundary
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          p='artifacts/gate_btc_factory/b3_derivatives_type1_full_zip_inspection.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['strict_source_gate_green'] is False
          assert d['source_gate_credit'] == 0
          assert d['historical_backfill_credit'] == 0
          assert d['prospective_credit'] == 0
          assert d['economics_read'] is False
          assert d['full_161_session_coverage_proven'] is False
          s=d['safety']
          assert s['research_only'] and s['shadow_only'] and s['not_approved'] and s['fail_closed']
          assert s['engine_feed'] is False and s['orders']==0 and s['real_capital']==0
          assert s['no_retune'] and s['no_backfill'] and s['no_counter_reset']
          assert s['h1_economics_read'] is False
          print('B3_TYPE1_DRV_FULL_ZIP_BOUNDARY=PASS_ZERO_CREDIT')
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: gate-btc-b3-type1-drv-full-zip-${{ github.run_id }}
          path: artifacts/gate_btc_factory/b3_derivatives_type1_full_zip_inspection.json
          retention-days: 30
          if-no-files-found: error
