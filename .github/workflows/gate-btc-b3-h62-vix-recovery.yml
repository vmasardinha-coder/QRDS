name: GATE BTC B3 H62 VIX Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_b3_h62_vix_recovery.py'
      - '.github/workflows/gate-btc-b3-h62-vix-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_NOT_APPROVED: 'true'
  GATE_BTC_ORDERS: '0'
  GATE_BTC_REAL_CAPITAL: '0'
  GATE_BTC_ENGINE_FEED: 'false'

jobs:
  recover-h62:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: Run H62 with official Cboe VIX and explicit US date parsing
        run: |
          python tools/gate_btc_b3_h62_vix_recovery.py \
            --out /tmp/B3_H62_VIX_RECOVERY.json \
            --ledger /tmp/B3_H62_VIX_LEDGER.jsonl \
            --cells /tmp/B3_H62_VIX_CELLS.csv
      - name: Assert scientific and safety boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/B3_H62_VIX_RECOVERY.json'))
          assert p['cutoff_exclusive']=='2026-08-10'
          assert p['source']['provider']=='Cboe Global Markets'
          assert p['source']['status']=='PASS'
          assert p['source']['discovery_join_coverage']>=0.90
          assert p['source']['replication_join_coverage']>=0.90
          assert p['h1_economics_read'] is False
          assert p['survivor_partial_economics_read'] is False
          assert p['orders_generated']==0 and p['real_capital_used']==0 and p['engine_feed'] is False
          assert p['state'] in {'SURVIVOR_REPLICATED','REJECTED_FAILED_REPLICATION','REJECTED_DISCOVERY'}
          print('B3_H62_VIX_RECOVERY=PASS',p['state'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b3-h62-vix-recovery-${{ github.run_id }}
          path: |
            /tmp/B3_H62_VIX_RECOVERY.json
            /tmp/B3_H62_VIX_LEDGER.jsonl
            /tmp/B3_H62_VIX_CELLS.csv
          retention-days: 30
          if-no-files-found: error
