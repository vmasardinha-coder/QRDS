name: GATE BTC B3 H180-H189 Treasury Source QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/b3_h180_h189_treasury_prereg.md'
      - 'tools/gate_btc_b3_h180_h189_treasury_source_qa.py'
      - '.github/workflows/gate-btc-b3-h180-h189-treasury-source-qa.yml'

permissions:
  contents: read

jobs:
  source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GATE_BTC_RESEARCH_ONLY: 'true'
      ORDERS: '0'
      REAL_CAPITAL: '0'
      ENGINE_FEED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile tools/gate_btc_b3_h180_h189_treasury_source_qa.py
      - name: Verify frozen prereg safety markers
        run: |
          grep -q 'Frozen before any H180-H189 economics' research/b3_h180_h189_treasury_prereg.md
          grep -q '2026-08-10' research/b3_h180_h189_treasury_prereg.md
          grep -q 'ORDERS=0' research/b3_h180_h189_treasury_prereg.md
          grep -q 'ENGINE_FEED=false' research/b3_h180_h189_treasury_prereg.md
      - name: Official Treasury source QA
        run: python tools/gate_btc_b3_h180_h189_treasury_source_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b3-h180-h189-treasury-source-qa-${{ github.run_id }}
          path: b3_h180_h189_treasury_source_qa.json
          if-no-files-found: warn
          retention-days: 90
