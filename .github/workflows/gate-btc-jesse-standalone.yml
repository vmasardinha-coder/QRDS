name: GATE BTC Jesse standalone research
on:
  push:
    branches: [research/jesse-standalone]
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned transport dependency
        run: pip install 'git+https://github.com/ccxt/ccxt.git@6c98f320d87cab3fe2224a65bd293dd15673c31d#subdirectory=python'
      - name: Run clean Dual Thrust test
        run: python artifacts/gate_btc_2/jesse_research/dual_thrust_clean_test.py | tee artifacts/gate_btc_2/jesse_research/dual_thrust_result.json
      - name: Verify isolation
        run: |
          git diff --exit-code origin/main...HEAD -- ':!artifacts/gate_btc_2/jesse_research/**' ':!.github/workflows/gate-btc-jesse-standalone.yml'
      - uses: actions/upload-artifact@v4
        with:
          name: gate-btc-jesse-standalone
          path: artifacts/gate_btc_2/jesse_research/
