name: GATE BTC 2 V2A USDGO OSL Qualification
on:
  pull_request:
    paths:
      - tools/gate_btc_2_v2a_usdgo_osl_qualification.py
      - .github/workflows/gate-btc-2-v2a-usdgo-osl-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify-usdgo-osl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile qualifier
        run: python -m py_compile tools/gate_btc_2_v2a_usdgo_osl_qualification.py
      - name: Capture exact OSL USDGO/USD evidence
        run: python tools/gate_btc_2_v2a_usdgo_osl_qualification.py --output-dir artifacts/gate_btc_2/usdgo_osl_qualification
      - name: Assert zero-credit boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/gate_btc_2/usdgo_osl_qualification/SUMMARY.json'))
          assert d['qualification_only'] and d['source_admitted'] is False and d['registry_mutated'] is False and d['denominator_changed'] is False
          assert d['historical_credit']==0 and d['scientific_credit'] is False and d['prospective_credit'] is False and d['d0_credit']==0 and d['d0_started'] is False
          assert d['research_only'] and d['shadow_only'] and d['not_approved'] and d['fail_closed']
          assert d['engine_feed'] is False and d['orders_generated']==0 and d['real_capital_brl']==0
          assert d['no_retune'] and d['no_backfill'] and d['no_counter_reset'] and d['no_silent_source_substitution']
          print('USDGO_OSL_BOUNDARY=PASS_ZERO_CREDIT')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gate-btc-2-v2a-usdgo-osl-${{ github.run_id }}
          path: artifacts/gate_btc_2/usdgo_osl_qualification/
          retention-days: 90
          if-no-files-found: error
