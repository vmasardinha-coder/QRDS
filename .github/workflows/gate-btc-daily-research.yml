name: GATE BTC Daily Research Collection

on:
  workflow_dispatch:
    inputs:
      data_cutoff:
        description: Optional completed UTC close (YYYY-MM-DD)
        required: false
        type: string
  schedule:
    - cron: "15 0 * * *"
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-daily-research.yml
      - .github/workflows/gate-btc-daily-fallback.yml
      - tools/gate_btc_daily_research.py
      - tools/gate_btc_shadow_delivery.py
      - tools/gate_btc_generate_shadow_models.py
      - tests/test_gate_btc_daily_research.py
      - tests/test_gate_btc_shadow_delivery.py
      - tools/qos_orchestrator.py
      - tools/gateway_upstream_equivalence.py
      - tools/gateway_upstream_equivalence_v2.py
      - tools/gateway_upstream_equivalence_v3.py
      - tools/gateway_capture_site/**
      - tools/gateway_frozen_replay.py
      - tools/v2a_frozen_replay.py
      - tools/delta_frozen_replay.py
      - migration/canonical/**
      - migration/gateway/**
      - migration/reporting/**
  push:
    branches:
      - agent/gate-btc-actions-migration
      - agent/gate-btc-autonomous-shadow-models
    paths:
      - .github/workflows/gate-btc-daily-research.yml
      - tools/gate_btc_daily_research.py
      - tools/gate_btc_shadow_delivery.py
      - tools/gate_btc_generate_shadow_models.py
      - tests/test_gate_btc_daily_research.py
      - tests/test_gate_btc_shadow_delivery.py
      - tools/qos_orchestrator.py
      - tools/gateway_upstream_equivalence.py
      - tools/gateway_upstream_equivalence_v2.py
      - tools/gateway_upstream_equivalence_v3.py
      - tools/gateway_capture_site/**
      - tools/gateway_frozen_replay.py
      - tools/v2a_frozen_replay.py
      - tools/delta_frozen_replay.py
      - migration/canonical/**
      - migration/gateway/**
      - migration/reporting/**

permissions:
  contents: read

concurrency:
  group: gate-btc-daily-research-${{ github.ref }}
  cancel-in-progress: false

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  daily-research-collection:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            migration/canonical/v2a/requirements.txt
            migration/canonical/delta/requirements.txt
            migration/canonical/gateway/requirements.txt
      - name: Install canonical research dependencies
        run: >-
          pip install
          -r migration/canonical/v2a/requirements.txt
          -r migration/canonical/delta/requirements.txt
          -r migration/canonical/gateway/requirements.txt
          reportlab
      - name: Test daily handoff and fail-closed locks
        run: >-
          python -m unittest -v
          tests/test_gate_btc_daily_research.py
          tests/test_gate_btc_shadow_delivery.py
      - name: Resolve most recent completed UTC close
        env:
          REQUESTED_CUTOFF: ${{ inputs.data_cutoff || '' }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          requested = os.environ.get('REQUESTED_CUTOFF', '').strip()
          cutoff = requested or (datetime.now(timezone.utc).date() - timedelta(days=1)).isoformat()
          datetime.strptime(cutoff, '%Y-%m-%d')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'GATE_BTC_DATA_CUTOFF={cutoff}\n')
          print(f'GATE_BTC_DATA_CUTOFF={cutoff}')
          PY
      - name: Materialize canonical Gateway source payload
        run: >-
          cat migration/canonical/gateway/payload/gateway_v010_canonical_source.zip.b64.part-*
          > migration/canonical/gateway/gateway_v010_canonical_source.zip.b64
      - name: Collect and freeze V2A and Delta
        run: >-
          python tools/qos_orchestrator.py
          --public-data
          --data-cutoff "$GATE_BTC_DATA_CUTOFF"
          --output-dir artifacts/qos_daily
      - name: Collect Gateway public inputs and replay them offline
        run: >-
          python tools/gateway_upstream_equivalence_v3.py capture-replay
          --output-dir artifacts/gateway_daily
          --timeout-seconds 1800
      - name: Revalidate admitted Gateway downstream reference
        run: >-
          python tools/gateway_frozen_replay.py
          --output-dir artifacts/gateway_reference_check
      - name: Build fail-closed daily handoff
        run: >-
          python tools/gate_btc_daily_research.py
          --qos-dir artifacts/qos_daily
          --gateway-dir artifacts/gateway_daily
          --gateway-reference-dir artifacts/gateway_reference_check
          --data-cutoff "$GATE_BTC_DATA_CUTOFF"
          --output-dir artifacts/daily_handoff
      - name: Bind immutable Shadow delivery request to this run
        run: >-
          python tools/gate_btc_shadow_delivery.py request
          --handoff-dir artifacts/daily_handoff
          --output artifacts/daily_handoff/GATE_BTC_SHADOW_DELIVERY_REQUEST.json
      - name: Package current artifact inputs for autonomous renderer
        run: |
          cd artifacts
          zip -qr gate-btc-render-input.zip qos_daily gateway_reference_check gateway_daily daily_handoff
      - name: Generate the three canonical Shadow Watch PDF models
        run: >-
          python tools/gate_btc_generate_shadow_models.py
          --artifact artifacts/gate-btc-render-input.zip
          --out artifacts/shadow_reports
      - name: Validate exact autonomous PDF set
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/shadow_reports')
          pdfs = sorted(root.glob('*.pdf'))
          assert len(pdfs) == 3, [p.name for p in pdfs]
          expected = ('Reconciled_FullSet_v13_Master', 'v20_Comparativos_Completos_FINAL', 'Profit_Preservation')
          names = ' '.join(p.name for p in pdfs)
          for token in expected:
              assert token in names, token
          for p in pdfs:
              assert p.stat().st_size >= 20000, (p.name, p.stat().st_size)
              assert p.read_bytes().startswith(b'%PDF-'), p.name
          manifest = json.loads((root/'GATE_BTC_SHADOW_REPORT_MANIFEST.json').read_text())
          assert manifest['research_only'] is True
          assert manifest['not_approved'] is True
          assert manifest['orders'] == 0
          assert manifest['capital'] == 0
          print([p.name for p in pdfs])
          PY
      - name: Upload daily report inputs, PDFs and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-daily-research-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
