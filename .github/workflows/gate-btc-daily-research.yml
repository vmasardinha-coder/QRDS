name: GATE BTC Daily Research Collection

on:
  workflow_dispatch:
    inputs:
      data_cutoff:
        description: Optional completed UTC close (YYYY-MM-DD)
        required: false
        type: string
  schedule:
    - cron: "15 0 * * *"
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-daily-research.yml
      - .github/workflows/gate-btc-daily-fallback.yml
      - tools/gate_btc_daily_research.py
      - tools/gate_btc_shadow_delivery.py
      - tests/test_gate_btc_daily_research.py
      - tests/test_gate_btc_shadow_delivery.py
      - tools/qos_orchestrator.py
      - tools/gateway_upstream_equivalence.py
      - tools/gateway_upstream_equivalence_v2.py
      - tools/gateway_upstream_equivalence_v3.py
      - tools/gateway_capture_site/**
      - tools/gateway_frozen_replay.py
      - tools/v2a_frozen_replay.py
      - tools/delta_frozen_replay.py
      - migration/canonical/**
      - migration/gateway/**
      - migration/reporting/**
  push:
    branches: [agent/gate-btc-actions-migration]
    paths:
      - .github/workflows/gate-btc-daily-research.yml
      - tools/gate_btc_daily_research.py
      - tools/gate_btc_shadow_delivery.py
      - tests/test_gate_btc_daily_research.py
      - tests/test_gate_btc_shadow_delivery.py
      - tools/qos_orchestrator.py
      - tools/gateway_upstream_equivalence.py
      - tools/gateway_upstream_equivalence_v2.py
      - tools/gateway_upstream_equivalence_v3.py
      - tools/gateway_capture_site/**
      - tools/gateway_frozen_replay.py
      - tools/v2a_frozen_replay.py
      - tools/delta_frozen_replay.py
      - migration/canonical/**
      - migration/gateway/**
      - migration/reporting/**

permissions:
  contents: read

concurrency:
  group: gate-btc-daily-research-${{ github.ref }}
  cancel-in-progress: false

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  daily-research-collection:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            migration/canonical/v2a/requirements.txt
            migration/canonical/delta/requirements.txt
            migration/canonical/gateway/requirements.txt
      - name: Install canonical research dependencies
        run: >-
          pip install
          -r migration/canonical/v2a/requirements.txt
          -r migration/canonical/delta/requirements.txt
          -r migration/canonical/gateway/requirements.txt
      - name: Test daily handoff and fail-closed locks
        run: >-
          python -m unittest -v
          tests/test_gate_btc_daily_research.py
          tests/test_gate_btc_shadow_delivery.py
      - name: Resolve most recent completed UTC close
        env:
          REQUESTED_CUTOFF: ${{ inputs.data_cutoff || '' }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          requested = os.environ.get('REQUESTED_CUTOFF', '').strip()
          cutoff = requested or (datetime.now(timezone.utc).date() - timedelta(days=1)).isoformat()
          datetime.strptime(cutoff, '%Y-%m-%d')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'GATE_BTC_DATA_CUTOFF={cutoff}\n')
          print(f'GATE_BTC_DATA_CUTOFF={cutoff}')
          PY
      - name: Materialize canonical Gateway source payload
        run: >-
          cat migration/canonical/gateway/payload/gateway_v010_canonical_source.zip.b64.part-*
          > migration/canonical/gateway/gateway_v010_canonical_source.zip.b64
      - name: Collect and freeze V2A and Delta
        run: >-
          python tools/qos_orchestrator.py
          --public-data
          --data-cutoff "$GATE_BTC_DATA_CUTOFF"
          --output-dir artifacts/qos_daily
      - name: Collect Gateway public inputs and replay them offline
        run: >-
          python tools/gateway_upstream_equivalence_v3.py capture-replay
          --output-dir artifacts/gateway_daily
          --timeout-seconds 1800
      - name: Revalidate admitted Gateway downstream reference
        run: >-
          python tools/gateway_frozen_replay.py
          --output-dir artifacts/gateway_reference_check
      - name: Build fail-closed daily handoff
        run: >-
          python tools/gate_btc_daily_research.py
          --qos-dir artifacts/qos_daily
          --gateway-dir artifacts/gateway_daily
          --gateway-reference-dir artifacts/gateway_reference_check
          --data-cutoff "$GATE_BTC_DATA_CUTOFF"
          --output-dir artifacts/daily_handoff
      - name: Bind immutable Shadow delivery request to this run
        run: >-
          python tools/gate_btc_shadow_delivery.py request
          --handoff-dir artifacts/daily_handoff
          --output artifacts/daily_handoff/GATE_BTC_SHADOW_DELIVERY_REQUEST.json
      - name: Build deterministic latest-run pointer
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          request_path = Path('artifacts/daily_handoff/GATE_BTC_SHADOW_DELIVERY_REQUEST.json')
          request_bytes = request_path.read_bytes()
          pointer = {
              'schema_version': '1.0.0',
              'workflow_name': 'GATE BTC Daily Research Collection',
              'workflow_file': '.github/workflows/gate-btc-daily-research.yml',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'event_name': os.environ['GITHUB_EVENT_NAME'],
              'branch': os.environ['GITHUB_REF_NAME'],
              'head_sha': os.environ['GITHUB_SHA'],
              'data_cutoff': os.environ['GATE_BTC_DATA_CUTOFF'],
              'artifact_name': f"gate-btc-daily-research-{os.environ['GITHUB_RUN_ID']}",
              'delivery_request_path': 'artifacts/daily_handoff/GATE_BTC_SHADOW_DELIVERY_REQUEST.json',
              'delivery_request_sha256': hashlib.sha256(request_bytes).hexdigest(),
              'research_only': True,
              'operational_status': 'NOT_APPROVED',
              'orders_generated': 0,
              'real_capital_used': 0,
              'published_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          output = Path('artifacts/runtime_pointer/GATE_BTC_LATEST_ELIGIBLE_RUN.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(pointer, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(output.read_text(encoding='utf-8'))
          PY
      - name: Upload daily report inputs and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-daily-research-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  publish-runtime-pointer:
    needs: daily-research-collection
    if: >-
      needs.daily-research-collection.result == 'success' &&
      github.event_name != 'pull_request' &&
      github.ref_name == 'main'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download validated daily evidence
        uses: actions/download-artifact@v4
        with:
          name: gate-btc-daily-research-${{ github.run_id }}
          path: daily_evidence
      - name: Check out runtime branch only
        uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 0
      - name: Publish deterministic pointer to runtime branch
        run: |
          set -euo pipefail
          test -f daily_evidence/runtime_pointer/GATE_BTC_LATEST_ELIGIBLE_RUN.json
          git -C runtime_repo config user.name "gate-btc-actions"
          git -C runtime_repo config user.email "gate-btc-actions@users.noreply.github.com"
          mkdir -p runtime_repo/runtime
          cp daily_evidence/runtime_pointer/GATE_BTC_LATEST_ELIGIBLE_RUN.json runtime_repo/runtime/GATE_BTC_LATEST_ELIGIBLE_RUN.json
          git -C runtime_repo add runtime/GATE_BTC_LATEST_ELIGIBLE_RUN.json
          if git -C runtime_repo diff --cached --quiet; then
            echo "Runtime pointer already current"
          else
            git -C runtime_repo commit -m "Update latest eligible GATE BTC run pointer"
            git -C runtime_repo push origin HEAD:gate-btc-runtime
          fi
