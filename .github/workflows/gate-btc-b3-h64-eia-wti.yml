name: GATE BTC B3 H64 EIA WTI

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_b3_h64_eia_wti.py'
      - '.github/workflows/gate-btc-b3-h64-eia-wti.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_NOT_APPROVED: 'true'
  GATE_BTC_ORDERS: '0'
  GATE_BTC_REAL_CAPITAL: '0'
  GATE_BTC_ENGINE_FEED: 'false'

jobs:
  h64-eia-wti:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests xlrd
      - name: Bind official EIA WTI and run exact preregistered H64 WTI budget if data gate passes
        run: |
          python tools/gate_btc_b3_h64_eia_wti.py \
            --out /tmp/B3_H64_EIA_WTI.json \
            --ledger /tmp/B3_H64_EIA_LEDGER.jsonl \
            --cells /tmp/B3_H64_EIA_CELLS.csv
      - name: Assert fail-closed scientific and safety boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/B3_H64_EIA_WTI.json'))
          assert p['family']=='H64' and p['cutoff_exclusive']=='2026-08-10'
          assert p['thresholds']==[1.0,1.5]
          assert set(p['mappings'])=={'same','opposite'}
          assert p['horizons']==[60,120]
          assert p['state'] in {'SURVIVOR_REPLICATED','REJECTED_FAILED_REPLICATION','REJECTED_DISCOVERY','DATA_GAP'}
          if p['state']=='DATA_GAP':
              assert p['source']['status']=='DATA_GAP'
              assert p['source']['economics_run'] is False
          else:
              assert p['source']['status']=='PASS'
              assert p['source']['provider']=='U.S. Energy Information Administration'
              assert p['source']['discovery_join_coverage']>=0.90
              assert p['source']['replication_join_coverage']>=0.90
              assert p['source']['economics_run'] is True
          assert p['synthetic_backfill'] is False
          assert p['h1_economics_read'] is False and p['survivor_partial_economics_read'] is False
          assert p['orders_generated']==0 and p['real_capital_used']==0 and p['engine_feed'] is False
          print('B3_H64_EIA_WTI=PASS_FAIL_CLOSED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b3-h64-eia-wti-${{ github.run_id }}
          path: |
            /tmp/B3_H64_EIA_WTI.json
            /tmp/B3_H64_EIA_LEDGER.jsonl
            /tmp/B3_H64_EIA_CELLS.csv
          retention-days: 30
          if-no-files-found: error
