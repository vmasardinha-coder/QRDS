name: PIT150 Closeout Validation
on:
  pull_request:
    branches: [main]
    paths:
      - tools/gate_btc_usx_pool_history.py
      - tests/test_gate_btc_usx_pool_history.py
      - 'tools/gate_btc_pit150_qualified_history.py'
      - 'tools/gate_btc_a7a5_swap_history.py'
      - 'tools/gate_btc_reusd_swap_history.py'
      - 'tools/v2a_frozen_replay.py'
      - 'tests/test_v2a_frozen_replay.py'
      - 'tools/gate_btc_pit150_akt_preflight.py'
      - 'tests/test_gate_btc_pit150_akt_gate.py'
      - 'migration/canonical/v2a/scripts/00_run_all_v2a.py'
      - 'artifacts/gate_btc_2/pit150_delivery_20261017/AKT_NATIVE_GATE_RAW.zip'
      - 'artifacts/gate_btc_2/pit150_delivery_20261017/FROZEN_FAILED_SOURCE.zip'
      - 'tools/gate_btc_hash_settlement_history.py'
      - 'tools/gate_btc_pit150_figure_history_audit.py'
      - 'tests/test_gate_btc_hash_settlement_history.py'
      - 'artifacts/gate_btc_2/pit150_hash_kinesis_20261016/fixtures/*.zip'
      - 'tests/test_gate_btc_reusd_swap_history.py'
      - 'tools/gate_btc_pit150_usdy_capture.py'
      - 'tools/gate_btc_pit150_source_crosswalk.py'
      - 'tools/gate_btc_pit150_retry_policy.py'
      - 'tools/gate_btc_pit150_retry_policy.json'
      - 'tests/test_gate_btc_pit150_source_crosswalk.py'
      - 'tests/test_gate_btc_pit150_qualified_history.py'
      - 'tools/gate_btc_pit150_closeout_probe.py'
      - '.github/workflows/gate-btc-pit150-closeout-validation.yml'
concurrency:
  group: pit150-closeout-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  official-host-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_gate_btc_pit150_qualified_history.BybitOfficialHostTests tests.test_gate_btc_pit150_qualified_history.BybitPublicCaptureTests tests.test_gate_btc_pit150_qualified_history.BybitCapturePublisherTests tests.test_gate_btc_pit150_source_crosswalk tests.test_gate_btc_reusd_swap_history tests.test_gate_btc_hash_settlement_history -v
  public-host-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m tools.gate_btc_pit150_closeout_probe --out artifacts/pit150_public_host_probe
      - name: Validate pinned public capture with read-only API access
        env:
          GATE_BTC_PUBLIC_CAPTURE_READ_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, pathlib, requests
          from datetime import datetime, timedelta, timezone
          from tools.gate_btc_pit150_qualified_history import load_bybit_public_capture, ROUTES, BYBIT_CAPTURE_BRANCH, BYBIT_CAPTURE_REPOSITORY
          now = datetime.now(timezone.utc)
          requested_cutoff = (now - timedelta(days=1)).date()
          # This is a transport/pinning preflight, not admission of today's close.
          # Immediately after UTC midnight the new native capture may not exist.
          import os
          response = requests.get(
              f"https://api.github.com/repos/{BYBIT_CAPTURE_REPOSITORY}/commits",
              params={"sha":BYBIT_CAPTURE_BRANCH,"per_page":1},
              headers={"Authorization":"Bearer " + os.environ["GATE_BTC_PUBLIC_CAPTURE_READ_TOKEN"]}, timeout=30)
          response.raise_for_status()
          published = datetime.fromisoformat(response.json()[0]["commit"]["committer"]["date"].replace("Z","+00:00"))
          if published.tzinfo is None or published > now:
              raise ValueError("capture publication is future or timezone missing")
          available_cutoff = min(requested_cutoff, published.date() - timedelta(days=1))
          if (requested_cutoff - available_cutoff).days > 1:
              raise ValueError("pinned capture is more than one cutoff behind")
          cutoff = available_cutoff.isoformat()
          out = pathlib.Path('artifacts/pit150_public_host_probe/required_capture')
          rows, receipt = load_bybit_public_capture(requests.Session(), ROUTES['USDY'], 'USDY', cutoff, out, now=now)
          assert len(rows) >= 200 and rows[-1]['date'] == cutoff
          result = {'status':'PASS_PINNED_PUBLIC_CAPTURE', 'cutoff':cutoff, 'requested_cutoff':requested_cutoff.isoformat(), 'freshness':'CURRENT' if cutoff == requested_cutoff.isoformat() else 'WAIT_LATEST_NATIVE_CAPTURE', 'runtime_admission':False, 'rows':len(rows), 'receipt':receipt, 'orders':0}
          (out/'RESULT.json').write_text(json.dumps(result, indent=2)+'\n')
          print(json.dumps({'status':result['status'], 'rows':len(rows), 'cutoff':cutoff}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pit150-public-host-probe
          path: artifacts/pit150_public_host_probe/
  reusd-native-public-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m tools.gate_btc_reusd_swap_history --out artifacts/pit150_reusd_native_preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pit150-reusd-native-preflight
          path: artifacts/pit150_reusd_native_preflight/

  hash-native-reconciled-public-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m tools.gate_btc_hash_settlement_history --out artifacts/pit150_hash_native_preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pit150-hash-native-preflight
          path: artifacts/pit150_hash_native_preflight/

  frozen-v2a-replay-and-akt-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r migration/canonical/v2a/requirements.txt
      - run: python -m unittest tests.test_gate_btc_pit150_retry_policy tests.test_gate_btc_kag_retry_cutoff -v
      - run: python -m unittest tests.test_v2a_frozen_replay tests.test_gate_btc_pit150_qualified_history tests.test_gate_btc_pit150_akt_gate tests.test_gate_btc_pit150_source_crosswalk -v
      - run: python tools/v2a_frozen_replay.py artifacts/gate_btc_2/pit150_delivery_20261017/FROZEN_FAILED_SOURCE.zip --output-zip artifacts/pit150_fixed_replay/qos_v2a_outputs.zip --data-cutoff 2026-10-16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pit150-fixed-frozen-replay
          path: artifacts/pit150_fixed_replay/
  akt-native-public-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m tools.gate_btc_pit150_akt_preflight --out artifacts/pit150_akt_native_preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pit150-akt-native-preflight
          path: artifacts/pit150_akt_native_preflight/

