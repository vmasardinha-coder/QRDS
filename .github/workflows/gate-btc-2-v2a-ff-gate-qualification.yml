name: GATE BTC 2 V2A FF Gate Qualification

on:
  pull_request:
    paths:
      - 'tools/gate_btc_2_v2a_ff_gate_qualification_runner.py'
      - 'tests/test_gate_btc_2_v2a_ff_gate_qualification_runner.py'
      - '.github/workflows/gate-btc-2-v2a-ff-gate-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_gate_btc_2_v2a_ff_gate_qualification_runner.py
      - name: Physical qualification capture
        run: python tools/gate_btc_2_v2a_ff_gate_qualification_runner.py --end 2026-09-02
      - name: Safety assertions
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/gate_btc_2/v2a_ff_gate_qualification/SUMMARY.json')
          s=json.loads(p.read_text())
          assert s['research_only'] and s['shadow_only'] and s['not_approved']
          assert s['engine_feed'] is False and s['orders']==0 and s['real_capital_brl']==0
          assert s['no_retune'] and s['no_backfill'] and s['no_counter_reset']
          assert s['no_silent_source_substitution'] and s['fail_closed']
          assert s['scientific_credit'] is False and s['prospective_credit'] is False
          assert s['historical_coverage_sufficiency_asserted'] is False
          assert s['retroactive_v2a_repair_allowed'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-btc-2-v2a-ff-gate-qualification
          path: artifacts/gate_btc_2/v2a_ff_gate_qualification/
          if-no-files-found: error
