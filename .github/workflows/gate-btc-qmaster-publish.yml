name: GATE BTC QMASTER Publisher

on:
  workflow_run:
    workflows: ["GATE BTC Daily Research Collection"]
    types: [completed]
  schedule:
    - cron: "30 2 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/gate-btc-qmaster-publish.yml"
      - "tools/gate_btc_qmaster_export.py"
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional Daily Research run id to republish
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: gate-btc-qmaster-publisher
  cancel-in-progress: false

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  publish-qmaster:
    # Sem exigir a run inteira verde. A conclusao da run de coleta carrega jobs
    # irmaos com outros datasets -- entre eles o prospective-v2a-pit, que roda sem
    # needs e falha sozinho. Exigir a run verde aqui deixava a publicacao sem
    # rodar nos dias em que o dado que ela le estava perfeito: foi assim que um
    # simbolo delistado segurou o V11 por quatro dias. O portao real e o passo
    # 'Gate on the producer job' abaixo, e ele falha fechado.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main exporter
        uses: actions/checkout@v4
        with:
          ref: main
          path: source_repo

      - name: Check out runtime branch
        uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 0

      - name: Resolve source run id
        id: source
        env:
          MANUAL_RUN_ID: ${{ inputs.run_id || '' }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          run_id="${MANUAL_RUN_ID:-${WORKFLOW_RUN_ID:-}}"
          if [ -z "$run_id" ]; then
            test -s runtime_repo/runtime/GATE_BTC_LATEST_ELIGIBLE_RUN.json
            run_id="$(python - <<'PY'
          import json
          p='runtime_repo/runtime/GATE_BTC_LATEST_ELIGIBLE_RUN.json'
          s=json.load(open(p,encoding='utf-8'))
          assert s['workflow_name']=='GATE BTC Daily Research Collection'
          assert s['branch']=='main'
          assert s['research_only'] is True
          assert s['operational_status']=='NOT_APPROVED'
          assert s['orders_generated']==0
          assert s['real_capital_used']==0
          print(int(s['run_id']))
          PY
          )"
          fi
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "QMASTER_SOURCE_RUN_ID=$run_id"

      - name: Gate on the producer job
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > source_run.json
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100" > source_jobs.json
          python - <<'PY'
          import json
          run=json.load(open('source_run.json', encoding='utf-8'))
          assert run['name']=='GATE BTC Daily Research Collection', run['name']
          assert run['head_branch']=='main', run['head_branch']
          assert run['status']=='completed', run['status']
          # O artefato publicado aqui e gate-btc-daily-research-<run_id>, produzido
          # apenas pelo job daily-research-collection. A conclusao da run inteira
          # carrega jobs irmaos que leem outros datasets e podem falhar sozinhos.
          jobs=json.load(open('source_jobs.json', encoding='utf-8'))['jobs']
          producer=[j for j in jobs if j['name']=='daily-research-collection']
          assert len(producer)==1, len(producer)
          assert producer[0]['status']=='completed', producer[0]['status']
          assert producer[0]['conclusion']=='success', producer[0]['conclusion']
          PY

      - name: Download Daily Research evidence
        uses: actions/download-artifact@v4
        with:
          name: gate-btc-daily-research-${{ steps.source.outputs.run_id }}
          path: daily_evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Export canonical QMASTER sidecar
        run: >-
          python source_repo/tools/gate_btc_qmaster_export.py
          --source-zip daily_evidence/qos_daily/qos_v2a_public_collection.zip
          --output-dir qmaster_out

      - name: Validate QMASTER output
        run: |
          set -euo pipefail
          test -s qmaster_out/GATE_BTC_QMASTER_LATEST.txt
          test -s qmaster_out/GATE_BTC_QMASTER_LATEST.csv
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('qmaster_out/GATE_BTC_QMASTER_LATEST.txt').read_text(encoding='utf-8'))
          assert state['status'] == 'PASS'
          assert state['research_only'] is True
          assert state['operational_status'] == 'NOT_APPROVED'
          assert state['orders_generated'] == 0
          assert state['real_capital_used'] == 0
          assert state['methodology_changed'] is False
          assert state['rows'] > 0
          assert state['symbols'] > 0
          print(json.dumps(state, indent=2, sort_keys=True))
          PY

      - name: Upload canonical QMASTER artifact
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-qmaster-latest-${{ steps.source.outputs.run_id }}
          path: |
            qmaster_out/GATE_BTC_QMASTER_LATEST.txt
            qmaster_out/GATE_BTC_QMASTER_LATEST.csv
          if-no-files-found: error
          retention-days: 30

      - name: Publish QMASTER to canonical runtime paths
        run: |
          set -euo pipefail
          git -C runtime_repo config user.name "gate-btc-actions"
          git -C runtime_repo config user.email "gate-btc-actions@users.noreply.github.com"
          mkdir -p runtime_repo/runtime/qmaster
          cp qmaster_out/GATE_BTC_QMASTER_LATEST.txt runtime_repo/runtime/GATE_BTC_QMASTER_LATEST.txt
          cp qmaster_out/GATE_BTC_QMASTER_LATEST.csv runtime_repo/runtime/GATE_BTC_QMASTER_LATEST.csv
          cp qmaster_out/GATE_BTC_QMASTER_LATEST.txt runtime_repo/runtime/qmaster/GATE_BTC_QMASTER_LATEST.txt
          cp qmaster_out/GATE_BTC_QMASTER_LATEST.csv runtime_repo/runtime/qmaster/GATE_BTC_QMASTER_LATEST.csv
          git -C runtime_repo add runtime/GATE_BTC_QMASTER_LATEST.txt runtime/GATE_BTC_QMASTER_LATEST.csv runtime/qmaster/
          if git -C runtime_repo diff --cached --quiet; then
            echo "QMASTER already current"
            exit 0
          fi
          git -C runtime_repo commit -m "Publish canonical QMASTER sidecar"
          for attempt in 1 2 3 4 5; do
            git -C runtime_repo fetch origin gate-btc-runtime
            if ! git -C runtime_repo rebase origin/gate-btc-runtime; then
              git -C runtime_repo rebase --abort || true
              exit 1
            fi
            if git -C runtime_repo push origin HEAD:gate-btc-runtime; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
