name: GATE BTC Bitfinex Exact Residual Probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-bitfinex-residual-exact-probe.yml
      - tools/gate_btc_bitfinex_residual_exact_probe.py
      - tests/test_gate_btc_bitfinex_residual_exact_probe.py

concurrency:
  group: gate-btc-bitfinex-exact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  exact-residual-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: pip install 'pandas>=2,<3' 'requests>=2,<3'
      - name: Test exact-pair safety invariants
        run: python -m unittest -v tests/test_gate_btc_bitfinex_residual_exact_probe.py
      - name: Query exact Bitfinex public trade history
        run: python tools/gate_btc_bitfinex_residual_exact_probe.py --outdir artifacts/bitfinex_exact_residual
      - name: Verify research-only evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/bitfinex_exact_residual/BITFINEX_EXACT_RESIDUAL_SUMMARY.json').read_text())
          assert p['research_only'] is True
          assert p['shadow_only'] is True
          assert p['not_approved'] is True
          assert p['exact_pair_only'] is True
          assert p['relabeling'] is False
          assert p['cross_token_stitching'] is False
          assert p['integration_eligible'] is False
          assert p['source_substitution_performed'] is False
          assert p['methodology_changes'] == 0
          assert p['engine_feed'] is False
          assert p['orders_generated'] == 0
          assert p['real_capital_used'] == 0
          print('BITFINEX_EXACT_RESIDUAL_CONTRACT=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gate-btc-bitfinex-exact-residual-${{ github.run_id }}
          path: artifacts/bitfinex_exact_residual
          if-no-files-found: error
          retention-days: 14
