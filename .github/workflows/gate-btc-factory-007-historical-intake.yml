name: GATE BTC Factory 007 Historical Intake
'on':
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'tools/gate_btc_factory/grammar_007_historical_intake.py'
      - 'tests/test_gate_btc_grammar_007_historical_intake.py'
      - '.github/workflows/gate-btc-factory-007-historical-intake.yml'
permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source_repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: cd source_repo && pytest -q tests/test_gate_btc_grammar_007_historical_intake.py
      - name: Smoke intake with outcome-blind qualified-family fixture
        run: |
          python - <<'PY'
          import json
          families=[]
          for fid,ch,sources in [
            ("XAGRAMMAR_728DC88D691B","BCB_FOCUS_EXPECTATIONS_REVISION_B3_TRANSMISSION",["BCB","B3"]),
            ("XAGRAMMAR_62943307741A","CVM_FUND_FLOW_B3_TRANSMISSION",["CVM","B3"])]:
            families.append({"family_id":fid,"channel_id":ch,"grammar_signature":fid,
              "frozen_semantics":{"feature":"frozen","window":"frozen","lookback":"frozen","target":"frozen"},
              "qualified_sources":sources,"semantic_prereg_sha256":"ca80c0b9","status":"SOURCE_COST_QUALIFIED",
              "source_qualified":True,"cost_applicability_proven":True,"economics_read":False,"historical_testing_started":False})
          json.dump({"families":families},open("/tmp/grammar_007_qualification.json","w"))
          PY
          python source_repo/tools/gate_btc_factory/grammar_007_historical_intake.py \
            --qualification /tmp/grammar_007_qualification.json \
            --out /tmp/grammar_007_historical_intake.json
          python - <<'PY'
          import json
          z=json.load(open('/tmp/grammar_007_historical_intake.json'))
          assert z['status']=='READY_FOR_CAUSAL_SOURCE_MATERIALIZATION'
          assert z['economics_read'] is False and z['outcomes_read'] is False
          assert z['historical_testing_started'] is False
          PY

      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 0
      - name: Persist canonical Grammar 007 historical intake
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          ROOT=runtime_repo/runtime/factory_autonomy
          test -f "$ROOT/GRAMMAR_SOURCE_COST_QUALIFICATION_RUNTIME.json"
          python source_repo/tools/gate_btc_factory/grammar_007_historical_intake.py \
            --qualification "$ROOT/GRAMMAR_SOURCE_COST_QUALIFICATION_RUNTIME.json" \
            --out "$ROOT/GRAMMAR_007_HISTORICAL_INTAKE_RUNTIME.json"
          python - <<'PY'
          import json
          p='runtime_repo/runtime/factory_autonomy/GRAMMAR_007_HISTORICAL_INTAKE_RUNTIME.json'
          z=json.load(open(p))
          assert z['status']=='READY_FOR_CAUSAL_SOURCE_MATERIALIZATION'
          assert z['economics_read'] is False and z['outcomes_read'] is False
          assert z['historical_testing_started'] is False
          assert len(z['families'])==2
          assert all(x['status']=='MATERIALIZATION_REQUIRED_OUTCOME_BLIND' for x in z['families'])
          PY
          cd runtime_repo
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          git add runtime/factory_autonomy/GRAMMAR_007_HISTORICAL_INTAKE_RUNTIME.json
          git commit -m "Factory 007 historical intake ${{ github.run_id }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin gate-btc-runtime && git push origin HEAD:gate-btc-runtime && exit 0; sleep $((i*2)); done
          exit 1
