name: GATE BTC WIN WDO Cross Asset Regime Final State

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/WIN_WDO_CROSS_ASSET_REGIME_PREREG_FINAL_STATE_20260915.json'
      - 'tools/gate_btc_factory/test_win_wdo_cross_asset_regime_prereg_final_state.py'
      - '.github/workflows/gate-btc-win-wdo-cross-asset-regime-final-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-state-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate final prereg state
        run: python -m pytest -q tools/gate_btc_factory/test_win_wdo_cross_asset_regime_prereg_final_state.py
