name: GATE BTC Factory Regime C2

on:
  pull_request:
    paths:
      - 'tools/gate_btc_factory_regime_c2.py'
      - 'tools/gate_btc_factory_regime_c2_prereg.json'
      - 'tools/gate_btc_factory_regime_c2_clarification_freeze.json'
      - 'tests/test_gate_btc_factory_regime_c2.py'
      - '.github/workflows/gate-btc-factory-regime-c2.yml'

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_NOT_APPROVED: 'true'

jobs:
  regime-c2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: Contract and causality tests
        run: python -m unittest -v tests/test_gate_btc_factory_regime_c2.py
      - name: Run preregistered fixture generation only
        run: |
          mkdir -p artifacts/factory_regime_c2_fixture
          python tools/gate_btc_factory_regime_c2.py --mode fixture --out artifacts/factory_regime_c2_fixture/RESULT.json
          python - <<'PY'
          import json
          p=json.load(open('artifacts/factory_regime_c2_fixture/RESULT.json'))
          assert p['mode']=='fixture'
          assert p['orders']==0 and p['real_capital']==0 and p['engine_feed'] is False
          assert p['predecessor_result_credit']==0
          assert p['h1_economics_read'] is False
          assert p['partial_prospective_economics_read'] is False
          assert p['source_manifest']['funding_called'] is False
          assert p['source_manifest']['fred_called'] is False
          assert p['status'] in {'CLOSED_NULL','SURVIVORS_READY_FOR_FREEZE'}
          assert len(p['survivors_to_freeze']) <= 2
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gate-btc-factory-regime-c2-fixture-${{ github.run_id }}
          path: artifacts/factory_regime_c2_fixture/
          retention-days: 90
          if-no-files-found: error
