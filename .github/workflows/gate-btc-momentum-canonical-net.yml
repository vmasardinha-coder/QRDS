name: GATE BTC Momentum Canonical Paper Net
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
  workflow_run:
    workflows: ['GATE BTC Momentum M1 M2 Economics', 'GATE BTC Momentum M3 Prospective Shadow']
    types: [completed]
  push:
    branches: [main]
    paths:
      - tools/gate_btc_momentum_canonical_net.py
      - tools/gate_btc_momentum_cost_diagnostic.py
      - tools/gate_btc_momentum_m3_economics.py
      - tools/gate_btc_momentum_m3_persistence.py
      - tools/gate_btc_momentum_required_prices.py
      - tools/gate_btc_momentum_economic_shadow.py
      - tools/gate_btc_pit150_qualified_history.py
      - tools/gate_btc_usx_pool_history.py
      - tests/test_gate_btc_usx_pool_history.py
      - tools/gate_btc_hash_settlement_history.py
      - tools/gate_btc_pit150_figure_history_audit.py
      - tools/gate_btc_reusd_swap_history.py
      - tools/gate_btc_a7a5_swap_history.py
      - tools/gate_btc_2_v2a_complete_qualified_source_registry_v1.json
      - tests/test_gate_btc_momentum_canonical_net.py
      - migration/reporting/momentum_canonical_paper_cost_model_20261017.json
      - .github/workflows/gate-btc-momentum-canonical-net.yml
  pull_request:
    paths:
      - tools/gate_btc_momentum_canonical_net.py
      - tools/gate_btc_momentum_cost_diagnostic.py
      - tools/gate_btc_momentum_m3_economics.py
      - tools/gate_btc_momentum_m3_persistence.py
      - tools/gate_btc_momentum_required_prices.py
      - tools/gate_btc_momentum_economic_shadow.py
      - tools/gate_btc_pit150_qualified_history.py
      - tools/gate_btc_usx_pool_history.py
      - tests/test_gate_btc_usx_pool_history.py
      - tools/gate_btc_hash_settlement_history.py
      - tools/gate_btc_pit150_figure_history_audit.py
      - tools/gate_btc_reusd_swap_history.py
      - tools/gate_btc_a7a5_swap_history.py
      - tools/gate_btc_2_v2a_complete_qualified_source_registry_v1.json
      - tests/test_gate_btc_momentum_canonical_net.py
      - migration/reporting/momentum_canonical_paper_cost_model_20261017.json
      - .github/workflows/gate-btc-momentum-canonical-net.yml
permissions:
  contents: read
concurrency:
  group: momentum-canonical-net-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'canonical' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest -v tests.test_gate_btc_momentum_canonical_net tests.test_gate_btc_momentum_cost_diagnostic tests.test_gate_btc_momentum_cost_source_integrity
  publish:
    needs: validate
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, path: main_repo}
      - uses: actions/checkout@v4
        with: {ref: gate-btc-runtime, path: runtime_repo, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.2.3 numpy==2.1.3 requests
      - name: Bind future paper costs and preserve all gross bytes
        run: |
          python - <<'PY'
          import hashlib,json,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'main_repo')
          from tools.gate_btc_momentum_canonical_net import run,read,CONTRACT
          root=Path('runtime_repo')
          paths=[]
          for name in ('momentum_m1_m2_economics','momentum_m3_economics'):
              paths.extend(p for p in (root/'runtime/ledgers'/name).rglob('*') if p.is_file())
          before={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          status=run(root,root/'runtime/ledgers/momentum_canonical_net',read(CONTRACT))
          assert before=={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          print(json.dumps(status,sort_keys=True))
          print('ALL_GROSS_SOURCE_BYTES_UNCHANGED=PASS')
          PY
      - name: Publish only cost-model receipts
        working-directory: runtime_repo
        run: |
          set -euo pipefail
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          git add runtime/ledgers/momentum_canonical_net
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Bind forward canonical abstract Momentum paper costs"
          for i in 1 2 3 4 5; do
            git pull --rebase origin gate-btc-runtime && git push origin HEAD:gate-btc-runtime && exit 0
            sleep $((i*2))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentum-canonical-paper-net-${{ github.run_id }}
          path: runtime_repo/runtime/ledgers/momentum_canonical_net
          retention-days: 90
          if-no-files-found: error

