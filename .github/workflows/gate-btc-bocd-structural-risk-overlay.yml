name: GATE BTC BOCPD structural-risk research

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_bocd_structural_risk_overlay.py'
      - 'artifacts/gate_btc_2/bocd_research/**'
      - '.github/workflows/gate-btc-bocd-structural-risk-overlay.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_REAL_CAPITAL: '0'

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert isolated research scope
        run: |
          test "$GATE_BTC_RESEARCH_ONLY" = "true"
          test "$GATE_BTC_SHADOW_ONLY" = "true"
          test "$GATE_BTC_REAL_CAPITAL" = "0"
      - name: Install frozen BOCPD dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy requests "git+https://github.com/fiannai/bocd.git@0c09315e9102ddea885bb7164e47b61a95e99dac"
      - name: Run frozen causal BOCPD benchmark
        run: python tools/gate_btc_bocd_structural_risk_overlay.py
      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('bocd_evidence/RESULT.json')
          if not p.exists():
              raise SystemExit('RESULT.json missing')
          x = json.loads(p.read_text())
          assert x['research_only'] is True
          assert x['shadow_only'] is True
          assert x['real_capital_used'] == 0
          assert x['upstream_sha'] == '0c09315e9102ddea885bb7164e47b61a95e99dac'
          assert x['rows'] == 8000
          assert x['real_market']['resolved_decisions'] > 7900
          assert x['disposition'] in {'PASS', 'REJECT_FROZEN_CONFIGURATION'}
          print('BOCD_EVIDENCE_CONTRACT=PASS')
          print('SCIENTIFIC_DISPOSITION=' + x['disposition'])
          PY
      - name: Upload standalone evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-bocd-structural-risk-overlay
          path: bocd_evidence/
          retention-days: 90
