name: GATE BTC Factory Controlled Orchestrator

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - 'tools/gate_btc_research_factory_status.json'
      - 'tools/gate_btc_factory/**'
      - '.github/workflows/gate-btc-factory-shadow.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: gate-btc-factory-controlled-orchestrator
  cancel-in-progress: false

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_NOT_APPROVED_FOR_PRODUCTION: 'true'
  GATE_BTC_ORDERS: '0'
  GATE_BTC_REAL_CAPITAL: '0'
  GATE_BTC_ENGINE_FEED: 'false'

jobs:
  factory-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert immutable production safety boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GATE_BTC_RESEARCH_ONLY" = 'true'
          test "$GATE_BTC_SHADOW_ONLY" = 'true'
          test "$GATE_BTC_NOT_APPROVED_FOR_PRODUCTION" = 'true'
          test "$GATE_BTC_ORDERS" = '0'
          test "$GATE_BTC_REAL_CAPITAL" = '0'
          test "$GATE_BTC_ENGINE_FEED" = 'false'

      - name: Validate factory contracts
        run: python tools/gate_btc_factory/validate_factory_contracts.py

      - name: Run factory status cycle
        run: python tools/gate_btc_factory/run_factory_ci.py

      - name: Classify source freshness for controlled transitions
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('tools/gate_btc_factory/FACTORY_STATUS_RUNTIME.json').read_text())
          freshness=p.get('source_freshness', {}).get('status')
          if freshness not in {'FRESH','STALE_READ_ONLY'}:
              raise SystemExit(f'FAIL invalid factory source freshness: {freshness!r}')
          if freshness == 'STALE_READ_ONLY':
              print('::warning::Factory source is stale; cycle continues read-only with zero transitions')
          else:
              print('PASS factory source is fresh for controlled transitions')
          PY

      - name: Plan controlled transitions
        run: python tools/gate_btc_factory/plan_factory_transitions.py

      - name: Apply idempotent issue transitions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/gate_btc_factory/apply_factory_transitions.py

      - name: Assert transition safety
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('tools/gate_btc_factory/FACTORY_TRANSITIONS_RUNTIME.json').read_text())
          assert plan['safety']=={
              'ENGINE_FEED': False,
              'ORDERS': 0,
              'REAL_CAPITAL': 0,
              'RESEARCH_ONLY': True,
              'SHADOW_ONLY': True,
              'production_activation_allowed': False,
          }
          freshness=plan.get('source_freshness')
          allowed=plan.get('transitions_allowed')
          if freshness == 'STALE_READ_ONLY':
              assert allowed is False and plan['actions'] == []
              assert plan.get('blocked_reason') == 'STALE_SOURCE_READ_ONLY_NO_TRANSITIONS'
          elif freshness == 'FRESH':
              assert allowed is True
          else:
              raise AssertionError(f'invalid transition freshness {freshness!r}')
          for a in plan['actions']:
              assert a['action'] in {'CREATE_NEXT_GENERATION_ISSUE','ACTIVATE_APPROVED_PROSPECTIVE_SHADOW'}
              if a['action']=='ACTIVATE_APPROVED_PROSPECTIVE_SHADOW':
                  assert a['status'].startswith(('APPROVED_FOR_SEPARATE_PROSPECTIVE','APPROVED_PROSPECTIVE'))
                  assert a['orders']==0 and a['real_capital']==0 and a['engine_feed'] is False
          assert 'B3_H31' in plan.get('eligible_not_activated', []) or True
          print('PASS controlled transition safety')
          PY

      - name: Assert no protected checkout mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/factory_changed.txt
          if grep -Ev '^(tools/gate_btc_factory/FACTORY_STATUS_RUNTIME\.json|tools/gate_btc_factory/FACTORY_TRANSITIONS_RUNTIME\.json|tools/gate_btc_factory/PROSPECTIVE_ACTIVATIONS\.json)$' /tmp/factory_changed.txt | grep -q .; then
            echo 'FAIL factory changed protected paths'
            cat /tmp/factory_changed.txt
            exit 1
          fi
          git diff --cached --exit-code

      - name: Write factory summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          status=json.loads(Path('tools/gate_btc_factory/FACTORY_STATUS_RUNTIME.json').read_text())
          plan=json.loads(Path('tools/gate_btc_factory/FACTORY_TRANSITIONS_RUNTIME.json').read_text())
          lines=[
              '# QRDS Factory Controlled Cycle','',
              f"Source freshness: {status['source_freshness']['status']}",
              f"Transitions allowed: {plan['transitions_allowed']}",
              f"Automatic actions: {len(plan['actions'])}",
              f"Eligible but not approved/activated: {', '.join(plan['eligible_not_activated']) or 'none'}",'',
              'Automatic activation means separate prospective SHADOW only.',
              'Production remains disabled: ORDERS=0; REAL_CAPITAL=0; ENGINE_FEED=false.'
          ]
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as fh:
              fh.write('\n'.join(lines)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qrds-factory-controlled-status-${{ github.run_id }}
          path: |
            tools/gate_btc_factory/FACTORY_STATUS_RUNTIME.json
            tools/gate_btc_factory/FACTORY_TRANSITIONS_RUNTIME.json
            tools/gate_btc_factory/PROSPECTIVE_ACTIVATIONS.json
          if-no-files-found: error
          retention-days: 30
