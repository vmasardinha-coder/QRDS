name: GATE BTC F-XMM Inventory Family

on:
  pull_request:
    paths:
      - 'artifacts/gate_btc_2/family_handoffs/F_XMM_INVENTORY_PREREG_20260921.md'
      - 'tools/gate_btc_2_f_xmm_inventory_extractor.py'
      - 'tools/gate_btc_2_system11_depth10_collector.py'
      - 'tests/test_gate_btc_2_f_xmm_inventory_extractor.py'
      - 'tools/gate_btc_2_family_feature_cadence.py'
      - 'tests/test_gate_btc_2_family_feature_cadence.py'
      - '.github/workflows/gate-btc-2-f-xmm-inventory-family.yml'
  schedule:
    - cron: '20 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: family-f_xmm_inventory-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'canonical' }}
  cancel-in-progress: false

jobs:
  validate-family:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESEARCH_ONLY: 'true'
      SHADOW_ONLY: 'true'
      REAL_CAPITAL_BRL: '0'
      ORDERS: '0'
      NO_RETUNE: 'true'
      NO_BACKFILL: 'true'
      FACTORY_RUNTIME_UNTOUCHED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Archive safety tests
        run: python -m unittest -v tests.test_gate_btc_2_family_feature_cadence
      - name: Unit tests
        run: python -m unittest -v tests/test_gate_btc_2_f_xmm_inventory_extractor.py
      - name: Install Cryptofeed
        run: python -m pip install --disable-pip-version-check 'cryptofeed==2.5.0'
      - name: Assert research boundary
        shell: bash
        run: |
          test "$RESEARCH_ONLY" = true
          test "$SHADOW_ONLY" = true
          test "$REAL_CAPITAL_BRL" = 0
          test "$ORDERS" = 0
          test "$NO_RETUNE" = true
          test "$NO_BACKFILL" = true
          test "$FACTORY_RUNTIME_UNTOUCHED" = true
      - name: Capture depth10 family features
        if: github.event_name != 'pull_request'
        run: python tools/gate_btc_2_f_xmm_inventory_extractor.py --duration 60 --output artifacts_live/f_xmm_inventory
      - name: Assert tangible family artifact
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('artifacts_live/f_xmm_inventory/SUMMARY.json').read_text())
          assert s['family_id']=='F-XMM-INVENTORY'
          assert s['quality_pass'] is True
          assert s['disposition']=='FAMILY_FEATURE_CAPTURE_READY'
          assert s['research_only'] is True and s['shadow_only'] is True
          assert s['orders']==0 and s['real_capital_brl']==0
          assert s['economic_claim_authorized'] is False
          assert s['factory_migration_authorized'] is False
          assert s['factory_runtime_untouched'] is True
          assert s['no_backfill'] is True
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && always()
        with:
          name: gate-btc-f-xmm-inventory-family
          path: artifacts_live/f_xmm_inventory
          if-no-files-found: error
          retention-days: 90
      - name: Checkout canonical runtime for scheduled capture
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 0
      - name: Seal prospective feature and raw source
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          python tools/gate_btc_2_family_feature_cadence.py \
            --family F-XMM-INVENTORY \
            --capture artifacts_live/f_xmm_inventory \
            --ledger runtime_repo/runtime/gate_btc_2/family_features/f_xmm_inventory \
            --run-id "${{ github.run_id }}"
          git -C runtime_repo config user.name gate-btc-research-bot
          git -C runtime_repo config user.email gate-btc-research-bot@users.noreply.github.com
          git -C runtime_repo add runtime/gate_btc_2/family_features/f_xmm_inventory
          git -C runtime_repo commit -m "Append prospective F-XMM-INVENTORY feature capture ${{ github.run_id }}"
          for attempt in 1 2 3 4 5; do
            git -C runtime_repo pull --rebase origin gate-btc-runtime &&
              git -C runtime_repo push origin HEAD:gate-btc-runtime && exit 0
            sleep $((attempt * 2))
          done
          exit 1
