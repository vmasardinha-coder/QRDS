name: GATE BTC B3 BDI TickByTick Source Probe

on:
  workflow_dispatch:
    inputs:
      probe_date:
        description: B3 session date YYYY-MM-DD
        required: false
        default: '2026-09-04'
  push:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/b3_bdi_tickbytick_probe.py'
      - 'tests/test_gate_btc_b3_bdi_tickbytick_probe.py'
      - '.github/workflows/gate-btc-b3-bdi-tickbytick-probe.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/b3_bdi_tickbytick_probe.py'
      - 'tests/test_gate_btc_b3_bdi_tickbytick_probe.py'
      - '.github/workflows/gate-btc-b3-bdi-tickbytick-probe.yml'

permissions:
  contents: read

env:
  RESEARCH_ONLY: 'true'
  SHADOW_ONLY: 'true'
  NOT_APPROVED: 'true'
  ENGINE_FEED: 'false'
  ORDERS: '0'
  REAL_CAPITAL: '0'
  NO_RETUNE: 'true'
  NO_BACKFILL: 'true'
  NO_COUNTER_RESET: 'true'
  FAIL_CLOSED: 'true'
  H1_ECONOMICS_READ: 'false'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert immutable research boundary
        run: |
          test "$RESEARCH_ONLY" = true
          test "$SHADOW_ONLY" = true
          test "$NOT_APPROVED" = true
          test "$ENGINE_FEED" = false
          test "$ORDERS" = 0
          test "$REAL_CAPITAL" = 0
          test "$NO_RETUNE" = true
          test "$NO_BACKFILL" = true
          test "$NO_COUNTER_RESET" = true
          test "$FAIL_CLOSED" = true
          test "$H1_ECONOMICS_READ" = false
      - name: Test BDI transport and fail-closed contract
        run: |
          python -m pip install -q requests pytest
          python -m py_compile tools/gate_btc_factory/b3_bdi_tickbytick_probe.py
          pytest -q tests/test_gate_btc_b3_bdi_tickbytick_probe.py
      - name: Probe official B3 BDI TickByTickDerivatives
        if: github.event_name != 'pull_request'
        env:
          INPUT_DATE: ${{ github.event.inputs.probe_date }}
        run: |
          DATE="${INPUT_DATE:-2026-09-04}"
          python tools/gate_btc_factory/b3_bdi_tickbytick_probe.py --date "$DATE" --output BDI_TICKBYTICK_EVIDENCE.json
          python - <<'PY'
          import json
          d=json.load(open('BDI_TICKBYTICK_EVIDENCE.json',encoding='utf-8'))
          assert d['strict_source_gate_green'] is False
          assert d['source_gate_credit'] == 0
          assert d['historical_backfill_credit'] == 0
          s=d['safety']
          assert s['research_only'] and s['shadow_only'] and s['not_approved']
          assert s['engine_feed'] is False and s['orders']==0 and s['real_capital']==0
          assert s['no_retune'] and s['no_backfill'] and s['no_counter_reset'] and s['fail_closed']
          print('BDI_TICK_EVIDENCE_STATUS=' + d['status'])
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: gate-btc-b3-bdi-tickbytick-${{ github.run_id }}
          path: BDI_TICKBYTICK_EVIDENCE.json
          if-no-files-found: error
          retention-days: 30
