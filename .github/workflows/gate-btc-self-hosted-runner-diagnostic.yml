name: GATE BTC Self-Hosted Runner Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gate-btc-self-hosted-runner-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  github-hosted-control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Control
        run: |
          echo "GITHUB_HOSTED_CONTROL=PASS"
          echo "RUN_ID=${GITHUB_RUN_ID}"
      - name: Inspect repository-visible self-hosted runners
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/actions/runners" > /tmp/runners.json 2>/tmp/runners.err
          rc=$?
          echo "RUNNER_API_RC=$rc"
          if [ "$rc" -eq 0 ]; then
            jq '{total_count, runners: [.runners[] | {id,name,os,status,busy,labels:[.labels[].name]}]}' /tmp/runners.json
          else
            cat /tmp/runners.err
          fi
          exit 0

  self-hosted-default-label:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Identify default self-hosted runner
        shell: powershell
        run: |
          Write-Host "SELF_HOSTED_DEFAULT=PASS"
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Host "COMPUTERNAME=$env:COMPUTERNAME"

  self-hosted-windows-x64:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Identify Windows x64 self-hosted runner
        shell: powershell
        run: |
          Write-Host "SELF_HOSTED_WINDOWS_X64=PASS"
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Host "COMPUTERNAME=$env:COMPUTERNAME"
