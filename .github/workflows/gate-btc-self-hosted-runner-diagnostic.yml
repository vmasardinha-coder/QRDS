name: GATE BTC Self-Hosted Runner Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gate-btc-self-hosted-runner-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github-hosted-control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Control
        run: |
          echo "GITHUB_HOSTED_CONTROL=PASS"
          echo "RUN_ID=${GITHUB_RUN_ID}"

  self-hosted-default-label:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Identify default self-hosted runner
        shell: powershell
        run: |
          Write-Host "SELF_HOSTED_DEFAULT=PASS"
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Host "COMPUTERNAME=$env:COMPUTERNAME"

  self-hosted-windows-x64:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Identify Windows x64 self-hosted runner
        shell: powershell
        run: |
          Write-Host "SELF_HOSTED_WINDOWS_X64=PASS"
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Host "COMPUTERNAME=$env:COMPUTERNAME"
