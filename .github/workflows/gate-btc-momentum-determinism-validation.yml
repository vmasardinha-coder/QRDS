name: GATE BTC Momentum Determinism Validation

on:
  push:
    branches: [fix/momentum-deterministic-cutoff-hash]
    paths:
      - 'tools/gate_btc_momentum_identity.py'
      - 'tools/gate_btc_momentum_shadow_collect_deterministic.py'
      - 'tests/test_gate_btc_momentum_identity.py'
      - '.github/workflows/gate-btc-momentum-determinism-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_momentum_identity.py'
      - 'tools/gate_btc_momentum_shadow_collect_deterministic.py'
      - 'tests/test_gate_btc_momentum_identity.py'
      - '.github/workflows/gate-btc-momentum-determinism-validation.yml'
      - '.github/workflows/gate-btc-momentum-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  TEST_CUTOFF: '2026-08-26'
  EXISTING_HASH: '6a3c61297695eb47383dd46298df714766a16f37848df256c805503040dbeec5'

jobs:
  deterministic-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_anchor
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: migration/canonical/v2a/requirements.txt
      - name: Install canonical V2A dependencies
        run: pip install -r migration/canonical/v2a/requirements.txt
      - name: Compile repair only
        run: python -m py_compile tools/gate_btc_momentum_identity.py tools/gate_btc_momentum_shadow_collect_deterministic.py
      - name: Run deterministic identity regressions A-H
        run: python -m unittest -v tests.test_gate_btc_momentum_identity tests.test_gate_btc_momentum_m2_coverage
      - name: Assert append-only anchor before reproduction
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('runtime_anchor/runtime/ledgers/momentum_m1_m2/2026-08-26.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['snapshot_sha256']==os.environ['EXISTING_HASH']
          print('ANCHOR_BLOB_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          print('EXISTING_SNAPSHOT_SHA256='+d['snapshot_sha256'])
          PY
      - name: Build two independent public V2A packages
        run: |
          mkdir -p artifacts/A artifacts/B
          python migration/canonical/v2a/scripts/00_run_all_v2a.py --output-zip artifacts/A/public.zip
          python migration/canonical/v2a/scripts/00_run_all_v2a.py --output-zip artifacts/B/public.zip
      - name: Freeze both packages to exact historical cutoff
        run: |
          python tools/v2a_frozen_replay.py artifacts/A/public.zip --data-cutoff "$TEST_CUTOFF" --output-zip artifacts/A/frozen.zip --evidence-dir artifacts/A/evidence
          python tools/v2a_frozen_replay.py artifacts/B/public.zip --data-cutoff "$TEST_CUTOFF" --output-zip artifacts/B/frozen.zip --evidence-dir artifacts/B/evidence
      - name: Reproduce cutoff A and B against isolated copies of append-only ledger
        run: |
          cp -a runtime_anchor/runtime/ledgers/momentum_m1_m2 artifacts/ledger_A
          cp -a runtime_anchor/runtime/ledgers/momentum_m1_m2 artifacts/ledger_B
          python tools/gate_btc_momentum_shadow_collect_deterministic.py --v2a-zip artifacts/A/frozen.zip --cutoff "$TEST_CUTOFF" --ledger-dir artifacts/ledger_A --output artifacts/A/snapshot.json --identity-diagnostic-output artifacts/A/identity.json | tee artifacts/A/stdout.txt
          python tools/gate_btc_momentum_shadow_collect_deterministic.py --v2a-zip artifacts/B/frozen.zip --cutoff "$TEST_CUTOFF" --ledger-dir artifacts/ledger_B --output artifacts/B/snapshot.json --identity-diagnostic-output artifacts/B/identity.json | tee artifacts/B/stdout.txt
      - name: Prove same canonical result and unchanged ledgers
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          expected=os.environ['EXISTING_HASH']
          vals=[]
          anchor=Path('runtime_anchor/runtime/ledgers/momentum_m1_m2/2026-08-26.json').read_bytes()
          for label in ('A','B'):
              out=json.loads(Path(f'artifacts/{label}/snapshot.json').read_text(encoding='utf-8'))
              diag=json.loads(Path(f'artifacts/{label}/identity.json').read_text(encoding='utf-8'))
              led=Path(f'artifacts/ledger_{label}/2026-08-26.json').read_bytes()
              assert led==anchor, f'{label}: ledger anchor bytes mutated'
              assert out['snapshot_sha256']==expected, (label,out['snapshot_sha256'],expected)
              assert diag['status']=='ALREADY_RECORDED' and diag['result']=='IDEMPOTENT_SUCCESS'
              assert diag['ledger_mutated'] is False
              vals.append(out['snapshot_sha256'])
          assert vals[0]==vals[1]==expected
          print('RUN_A='+vals[0]); print('RUN_B='+vals[1]); print('EXISTING_LEDGER='+expected); print('MATCH=true')
          print('LEDGER_MUTATED=false')
          PY
      - name: Assert immutable safety boundary
        run: |
          grep -q 'engine_feed.*False' tools/gate_btc_momentum_shadow_collect_deterministic.py
          grep -q 'orders.*0' tools/gate_btc_momentum_shadow_collect_deterministic.py
          grep -q 'real_capital.*0' tools/gate_btc_momentum_shadow_collect_deterministic.py
          ! grep -Rni 'h1_economics' tools/gate_btc_momentum_identity.py tools/gate_btc_momentum_shadow_collect_deterministic.py
          echo 'H1_ECONOMICS_READ=false'
          echo 'PROSPECTIVE_ECONOMICS_READ=false'
          echo 'ORDERS=0'
          echo 'CAPITAL=0'
          echo 'ENGINE_FEED=false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentum-determinism-${{ github.run_id }}
          path: artifacts
          retention-days: 90
