name: GATE BTC B3 H80-H89 BD Final QA

on:
  pull_request:
    paths:
      - 'tools/gate_btc_b3_h80_h89_bdfinal_probe.py'
      - '.github/workflows/gate-btc-b3-h80-h89-bdfinal-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_NOT_APPROVED: 'true'
  GATE_BTC_ORDERS: '0'
  GATE_BTC_REAL_CAPITAL: '0'
  GATE_BTC_ENGINE_FEED: 'false'

jobs:
  bdfinal-source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Probe official B3 legacy BD_Final request contract only
        run: python tools/gate_btc_b3_h80_h89_bdfinal_probe.py
      - name: Assert no economics or protected activation
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/b3_h80_h89_bdfinal/B3_H80_H89_BDFINAL_SOURCE_QA.json'))
          assert p['economics_run'] is False
          assert p['h1_economics_read'] is False
          assert p['survivor_partial_economics_read'] is False
          assert p['orders']==0 and p['real_capital']==0 and p['engine_feed'] is False
          assert p['cutoff_exclusive']=='2026-08-10'
          assert p['status'] in {'PASS_LEGACY_SOURCE_CONTRACT','DATA_GAP_LEGACY_REQUEST_CONTRACT'}
          print('B3_H80_H89_BDFINAL_QA='+p['status'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b3-h80-h89-bdfinal-source-qa-${{ github.run_id }}
          path: artifacts/b3_h80_h89_bdfinal/B3_H80_H89_BDFINAL_SOURCE_QA.json
          retention-days: 30
          if-no-files-found: error
