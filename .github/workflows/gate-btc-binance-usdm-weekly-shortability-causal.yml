name: GATE BTC Binance USD-M Causal Shortability

on:
  workflow_dispatch:
  schedule:
    - cron: "35 20 * * 4"
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-binance-usdm-weekly-shortability-causal.yml
      - tools/gate_btc_binance_usdm_weekly_shortability_causal.py
      - tools/gate_btc_binance_usdm_weekly_shortability.py
  push:
    branches: [agent/gate-btc-migration-current]
    paths:
      - .github/workflows/gate-btc-binance-usdm-weekly-shortability-causal.yml
      - tools/gate_btc_binance_usdm_weekly_shortability_causal.py
      - tools/gate_btc_binance_usdm_weekly_shortability.py

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  causal-shortability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Build Thursday-Friday causal ledger
        run: >-
          python tools/gate_btc_binance_usdm_weekly_shortability_causal.py
          --start 2020-07-03
          --workers 24
          --output-csv artifacts/binance_shortability_causal/BINANCE_USDM_WEEKLY_SHORTABLE_CAUSAL.csv
          --output-summary artifacts/binance_shortability_causal/BINANCE_USDM_WEEKLY_SHORTABLE_CAUSAL_SUMMARY.json
      - name: Verify no post-entry evidence is required
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/binance_shortability_causal/BINANCE_USDM_WEEKLY_SHORTABLE_CAUSAL_SUMMARY.json',encoding='utf-8'))
          assert p['status']=='PASS'
          assert p['RESEARCH_ONLY'] and p['SHADOW_ONLY'] and p['NOT_APPROVED']
          assert p['ORDERS']==0 and p['REAL_CAPITAL']==0
          assert 'Thursday AND Friday' in p['method']
          assert 'Saturday is never inspected' in p['method']
          assert p['fridays'] > 300
          print('CAUSAL_SHORTABILITY_SAFETY=PASS')
          print('ROWS='+str(p['ledger_rows']))
          PY
      - name: Upload causal shortability ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-binance-usdm-shortability-causal-${{ github.run_id }}
          path: artifacts/binance_shortability_causal/
          retention-days: 30
          if-no-files-found: error
