name: GATE BTC 2 Item 3B Forward Source Binding

on:
  pull_request:
    paths:
      - 'artifacts/gate_btc_2/FACTORY_ITEM3B_FORWARD_SOURCE_PREREG_20260922.json'
      - 'tools/gate_btc_2_item3b_forward_source_probe.py'
      - '.github/workflows/gate-btc-2-item3b-forward-source-binding.yml'
  push:
    branches: [main]
    paths:
      - 'artifacts/gate_btc_2/FACTORY_ITEM3B_FORWARD_SOURCE_PREREG_20260922.json'
      - 'tools/gate_btc_2_item3b_forward_source_probe.py'
      - '.github/workflows/gate-btc-2-item3b-forward-source-binding.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('gate-btc-2-item3b-pr-{0}', github.event.pull_request.number) || 'gate-btc-2-item3b-physical' }}
  cancel-in-progress: false

env:
  RESEARCH_ONLY: 'true'
  SHADOW_ONLY: 'true'
  MT5_READ_ONLY: 'true'
  NO_ORDER_SEND: 'true'
  ENGINE_FEED: 'false'
  ORDERS: '0'
  REAL_CAPITAL: '0'
  NO_BACKFILL: 'true'
  NO_RETUNE: 'true'
  H1_H31_RUNTIME_MUTATION: 'false'

jobs:
  validate-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source probe
        shell: powershell
        run: python -m py_compile tools/gate_btc_2_item3b_forward_source_probe.py
      - name: Assert frozen preregistration and safety
        shell: powershell
        run: |
          python -c "import json; p=json.load(open('artifacts/gate_btc_2/FACTORY_ITEM3B_FORWARD_SOURCE_PREREG_20260922.json',encoding='utf-8')); assert p['status']=='PREREGISTERED_BEFORE_PHYSICAL_FORWARD_SOURCE_READ'; assert p['activation_population']['expected_count']==580; assert p['activation_population']['manual_selection'] is False; assert p['volume_admission']['tick_volume_is_not_accepted_as_equivalent'] is True; assert p['forward_state']['warmup']=='PROSPECTIVE_ONLY_AFTER_D0'; assert p['activation_semantics']['survivor_credit']==0 and p['activation_semantics']['promotion_authority'] is False; s=p['safety']; assert s['RESEARCH_ONLY'] and s['SHADOW_ONLY'] and s['MT5_READ_ONLY'] and s['NO_ORDER_SEND'] and s['NO_BACKFILL'] and s['NO_RETUNE']; assert s['ORDERS']==0 and s['REAL_CAPITAL']==0 and s['ENGINE_FEED'] is False and s['H1_H31_RUNTIME_MUTATION'] is False"
      - name: Assert no order path in probe
        shell: powershell
        run: |
          $t=Get-Content tools/gate_btc_2_item3b_forward_source_probe.py -Raw
          if ($t -match 'order_send\s*\(') { throw 'ORDER_SEND_FORBIDDEN' }
          if ($t -match 'gate_btc_b3_h1_daily\.main|gate_btc_b3_h31_intraday_shadow\.main') { throw 'H1_H31_RUNTIME_MUTATION_FORBIDDEN' }

  physical-forward-binding:
    needs: validate-contract
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_repo
      - name: Check out canonical runtime
        uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 0
      - name: Assert runtime/safety and MT5 availability
        shell: powershell
        run: |
          if ($env:RESEARCH_ONLY -ne 'true' -or $env:SHADOW_ONLY -ne 'true') { throw 'RESEARCH_BOUNDARY' }
          if ($env:MT5_READ_ONLY -ne 'true' -or $env:NO_ORDER_SEND -ne 'true') { throw 'MT5_READ_ONLY_BOUNDARY' }
          if ($env:ENGINE_FEED -ne 'false' -or $env:ORDERS -ne '0' -or $env:REAL_CAPITAL -ne '0') { throw 'TRADING_BOUNDARY' }
          if ($env:NO_BACKFILL -ne 'true' -or $env:NO_RETUNE -ne 'true' -or $env:H1_H31_RUNTIME_MUTATION -ne 'false') { throw 'SCIENTIFIC_BOUNDARY' }
          python -m pip install -q MetaTrader5 tzdata
          python -c "import MetaTrader5 as mt5; print('MT5_MODULE_READY='+str(hasattr(mt5,'copy_rates_from_pos')))"
      - name: Execute physical forward-only source binding
        shell: powershell
        run: |
          python main_repo/tools/gate_btc_2_item3b_forward_source_probe.py `
            --runtime-root runtime_repo `
            --prereg main_repo/artifacts/gate_btc_2/FACTORY_ITEM3B_FORWARD_SOURCE_PREREG_20260922.json `
            --out-dir item3b_out
      - name: Assert physical result safety and deterministic population
        shell: powershell
        run: |
          python -c "import json; b=json.load(open('item3b_out/FORWARD_SOURCE_BINDING.json',encoding='utf-8')); m=json.load(open('item3b_out/ACTIVATION_MANIFEST.json',encoding='utf-8')); assert b['eligible_population_count']==580; assert m['eligible_before_source_qa']==580; assert m['active_family_count']+m['waiting_source_semantics_count']==580; assert m['historical_credit']==0 and m['retroactive_credit']==0 and m['promotion_authority'] is False; assert m['engine_feed'] is False and m['orders']==0 and m['real_capital']==0 and m['no_backfill'] and m['no_retune']; print('ITEM3B_STATUS='+b['status']); print('ITEM3B_ACTIVE='+str(m['active_family_count'])); print('ITEM3B_WAITING='+str(m['waiting_source_semantics_count'])); print('ITEM3B_D0='+str(m['d0'])); print('ITEM3B_VOLUME_PASS='+str(b['volume_source_pass']))"
      - name: Upload immutable source evidence
        uses: actions/upload-artifact@v4
        with:
          name: factory-item3b-forward-source-binding-${{ github.run_id }}
          path: item3b_out/
          retention-days: 90
      - name: Persist canonical Item 3B binding and activation manifest
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path runtime_repo\runtime\gate_btc_2\item3_forward_shadow | Out-Null
          Copy-Item item3b_out\FORWARD_SOURCE_BINDING.json runtime_repo\runtime\gate_btc_2\item3_forward_shadow\FORWARD_SOURCE_BINDING.json -Force
          Copy-Item item3b_out\ACTIVATION_MANIFEST.json runtime_repo\runtime\gate_btc_2\item3_forward_shadow\ACTIVATION_MANIFEST.json -Force
          Copy-Item item3b_out\RAW_FORWARD_SOURCE_EVIDENCE.json runtime_repo\runtime\gate_btc_2\item3_forward_shadow\RAW_FORWARD_SOURCE_EVIDENCE.json -Force
          git -C runtime_repo config user.name gate-btc-research-bot
          git -C runtime_repo config user.email gate-btc-research-bot@users.noreply.github.com
          git -C runtime_repo add runtime/gate_btc_2/item3_forward_shadow
          git -C runtime_repo diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git -C runtime_repo commit -m "Persist Factory Item 3B forward source binding ${{ github.run_id }}"
          for ($i=1; $i -le 5; $i++) {
            git -C runtime_repo fetch origin gate-btc-runtime
            git -C runtime_repo rebase origin/gate-btc-runtime
            if ($LASTEXITCODE -ne 0) { git -C runtime_repo rebase --abort; throw 'RUNTIME_REBASE_FAILED' }
            git -C runtime_repo push origin HEAD:gate-btc-runtime
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds ($i*2)
          }
          throw 'RUNTIME_PUSH_FAILED'
