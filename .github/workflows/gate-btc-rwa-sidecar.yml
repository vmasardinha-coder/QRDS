name: GATE BTC RWA Tokenized Observation Sidecar

on:
  workflow_dispatch:
  schedule:
    - cron: "55 5 * * *"
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-rwa-sidecar.yml
      - tools/gate_btc_rwa_sidecar_manifest.py
      - tools/gate_btc_v2a_failure_diagnostic.py
      - tools/gate_btc_pit150_retry_policy.py
      - tools/gate_btc_pit150_retry_policy.json
      - tests/test_gate_btc_rwa_sidecar_manifest.py

permissions:
  actions: read
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  rwa-tokenized-sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test sidecar safety boundary
        run: python -m unittest -v tests/test_gate_btc_rwa_sidecar_manifest.py
      - name: Resolve latest successful source-probe evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          RUN_ID=""
          ARTIFACT_ID="0"
          # A successful run can have no retained payload; select evidence,
          # rather than assuming the newest green run has an artifact.
          for SOURCE_BRANCH in "$BRANCH" main; do
            CANDIDATES=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/gate-btc-source-redundancy-probes.yml/runs?branch=${SOURCE_BRANCH}&status=success&per_page=20" --jq '[.workflow_runs[] | select(.conclusion == "success") | .id] | if length == 0 then "NONE" else map(tostring) | join(" ") end')
            for CANDIDATE in $CANDIDATES; do
              if [ "$CANDIDATE" = "NONE" ]; then continue; fi
              ARTIFACT_ID=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE}/artifacts" --jq '[.artifacts[] | select(.expired == false) | select(.name | startswith("gate-btc-source-probes-"))] | .[0].id // 0')
              if [ "$ARTIFACT_ID" = "0" ]; then continue; fi
              gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > source_probe.zip
              if python -c 'import sys,zipfile; sys.exit(0 if "v2a_failure_diagnostic.json" in zipfile.ZipFile("source_probe.zip").namelist() else 1)'; then
                RUN_ID="$CANDIDATE"
                break
              fi
              echo "SOURCE_PROBE_WITHOUT_V2A_DIAGNOSTIC=$CANDIDATE"
              ARTIFACT_ID="0"
            done
            if [ "$ARTIFACT_ID" != "0" ]; then break; fi
          done
          if [ "$ARTIFACT_ID" = "0" ]; then
            echo "No retained source-probe evidence in the bounded branch/main search."
            exit 1
          fi
          echo "SELECTED_SOURCE_PROBE_RUN=$RUN_ID"
          mkdir -p source_probe artifacts/rwa_sidecar
          unzip -q source_probe.zip -d source_probe
          test -f source_probe/v2a_failure_diagnostic.json
          echo "SOURCE_PROBE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
      - name: Build point-in-time RWA tokenized observation sidecar
        run: >-
          python tools/gate_btc_rwa_sidecar_manifest.py
          --diagnostic source_probe/v2a_failure_diagnostic.json
          --output artifacts/rwa_sidecar/rwa_tokenized_observation_sidecar.json
      - name: Verify sidecar cannot change V2A or create a strategy universe
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/rwa_sidecar/rwa_tokenized_observation_sidecar.json',encoding='utf-8'))
          assert p['stock_bases_adapter_implemented'] is False
          assert p['rwa_strategy_universe_created'] is False
          assert p['automatic_exclusion_from_v2a'] is False
          assert p['engine_feed'] is False
          assert p['feeds_frozen_engine'] is False
          assert p['source_substitution_performed'] is False
          assert p['strategy_inputs_changed'] is False
          assert p['denominator_changed'] is False
          assert p['universe_changed'] is False
          assert p['methodology_changes'] == 0
          assert p['orders_generated'] == 0
          assert p['real_capital_used'] == 0
          print('RWA_SIDECAR_SAFETY=PASS')
          print('STATUS='+p['status'])
          PY
      - name: Upload RWA sidecar evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-rwa-sidecar-${{ github.run_id }}
          path: artifacts/rwa_sidecar/
          retention-days: 30
          if-no-files-found: error
