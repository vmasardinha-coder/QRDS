name: GATE BTC Binance USD-M Funding Features Pre-2025

on:
  workflow_dispatch:
  push:
    branches: [agent/gate-btc-migration-current]
    paths:
      - .github/workflows/gate-btc-binance-usdm-funding-features-pre2025.yml
      - tools/gate_btc_binance_usdm_weekly_funding_features.py

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  funding-features:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Build causal pre-2025 funding feature panel
        run: >-
          python tools/gate_btc_binance_usdm_weekly_funding_features.py
          --start 2021-01-07
          --end 2024-12-31
          --workers 32
          --output-csv artifacts/binance_funding_features/BINANCE_USDM_WEEKLY_FUNDING_FEATURES.csv
          --output-summary artifacts/binance_funding_features/BINANCE_USDM_WEEKLY_FUNDING_FEATURES_SUMMARY.json
      - name: Verify safety and coverage
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/binance_funding_features/BINANCE_USDM_WEEKLY_FUNDING_FEATURES_SUMMARY.json',encoding='utf-8'))
          assert p['status']=='PASS'
          assert p['RESEARCH_ONLY'] and p['SHADOW_ONLY'] and p['NOT_APPROVED']
          assert p['ORDERS']==0 and p['REAL_CAPITAL']==0
          assert p['thursdays'] > 200
          assert p['rows'] > 10000
          assert p['features']==['fund_last','fund_mean_7d','fund_mean_30d','fund_std_30d']
          print('FUNDING_FEATURE_PANEL_SAFETY=PASS')
          print('THURSDAYS='+str(p['thursdays']))
          print('ROWS='+str(p['rows']))
          PY
      - name: Upload feature panel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-binance-funding-features-${{ github.run_id }}
          path: artifacts/binance_funding_features/
          retention-days: 30
          if-no-files-found: error
