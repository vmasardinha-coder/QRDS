name: GATE BTC Factory Grammar Scout Handoff

on:
  workflow_dispatch:
  schedule:
    - cron: '7 12 * * *'
  workflow_run:
    workflows: ['GATE BTC Factory Grammar Scout']
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/grammar_scout_handoff.py'
      - 'tools/gate_btc_factory/grammar_scout_prereg_transport.py'
      - 'tests/test_gate_btc_grammar_scout_handoff.py'
      - '.github/workflows/gate-btc-factory-grammar-scout-handoff.yml'

permissions:
  contents: write

env:
  RESEARCH_ONLY: 'true'
  SHADOW_ONLY: 'true'
  NOT_APPROVED: 'true'
  ENGINE_FEED: 'false'
  ORDERS: '0'
  REAL_CAPITAL: '0'
  NO_RETUNE: 'true'
  NO_BACKFILL: 'true'
  NO_COUNTER_RESET: 'true'
  FAIL_CLOSED: 'true'

concurrency:
  group: gate-btc-factory-grammar-scout-handoff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  handoff:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: source_repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: |
          python -m pip install -q pytest
          cd source_repo
          pytest -q tests/test_gate_btc_grammar_scout_handoff.py
          python -m py_compile tools/gate_btc_factory/grammar_scout_prereg_transport.py
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 0
      - name: Materialize outcome-blind handoff and separate preregistration envelopes
        if: github.event_name != 'pull_request'
        run: |
          test -f runtime_repo/runtime/factory_autonomy/GRAMMAR_SCOUT_RUNTIME.json
          mkdir -p runtime_repo/runtime/factory_autonomy/grammar_handoff_audits runtime_repo/runtime/factory_autonomy/grammar_preregistrations
          python source_repo/tools/gate_btc_factory/grammar_scout_handoff.py --scout runtime_repo/runtime/factory_autonomy/GRAMMAR_SCOUT_RUNTIME.json --ledger-dir runtime_repo/runtime/factory_autonomy/grammar_handoff_audits --output GRAMMAR_HANDOFF_RUNTIME.json
          python source_repo/tools/gate_btc_factory/grammar_scout_prereg_transport.py --handoff GRAMMAR_HANDOFF_RUNTIME.json --ledger-dir runtime_repo/runtime/factory_autonomy/grammar_preregistrations --output GRAMMAR_PREREG_TRANSPORT_RUNTIME.json
          python - <<'PY'
          import json
          h=json.load(open('GRAMMAR_HANDOFF_RUNTIME.json')); p=json.load(open('GRAMMAR_PREREG_TRANSPORT_RUNTIME.json'))
          assert h['mode']=='OUTCOME_BLIND_HANDOFF_ONLY'
          assert p['safety']['H1_H31_UNTOUCHED'] and p['safety']['NO_RETUNE'] and p['safety']['NO_BACKFILL']
          for f in p['families']: assert f['status']=='PREREGISTERED_AWAITING_SOURCE_COST_QUALIFICATION'
          PY
      - name: Persist append-only handoff and preregistration transport
        if: github.event_name != 'pull_request'
        run: |
          cp GRAMMAR_HANDOFF_RUNTIME.json "runtime_repo/runtime/factory_autonomy/grammar_handoff_audits/${{ github.run_id }}.json"
          cp GRAMMAR_HANDOFF_RUNTIME.json runtime_repo/runtime/factory_autonomy/GRAMMAR_HANDOFF_RUNTIME.json
          cp GRAMMAR_PREREG_TRANSPORT_RUNTIME.json runtime_repo/runtime/factory_autonomy/GRAMMAR_PREREG_TRANSPORT_RUNTIME.json
          cd runtime_repo
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          git add runtime/factory_autonomy/grammar_handoff_audits runtime/factory_autonomy/grammar_preregistrations runtime/factory_autonomy/GRAMMAR_HANDOFF_RUNTIME.json runtime/factory_autonomy/GRAMMAR_PREREG_TRANSPORT_RUNTIME.json
          git commit -m "Factory grammar handoff and prereg transport ${{ github.run_id }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin gate-btc-runtime && git push origin HEAD:gate-btc-runtime && exit 0; sleep $((i*2)); done
          exit 1
