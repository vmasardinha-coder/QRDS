name: GATE BTC Factory B3 COTAHIST Physical Capture

on:
  pull_request:
    paths:
      - 'tools/gate_btc_factory/b3_cotahist_capture.py'
      - 'tools/gate_btc_factory/B3_COTAHIST_DATA_SOURCE.v1.json'
      - 'tools/gate_btc_factory/B3_COTAHIST_FROZEN_HASHES.v1.json'
      - 'tools/gate_btc_factory/B3_BLUECHIPS_UNIVARIATE_PREREG.v1.json'
      - 'tools/gate_btc_factory/B3_BLUECHIPS_UNIVARIATE_GATES.v1.json'
      - 'tools/gate_btc_factory/b3_bluechips_univariate_execute.py'
      - 'tools/gate_btc_factory/b3_win_wdo_official_source_probe.py'
      - 'tools/gate_btc_factory/b3_win_wdo_coverage_block.py'
      - 'tools/gate_btc_factory/b3_win_wdo_calendar_crosscheck.py'
      - '.github/workflows/gate-btc-factory-cotahist-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RESEARCH_ONLY: 'true'
  SHADOW_ONLY: 'true'
  NOT_APPROVED: 'true'
  ENGINE_FEED: 'false'
  ORDERS: '0'
  REAL_CAPITAL: '0'
  NO_RETUNE: 'true'
  NO_BACKFILL: 'true'
  NO_COUNTER_RESET: 'true'
  FAIL_CLOSED: 'true'

jobs:
  physical-capture-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile capture and frozen family executor
        run: |
          python -m py_compile tools/gate_btc_factory/b3_cotahist_capture.py
          python -m py_compile tools/gate_btc_factory/b3_bluechips_univariate_execute.py
      - name: Capture official annual COTAHIST objects and QA
        run: python tools/gate_btc_factory/b3_cotahist_capture.py --years 2020-2026 --out artifacts/gate_btc/factory/cotahist_capture
      - name: Assert manifest and immutable safety
        run: |
          python - <<'PY'
          import json
          p='artifacts/gate_btc/factory/cotahist_capture/MANIFEST.json'
          x=json.load(open(p))
          assert x['status']=='PASS_PHYSICAL_CAPTURE_QA', x
          assert len(x['objects'])==7, len(x['objects'])
          for o in x['objects']:
              assert len(o['raw_zip_sha256'])==64
              assert len(o['payload_sha256'])==64
              assert o['daily_quote_record_count']>0
              assert o['duplicate_full_identity_count']==0
              assert o['invalid_record_length_count']==0
              assert o['invalid_daily_quote_count']==0
          expected={'RESEARCH_ONLY':True,'SHADOW_ONLY':True,'NOT_APPROVED':True,'ENGINE_FEED':False,'ORDERS':0,'REAL_CAPITAL':0,'NO_RETUNE':True,'NO_BACKFILL':True,'NO_COUNTER_RESET':True,'FAIL_CLOSED':True}
          for k,v in expected.items(): assert x[k]==v,(k,x[k])
          assert x['economics_read_allowed'] is False
          assert x['family_creation_allowed'] is False
          print('COTAHIST_PHYSICAL_CAPTURE_QA=PASS')
          PY
      - name: Execute frozen EQB01-EQB10 scientific funnel
        run: |
          python tools/gate_btc_factory/b3_bluechips_univariate_execute.py \
            --capture-dir artifacts/gate_btc/factory/cotahist_capture \
            --out artifacts/gate_btc/factory/b3_bluechips_univariate/RESULT.json
      - name: Assert EQB result safety and finite family set
        run: |
          python - <<'PY'
          import json
          p='artifacts/gate_btc/factory/b3_bluechips_univariate/RESULT.json'
          x=json.load(open(p))
          assert x['schema']=='qrds.factory.b3_bluechips_univariate_result.v1'
          assert x['family_count']==10
          assert sorted(x['results'])==[f'EQB{i:02d}' for i in range(1,11)]
          expected={'RESEARCH_ONLY':True,'SHADOW_ONLY':True,'NOT_APPROVED':True,'ENGINE_FEED':False,'ORDERS':0,'REAL_CAPITAL':0,'NO_RETUNE':True,'NO_BACKFILL':True,'NO_COUNTER_RESET':True,'FAIL_CLOSED':True}
          for k,v in expected.items(): assert x[k]==v,(k,x[k])
          assert x['prospective_activation_performed'] is False
          assert x['prospective_credit']==0
          print('EQB_SCIENTIFIC_FUNNEL_EXECUTED=PASS')
          PY
      - name: Upload immutable physical capture evidence
        uses: actions/upload-artifact@v4
        with:
          name: b3-cotahist-physical-capture-${{ github.run_id }}
          path: artifacts/gate_btc/factory/cotahist_capture/
          if-no-files-found: error
          retention-days: 90
      - name: Upload EQB scientific result
        uses: actions/upload-artifact@v4
        with:
          name: b3-bluechips-univariate-result-${{ github.run_id }}
          path: artifacts/gate_btc/factory/b3_bluechips_univariate/RESULT.json
          if-no-files-found: error
          retention-days: 90

  win-wdo-official-source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile official source probe
        run: python -m py_compile tools/gate_btc_factory/b3_win_wdo_official_source_probe.py
      - name: Probe B3 historical PriceReport sentinels
        run: python tools/gate_btc_factory/b3_win_wdo_official_source_probe.py --out artifacts/gate_btc/factory/win_wdo_source_probe/RESULT.json
      - name: Assert research-only source qualification boundary
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifacts/gate_btc/factory/win_wdo_source_probe/RESULT.json'))
          assert x['schema']=='qrds.factory.b3_win_wdo_official_source_probe.v1'
          assert len(x['sentinels'])==4
          assert x['economics_read_allowed'] is False
          assert x['family_creation_allowed'] is False
          assert x['prospective_credit']==0 and x['scientific_credit']==0
          assert x['source_admission_pass'] is False
          s=x['safety']
          assert s['RESEARCH_ONLY'] and s['SHADOW_ONLY'] and s['NOT_APPROVED']
          assert s['ENGINE_FEED'] is False and s['ORDERS']==0 and s['REAL_CAPITAL']==0
          assert s['NO_RETUNE'] and s['NO_BACKFILL'] and s['NO_COUNTER_RESET'] and s['FAIL_CLOSED']
          assert s['H1_ECONOMICS_READ'] is False
          print('WIN_WDO_OFFICIAL_SOURCE_PROBE_BOUNDARY=PASS')
          PY
      - name: Upload WIN/WDO source probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: b3-win-wdo-official-source-probe-${{ github.run_id }}
          path: artifacts/gate_btc/factory/win_wdo_source_probe/RESULT.json
          if-no-files-found: error
          retention-days: 90

  win-wdo-coverage-2020-2024:
    name: win-wdo-coverage-${{ matrix.block }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {block: '2020-q1', start: '2020-01-01', end: '2020-03-31', file: '2020_Q1.json'}
          - {block: '2020-q2', start: '2020-04-01', end: '2020-06-30', file: '2020_Q2.json'}
          - {block: '2020-q3', start: '2020-07-01', end: '2020-09-30', file: '2020_Q3.json'}
          - {block: '2020-q4', start: '2020-10-01', end: '2020-12-31', file: '2020_Q4.json'}
          - {block: '2021-q1', start: '2021-01-01', end: '2021-03-31', file: '2021_Q1.json'}
          - {block: '2021-q2', start: '2021-04-01', end: '2021-06-30', file: '2021_Q2.json'}
          - {block: '2021-q3', start: '2021-07-01', end: '2021-09-30', file: '2021_Q3.json'}
          - {block: '2021-q4', start: '2021-10-01', end: '2021-12-31', file: '2021_Q4.json'}
          - {block: '2022-q1', start: '2022-01-01', end: '2022-03-31', file: '2022_Q1.json'}
          - {block: '2022-q2', start: '2022-04-01', end: '2022-06-30', file: '2022_Q2.json'}
          - {block: '2022-q3', start: '2022-07-01', end: '2022-09-30', file: '2022_Q3.json'}
          - {block: '2022-q4', start: '2022-10-01', end: '2022-12-31', file: '2022_Q4.json'}
          - {block: '2023-q1', start: '2023-01-01', end: '2023-03-31', file: '2023_Q1.json'}
          - {block: '2023-q2', start: '2023-04-01', end: '2023-06-30', file: '2023_Q2.json'}
          - {block: '2023-q3', start: '2023-07-01', end: '2023-09-30', file: '2023_Q3.json'}
          - {block: '2023-q4', start: '2023-10-01', end: '2023-12-31', file: '2023_Q4.json'}
          - {block: '2024-q1', start: '2024-01-01', end: '2024-03-31', file: '2024_Q1.json'}
          - {block: '2024-q2', start: '2024-04-01', end: '2024-06-30', file: '2024_Q2.json'}
          - {block: '2024-q3', start: '2024-07-01', end: '2024-09-30', file: '2024_Q3.json'}
          - {block: '2024-q4', start: '2024-10-01', end: '2024-12-31', file: '2024_Q4.json'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile incremental coverage qualifier
        run: python -m py_compile tools/gate_btc_factory/b3_win_wdo_coverage_block.py
      - name: Qualify official B3 PriceReport coverage block
        run: python tools/gate_btc_factory/b3_win_wdo_coverage_block.py --start '${{ matrix.start }}' --end '${{ matrix.end }}' --out 'artifacts/gate_btc/factory/win_wdo_coverage/${{ matrix.file }}'
      - name: Assert DATA-only block boundary
        env:
          COVERAGE_FILE: artifacts/gate_btc/factory/win_wdo_coverage/${{ matrix.file }}
        run: |
          python - <<'PY'
          import json, os
          x=json.load(open(os.environ['COVERAGE_FILE']))
          assert x['schema']=='qrds.factory.b3_win_wdo_coverage_block.v1'
          assert x['source_admission_pass'] is False
          assert x['economics_read_allowed'] is False and x['family_creation_allowed'] is False
          assert x['prospective_credit']==0 and x['scientific_credit']==0
          s=x['safety']
          assert s['RESEARCH_ONLY'] and s['SHADOW_ONLY'] and s['NOT_APPROVED']
          assert s['ENGINE_FEED'] is False and s['ORDERS']==0 and s['REAL_CAPITAL']==0
          assert s['NO_RETUNE'] and s['NO_BACKFILL'] and s['NO_COUNTER_RESET'] and s['FAIL_CLOSED']
          assert s['H1_ECONOMICS_READ'] is False
          assert x['block_contract_pass'] is True, x
          print('WIN_WDO_DATA_ONLY_BOUNDARY=PASS')
          PY
      - name: Upload coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: b3-win-wdo-coverage-${{ matrix.block }}-${{ github.run_id }}
          path: artifacts/gate_btc/factory/win_wdo_coverage/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 90

  win-wdo-calendar-crosscheck:
    needs: [physical-capture-qa, win-wdo-coverage-2020-2024]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile calendar crosscheck
        run: python -m py_compile tools/gate_btc_factory/b3_win_wdo_calendar_crosscheck.py
      - name: Download quarter coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: b3-win-wdo-coverage-*-${{ github.run_id }}
          path: artifacts/gate_btc/factory/win_wdo_coverage
          merge-multiple: true
      - name: Download official COTAHIST capture
        uses: actions/download-artifact@v4
        with:
          name: b3-cotahist-physical-capture-${{ github.run_id }}
          path: artifacts/gate_btc/factory/cotahist_capture
      - name: Crosscheck PriceReport weekday gaps against official B3 sessions
        run: |
          python tools/gate_btc_factory/b3_win_wdo_calendar_crosscheck.py \
            --coverage-dir artifacts/gate_btc/factory/win_wdo_coverage \
            --cotahist-dir artifacts/gate_btc/factory/cotahist_capture \
            --out artifacts/gate_btc/factory/win_wdo_calendar_crosscheck/RESULT.json
      - name: Assert calendar QA and research-only boundary
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifacts/gate_btc/factory/win_wdo_calendar_crosscheck/RESULT.json'))
          assert x['schema']=='qrds.factory.b3_win_wdo_calendar_crosscheck.v1'
          assert x['quarter_count']==20
          assert x['calendar_crosscheck_pass'] is True, x
          assert x['inconsistent_price_report_gaps_on_cotahist_sessions']==[]
          assert x['published_price_report_dates_not_in_cotahist']==[]
          assert x['source_admission_pass'] is False
          assert x['source_admission_blocker']=='IDENTITY_DEDUPE_PUBLICATION_TIMING_AND_PIT_QA_NOT_YET_FROZEN'
          assert x['economics_read_allowed'] is False and x['family_creation_allowed'] is False
          assert x['prospective_credit']==0 and x['scientific_credit']==0
          s=x['safety']
          assert s['RESEARCH_ONLY'] and s['SHADOW_ONLY'] and s['NOT_APPROVED']
          assert s['ENGINE_FEED'] is False and s['ORDERS']==0 and s['REAL_CAPITAL']==0
          assert s['NO_RETUNE'] and s['NO_BACKFILL'] and s['NO_COUNTER_RESET'] and s['FAIL_CLOSED']
          assert s['H1_ECONOMICS_READ'] is False
          print('WIN_WDO_CALENDAR_CROSSCHECK=PASS')
          PY
      - name: Upload calendar crosscheck evidence
        uses: actions/upload-artifact@v4
        with:
          name: b3-win-wdo-calendar-crosscheck-${{ github.run_id }}
          path: artifacts/gate_btc/factory/win_wdo_calendar_crosscheck/RESULT.json
          if-no-files-found: error
          retention-days: 90
