name: GATE BTC QOS Three-Track Prospective Shadow

on:
  pull_request:
    branches: [main, agent/gate-btc-migration-current]
    paths:
      - .github/workflows/gate-btc-qos-three-track-shadow.yml
      - migration/GATE_BTC_QOS_PROSPECTIVE_THREE_TRACK_CONTRACT_V1.json
      - tools/gate_btc_qos_interruption_20260928.json
      - tools/gate_btc_qos_prospective_three_track.py
      - tools/gate_btc_qos_covered_delivery.py
      - tools/gate_btc_qos_source_epoch_20261031.json
      - tools/gate_btc_qos_selected_source_probe.py
      - tools/gate_btc_binance_spot_equivalence_probe.py
      - tools/gate_btc_source_redundancy_probe.py
      - tools/gate_btc_momentum_required_prices.py
      - tools/gate_btc_momentum_economic_shadow.py
      - tests/test_gate_btc_qos_prospective_three_track.py
      - tests/test_gate_btc_qos_covered_delivery.py
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional eligible Daily Research run; default latest completed main run
        required: false
        type: string
  workflow_run:
    workflows: ["GATE BTC Daily Research Collection"]
    types: [completed]
  schedule:
    - cron: '50 * * * *'

permissions:
  actions: read
  contents: read

concurrency:
  group: gate-btc-qos-three-track-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'canonical' }}
  cancel-in-progress: false

jobs:
  upstream-daily-delivery:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Propagate failed main Daily collection
        env:
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          test "$UPSTREAM_BRANCH" = "main"
          test "$UPSTREAM_CONCLUSION" = "success"

  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy pandas pytest requests
      - run: python -m pytest -q tests/test_gate_btc_qos_prospective_three_track.py tests/test_gate_btc_qos_covered_delivery.py

  append-prospective-evidence:
    needs: contract-tests
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/checkout@v4
        with: {ref: gate-btc-runtime, path: runtime_repo, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy pandas requests
      - name: Preserve approved interrupted cycle and plan bounded current collection
        id: plan
        run: python tools/gate_btc_qos_covered_delivery.py --mode plan --runtime-dir runtime_repo/runtime/ledgers/qos_three_track
      - name: Resolve and validate immutable current Daily source
        id: input
        if: steps.plan.outputs.needs_source == 'true'
        continue-on-error: true
        env:
          MANUAL_RUN_ID: ${{ inputs.run_id || '' }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          SOURCE_RUN_ID="${MANUAL_RUN_ID:-$EVENT_RUN_ID}"
          if [ -z "$SOURCE_RUN_ID" ]; then
            gh run list --workflow gate-btc-daily-research.yml --branch main --limit 30 --json databaseId,status > daily_runs.json
            SOURCE_RUN_ID=$(python -c "import json; print(next(str(r['databaseId']) for r in json.load(open('daily_runs.json')) if r['status']=='completed'))")
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source_run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" > source_jobs.json
          python - <<'PY'
          import json
          r=json.load(open('source_run.json'));js=json.load(open('source_jobs.json'))['jobs']
          assert r['name']=='GATE BTC Daily Research Collection' and r['head_branch']=='main' and r['status']=='completed'
          p=[j for j in js if j['name']=='daily-research-collection']
          assert len(p)==1 and p[0]['conclusion']=='success'
          PY
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("gate-btc-daily-research-")) | .id' | head -1)
          test -n "$artifact_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > artifact.zip
          mkdir -p source_artifact
          unzip -q artifact.zip -d source_artifact
          python - <<'PY'
          import json
          d=json.load(open('source_artifact/daily_handoff/GATE_BTC_DAILY_RESEARCH_MANIFEST.json',encoding='utf-8-sig'))
          assert d['status'] in ['PASS','PASS_WITH_DATA_WARNINGS'] and d['components']['v2a']['status']=='PASS'
          assert d['research_only'] and d['operational_status']=='NOT_APPROVED'
          assert d['orders_generated']==d['real_capital_used']==d['methodology_changes']==0
          PY
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"
      - name: Deliver frozen cohort prices and unchanged three-track evaluation
        id: process
        if: steps.plan.outputs.needs_source == 'true' && steps.input.outcome == 'success'
        continue-on-error: true
        run: |
          python tools/gate_btc_qos_covered_delivery.py --mode process \
            --runtime-dir runtime_repo/runtime/ledgers/qos_three_track \
            --v2a-zip source_artifact/qos_daily/qos_v2a_outputs.zip --source-run-id "$SOURCE_RUN_ID"
      - name: Record upstream failure without fabricating economic evidence
        if: always() && steps.plan.outputs.needs_source == 'true' && steps.input.outcome != 'success'
        continue-on-error: true
        run: python tools/gate_btc_qos_covered_delivery.py --mode failure --runtime-dir runtime_repo/runtime/ledgers/qos_three_track
      - name: Verify original seals before publishing diagnostics or valid evidence
        id: integrity
        if: always() && steps.plan.outcome == 'success'
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.gate_btc_qos_covered_delivery import disposition,APPROVAL,core
          root=Path('runtime_repo/runtime/ledgers/qos_three_track')
          disposition(root,core.load(APPROVAL))
          s=core.load(root/'STATUS.json')
          assert s['research_only'] and s['shadow_only'] and s['not_approved']
          assert s['orders_generated']==s['real_capital_used']==0
          print('QOS_ORIGINAL_12_FILES_PRESERVED=PASS')
          PY
      - name: Publish actual status and immutable evidence
        if: always() && steps.integrity.outcome == 'success'
        working-directory: runtime_repo
        run: |
          set -euo pipefail
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          git add runtime/ledgers/qos_three_track
          git diff --cached --quiet && exit 0
          git commit -m "QOS approved interruption and current frozen-cohort delivery"
          for i in 1 2 3 4 5; do
            git pull --rebase origin gate-btc-runtime && git push origin HEAD:gate-btc-runtime && exit 0
            sleep $((i*2))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qos-three-track-evidence-${{ github.run_id }}
          path: runtime_repo/runtime/ledgers/qos_three_track
          retention-days: 90
      - name: Propagate blocked or failed delivery
        if: always() && steps.plan.outcome == 'success'
        env:
          NEEDS_SOURCE: ${{ steps.plan.outputs.needs_source }}
          INPUT_OUTCOME: ${{ steps.input.outcome }}
          PROCESS_OUTCOME: ${{ steps.process.outcome }}
        run: |
          python - <<'PY'
          import json,os
          s=json.load(open('runtime_repo/runtime/ledgers/qos_three_track/STATUS.json'))
          assert not s['status'].startswith(('FAILED','BLOCKED')),s['status']
          if os.environ['NEEDS_SOURCE']=='true':
              assert os.environ['INPUT_OUTCOME']==os.environ['PROCESS_OUTCOME']=='success'
          PY
