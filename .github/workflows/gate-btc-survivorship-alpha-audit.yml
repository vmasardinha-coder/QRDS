name: GATE BTC Survivorship Corrected Alpha Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-survivorship-alpha-audit.yml
      - tools/gate_btc_survivorship_alpha_audit.py
      - tests/test_gate_btc_survivorship_alpha_audit.py

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  survivorship-alpha-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test point-in-time alpha audit boundary
        run: python -m unittest -v tests/test_gate_btc_survivorship_alpha_audit.py

      - name: Emit current fail-closed audit state
        run: >-
          python tools/gate_btc_survivorship_alpha_audit.py
          --output artifacts/survivorship_alpha/SURVIVORSHIP_ALPHA_AUDIT_STATUS.json

      - name: Verify no survivor-only result can become official by default
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/survivorship_alpha/SURVIVORSHIP_ALPHA_AUDIT_STATUS.json', encoding='utf-8'))
          assert p['status'] == 'BLOCKED_INSUFFICIENT_VALIDATED_PIT_SERIES'
          assert p['user_exploratory_baseline']['status'] == 'UNVERIFIED_USER_EXPLORATORY_BASELINE'
          assert p['engine_feed'] is False
          assert p['feeds_frozen_engine'] is False
          assert p['strategy_inputs_changed'] is False
          assert p['methodology_changes'] == 0
          assert p['research_only'] is True
          assert p['shadow_only'] is True
          assert p['not_approved'] is True
          assert p['orders_generated'] == 0
          assert p['real_capital_used'] == 0
          print('SURVIVORSHIP_ALPHA_CONTRACT=PASS')
          print('STATUS='+p['status'])
          PY

      - name: Upload alpha audit contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-survivorship-alpha-audit-${{ github.run_id }}
          path: artifacts/survivorship_alpha/
          retention-days: 30
          if-no-files-found: error
