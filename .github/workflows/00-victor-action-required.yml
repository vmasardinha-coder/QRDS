name: "00 VICTOR — ACTION REQUIRED"
run-name: "00 VICTOR — ACTION REQUIRED"

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

concurrency:
  group: victor-human-action-supervisor
  cancel-in-progress: true

jobs:
  supervisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan live GitHub human gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/victor_action_supervisor.py \
            --json-out /tmp/victor_action_queue.json \
            --markdown-out /tmp/victor_action_queue.md
          cat /tmp/victor_action_queue.md >> "$GITHUB_STEP_SUMMARY"

      - name: Synchronize single Victor action issue
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(jq -r '.human_action_count' /tmp/victor_action_queue.json)
          title='00 VICTOR — ACTION REQUIRED'
          body=$(cat /tmp/victor_action_queue.md)

          issue_json=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title,body)
          issue_number=$(jq -r --arg t "$title" '.[] | select(.title == $t) | .number' <<<"$issue_json" | head -n1)

          changed=0
          if [[ "$count" -gt 0 ]]; then
            if [[ -z "$issue_number" ]]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" >/tmp/victor_issue_url.txt
              changed=1
              echo "Created human-action issue: $(cat /tmp/victor_issue_url.txt)"
            else
              old_body=$(jq -r --argjson n "$issue_number" '.[] | select(.number == $n) | .body' <<<"$issue_json")
              if [[ "$old_body" != "$body" ]]; then
                gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
                changed=1
                echo "Updated human-action issue #$issue_number"
              else
                echo "Human-action issue #$issue_number unchanged"
              fi
            fi
          else
            if [[ -n "$issue_number" ]]; then
              gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" --comment "No remaining human action detected by the live supervisor."
              echo "Closed resolved human-action issue #$issue_number"
            fi
            echo "No Victor action required."
          fi

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Signal only new or changed human action
        if: ${{ steps.sync.outputs.count != '0' && steps.sync.outputs.changed == '1' }}
        run: |
          echo 'NEW OR CHANGED HUMAN ACTION DETECTED.'
          echo 'Open the issue named: 00 VICTOR — ACTION REQUIRED'
          exit 1

      - name: Human-action state unchanged
        if: ${{ !(steps.sync.outputs.count != '0' && steps.sync.outputs.changed == '1') }}
        run: |
          echo 'No new human intervention surfaced in this cycle.'

      - name: Safety boundaries
        run: |
          echo 'RESEARCH_ONLY=true'
          echo 'ORDERS=0'
          echo 'REAL_CAPITAL=0'
          echo 'ENGINE_FEED=false'
          echo 'Ordinary workflow failures remain Factory-owned.'
          echo 'No H1 partial economics are opened by this supervisor.'
