name: GATE BTC Migration Parallel Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [agent/gate-btc-actions-migration]
    paths:
      - .github/workflows/gate-btc-migration-parallel.yml
      - tools/gate_btc_migration_runner.py
      - tools/qos_orchestrator.py
      - tools/v2a_frozen_replay.py
      - tools/compare_v2a_outputs.py
      - tools/delta_frozen_replay.py
      - tools/compare_delta_outputs.py
      - tools/compare_cross_platform_outputs.py
      - tools/validate_gateway_output_contract.py
      - tools/compare_qos_runs.py
      - tests/test_gate_btc_migration_runner.py
      - tests/test_qos_orchestrator.py
      - tests/test_v2a_frozen_replay.py
      - tests/test_compare_v2a_outputs.py
      - tests/test_delta_frozen_replay.py
      - tests/test_compare_delta_outputs.py
      - tests/test_compare_cross_platform_outputs.py
      - tests/test_gateway_output_contract.py
      - tests/test_compare_qos_runs.py
      - migration/canonical/**
      - migration/gateway/**

permissions:
  actions: read
  contents: read

concurrency:
  group: gate-btc-migration-${{ github.ref }}
  cancel-in-progress: true

env:
  GATE_BTC_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  GATE_BTC_SOURCE_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  GATE_BTC_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
  GATE_BTC_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}

jobs:
  research-only-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GATE_BTC_RESEARCH_ONLY: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            migration/canonical/v2a/requirements.txt
            migration/canonical/delta/requirements.txt
      - name: Install canonical research dependencies
        run: pip install -r migration/canonical/v2a/requirements.txt -r migration/canonical/delta/requirements.txt
      - name: Validate repository safety and contracts
        run: >-
          python -m unittest -v
          tests/test_gate_btc_migration_runner.py
          tests/test_gateway_output_contract.py
          tests/test_qos_orchestrator.py
          tests/test_v2a_frozen_replay.py
          tests/test_compare_v2a_outputs.py
          tests/test_delta_frozen_replay.py
          tests/test_compare_delta_outputs.py
          tests/test_compare_cross_platform_outputs.py
          tests/test_compare_qos_runs.py
      - name: Prepare artifact directories
        run: mkdir -p artifacts
      - name: Run unified QOS fixture orchestration
        run: python tools/qos_orchestrator.py --output-dir artifacts/qos_orchestration
      - name: Generate dated migration evidence
        if: always()
        run: python tools/gate_btc_migration_runner.py --output-dir artifacts/gate_btc_migration
      - name: Upload QOS and migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-migration-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

  public-data-close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GATE_BTC_RESEARCH_ONLY: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            migration/canonical/v2a/requirements.txt
            migration/canonical/delta/requirements.txt
      - name: Install canonical research dependencies
        run: pip install -r migration/canonical/v2a/requirements.txt -r migration/canonical/delta/requirements.txt
      - name: Prepare public-close artifact directories
        run: mkdir -p artifacts
      - name: Run unified QOS public-close orchestration
        run: >-
          python tools/qos_orchestrator.py
          --public-data
          --data-cutoff 2026-07-31
          --output-dir artifacts/qos_public_close
      - name: Verify deterministic V2A replay on identical bytes
        run: |
          python tools/v2a_frozen_replay.py \
            artifacts/qos_public_close/qos_v2a_outputs.zip \
            --data-cutoff 2026-07-31 \
            --output-zip artifacts/qos_public_close/qos_v2a_frozen_replay.zip \
            --evidence-dir artifacts/qos_public_close/v2a_replay_evidence
          python tools/compare_v2a_outputs.py \
            artifacts/qos_public_close/qos_v2a_outputs.zip \
            artifacts/qos_public_close/qos_v2a_frozen_replay.zip \
            --output-dir artifacts/qos_public_close/v2a_frozen_parity
      - name: Verify deterministic Delta replay on identical bytes
        run: |
          python tools/delta_frozen_replay.py \
            artifacts/qos_public_close/delta_public_input_snapshot.zip \
            --data-cutoff 2026-07-31 \
            --output-zip artifacts/qos_public_close/delta_frozen_replay.zip \
            --input-snapshot-zip artifacts/qos_public_close/delta_second_input_snapshot.zip \
            --evidence-dir artifacts/qos_public_close/delta_replay_evidence
          python tools/compare_delta_outputs.py \
            artifacts/qos_public_close/delta_walk_forward_outputs.zip \
            artifacts/qos_public_close/delta_frozen_replay.zip \
            --output-dir artifacts/qos_public_close/delta_frozen_parity
      - name: Generate dated migration evidence
        if: always()
        run: python tools/gate_btc_migration_runner.py --output-dir artifacts/gate_btc_migration
      - name: Upload public-close evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-public-close-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

  windows-same-input-parity:
    needs: public-data-close
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GATE_BTC_RESEARCH_ONLY: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            migration/canonical/v2a/requirements.txt
            migration/canonical/delta/requirements.txt
      - name: Install canonical research dependencies
        run: pip install -r migration/canonical/v2a/requirements.txt -r migration/canonical/delta/requirements.txt
      - name: Download Linux matched-close evidence
        uses: actions/download-artifact@v4
        with:
          name: gate-btc-public-close-${{ github.run_id }}
          path: artifacts
      - name: Replay V2A on Windows and compare semantically
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/windows_same_input | Out-Null
          python tools/v2a_frozen_replay.py `
            artifacts/qos_public_close/qos_v2a_outputs.zip `
            --data-cutoff 2026-07-31 `
            --output-zip artifacts/windows_same_input/windows_v2a_outputs.zip `
            --evidence-dir artifacts/windows_same_input/v2a_replay_evidence
          python tools/compare_cross_platform_outputs.py v2a `
            artifacts/qos_public_close/qos_v2a_outputs.zip `
            artifacts/windows_same_input/windows_v2a_outputs.zip `
            --output-dir artifacts/windows_same_input/v2a_windows_parity
      - name: Replay Delta on Windows and compare semantically
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/windows_same_input | Out-Null
          python tools/delta_frozen_replay.py `
            artifacts/qos_public_close/delta_public_input_snapshot.zip `
            --data-cutoff 2026-07-31 `
            --output-zip artifacts/windows_same_input/windows_delta_outputs.zip `
            --input-snapshot-zip artifacts/windows_same_input/windows_delta_input_snapshot.zip `
            --evidence-dir artifacts/windows_same_input/delta_replay_evidence
          python tools/compare_cross_platform_outputs.py delta `
            artifacts/qos_public_close/delta_walk_forward_outputs.zip `
            artifacts/windows_same_input/windows_delta_outputs.zip `
            --reference-input-snapshot artifacts/qos_public_close/delta_public_input_snapshot.zip `
            --replay-input-snapshot artifacts/windows_same_input/windows_delta_input_snapshot.zip `
            --output-dir artifacts/windows_same_input/delta_windows_parity
      - name: Generate Windows dated migration evidence
        if: always()
        run: python tools/gate_btc_migration_runner.py --output-dir artifacts/windows_same_input/migration_evidence
      - name: Upload Windows same-input evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-windows-same-input-${{ github.run_id }}
          path: artifacts/windows_same_input/
          retention-days: 14
          if-no-files-found: error
