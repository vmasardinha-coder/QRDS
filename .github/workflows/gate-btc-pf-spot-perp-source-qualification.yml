name: GATE BTC PF Spot Perp Source Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/gate_btc_2/PF_SPOT_PERP_BASIS_FUNDING_SOURCE_QUALIFICATION_20260923.json'
      - 'tools/gate_btc_factory/pf_spot_perp_basis_funding_source_qualification.py'
      - 'tests/test_gate_btc_pf_spot_perp_basis_funding_source_qualification.py'
      - '.github/workflows/gate-btc-pf-spot-perp-source-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'artifacts/gate_btc_2/PF_SPOT_PERP_BASIS_FUNDING_SOURCE_QUALIFICATION_20260923.json'
      - 'tools/gate_btc_factory/pf_spot_perp_basis_funding_source_qualification.py'
      - 'tests/test_gate_btc_pf_spot_perp_basis_funding_source_qualification.py'
      - '.github/workflows/gate-btc-pf-spot-perp-source-qualification.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  RESEARCH_ONLY: 'true'
  SHADOW_ONLY: 'true'
  ENGINE_FEED: 'false'
  ORDERS: '0'
  REAL_CAPITAL: '0'
  NO_RETUNE: 'true'
  NO_BACKFILL: 'true'

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: source_repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source and independence boundary
        run: |
          python -m pip install -q requests pytest
          cd source_repo
          python -m py_compile tools/gate_btc_factory/pf_spot_perp_basis_funding_source_qualification.py
          pytest -q tests/test_gate_btc_pf_spot_perp_basis_funding_source_qualification.py
          python tools/gate_btc_factory/pf_spot_perp_basis_funding_source_qualification.py --self-test
          python - <<'PY'
          import json
          d=json.load(open('artifacts/gate_btc_2/PF_SPOT_PERP_BASIS_FUNDING_SOURCE_QUALIFICATION_20260923.json'))
          assert d['economic_parameters_defined'] is False
          assert d['signal_formula_defined'] is False
          assert d['direction_defined'] is False
          assert d['thresholds_defined'] is False
          assert d['historical_backfill_allowed'] is False
          x=d['xagent_third_input_eligibility']
          assert x['status']=='NOT_ESTABLISHED_SHARED_COMPONENTS'
          assert 'PERPETUAL_MARKET' in x['shared_components'] and 'FUNDING' in x['shared_components']
          s=d['safety']
          assert s['RESEARCH_ONLY'] and s['SHADOW_ONLY'] and s['NO_RETUNE'] and s['NO_BACKFILL']
          assert s['ENGINE_FEED'] is False and s['ORDERS']==0 and s['REAL_CAPITAL']==0 and s['CANONICAL_580_UNTOUCHED']
          print('PF_SPOT_PERP_SOURCE_CONTRACT=PASS')
          PY
      - name: Probe live public source
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p live
          python source_repo/tools/gate_btc_factory/pf_spot_perp_basis_funding_source_qualification.py --output live/PF_SPOT_PERP_BASIS_FUNDING_SOURCE_QUALIFICATION_RUNTIME.json
      - name: Validate live source adjudication
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          d=json.load(open('live/PF_SPOT_PERP_BASIS_FUNDING_SOURCE_QUALIFICATION_RUNTIME.json'))
          assert d['economic_outcomes_read'] is False and d['signal_formula_defined'] is False
          assert d['historical_backfill_started'] is False and d['safety']['canonical_580_untouched'] is True
          assert d['xagent_third_input_eligibility']['count_as_third_input'] is False
          assert d['source']['status'] in {'QUALIFIED_PUBLIC_SOURCE','BLOCKED_REQUIRED_PUBLIC_SPOT_PERP_FIELD_MISSING','FAIL_CLOSED_SOURCE_UNVERIFIED'}
          print('PF_SPOT_PERP_LIVE_STATUS='+d['status'])
          print('PF_SPOT_PERP_SOURCE='+d['source']['status'])
          print('PF_SPOT_PERP_XAGENT_THIRD='+str(d['xagent_third_input_eligibility']['count_as_third_input']))
          PY
      - name: Persist source qualification to canonical runtime
        if: github.event_name != 'pull_request'
        run: |
          git clone --depth 1 --branch gate-btc-runtime "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" runtime_repo
          mkdir -p runtime_repo/runtime/factory_autonomy/parallel_frontier_source_qualifications
          cp live/PF_SPOT_PERP_BASIS_FUNDING_SOURCE_QUALIFICATION_RUNTIME.json runtime_repo/runtime/factory_autonomy/PF_SPOT_PERP_BASIS_FUNDING_SOURCE_QUALIFICATION_RUNTIME.json
          cp live/PF_SPOT_PERP_BASIS_FUNDING_SOURCE_QUALIFICATION_RUNTIME.json runtime_repo/runtime/factory_autonomy/parallel_frontier_source_qualifications/68f5b4b1bcb58e95ffec65c0e62e69da82c7d8f477f48c4d5d732ca5b24030ae.json
          git -C runtime_repo config user.name gate-btc-research-bot
          git -C runtime_repo config user.email gate-btc-research-bot@users.noreply.github.com
          git -C runtime_repo add runtime/factory_autonomy/PF_SPOT_PERP_BASIS_FUNDING_SOURCE_QUALIFICATION_RUNTIME.json runtime/factory_autonomy/parallel_frontier_source_qualifications
          git -C runtime_repo diff --cached --quiet && exit 0
          git -C runtime_repo commit -m "PF spot-perp source qualification ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            git -C runtime_repo fetch origin gate-btc-runtime
            git -C runtime_repo rebase origin/gate-btc-runtime || { git -C runtime_repo rebase --abort; exit 1; }
            git -C runtime_repo push origin HEAD:gate-btc-runtime && exit 0
            sleep $((i*2))
          done
          exit 1
      - name: Fail only if source could not be adjudicated
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          d=json.load(open('live/PF_SPOT_PERP_BASIS_FUNDING_SOURCE_QUALIFICATION_RUNTIME.json'))
          if d['source']['status']=='FAIL_CLOSED_SOURCE_UNVERIFIED':
              raise SystemExit('SOURCE_UNVERIFIED_FAIL_CLOSED')
          print('PF_SPOT_PERP_ADJUDICATED='+d['source']['status'])
          PY
