name: GATE BTC WIN WDO Cross Asset Regime Final Prereg

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/WIN_WDO_CROSS_ASSET_REGIME_FINAL_PREREG_CHECK_20260915.json'
      - 'tools/gate_btc_factory/test_win_wdo_cross_asset_regime_final_prereg_check.py'
      - '.github/workflows/gate-btc-win-wdo-cross-asset-regime-final-prereg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-prereg-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate final prereg seal
        run: python -m pytest -q tools/gate_btc_factory/test_win_wdo_cross_asset_regime_final_prereg_check.py
