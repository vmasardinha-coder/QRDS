name: GATE BTC B3 H100-H104 Exact CFTC Identity
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_b3_h100_h104_exact_identity.py'
      - '.github/workflows/gate-btc-b3-h100-h104-exact-identity.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_NOT_APPROVED: 'true'
  GATE_BTC_ORDERS: '0'
  GATE_BTC_REAL_CAPITAL: '0'
  GATE_BTC_ENGINE_FEED: 'false'
jobs:
  exact-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/gate_btc_b3_h100_h104_exact_identity.py
      - name: Assert source-only boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/b3_h100_h109/B3_H100_H104_EXACT_IDENTITY.json'))
          assert p['cutoff_exclusive']=='2026-08-10'
          assert p['economics_run'] is False and p['h1_economics_read'] is False
          assert p['survivor_partial_economics_read'] is False
          assert p['orders_generated']==0 and p['real_capital_used']==0 and p['engine_feed'] is False
          assert p['not_approved'] is True
          print(p['status']); print({k:v['status'] for k,v in p['families'].items()})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b3-h100-h104-exact-identity-${{ github.run_id }}
          path: artifacts/b3_h100_h109/B3_H100_H104_EXACT_IDENTITY.json
          retention-days: 30
          if-no-files-found: error
