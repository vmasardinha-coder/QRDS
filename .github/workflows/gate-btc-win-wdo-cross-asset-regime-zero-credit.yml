name: GATE BTC WIN WDO Cross Asset Regime Zero Credit

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/WIN_WDO_CROSS_ASSET_REGIME_ZERO_CREDIT_20260915.json'
      - 'tools/gate_btc_factory/test_win_wdo_cross_asset_regime_zero_credit.py'
      - '.github/workflows/gate-btc-win-wdo-cross-asset-regime-zero-credit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-credit-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate zero-credit boundary
        run: python -m pytest -q tools/gate_btc_factory/test_win_wdo_cross_asset_regime_zero_credit.py
