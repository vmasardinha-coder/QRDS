name: GATE BTC WIN WDO Cross Asset Regime NO TRADES Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/WIN_WDO_CROSS_ASSET_REGIME_NO_TRADES_AUDIT_BOUNDARY_20260915.json'
      - 'tools/gate_btc_factory/test_win_wdo_cross_asset_regime_no_trades_boundary.py'
      - '.github/workflows/gate-btc-win-wdo-cross-asset-regime-no-trades-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-trades-boundary-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate NO_TRADES audit boundary
        run: python -m pytest -q tools/gate_btc_factory/test_win_wdo_cross_asset_regime_no_trades_boundary.py
