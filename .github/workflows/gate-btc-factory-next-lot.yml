name: GATE BTC Factory Source Delivery and Admission Validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/prospective_local_operations.py'
      - 'tools/gate_btc_factory_source_delivery.ps1'
      - 'tools/gate_btc_factory_source_delivery_install.ps1'
      - 'tools/gate_btc_system13_dataset_readiness.py'
      - 'tools/gate_btc_system13_source_readiness.py'
      - 'tools/gate_btc_factory/SYSTEM13_EXACT_IDENTITY_EXTENSION_20261101.json'
      - 'artifacts/gate_btc_2/system13_identity_extension_20261101/**'
      - 'artifacts/gate_btc_2/grammar007_reconciliation_20261101/**'
      - 'tools/gate_btc_factory/grammar_007_current_disposition.py'
      - 'tools/gate_btc_factory/grammar_pipeline_status.py'
      - 'tests/test_gate_btc_factory_source_delivery.py'
      - 'tests/test_gate_btc_system13_dataset_readiness.py'
      - 'tests/test_gate_btc_grammar007_current_disposition.py'
      - '.github/workflows/gate-btc-factory-next-lot.yml'
  push:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/prospective_local_operations.py'
      - 'tools/gate_btc_factory_source_delivery.ps1'
      - 'tools/gate_btc_factory_source_delivery_install.ps1'
      - 'tools/gate_btc_system13_dataset_readiness.py'
      - 'tools/gate_btc_system13_source_readiness.py'
      - 'tools/gate_btc_factory/SYSTEM13_EXACT_IDENTITY_EXTENSION_20261101.json'
      - 'tools/gate_btc_factory/grammar_007_current_disposition.py'
      - 'tests/test_gate_btc_factory_source_delivery.py'
      - 'tests/test_gate_btc_system13_dataset_readiness.py'
      - 'tests/test_gate_btc_grammar007_current_disposition.py'
      - '.github/workflows/gate-btc-factory-next-lot.yml'
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests pytest PyYAML
      - name: Validate source delivery, immutable scientific boundaries and admission
        run: >-
          python -m pytest -q
          tests/test_gate_btc_factory_source_delivery.py
          tests/test_gate_btc_crypto_745_basis_forward_capture.py
          tests/test_gate_btc_xagent_spot_flow_signal_producer.py
          tests/test_gate_btc_xagent_term_carry_signal_producer.py
          tests/test_gate_btc_xagent_breadth_signal_producer.py
          tests/test_gate_btc_system13_dataset_readiness.py
          tests/test_gate_btc_system13_source_readiness.py
          tests/test_gate_btc_system13_governed_bars.py
          tests/test_gate_btc_system13_binding_refinement.py
          tests/test_gate_btc_system13_native_capture.py
          tests/test_gate_btc_grammar007_current_disposition.py
          tests/test_gate_btc_grammar_007_effect_cases_auth.py
          tests/test_gate_btc_grammar_007_effect_stat_auth.py
          tests/test_gate_btc_grammar_pipeline_status.py
          tests/test_gate_btc_grammar_pipeline_progress.py
