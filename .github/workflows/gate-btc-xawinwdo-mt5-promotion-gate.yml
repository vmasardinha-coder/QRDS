name: GATE BTC XAWINWDO MT5 Promotion Gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/XAWINWDO_MT5_PROMOTION_GATE.v1.json'
      - 'tests/test_gate_btc_xawinwdo_mt5_promotion_gate.py'
      - '.github/workflows/gate-btc-xawinwdo-mt5-promotion-gate.yml'
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install -q pytest
          pytest -q tests/test_gate_btc_xawinwdo_mt5_promotion_gate.py
