name: GATE BTC V16B.1 Prospective Publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-v16b1-prospective-publisher.yml
      - tools/gate_btc_v16b1_operational_orchestrator.py
  schedule:
    # Hourly gives the causal state machine repeated opportunities without
    # changing the frozen Thu/Fri clock enforced by gate_btc_v16b1_chain.py.
    - cron: "17 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: gate-btc-v16b1-prospective-publisher
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  RESEARCH_ONLY: "true"
  SHADOW_ONLY: "true"
  NOT_APPROVED: "true"
  ENGINE_FEED: "false"
  ORDERS: "0"
  REAL_CAPITAL: "0"
  NO_BACKFILL: "true"
  NO_LATE_SEAL: "true"
  NO_COUNTER_RESET: "true"
  NO_RETUNE: "true"
  FAIL_CLOSED: "true"

jobs:
  causal-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout immutable main implementation
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Checkout canonical runtime branch
        uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: canonical-runtime
          fetch-depth: 0

      - name: Install runtime dependencies
        working-directory: source
        run: python -m pip install --disable-pip-version-check pandas

      - name: Resolve authoritative V16B.1 SIGNAL inputs fail closed
        if: github.event_name != 'pull_request'
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          STATUS="$GITHUB_WORKSPACE/canonical-runtime/runtime/ledgers/v16b1/STATUS.json"
          SIGNAL_DATE="$(python -c "import json; print(json.load(open('$STATUS'))['signal_date'])")"
          NOW_EPOCH="$(date -u +%s)"
          OPEN_EPOCH="$(date -u -d "$SIGNAL_DATE + 1 day" +%s)"
          CLOSE_EPOCH="$(date -u -d "$SIGNAL_DATE + 2 days" +%s)"
          if [ "$NOW_EPOCH" -lt "$OPEN_EPOCH" ] || [ "$NOW_EPOCH" -ge "$CLOSE_EPOCH" ]; then
            echo "V16B1_SIGNAL_INPUT_RESOLUTION=NOT_IN_SIGNAL_WINDOW signal_date=$SIGNAL_DATE"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/v16b1-inputs/cmc"
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          signal_date=json.load(open(os.environ['GITHUB_WORKSPACE']+'/canonical-runtime/runtime/ledgers/v16b1/STATUS.json'))['signal_date']
          repo=os.environ['REPO']
          runs=json.loads(subprocess.check_output([
              'gh','api',f'repos/{repo}/actions/workflows/gate-btc-v16b-cmc-snapshot.yml/runs?status=success&per_page=100'
          ], text=True))
          candidates=[]
          for r in runs.get('workflow_runs', []):
              if r.get('name')!='GATE BTC V16B CMC Prospective Snapshot' or r.get('conclusion')!='success' or r.get('event') not in ('schedule','workflow_dispatch'):
                  continue
              created=str(r.get('created_at',''))
              if created[:10] != signal_date:
                  continue
              candidates.append((created, int(r['id'])))
          if not candidates:
              raise SystemExit('FAIL_CLOSED_NO_SAME_DAY_CMC_SNAPSHOT')
          run_id=sorted(candidates)[-1][1]
          arts=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}/artifacts'], text=True)).get('artifacts',[])
          arts=[a for a in arts if a.get('name')==f'gate-btc-v16b-cmc-snapshot-{run_id}' and not a.get('expired')]
          if len(arts)!=1:
              raise SystemExit('FAIL_CLOSED_CMC_ARTIFACT_NOT_UNIQUE')
          pathlib.Path(os.environ['RUNNER_TEMP']+'/v16b1-cmc-run-id').write_text(str(run_id))
          pathlib.Path(os.environ['RUNNER_TEMP']+'/v16b1-cmc-artifact-id').write_text(str(arts[0]['id']))
          PY
          ART_ID="$(cat "$RUNNER_TEMP/v16b1-cmc-artifact-id")"
          gh api "repos/$REPO/actions/artifacts/$ART_ID/zip" > "$RUNNER_TEMP/v16b1-cmc.zip"
          unzip -q "$RUNNER_TEMP/v16b1-cmc.zip" -d "$RUNNER_TEMP/v16b1-inputs/cmc"
          RAW="$(find "$RUNNER_TEMP/v16b1-inputs/cmc" -type f -name '*.raw.json' | head -1)"
          EV="$(find "$RUNNER_TEMP/v16b1-inputs/cmc" -type f -name '*.evidence.json' | head -1)"
          test -n "$RAW" && test -n "$EV"
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'v16b1-inputs/cmc'
          raw=next(root.rglob('*.raw.json')); ev=next(root.rglob('*.evidence.json'))
          e=json.load(open(ev)); assert hashlib.sha256(raw.read_bytes()).hexdigest()==e['raw_snapshot_sha256']
          assert e['snapshot_date']==json.load(open(os.environ['GITHUB_WORKSPACE']+'/canonical-runtime/runtime/ledgers/v16b1/STATUS.json'))['signal_date']
          print('V16B1_CMC_INPUT=PASS',e['snapshot_id'])
          PY
          HIST="$GITHUB_WORKSPACE/canonical-runtime/runtime/ledgers/v16b1/HISTORICAL_WEEKLY_UNIVERSE_MODEL_ONLY.csv"
          # This file is an authoritative frozen model-training input only. Never
          # reconstruct it from missed prospective windows or current snapshots.
          if [ ! -f "$HIST" ]; then
            echo "FAIL_CLOSED_MISSING_HISTORICAL_WEEKLY_UNIVERSE_MODEL_ONLY"
            python - <<'PY'
          import json,os
          p=os.environ['GITHUB_WORKSPACE']+'/canonical-runtime/runtime/ledgers/v16b1/STATUS.json'
          s=json.load(open(p)); s['operational_blocker']='MISSING_AUTHORITATIVE_HISTORICAL_WEEKLY_UNIVERSE_MODEL_ONLY'
          s['canonical_cycle_count']=int(s['canonical_cycle_count']); s['prospective_credit']=int(s['prospective_credit'])
          open(p,'w').write(json.dumps(s,indent=2,sort_keys=True)+'\n')
          PY
            exit 0
          fi
          SHORT="$GITHUB_WORKSPACE/canonical-runtime/runtime/ledgers/v16b1/SHORTABILITY_HISTORY.csv"
          if [ ! -f "$SHORT" ]; then
            printf 'friday_utc,asset\n' > "$RUNNER_TEMP/v16b1-shortability.csv"
            SHORT="$RUNNER_TEMP/v16b1-shortability.csv"
          fi
          OUT="$RUNNER_TEMP/v16b1-inputs/source"
          python -m tools.gate_btc_v16b_signal_source             --cmc-snapshot "$RAW" --cmc-evidence "$EV" --signal-date "$SIGNAL_DATE"             --historical-weekly-universe "$HIST" --out-dir "$OUT"
          python -m tools.gate_btc_v16b_source_bound_panel             --daily-prices "$OUT/daily_prices.csv" --weekly-universe "$OUT/weekly_universe.csv"             --signal-market-source-manifest "$OUT/signal_market_source_manifest.json"             --output "$OUT/panel.csv" --manifest "$OUT/panel_manifest.json"
          python -m tools.gate_btc_v16b1_okx_signal             --panel "$OUT/panel.csv" --panel-manifest "$OUT/panel_manifest.json"             --signal-market-source-manifest "$OUT/signal_market_source_manifest.json"             --v16b1-shortability "$SHORT" --signal-date "$SIGNAL_DATE"             --universe-snapshot "$RAW" --universe-snapshot-evidence "$EV"             --code-commit "$(git rev-parse HEAD)" --output "$OUT/signal_input.json"
          python -m tools.gate_btc_v16b1_chain seal-signal             --input "$OUT/signal_input.json"             --ledger "$GITHUB_WORKSPACE/canonical-runtime/runtime/ledgers/v16b1/CHAIN.jsonl"

      - name: Resolve causal V16B.1 ENTRY inputs fail closed
        if: github.event_name != 'pull_request'
        working-directory: source
        run: |
          set -euo pipefail
          LEDGER="$GITHUB_WORKSPACE/canonical-runtime/runtime/ledgers/v16b1/CHAIN.jsonl"
          STATUS="$GITHUB_WORKSPACE/canonical-runtime/runtime/ledgers/v16b1/STATUS.json"
          touch "$LEDGER"
          read SIGNAL_DATE ENTRY_DATE HAS_SIGNAL HAS_ENTRY <<<"$(python - <<'PY'
          import json,os
          from tools import gate_btc_v16b1_chain as c
          s=json.load(open(os.environ['GITHUB_WORKSPACE']+'/canonical-runtime/runtime/ledgers/v16b1/STATUS.json'))
          ev=c.load_events(__import__('pathlib').Path(os.environ['GITHUB_WORKSPACE']+'/canonical-runtime/runtime/ledgers/v16b1/CHAIN.jsonl'))
          sd=s['signal_date']; ed=s['entry_date']
          print(sd,ed,int(any(x.get('event_type')=='V16B1_SIGNAL_SEAL' and x.get('signal_date_utc')==sd for x in ev)),int(any(x.get('event_type')=='V16B1_ENTRY_SEAL' and x.get('signal_date_utc')==sd for x in ev)))
          PY
          )"
          [ "$HAS_SIGNAL" = 1 ] || { echo "V16B1_ENTRY=WAITING_VALID_SIGNAL"; exit 0; }
          [ "$HAS_ENTRY" = 0 ] || { echo "V16B1_ENTRY=ALREADY_SEALED"; exit 0; }
          NOW="$(date -u +%s)"; CLOSE="$(date -u -d "$ENTRY_DATE + 1 day" +%s)"
          [ "$NOW" -lt "$CLOSE" ] || { echo "V16B1_ENTRY=WINDOW_MISSED_FAIL_CLOSED"; exit 0; }
          OUT="$RUNNER_TEMP/v16b1-entry"; mkdir -p "$OUT"
          curl -fsS 'https://www.okx.com/api/v5/public/instruments?instType=SWAP' -o "$OUT/okx_instruments.json"
          curl -fsS 'https://www.okx.com/api/v5/public/time' -o "$OUT/okx_time.json"
          curl -fsS 'https://api.binance.com/api/v3/exchangeInfo' -o "$OUT/binance_exchangeInfo.json"
          curl -fsS 'https://api.binance.com/api/v3/time' -o "$OUT/binance_time.json"
          python - <<'PY'
          import json,os,pathlib
          from tools import gate_btc_v16b1_chain as c
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          ev=c.load_events(root/'canonical-runtime/runtime/ledgers/v16b1/CHAIN.jsonl')
          sd=json.load(open(root/'canonical-runtime/runtime/ledgers/v16b1/STATUS.json'))['signal_date']
          sig=[x for x in ev if x.get('event_type')=='V16B1_SIGNAL_SEAL' and x.get('signal_date_utc')==sd]
          assert len(sig)==1
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'v16b1-entry/signal_event.json'
          p.write_text(json.dumps(sig[0],sort_keys=True)+'\n')
          PY
          python -m tools.gate_btc_v16b1_okx_entry --signal-event "$OUT/signal_event.json" --okx-instruments "$OUT/okx_instruments.json" --okx-time "$OUT/okx_time.json" --binance-spot-exchange-info "$OUT/binance_exchangeInfo.json" --binance-time "$OUT/binance_time.json" --output "$OUT/entry_input.json"
          python -m tools.gate_btc_v16b1_chain seal-entry --input "$OUT/entry_input.json" --ledger "$LEDGER"
          mkdir -p "$GITHUB_WORKSPACE/canonical-runtime/runtime/ledgers/v16b1/evidence/$SIGNAL_DATE/entry"
          cp "$OUT"/*.json "$GITHUB_WORKSPACE/canonical-runtime/runtime/ledgers/v16b1/evidence/$SIGNAL_DATE/entry/"

      - name: Guard RESULT until official post-exit evidence is complete
        if: github.event_name != 'pull_request'
        working-directory: source
        run: |
          set -euo pipefail
          LEDGER="$GITHUB_WORKSPACE/canonical-runtime/runtime/ledgers/v16b1/CHAIN.jsonl"
          STATUS="$GITHUB_WORKSPACE/canonical-runtime/runtime/ledgers/v16b1/STATUS.json"
          touch "$LEDGER"
          python - <<'PY'
          import json,os,pathlib,datetime as dt
          from tools import gate_btc_v16b1_chain as c
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          s=json.load(open(root/'canonical-runtime/runtime/ledgers/v16b1/STATUS.json'))
          ev=c.load_events(root/'canonical-runtime/runtime/ledgers/v16b1/CHAIN.jsonl')
          sd=s['signal_date']
          entries=[x for x in ev if x.get('event_type')=='V16B1_ENTRY_SEAL' and x.get('signal_date_utc')==sd]
          results=[x for x in ev if x.get('event_type')=='V16B1_RESULT_SEAL' and x.get('signal_date_utc')==sd]
          if results: print('V16B1_RESULT=ALREADY_SEALED')
          elif not entries: print('V16B1_RESULT=WAITING_VALID_ENTRY')
          else:
              exit_date=dt.date.fromisoformat(entries[0]['entry_date_utc'])+dt.timedelta(days=7)
              close=dt.datetime.combine(exit_date+dt.timedelta(days=1),dt.time.min,tzinfo=dt.timezone.utc)
              print('V16B1_RESULT=EVIDENCE_CAPTURE_REQUIRED_AFTER_EXIT_CLOSE' if dt.datetime.now(dt.timezone.utc)>=close else 'V16B1_RESULT=WAITING_EXIT_CLOSE', exit_date.isoformat())
          PY

      - name: Reconcile causal clock fail closed
        working-directory: source
        run: |
          set -euo pipefail
          STATUS="$GITHUB_WORKSPACE/canonical-runtime/runtime/ledgers/v16b1/STATUS.json"
          LEDGER="$GITHUB_WORKSPACE/canonical-runtime/runtime/ledgers/v16b1/CHAIN.jsonl"
          touch "$LEDGER"
          python -m tools.gate_btc_v16b1_operational_orchestrator \
            --status "$STATUS" \
            --ledger "$LEDGER" \
            --write | tee "$RUNNER_TEMP/v16b1-orchestrator.json"

      - name: Validate canonical hard locks before publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('canonical-runtime/runtime/ledgers/v16b1/STATUS.json')
          s=json.loads(p.read_text())
          assert s['family_id']=='GATE_BTC_V16B1_OKX_FAMILY_FREEZE_20260909'
          assert s['canonical_child']=='GATE_BTC_V16B1_OKX_CORE'
          assert s['parent_status']=='TERMINAL_BLOCKED_NOT_PROMOTABLE'
          assert s['parent_reopened'] is False
          assert s['research_only'] is True and s['shadow_only'] is True and s['not_approved'] is True
          assert s['engine_feed'] is False and s['orders_generated']==0 and s['real_capital_used']==0
          assert s['no_backfill'] is True and s['no_late_seal'] is True and s['no_counter_reset'] is True
          assert s['no_retuning'] is True and s['fail_closed'] is True
          for m in s.get('missed_cycles',[]):
              assert m['scientific_credit']==0
          print('V16B1_CANONICAL_HARD_LOCKS=PASS')
          PY

      - name: Publish canonical runtime atomically
        working-directory: canonical-runtime
        run: |
          set -euo pipefail
          if git diff --quiet -- runtime/ledgers/v16b1; then
            echo "No canonical runtime change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/ledgers/v16b1
          git commit -m "runtime(v16b1): causal prospective publisher tick"
          git push origin HEAD:gate-btc-runtime

      - name: Confirm canonical branch after publication
        working-directory: canonical-runtime
        run: |
          set -euo pipefail
          git fetch origin gate-btc-runtime
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/gate-btc-runtime)"
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('runtime/ledgers/v16b1/STATUS.json').read_text())
          assert s['canonical_cycle_count'] >= 0
          assert s['prospective_credit'] >= 0
          assert s['parent_reopened'] is False
          assert s['orders_generated']==0 and s['real_capital_used']==0
          print(json.dumps({
              'canonical_runtime_confirmed': True,
              'next_canonical_event': s['next_canonical_event'],
              'signal_date': s['signal_date'],
              'canonical_cycle_count': s['canonical_cycle_count'],
              'prospective_credit': s['prospective_credit'],
          }, sort_keys=True))
          PY
