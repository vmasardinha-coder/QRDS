name: GATE BTC V16B.1 Prospective Publisher

on:
  workflow_dispatch:
  schedule:
    # Hourly gives the causal state machine repeated opportunities without
    # changing the frozen Thu/Fri clock enforced by gate_btc_v16b1_chain.py.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: gate-btc-v16b1-prospective-publisher
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  RESEARCH_ONLY: "true"
  SHADOW_ONLY: "true"
  NOT_APPROVED: "true"
  ENGINE_FEED: "false"
  ORDERS: "0"
  REAL_CAPITAL: "0"
  NO_BACKFILL: "true"
  NO_LATE_SEAL: "true"
  NO_COUNTER_RESET: "true"
  NO_RETUNE: "true"
  FAIL_CLOSED: "true"

jobs:
  causal-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout immutable main implementation
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Checkout canonical runtime branch
        uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: canonical-runtime
          fetch-depth: 0

      - name: Install runtime dependencies
        working-directory: source
        run: python -m pip install --disable-pip-version-check pandas

      - name: Reconcile causal clock fail closed
        working-directory: source
        run: |
          set -euo pipefail
          STATUS="$GITHUB_WORKSPACE/canonical-runtime/runtime/ledgers/v16b1/STATUS.json"
          LEDGER="$GITHUB_WORKSPACE/canonical-runtime/runtime/ledgers/v16b1/CHAIN.jsonl"
          touch "$LEDGER"
          python tools/gate_btc_v16b1_operational_orchestrator.py \
            --status "$STATUS" \
            --ledger "$LEDGER" \
            --write | tee "$RUNNER_TEMP/v16b1-orchestrator.json"

      - name: Validate canonical hard locks before publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('canonical-runtime/runtime/ledgers/v16b1/STATUS.json')
          s=json.loads(p.read_text())
          assert s['family_id']=='GATE_BTC_V16B1_OKX_FAMILY_FREEZE_20260909'
          assert s['canonical_child']=='GATE_BTC_V16B1_OKX_CORE'
          assert s['parent_status']=='TERMINAL_BLOCKED_NOT_PROMOTABLE'
          assert s['parent_reopened'] is False
          assert s['research_only'] is True and s['shadow_only'] is True and s['not_approved'] is True
          assert s['engine_feed'] is False and s['orders_generated']==0 and s['real_capital_used']==0
          assert s['no_backfill'] is True and s['no_late_seal'] is True and s['no_counter_reset'] is True
          assert s['no_retuning'] is True and s['fail_closed'] is True
          for m in s.get('missed_cycles',[]):
              assert m['scientific_credit']==0
          print('V16B1_CANONICAL_HARD_LOCKS=PASS')
          PY

      - name: Publish canonical runtime atomically
        working-directory: canonical-runtime
        run: |
          set -euo pipefail
          if git diff --quiet -- runtime/ledgers/v16b1/STATUS.json runtime/ledgers/v16b1/CHAIN.jsonl; then
            echo "No canonical runtime change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/ledgers/v16b1/STATUS.json runtime/ledgers/v16b1/CHAIN.jsonl
          git commit -m "runtime(v16b1): causal prospective publisher tick"
          git push origin HEAD:gate-btc-runtime

      - name: Confirm canonical branch after publication
        working-directory: canonical-runtime
        run: |
          set -euo pipefail
          git fetch origin gate-btc-runtime
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/gate-btc-runtime)"
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('runtime/ledgers/v16b1/STATUS.json').read_text())
          assert s['canonical_cycle_count'] >= 0
          assert s['prospective_credit'] >= 0
          assert s['parent_reopened'] is False
          assert s['orders_generated']==0 and s['real_capital_used']==0
          print(json.dumps({
              'canonical_runtime_confirmed': True,
              'next_canonical_event': s['next_canonical_event'],
              'signal_date': s['signal_date'],
              'canonical_cycle_count': s['canonical_cycle_count'],
              'prospective_credit': s['prospective_credit'],
          }, sort_keys=True))
          PY
