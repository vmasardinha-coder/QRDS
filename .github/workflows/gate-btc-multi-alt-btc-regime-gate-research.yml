name: GATE BTC multi-alt BTC regime gate research

on:
  push:
    branches:
      - research/freqtrade-family-tests
    paths:
      - "artifacts/gate_btc_2/freqtrade_research/multi_alt_btc_regime_gate_test.py"
      - ".github/workflows/gate-btc-multi-alt-btc-regime-gate-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: pip install numpy pandas
      - name: Run frozen multi-alt BTC regime gate panel
        run: python artifacts/gate_btc_2/freqtrade_research/multi_alt_btc_regime_gate_test.py
      - name: Verify isolation and frozen semantics
        run: |
          grep -q 'RESEARCH_ONLY=true' artifacts/gate_btc_2/freqtrade_research/multi_alt_btc_regime_gate_test.py
          grep -q 'SHADOW_ONLY=true' artifacts/gate_btc_2/freqtrade_research/multi_alt_btc_regime_gate_test.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/gate_btc_2/freqtrade_research/runtime_multi_alt_btc_gate/multi_alt_btc_regime_gate_test.json')
          d = json.loads(p.read_text())
          assert d['research_only'] is True
          assert d['shadow_only'] is True
          assert d['factory_touched'] is False
          assert d['frozen_rule']['per_asset_retune'] is False
          PY
      - name: Upload panel artifact
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-multi-alt-btc-regime-gate-research
          path: artifacts/gate_btc_2/freqtrade_research/runtime_multi_alt_btc_gate/
          if-no-files-found: error
