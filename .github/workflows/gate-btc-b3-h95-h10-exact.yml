name: GATE BTC B3 H95 H10 Exact Probe
on:
  pull_request:
    paths:
      - 'tools/gate_btc_b3_h95_h10_exact_probe.py'
      - '.github/workflows/gate-btc-b3-h95-h10-exact.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_NOT_APPROVED: 'true'
  GATE_BTC_ORDERS: '0'
  GATE_BTC_REAL_CAPITAL: '0'
  GATE_BTC_ENGINE_FEED: 'false'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python tools/gate_btc_b3_h95_h10_exact_probe.py
      - name: Assert no economics
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/b3_h90_h99/B3_H95_H10_EXACT_PROBE.json'))
          assert p['economics_run'] is False and p['h1_economics_read'] is False
          assert p['orders']==0 and p['real_capital']==0 and p['engine_feed'] is False
          assert p['not_approved'] is True
          print(p['status'], p.get('candidate_series_tokens'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b3-h95-h10-exact-${{ github.run_id }}
          path: artifacts/b3_h90_h99/B3_H95_H10_EXACT_PROBE.json
          retention-days: 30
          if-no-files-found: error
