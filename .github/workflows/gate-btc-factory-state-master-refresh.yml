name: GATE BTC Factory State Master Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '8 * * * *'

permissions:
  contents: write

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_NOT_APPROVED: 'true'

concurrency:
  group: gate-btc-factory-state-master-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh operational state only
        run: python tools/gate_btc_factory/state_master_refresh.py
      - name: Assert immutable safety boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('tools/gate_btc_research_factory_status.json',encoding='utf-8'))
          assert p['safety']=={
            'research_only': True, 'shadow_only': True, 'not_approved': True,
            'orders': 0, 'real_capital': 0, 'engine_feed': False,
            'no_holdout_contamination': True,
          }
          assert p['auto_refresh']['scientific_state_mutation_allowed'] is False
          print('PASS_STATE_MASTER_REFRESH_SAFETY')
          PY
      - name: Commit refreshed timestamp and operational fields
        run: |
          set -euo pipefail
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          git add tools/gate_btc_research_factory_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Factory: refresh canonical operational state'
          git push origin HEAD:gate-btc-runtime-factory-state
