name: GATE BTC B3 H Stage1 Adapter

on:
  pull_request:
    branches: [main]
    paths:
      - tools/gate_btc_b3_h_stage1_adapter.py
      - tests/test_gate_btc_b3_h_stage1_adapter.py
      - .github/workflows/gate-btc-b3-h-stage1-adapter.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  GATE_BTC_SHADOW_ONLY: "true"
  GATE_BTC_NOT_APPROVED: "true"

jobs:
  stage1-adapter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pytest
      - name: Run Stage1 anti-contamination tests
        run: pytest -q tests/test_gate_btc_b3_h_stage1_adapter.py
      - name: Compile Stage1 adapter
        run: python -m py_compile tools/gate_btc_b3_h_stage1_adapter.py
