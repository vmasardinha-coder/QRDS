name: GATE BTC V16B1 Official Label Maturation
on:
  schedule:
    - cron: "35 6 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-v16b1-official-label-maturation.yml
      - tools/gate_btc_v16b1_mature_official.py
      - tests/test_gate_btc_v16b1_mature_official.py
permissions:
  contents: write
concurrency:
  group: gate-btc-v16b1-official-label-maturation
  cancel-in-progress: false
jobs:
  mature:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {path: source}
      - uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: canonical-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Test official immutable label path
        working-directory: source
        run: |
          pip install --disable-pip-version-check pytest requests
          python -m pytest -q tests/test_gate_btc_v16b1_mature_official.py
      - name: Resolve oldest matured eligible week
        id: week
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt, json, pathlib
          root=pathlib.Path('canonical-runtime/runtime/evidence/v16b1/prospective_training/weeks')
          today=dt.datetime.now(dt.timezone.utc).date()
          candidates=[]
          for p in root.glob('*/WEEK.json'):
              meta=json.loads(p.read_text())
              if meta.get('label_status')=='PENDING_FROZEN_EXIT' and dt.date.fromisoformat(meta['exit_date'])<today and not (p.parent/'MATURED.json').exists():
                  candidates.append(p.parent.name)
          print('signal_date='+min(candidates,default=''))
          PY
      - name: Capture official close archives and seal labels
        if: steps.week.outputs.signal_date != ''
        working-directory: source
        run: |
          python -m tools.gate_btc_v16b1_mature_official --runtime-root ../canonical-runtime --signal-date "${{ steps.week.outputs.signal_date }}"
      - name: Publish append-only maturity evidence
        if: steps.week.outputs.signal_date != ''
        working-directory: canonical-runtime
        run: |
          set -euo pipefail
          git add -- "runtime/evidence/v16b1/prospective_training/weeks/${{ steps.week.outputs.signal_date }}"
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          git commit -m "Mature official V16B.1 labels after frozen exit"
          git pull --rebase origin gate-btc-runtime
          git push origin HEAD:gate-btc-runtime
      - name: Safety boundary
        run: |
          echo 'RESEARCH_ONLY=true SHADOW_ONLY=true ORDERS=0 REAL_CAPITAL=0 SCIENTIFIC_CREDIT=0'
