name: GATE BTC B3 H70-H79 Economics

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_b3_h70_h79_prereg.md'
      - 'tools/gate_btc_b3_h70_h79_data_probe.py'
      - 'tools/gate_btc_b3_h70_h79_economics.py'
      - '.github/workflows/gate-btc-b3-h70-h79-economics.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_NOT_APPROVED: 'true'
  GATE_BTC_ORDERS: '0'
  GATE_BTC_REAL_CAPITAL: '0'
  GATE_BTC_ENGINE_FEED: 'false'

jobs:
  economics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy requests xlrd
      - name: Revalidate all H70-H79 official sources before economics
        run: |
          python tools/gate_btc_b3_h70_h79_data_probe.py --out /tmp/B3_H70_H79_DATA_QA.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/B3_H70_H79_DATA_QA.json'))
          assert p['economics_run'] is False
          assert all(x['status']=='DATA_READY' for x in p['families'].values())
          assert p['h1_economics_read'] is False and p['survivor_partial_economics_read'] is False
          PY
      - name: Run frozen discovery and independent replication
        run: |
          python tools/gate_btc_b3_h70_h79_economics.py \
            --out /tmp/B3_H70_H79_ECONOMICS.json \
            --ledger /tmp/B3_H70_H79_LEDGER.jsonl \
            --cells /tmp/B3_H70_H79_CELLS.csv
      - name: Assert admissible scientific result and safety
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/B3_H70_H79_ECONOMICS.json'))
          assert p['cutoff_exclusive']=='2026-08-10'
          assert set(p['states'])=={f'H{i}' for i in range(70,80)}
          assert all(v in {'SURVIVOR_REPLICATED','REJECTED_FAILED_REPLICATION','REJECTED_DISCOVERY'} for v in p['states'].values())
          assert len(p['survivors'])<=2
          assert p['h1_economics_read'] is False and p['survivor_partial_economics_read'] is False
          assert p['synthetic_backfill'] is False
          assert p['orders_generated']==0 and p['real_capital_used']==0 and p['engine_feed'] is False
          rows=[json.loads(x) for x in open('/tmp/B3_H70_H79_LEDGER.jsonl') if x.strip()]
          assert len(rows)==10
          print({'status':p['status'],'states':p['states'],'survivors':p['survivors']})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b3-h70-h79-economics-${{ github.run_id }}
          path: |
            /tmp/B3_H70_H79_DATA_QA.json
            /tmp/B3_H70_H79_ECONOMICS.json
            /tmp/B3_H70_H79_LEDGER.jsonl
            /tmp/B3_H70_H79_CELLS.csv
          retention-days: 30
          if-no-files-found: error
