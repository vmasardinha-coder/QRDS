name: GATE BTC Freqtrade family robustness

on:
  push:
    branches:
      - "research/freqtrade-family-tests"
    paths:
      - "artifacts/gate_btc_2/freqtrade_research/run_candidate_robustness_tests.py"
      - ".github/workflows/gate-btc-freqtrade-family-robustness.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  RESEARCH_ONLY: "true"
  SHADOW_ONLY: "true"

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy ccxt
      - name: Run second-stage robustness battery
        run: python artifacts/gate_btc_2/freqtrade_research/run_candidate_robustness_tests.py
      - name: Verify isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/gate_btc_2/freqtrade_research/runtime_robustness/robustness_results.json')
          d = json.loads(p.read_text())
          assert d['policy'] == {'RESEARCH_ONLY': True, 'SHADOW_ONLY': True, 'factory_modified': False}
          print('PASS: robustness research remained isolated')
          PY
      - name: Upload robustness artifact
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-freqtrade-family-robustness
          path: artifacts/gate_btc_2/freqtrade_research/runtime_robustness/
          if-no-files-found: error
