name: GATE BTC H31 Recent Official Warmup
on:
  push:
    branches: [main]
    paths:
      - tools/gate_btc_h31_recent_source.py
      - tools/gate_btc_factory/H31_SOURCE_CONTINUATION_20261015.v1.json
      - tools/gate_btc_factory/H31_SOURCE_CALENDAR_EXTENSION_20261021.v1.json
      - tools/gate_btc_factory/H31_SOURCE_INPUT_QUALIFICATION_20261015.v1.json
      - .github/workflows/gate-btc-h31-recent-warmup.yml
  pull_request:
    paths:
      - tools/gate_btc_h31_recent_source.py
      - tools/gate_btc_factory/H31_SOURCE_CONTINUATION_20261015.v1.json
      - tools/gate_btc_factory/H31_SOURCE_CALENDAR_EXTENSION_20261021.v1.json
      - tools/gate_btc_factory/H31_SOURCE_INPUT_QUALIFICATION_20261015.v1.json
      - tests/test_gate_btc_h31_recent_source.py
      - .github/workflows/gate-btc-h31-recent-warmup.yml
  schedule:
    - cron: '15 0,2 * * 2-6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gate-btc-h31-recent-warmup
  cancel-in-progress: false
jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas numpy
      - name: Validate sealed continuation
        run: python -m unittest discover -s tests -p 'test_gate_btc_h31_recent_source.py' -v
      - uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 0
      - name: Prepare official input-only warmup
        env:
          PR_PROBE: ${{ github.event_name == 'pull_request' }}
        run: |
          PYTHONPATH=tools python - <<'PY'
          import os, json, hashlib
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from gate_btc_h31_recent_source import load_contract, qualify, frozen_seed
          canonical=Path('runtime_repo/runtime/ledgers/b3_h31_prospective/STATUS.json')
          canonical_before=canonical.read_bytes() if canonical.exists() else None
          dates=load_contract()['warmup_dates']
          now=datetime.now(ZoneInfo('America/Sao_Paulo'))
          failed=[]
          qualified=[]
          pending=[]
          for d in dates:
              if d>now.date().isoformat() or (d==now.date().isoformat() and (now.hour,now.minute)<(18,30)):
                  pending.append(d)
                  print(json.dumps({'date':d,'status':'WAIT_SESSION_CLOSE','eligible_observation_increment':0}),flush=True)
                  continue
              try:
                  r=qualify(d,'runtime_repo/runtime/ledgers/b3_h31_prospective')
                  if r is None:
                      failed.append(d);print(json.dumps({'date':d,'status':'UNQUALIFIED_INPUT_EXCLUDED_ZERO_CREDIT'}),flush=True);continue
                  qualified.append({'date':d,'WDO':r['WDO'],'receipt_sha256':r['receipt_sha256'],'source_sha256':r['source_sha256']})
                  print(json.dumps({'date':d,'status':'PASS','WDO':r['WDO'],'receipt_sha256':r['receipt_sha256'],'eligible_observation_increment':0}),flush=True)
              except Exception as e:
                  failed.append(d);print(json.dumps({'date':d,'status':'FAIL_CLOSED','error':str(e),'eligible_observation_increment':0}),flush=True)
          seed=frozen_seed('runtime_repo/runtime/ledgers/b3_h31_prospective')
          mixed=sorted(seed+[dict(x,source='RECENT_OFFICIAL_B3_INPUT_ONLY') for x in qualified],key=lambda x:x['date'])[-20:]
          status={'schema':'qrds.h31.recent_warmup_status.v1','updated_at':now.isoformat(),'qualified_input_count':len(mixed),'qualified_official_input_count':len(qualified),'selected_frozen_community_input_count':sum(r['source']=='FROZEN_COMMUNITY_WARMUP' for r in mixed),'required_input_count':20,'qualified_inputs':qualified,'unqualified_dates':failed,'pending_session_close_dates':pending,'ready_for_first_prospective_target':len(mixed)==20,'eligible_observation_increment':0,'canonical_counter_mutated':False,'h1_economics_read':False,'orders':0,'real_capital':0}
          status['selected_trailing_inputs']=mixed
          status['state']='READY_INPUTS_CANONICAL_OBSERVATION_STILL_REQUIRED' if status['ready_for_first_prospective_target'] else 'BLOCKED_INSUFFICIENT_20_STRUCTURAL_PASS_INPUTS'
          if os.environ['PR_PROBE']=='true': status['publication']='VALIDATED_INPUT_CACHE_ONLY_ZERO_CANONICAL_CREDIT'
          p=Path('runtime_repo/runtime/ledgers/b3_h31_prospective/source_continuation/SOURCE_STATUS.json');p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps(status,indent=2,sort_keys=True)+'\n')
          assert (canonical.read_bytes() if canonical.exists() else None)==canonical_before, 'CANONICAL_STATUS_MUTATION_FORBIDDEN'
          print(json.dumps(status),flush=True)
          if len(mixed)!=20: raise SystemExit('H31_WARMUP_NEEDS_20_PASS_INPUTS got='+str(len(mixed)))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h31-recent-official-warmup
          path: runtime_repo/runtime/ledgers/b3_h31_prospective/source_continuation
      - name: Publish only new warmup receipts without canonical credit
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        working-directory: runtime_repo
        run: |
          set -euo pipefail
          p=runtime/ledgers/b3_h31_prospective/source_continuation
          test -d "$p" || exit 0
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          git add "$p"
          git diff --cached --quiet && exit 0
          git commit -m 'Append input-only H31 recent official warmup; canonical credit zero'
          for attempt in 1 2 3 4 5; do
            git fetch origin gate-btc-runtime
            git rebase origin/gate-btc-runtime || { git rebase --abort; exit 1; }
            git push origin HEAD:gate-btc-runtime && exit 0
            sleep $((attempt * 2))
          done
          exit 1
