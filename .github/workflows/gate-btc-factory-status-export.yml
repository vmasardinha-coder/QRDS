name: GATE BTC Factory Status Export

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  workflow_run:
    workflows:
      - GATE BTC Momentum M3 Prospective Shadow
      - GATE BTC System13 observed panel
      - GATE BTC XAGENT Spot Decision Window
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory_status_export.py'
      - 'tools/gate_btc_reporting_authority.py'
      - 'tools/gate_btc_system12_post_review_release.py'
      - 'artifacts/gate_btc_2/post_review_release_20261020/**'
      - 'tests/test_gate_btc_factory_track_coverage.py'
      - 'tests/test_gate_btc_system12_factory_projection.py'
      - '.github/workflows/gate-btc-factory-status-export.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory_status_export.py'
      - 'tools/gate_btc_reporting_authority.py'
      - 'tools/gate_btc_system12_post_review_release.py'
      - 'artifacts/gate_btc_2/post_review_release_20261020/**'
      - 'tests/test_gate_btc_factory_track_coverage.py'
      - 'tests/test_gate_btc_system12_factory_projection.py'
      - '.github/workflows/gate-btc-factory-status-export.yml'

concurrency:
  group: gate-btc-factory-status-export-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'canonical' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RESEARCH_ONLY: 'true'
  SHADOW_ONLY: 'true'
  NOT_APPROVED: 'true'
  ENGINE_FEED: 'false'
  ORDERS: '0'
  REAL_CAPITAL: '0'
  NO_BACKFILL: 'true'
  NO_RETUNE: 'true'
  NO_COUNTER_RESET: 'true'

jobs:
  export:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {path: main_repo}
      - uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            runtime/**/STATUS.json
            runtime/**/CANONICAL_STATUS.json
            runtime/**/ACTIVE_EPOCH.json
            runtime/**/ECONOMICS_STATUS.json
            runtime/**/INTRADAY_STATUS.json
            runtime/GATE_BTC_REPORTING_CURRENT_STATE.json
            runtime/GATE_BTC_MEASUREMENT_STATUS.json
            runtime/GATE_BTC_FACTORY_STATUS_LATEST.json
            runtime/gate_btc_2/system12/**
            runtime/gate_btc_2/system13/observed_panel_v1/SOURCE_READINESS.json
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify independent track authorities and missing evidence
        run: |
          cd main_repo
          python -m unittest -v tests.test_gate_btc_factory_track_coverage tests.test_gate_btc_system12_factory_projection
      - name: Build canonical multi-track status
        run: |
          python main_repo/tools/gate_btc_factory_status_export.py \
            --runtime-root runtime_repo \
            --output runtime_repo/runtime/GATE_BTC_FACTORY_STATUS_LATEST.json
      - name: Assert immutable research boundary
        run: |
          python - <<'PY'
          import json
          p='runtime_repo/runtime/GATE_BTC_FACTORY_STATUS_LATEST.json'
          d=json.load(open(p, encoding='utf-8'))
          s=d['safety']
          assert s['RESEARCH_ONLY'] and s['SHADOW_ONLY'] and s['NOT_APPROVED']
          assert s['ENGINE_FEED'] is False and s['ORDERS']==0 and s['REAL_CAPITAL']==0
          assert s['NO_BACKFILL'] and s['NO_RETUNE'] and s['NO_COUNTER_RESET']
          assert d['methodology_changed'] is False
          PY
      - name: Persist status only
        if: github.event_name != 'pull_request'
        working-directory: runtime_repo
        run: |
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          # This checkout is disposable. The report is derived; recompute it
          # from the latest remote ledgers after each rejected non-force push.
          for i in 1 2 3 4 5; do
            git fetch origin gate-btc-runtime
            git reset --hard origin/gate-btc-runtime
            python ../main_repo/tools/gate_btc_factory_status_export.py \
              --runtime-root . --output runtime/GATE_BTC_FACTORY_STATUS_LATEST.json
            git add runtime/GATE_BTC_FACTORY_STATUS_LATEST.json
            git diff --cached --quiet && exit 0
            git commit -m "Factory refresh complete status ${{ github.run_id }}"
            if git push origin HEAD:gate-btc-runtime; then exit 0; fi
            sleep $((i*2))
          done
          exit 1


