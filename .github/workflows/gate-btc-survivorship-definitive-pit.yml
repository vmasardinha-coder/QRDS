name: GATE BTC Definitive PIT Survivorship Alpha

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-survivorship-definitive-pit.yml
      - tools/gate_btc_survivorship_definitive_pit.py
      - tools/gate_btc_survivorship_definitive_runner.py
      - tools/gate_btc_cmc_pit_parser.py
      - tools/gate_btc_cmc_pit_collector.py
      - tools/gate_btc_coinmetrics_pit_history.py
      - tests/test_gate_btc_survivorship_definitive_pit.py
      - tools/gate_btc_survivorship_alpha_audit.py
      - migration/canonical/v2a/scripts/00_run_all_v2a.py
      - migration/canonical/v2a/config_v2a.json

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  definitive-pit-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: migration/canonical/v2a/requirements.txt

      - name: Install research dependencies
        run: |
          pip install -r migration/canonical/v2a/requirements.txt
          pip install 'lxml>=5,<7'

      - name: Test definitive PIT contracts
        run: >-
          python -m unittest -v
          tests/test_gate_btc_survivorship_definitive_pit.py
          tests/test_gate_btc_survivorship_alpha_audit.py

      - name: Smoke test real lazy-row CMC reconstruction
        run: |
          python - <<'PY'
          import pandas as pd, requests
          from tools.gate_btc_cmc_pit_collector import metadata_maps, parse_page
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 GATE-BTC-Research-Only/1.0'})
          cmc,cc=metadata_maps(session)
          url='https://coinmarketcap.com/historical/20200630/'
          r=session.get(url,timeout=45)
          r.raise_for_status()
          f=parse_page(r.text,pd.Timestamp('2020-06-30'),cmc,cc)
          assert len(f) == 150
          assert f['rank'].min() == 1 and f['rank'].max() == 150
          assert int(f['identity_resolved'].sum()) >= 100
          print('REAL_CMC_PIT_RECONSTRUCTION=PASS rows='+str(len(f))+' resolved='+str(int(f['identity_resolved'].sum())))
          PY

      - name: Smoke test Coin Metrics Community daily source
        run: |
          python - <<'PY'
          import requests
          from tools.gate_btc_coinmetrics_pit_history import asset_reference, metric_catalog, fetch_asset_history, PRICE_METRIC, VOLUME_METRIC
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 GATE-BTC-Research-Only/1.0'})
          ref=asset_reference(s)
          catalog=metric_catalog(s)
          assert 'btc' in set(ref['asset'])
          assert PRICE_METRIC in catalog.get('btc', {})
          assert VOLUME_METRIC in catalog.get('btc', {})
          h=fetch_asset_history(s,'btc')
          assert len(h) >= 2000
          print('COINMETRICS_COMMUNITY=PASS assets='+str(len(ref))+' catalog_assets='+str(len(catalog))+' btc_rows='+str(len(h)))
          PY

      - name: Execute external monthly PIT top150 strict-next-bar study
        run: >-
          python tools/gate_btc_survivorship_definitive_runner.py
          --output-dir artifacts/survivorship_definitive
          --coverage-threshold 0.95

      - name: Verify safety and result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.load(open('artifacts/survivorship_definitive/MANIFEST.json', encoding='utf-8'))
          assert p['status'] in {'PASS_FULL_COVERAGE_AUDIT','PARTIAL_COVERAGE_RESEARCH_ONLY'}
          assert p['protocol'] == 'EXTERNAL_MONTHLY_PIT_TOP150_STRICT_NEXT_BAR'
          assert p['cmc_snapshots'] == 74
          assert p['pit_unique_symbols'] > 202
          assert p['research_only'] is True
          assert p['shadow_only'] is True
          assert p['not_approved'] is True
          assert p['orders_generated'] == 0
          assert p['real_capital_used'] == 0
          assert p['engine_feed'] is False
          assert p['methodology_changes'] == 0
          assert Path('artifacts/survivorship_definitive/GATE_BTC_SURVIVORSHIP_ALPHA_DEFINITIVE.zip').is_file()
          print('DEFINITIVE_PIT_CONTRACT=PASS')
          print('STATUS='+p['status'])
          print('PIT_UNIQUE_SYMBOLS='+str(p['pit_unique_symbols']))
          PY

      - name: Upload definitive research package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-survivorship-definitive-${{ github.run_id }}
          path: artifacts/survivorship_definitive/
          retention-days: 30
          if-no-files-found: warn
