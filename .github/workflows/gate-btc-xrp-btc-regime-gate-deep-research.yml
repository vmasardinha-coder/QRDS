name: GATE BTC XRP BTC regime gate deep research

on:
  push:
    branches:
      - research/freqtrade-family-tests
    paths:
      - "artifacts/gate_btc_2/freqtrade_research/xrp_btc_regime_gate_deep_test.py"
      - ".github/workflows/gate-btc-xrp-btc-regime-gate-deep-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-xrp-btc-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: pip install numpy pandas
      - name: Run deep XRP BTC regime-gate research
        run: python artifacts/gate_btc_2/freqtrade_research/xrp_btc_regime_gate_deep_test.py
      - name: Verify isolation
        run: |
          grep -q 'RESEARCH_ONLY=true' artifacts/gate_btc_2/freqtrade_research/xrp_btc_regime_gate_deep_test.py
          grep -q 'SHADOW_ONLY=true' artifacts/gate_btc_2/freqtrade_research/xrp_btc_regime_gate_deep_test.py
          test -f artifacts/gate_btc_2/freqtrade_research/runtime_xrp_btc_gate/xrp_btc_regime_gate_deep_test.json
      - name: Upload deep research artifact
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-xrp-btc-regime-gate-deep-research
          path: artifacts/gate_btc_2/freqtrade_research/runtime_xrp_btc_gate/
          if-no-files-found: error
