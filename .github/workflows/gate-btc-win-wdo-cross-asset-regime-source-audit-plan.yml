name: GATE BTC WIN WDO Cross Asset Regime Source Audit Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/WIN_WDO_CROSS_ASSET_REGIME_SOURCE_AUDIT_PLAN_20260915.json'
      - 'tools/gate_btc_factory/test_win_wdo_cross_asset_regime_source_audit_plan.py'
      - '.github/workflows/gate-btc-win-wdo-cross-asset-regime-source-audit-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit-plan-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source audit plan
        run: python -m pytest -q tools/gate_btc_factory/test_win_wdo_cross_asset_regime_source_audit_plan.py
