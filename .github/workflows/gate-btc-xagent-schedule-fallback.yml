name: GATE BTC XAGENT Schedule Fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-xagent-schedule-fallback.yml
      - artifacts/gate_btc_2/XAGENT_SCHEDULE_FALLBACK_PREREG_20260923.json
      - artifacts/gate_btc_2/XAGENT_SCHEDULE_FALLBACK_SCOPE_20260923.json
  schedule:
    - cron: '7,22,52 * * * *'
  workflow_run:
    workflows:
      - GATE BTC Factory Autonomy Supervisor
      - GATE BTC Factory Status Export
      - GATE BTC B3 Factory Continuation
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-xagent-schedule-fallback.yml
      - tools/gate_btc_factory/crypto_forward_schedule_guard.py
      - tests/test_gate_btc_crypto_forward_schedule_guard.py

permissions:
  actions: write
  contents: read

concurrency:
  group: gate-btc-xagent-schedule-fallback
  cancel-in-progress: false

env:
  RESEARCH_ONLY: 'true'
  SHADOW_ONLY: 'true'
  ENGINE_FEED: 'false'
  ORDERS: '0'
  REAL_CAPITAL: '0'
  NO_RETUNE: 'true'
  NO_BACKFILL: 'true'

jobs:
  guard-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest -v tests.test_gate_btc_crypto_forward_schedule_guard
      - run: python -m py_compile tools/gate_btc_factory/crypto_forward_schedule_guard.py
      - name: Assert safety boundary
        run: |
          test "$RESEARCH_ONLY" = true
          test "$SHADOW_ONLY" = true
          test "$ENGINE_FEED" = false
          test "$ORDERS" = 0
          test "$REAL_CAPITAL" = 0
          test "$NO_RETUNE" = true
          test "$NO_BACKFILL" = true

  recover-stale-xagent:
    if: github.event_name != 'pull_request'
    needs: guard-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Dispatch one current-time XAGENT collection only when stale
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_WORKFLOW: gate-btc-xagent-disagree-transform.yml
          FRESHNESS_SECONDS: '5400'
        run: python tools/gate_btc_factory/crypto_forward_schedule_guard.py
