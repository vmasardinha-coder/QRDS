name: GATE BTC WIN WDO Cross Asset Regime Analysis Freeze

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/WIN_WDO_CROSS_ASSET_REGIME_ANALYSIS_FREEZE_20260915.json'
      - 'tools/gate_btc_factory/test_win_wdo_cross_asset_regime_analysis_freeze.py'
      - '.github/workflows/gate-btc-win-wdo-cross-asset-regime-analysis-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis-freeze-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen cross-asset design
        run: python -m pytest -q tools/gate_btc_factory/test_win_wdo_cross_asset_regime_analysis_freeze.py
