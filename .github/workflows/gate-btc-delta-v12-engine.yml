name: GATE BTC Delta V12 Engine

# Runs the preregistered V12 engine over the TOP100 universe once the venue pins
# for the day exist. Chained on the pinning workflow rather than scheduled, so it
# can never run against a panel the pin ledger has not seen.
#
# The anchor is established by the FIRST successful run and never chosen again.
# The ledger is append-only and hash-chained: a run that would restate a
# committed close fails instead of writing.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["GATE BTC Delta V12 Price Pinning"]
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gate-btc-delta-v12-engine.yml'
      - 'tools/gate_btc_delta_v12_engine.py'
      - 'tools/gate_btc_delta_v12_funding.py'
      - 'tests/test_gate_btc_delta_v12_engine.py'
      - 'tests/test_gate_btc_delta_v12_funding.py'
      - 'migration/reporting/delta_v12_engine_contract.json'

permissions:
  actions: read
  contents: read

concurrency:
  group: gate-btc-delta-v12-engine
  cancel-in-progress: false

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  PIN_LEDGER: runtime/ledgers/delta_v12_prices
  ENGINE_LEDGER: runtime/ledgers/delta_v12_engine

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the engine and the funding adapter
        run: >-
          python -m unittest -v
          tests.test_gate_btc_delta_v12_engine
          tests.test_gate_btc_delta_v12_funding
      - name: Compile
        run: >-
          python -m py_compile
          tools/gate_btc_delta_v12_engine.py
          tools/gate_btc_delta_v12_funding.py

  run-engine:
    needs: engine-tests
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out canonical merged code
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the exact universe snapshot run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_RUN_ID=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/gate-btc-delta-v12-universe-snapshot.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')
          test -n "$SOURCE_RUN_ID"
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"

      - name: Download the universe artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("gate-btc-delta-v12-universe-")) | .id' | head -1)
          test -n "$artifact_id"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > universe.zip
          mkdir -p universe && unzip -q universe.zip -d universe
          test -f universe/UNIVERSE_TOP100.csv

      - name: Check out immutable runtime branch
        uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 0

      - name: Require an established pin ledger
        run: |
          set -euo pipefail
          # Pins define which venue each asset is priced and funded from. Running
          # the engine before they exist would anchor the ledger on an unpinned
          # panel, and the anchor is permanent.
          test -f "runtime_repo/${PIN_LEDGER}/PINS.json" || {
            echo "FAIL_CLOSED: no pin ledger; run the pinning workflow first"; exit 1; }
          python -c "import json,sys;p=json.load(open(sys.argv[1]))['pins'];print(f'pinned={len(p)}');sys.exit(0 if p else 1)" "runtime_repo/${PIN_LEDGER}/PINS.json"

      - name: Price the TOP100 from the pins
        run: >-
          python tools/gate_btc_delta_v12_multi_venue_daily_prices.py
          --universe-csv universe/UNIVERSE_TOP100.csv
          --out-dir prices_out
          --pins "runtime_repo/${PIN_LEDGER}/PINS.json"

      - name: Resolve the funding window from the anchor
        run: |
          set -euo pipefail
          # Funding is only ever needed from the anchor forward. Before the first
          # run there is no anchor, so a short window is enough to prove the feed
          # works; afterwards the window starts at the anchor itself.
          ANCHOR_FILE="runtime_repo/${ENGINE_LEDGER}/ANCHOR.json"
          if [ -f "$ANCHOR_FILE" ]; then
            SINCE=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['anchor_date'])" "$ANCHOR_FILE")
          else
            SINCE=$(date -u -d '7 days ago' +%F)
          fi
          echo "FUNDING_SINCE=$SINCE" >> "$GITHUB_ENV"
          echo "funding window starts $SINCE"

      - name: Read observed funding from each pinned venue
        run: >-
          python tools/gate_btc_delta_v12_funding.py
          --pins "runtime_repo/${PIN_LEDGER}/PINS.json"
          --out-dir funding_out
          --since "${FUNDING_SINCE}"

      - name: Run the engine
        run: >-
          python tools/gate_btc_delta_v12_engine.py
          --prices-csv prices_out/DAILY_PRICES.csv
          --universe-csv universe/UNIVERSE_TOP100.csv
          --contract migration/reporting/delta_v12_engine_contract.json
          --funding-csv funding_out/FUNDING_DAILY.csv
          --out-dir "runtime_repo/${ENGINE_LEDGER}"
          --run-id "${{ github.run_id }}"

      - name: Upload the full panel as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-delta-v12-engine-${{ github.run_id }}
          path: |
            prices_out/
            funding_out/
          retention-days: 90

      - name: Verify the safety boundary and the prospective invariants
        run: |
          python - <<'PY'
          import json, os
          root = os.path.join('runtime_repo', os.environ['ENGINE_LEDGER'])
          status = json.load(open(os.path.join(root, 'STATUS.json'), encoding='utf-8'))
          anchor = json.load(open(os.path.join(root, 'ANCHOR.json'), encoding='utf-8'))
          for key, expected in {
              'research_only': True, 'shadow_only': True, 'not_approved': True,
              'engine_feed': False, 'exchange_auth_allowed': False,
              'promotion_allowed': False, 'methodology_changes': 0,
              'orders_generated': 0, 'real_capital_used': 0,
          }.items():
              assert status[key] == expected, (key, status[key])
          assert status['funding_model'] == 'OBSERVED_PER_PINNED_VENUE_SUMMED_TO_THE_UTC_DAY_OF_SETTLEMENT', status['funding_model']
          assert anchor['backdating_prohibited'] is True
          assert status['anchor_date'] == anchor['anchor_date']
          assert status['leaderboard_descriptive_only'] is True
          # No book may be reported eligible before the frozen minimum sample.
          for name, book in status['books'].items():
              if book['observations'] < status['evidence_gate_min_observations']:
                  assert not book['evidence_eligible'], name
          print(json.dumps({
              'anchor_date': status['anchor_date'],
              'anchor_established_this_run': status['anchor_established_this_run'],
              'data_as_of': status['data_as_of'],
              'observed_days': status['observed_days'],
              'funding_covered_symbols': status['funding_covered_symbols'],
              'latest_chain_sha256': status['latest_chain_sha256'][:16],
          }, indent=2, sort_keys=True))
          PY

      - name: Commit the engine ledger only
        working-directory: runtime_repo
        run: |
          set -euo pipefail
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          git add "${ENGINE_LEDGER}"
          git diff --cached --quiet && exit 0
          git commit -m "Update Delta V12 engine ledger from run ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git fetch origin gate-btc-runtime
            if ! git rebase origin/gate-btc-runtime; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:gate-btc-runtime; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
