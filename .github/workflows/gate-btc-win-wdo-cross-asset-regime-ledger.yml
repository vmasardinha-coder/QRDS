name: GATE BTC WIN WDO Cross Asset Regime Ledger

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/WIN_WDO_CROSS_ASSET_REGIME_REJECTION_LEDGER_20260915.jsonl'
      - 'tools/gate_btc_factory/test_win_wdo_cross_asset_regime_rejection_ledger.py'
      - '.github/workflows/gate-btc-win-wdo-cross-asset-regime-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate ledger initialization
        run: python -m pytest -q tools/gate_btc_factory/test_win_wdo_cross_asset_regime_rejection_ledger.py
