name: GATE BTC Factory Autonomy Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/state_master_refresh.py'
      - 'tools/gate_btc_factory/universal_watchdog.py'
      - 'tools/gate_btc_factory/survivor_health.py'
      - 'tools/gate_btc_factory/self_audit.py'
      - '.github/workflows/gate-btc-factory-autonomy-supervisor.yml'
      - '.github/workflows/gate-btc-b3-nextgen-progression.yml'
      - '.github/workflows/gate-btc-factory-autonomy-validation.yml'
      - 'tests/test_gate_btc_factory_autonomy.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_NOT_APPROVED: 'true'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - name: Compile autonomy modules
        run: python -m py_compile tools/gate_btc_factory/state_master_refresh.py tools/gate_btc_factory/universal_watchdog.py tools/gate_btc_factory/survivor_health.py tools/gate_btc_factory/self_audit.py
      - name: Run autonomy regression tests
        run: pytest -q tests/test_gate_btc_factory_autonomy.py
      - name: Assert safety markers in supervisor
        run: |
          grep -q "NO_RETUNE" .github/workflows/gate-btc-b3-nextgen-progression.yml
          grep -q "scientific_change_allowed" .github/workflows/gate-btc-factory-autonomy-supervisor.yml
          grep -q "backfill_allowed" tools/gate_btc_factory/universal_watchdog.py
          echo 'FACTORY_AUTONOMY_VALIDATION=PASS'
