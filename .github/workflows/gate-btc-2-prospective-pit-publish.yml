name: GATE BTC 2 Prospective PIT Publish

on:
  workflow_run:
    workflows: ["GATE BTC Daily Research Collection"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful GATE BTC Daily Research Collection run id"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: gate-btc-2-prospective-pit-publish
  cancel-in-progress: false

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  GATE_BTC_SHADOW_ONLY: "true"
  GATE_BTC_NOT_APPROVED: "true"
  GATE_BTC_ENGINE_FEED: "false"
  GATE_BTC_ORDERS: "0"
  GATE_BTC_REAL_CAPITAL: "0"

jobs:
  publish-prospective-pit:
    # The PIT collector is an isolated job in the Daily workflow and uploads
    # its own artifact. The generic daily-research artifact intentionally does
    # not contain prospective_v2a, so consuming it here creates a false red.
    # Only run after a successful upstream workflow; workflow_dispatch is used
    # solely by the fallback wake after that same successful source run.
    # Absence/ineligibility is handled fail-closed below and earns zero credit.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
    steps:
      - name: Require explicit successful-source run id
        run: |
          test -n "$SOURCE_RUN_ID"
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID"

      - name: Download isolated prospective PIT artifact
        uses: actions/download-artifact@v4
        with:
          name: gate-btc-prospective-v2a-pit-${{ env.SOURCE_RUN_ID }}
          path: daily_evidence
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Validate isolated prospective PIT gate
        id: pit_gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('daily_evidence/prospective_v2a')
          status_path = root / 'STATUS.json'
          registry_path = root / 'QUALIFIED_SOURCE_REGISTRY.json'
          if not status_path.exists() or not registry_path.exists():
              raise SystemExit('prospective PIT evidence absent; fail closed')

          status = json.loads(status_path.read_text(encoding='utf-8'))
          required_status_safety = {
              'schema': 'gate_btc.v2a_point_in_time_data_ledger_status.v1',
              'latest_attempted_symbols': 137,
              'prospective_point_in_time_universe_observed': True,
              'prospective_point_in_time_universe_bias_present': False,
              'future_point_in_time_only': True,
              'retrospective_backfill_allowed': False,
              'research_only': True,
              'shadow_only': True,
              'not_approved': True,
              'feeds_frozen_engine': False,
              'orders_generated': 0,
              'real_capital_used': 0,
              'promotion_allowed': False,
          }
          for key, value in required_status_safety.items():
              if status.get(key) != value:
                  raise SystemExit(
                      f'prospective PIT safety gate failed: {key}={status.get(key)!r}, expected {value!r}'
                  )

          snapshot_id = status.get('latest_snapshot_id')
          if not snapshot_id:
              raise SystemExit('prospective PIT latest_snapshot_id absent; fail closed')
          snapshot_path = root / 'snapshots' / f'{snapshot_id}.json'
          if not snapshot_path.exists():
              raise SystemExit(f'prospective PIT snapshot absent: {snapshot_path}')
          snapshot = json.loads(snapshot_path.read_text(encoding='utf-8'))
          required_snapshot_safety = {
              'schema': 'gate_btc.v2a_point_in_time_data_snapshot.v1',
              'snapshot_id': snapshot_id,
              'attempted_symbols': 137,
              'prospective_point_in_time_universe_observed': True,
              'prospective_point_in_time_universe_bias_present': False,
              'retrospective_reconstruction': False,
              'backfill_performed': False,
              'counter_reset_performed': False,
              'historical_credit': 0,
              'prospective_credit_before_d0': 0,
              'research_only': True,
              'shadow_only': True,
              'not_approved': True,
              'feeds_frozen_engine': False,
              'orders_generated': 0,
              'real_capital_used': 0,
              'promotion_allowed': False,
          }
          for key, value in required_snapshot_safety.items():
              if snapshot.get(key) != value:
                  raise SystemExit(
                      f'prospective PIT snapshot safety gate failed: {key}={snapshot.get(key)!r}, expected {value!r}'
                  )

          complete = (
              status.get('latest_loaded_symbols') == 137
              and status.get('latest_failed_symbols') == 0
              and status.get('latest_coverage_ratio') == 1.0
              and status.get('latest_no_candle_failure_count') == 0
              and status.get('latest_short_history_failure_count') == 0
              and snapshot.get('loaded_symbols') == 137
              and snapshot.get('failed_symbols') == 0
              and snapshot.get('coverage_ratio') == 1.0
              and snapshot.get('download_failure_row_count') == 0
              and snapshot.get('no_candle_failure_count') == 0
              and snapshot.get('short_history_failure_count') == 0
              and snapshot.get('universe_row_count') == 137
          )
          selected_sources = snapshot.get('selected_sources')
          if complete and (not isinstance(selected_sources, dict) or len(selected_sources) != 137):
              raise SystemExit('prospective PIT selected_sources must contain exactly 137 symbols')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"eligible={'true' if complete else 'false'}\n")
          if not complete:
              print(
                  'PROSPECTIVE_V2A_PIT=EXPECTED_INCOMPLETE_SOURCE_COVERAGE '
                  f"loaded={status.get('latest_loaded_symbols')} failed={status.get('latest_failed_symbols')}"
              )
              print('SCIENTIFIC_CREDIT=0')
              print('NO_BACKFILL=true')
              print('NO_RETUNE=true')
          else:
              print(f'PROSPECTIVE_V2A_PIT=PASS_137_OF_137_ZERO_FAILURES snapshot={snapshot_id}')
          PY

      - name: Check out runtime branch only
        if: steps.pit_gate.outputs.eligible == 'true'
        uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 0

      - name: Publish isolated prospective PIT to runtime branch
        if: steps.pit_gate.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          test -f daily_evidence/prospective_v2a/STATUS.json
          test -f daily_evidence/prospective_v2a/QUALIFIED_SOURCE_REGISTRY.json
          git -C runtime_repo config user.name "gate-btc-actions"
          git -C runtime_repo config user.email "gate-btc-actions@users.noreply.github.com"
          mkdir -p runtime_repo/runtime/data_quality/v2a_registry_pit/snapshots runtime_repo/runtime/data_quality/v2a_registry_pit/archives
          cp daily_evidence/prospective_v2a/STATUS.json runtime_repo/runtime/data_quality/v2a_registry_pit/STATUS.json
          cp daily_evidence/prospective_v2a/QUALIFIED_SOURCE_REGISTRY.json runtime_repo/runtime/data_quality/v2a_registry_pit/QUALIFIED_SOURCE_REGISTRY.json
          cp daily_evidence/prospective_v2a/snapshots/*.json runtime_repo/runtime/data_quality/v2a_registry_pit/snapshots/
          cp daily_evidence/prospective_v2a/archives/* runtime_repo/runtime/data_quality/v2a_registry_pit/archives/
          git -C runtime_repo add runtime/data_quality/v2a_registry_pit
          if git -C runtime_repo diff --cached --quiet; then
            echo "Prospective PIT already current"
          else
            git -C runtime_repo commit -m "Update prospective V2A registry PIT evidence"
            for attempt in 1 2 3 4 5; do
              git -C runtime_repo fetch origin gate-btc-runtime
              if ! git -C runtime_repo rebase origin/gate-btc-runtime; then
                git -C runtime_repo rebase --abort || true
                exit 1
              fi
              if git -C runtime_repo push origin HEAD:gate-btc-runtime; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
