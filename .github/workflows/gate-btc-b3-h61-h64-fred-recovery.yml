name: GATE BTC B3 H61 H64 FRED Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_b3_h61_h64_fred_recovery.py'
      - '.github/workflows/gate-btc-b3-h61-h64-fred-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_NOT_APPROVED: 'true'
  GATE_BTC_ORDERS: '0'
  GATE_BTC_REAL_CAPITAL: '0'
  GATE_BTC_ENGINE_FEED: 'false'

jobs:
  recover-h61-h64:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: Retry official FRED delivery and run only preregistered H61/H64
        run: |
          python tools/gate_btc_b3_h61_h64_fred_recovery.py \
            --out /tmp/B3_H61_H64_FRED_RECOVERY.json \
            --ledger /tmp/B3_H61_H64_FRED_LEDGER.jsonl \
            --cells /tmp/B3_H61_H64_FRED_CELLS.csv
      - name: Assert scientific and safety boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/B3_H61_H64_FRED_RECOVERY.json'))
          assert p['cutoff_exclusive']=='2026-08-10'
          assert set(p['results'])=={'H61','H64'}
          for fam in ('H61','H64'):
              x=p['results'][fam]
              assert x['source']['status']=='PASS'
              assert x['source']['discovery_join_coverage']>=0.90
              assert x['source']['replication_join_coverage']>=0.90
              assert x['state'] in {'SURVIVOR_REPLICATED','REJECTED_FAILED_REPLICATION','REJECTED_DISCOVERY'}
          assert p['h1_economics_read'] is False
          assert p['survivor_partial_economics_read'] is False
          assert p['orders_generated']==0 and p['real_capital_used']==0 and p['engine_feed'] is False
          print('B3_H61_H64_FRED_RECOVERY=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b3-h61-h64-fred-recovery-${{ github.run_id }}
          path: |
            /tmp/B3_H61_H64_FRED_RECOVERY.json
            /tmp/B3_H61_H64_FRED_LEDGER.jsonl
            /tmp/B3_H61_H64_FRED_CELLS.csv
          retention-days: 30
          if-no-files-found: error
