name: GATE BTC B3 NextGen Progression Controller

# Legacy diagnostic entrypoint only. Automatic progression authority lives in
# GATE BTC Factory Autonomy Supervisor via reconcile_nextgen_progression.py.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_NOT_APPROVED: 'true'

jobs:
  legacy-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report authority migration
        run: |
          echo 'NEXTGEN_PROGRESSION_AUTHORITY=FACTORY_AUTONOMY_SUPERVISOR'
          echo 'WORKFLOW_RUN_CHAINING=false'
          echo 'NO_RETUNE=true'
          echo 'NO_BACKFILL=true'
          echo 'ORDERS=0'
          echo 'REAL_CAPITAL=0'
          echo 'ENGINE_FEED=false'
