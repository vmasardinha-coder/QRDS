name: Gate BTC V16B next-gate watchdog

on:
  workflow_dispatch:
    inputs:
      mode:
        description: preflight | signal_watchdog | entry_watchdog
        required: true
        default: preflight
      signal_date:
        description: Optional canonical SIGNAL date override; must lie on frozen weekly clock
        required: false
        default: ''
  schedule:
    # Frozen V16B clock: Tuesday/Wednesday preflight, Thursday SIGNAL, Friday ENTRY.
    - cron: '15 2 * * 2,3'
    - cron: '40 23 * * 4'
    - cron: '40 23 * * 5'

permissions:
  contents: read
  actions: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    env:
      RESEARCH_ONLY: 'true'
      SHADOW_ONLY: 'true'
      NOT_APPROVED: 'true'
      ENGINE_FEED: 'false'
      ORDERS: '0'
      REAL_CAPITAL: '0'
      NO_BACKFILL: 'true'
      NO_LATE_SEAL: 'true'
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          path: source_repo
          fetch-depth: 1
      - name: Check out runtime evidence branch
        uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 1

      - name: Resolve frozen canonical window and mode
        id: clock
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_SIGNAL_DATE: ${{ inputs.signal_date }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%F)
          DOW=$(date -u +%u)
          MODE="$REQUESTED_MODE"
          if [ -z "$MODE" ]; then
            case "$DOW" in
              2|3) MODE=preflight ;;
              4) MODE=signal_watchdog ;;
              5) MODE=entry_watchdog ;;
              *) MODE=noop ;;
            esac
          fi
          export TODAY MODE REQUESTED_SIGNAL_DATE
          python - <<'PY' > /tmp/v16b_clock.env
          import os, sys
          from datetime import date
          sys.path.insert(0, 'source_repo')
          from tools.gate_btc_v16b_calendar import next_unmissed_window, window_for_entry_date, window_from_signal

          today=date.fromisoformat(os.environ['TODAY'])
          mode=os.environ['MODE']
          requested=os.environ.get('REQUESTED_SIGNAL_DATE','').strip()
          if requested:
              w=window_from_signal(date.fromisoformat(requested))
          elif mode == 'entry_watchdog':
              w=window_for_entry_date(today)
          else:
              w=next_unmissed_window(today)
          print(f"mode={mode}")
          print(f"signal_date={w.signal_date.isoformat()}")
          print(f"entry_date={w.entry_date.isoformat()}")
          print(f"exit_date={w.complete_exit_date.isoformat()}")
          PY
          cat /tmp/v16b_clock.env >> "$GITHUB_OUTPUT"
          cat /tmp/v16b_clock.env

      - name: Verify frozen safety invariants
        shell: bash
        run: |
          test "$RESEARCH_ONLY" = true
          test "$SHADOW_ONLY" = true
          test "$NOT_APPROVED" = true
          test "$ENGINE_FEED" = false
          test "$ORDERS" = 0
          test "$REAL_CAPITAL" = 0
          test "$NO_BACKFILL" = true
          test "$NO_LATE_SEAL" = true

      - name: V16B D-2 / D-1 preflight discovery
        if: steps.clock.outputs.mode == 'preflight'
        shell: bash
        run: |
          set -euo pipefail
          python source_repo/tools/gate_btc_v16b_preflight_status.py \
            --source-root source_repo \
            --root source_repo \
            --root runtime_repo \
            --signal-date '${{ steps.clock.outputs.signal_date }}' \
            > GATE_BTC_V16B_PREFLIGHT_STATUS.json
          cat GATE_BTC_V16B_PREFLIGHT_STATUS.json
          python - <<'PY'
          import json
          s=json.load(open('GATE_BTC_V16B_PREFLIGHT_STATUS.json',encoding='utf-8'))
          assert s['RESEARCH_ONLY'] is True
          assert s['SHADOW_ONLY'] is True
          assert s['NOT_APPROVED'] is True
          assert s['ENGINE_FEED'] is False
          assert s['ORDERS'] == 0
          assert s['REAL_CAPITAL'] == 0
          assert s['NO_BACKFILL'] is True
          assert s['NO_LATE_SEAL'] is True
          if s['status'] != 'PASS_PREFLIGHT_DISCOVERY':
              raise SystemExit('V16B_PREFLIGHT=RED ' + s['status'])
          print('V16B_PREFLIGHT=PASS_DISCOVERY')
          print('V16B_REHEARSAL=REQUIRED_BEFORE_CANONICAL_SIGNAL')
          print('CANONICAL_CYCLE_COUNT=0')
          print('NEXT_CANONICAL_EVENT=SIGNAL_' + s['signal_date'])
          PY

      - name: Upload preflight status
        if: always() && steps.clock.outputs.mode == 'preflight'
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-v16b-preflight-${{ github.run_id }}
          path: GATE_BTC_V16B_PREFLIGHT_STATUS.json
          if-no-files-found: warn
          retention-days: 30

      - name: Canonical signal seal watchdog
        if: steps.clock.outputs.mode == 'signal_watchdog'
        shell: bash
        env:
          SIGNAL_DATE: ${{ steps.clock.outputs.signal_date }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, os, sys
          root=Path('runtime_repo'); expected=os.environ['SIGNAL_DATE']
          candidates=list(root.rglob('*V16B*SIGNAL*seal*.json')) + list(root.rglob('*v16b*signal*seal*.json'))
          ok=False
          for p in candidates:
              try: obj=json.loads(p.read_text(encoding='utf-8'))
              except Exception: continue
              if obj.get('REHEARSAL') is True or obj.get('CANONICAL_LEDGER') is False: continue
              if str(obj.get('signal_date_utc', obj.get('signal_date',''))) != expected: continue
              print(f'SIGNAL_SEAL_CANDIDATE={p} SHA256={hashlib.sha256(p.read_bytes()).hexdigest()}')
              ok=True
          if not ok:
              print('SIGNAL_SEAL=RED_MISSING_EXACT_CANONICAL_SEAL:' + expected)
              sys.exit(1)
          print('SIGNAL_SEAL=PASS_EXACT_DATE_FOR_FURTHER_CAUSAL_QA')
          PY

      - name: Canonical entry seal watchdog
        if: steps.clock.outputs.mode == 'entry_watchdog'
        shell: bash
        env:
          SIGNAL_DATE: ${{ steps.clock.outputs.signal_date }}
          ENTRY_DATE: ${{ steps.clock.outputs.entry_date }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, os, sys
          root=Path('runtime_repo'); sig_date=os.environ['SIGNAL_DATE']; ent_date=os.environ['ENTRY_DATE']
          sig=list(root.rglob('*V16B*SIGNAL*seal*.json')) + list(root.rglob('*v16b*signal*seal*.json'))
          ent=list(root.rglob('*V16B*ENTRY*seal*.json')) + list(root.rglob('*v16b*entry*seal*.json'))
          def canonical(ps, event_date, keys):
              out=[]
              for p in ps:
                  try: obj=json.loads(p.read_text(encoding='utf-8'))
                  except Exception: continue
                  if obj.get('REHEARSAL') is True or obj.get('CANONICAL_LEDGER') is False: continue
                  actual=next((str(obj.get(k)) for k in keys if obj.get(k) is not None), '')
                  if actual == event_date: out.append(p)
              return out
          sig=canonical(sig, sig_date, ('signal_date_utc','signal_date'))
          ent=canonical(ent, ent_date, ('entry_date_utc','entry_date'))
          if not sig:
              print('ENTRY_SEAL=RED_PRIOR_EXACT_SIGNAL_SEAL_MISSING:' + sig_date); sys.exit(1)
          if not ent:
              print('ENTRY_SEAL=RED_MISSING_EXACT_CANONICAL_ENTRY_SEAL:' + ent_date); sys.exit(1)
          for p in ent:
              print(f'ENTRY_SEAL_CANDIDATE={p} SHA256={hashlib.sha256(p.read_bytes()).hexdigest()}')
          print('ENTRY_SEAL=PASS_EXACT_DATE_FOR_FURTHER_CAUSAL_QA')
          PY

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo 'RESEARCH_ONLY=true' >> "$GITHUB_STEP_SUMMARY"
          echo 'SHADOW_ONLY=true' >> "$GITHUB_STEP_SUMMARY"
          echo 'NOT_APPROVED=true' >> "$GITHUB_STEP_SUMMARY"
          echo 'ORDERS=0' >> "$GITHUB_STEP_SUMMARY"
          echo 'REAL_CAPITAL=0' >> "$GITHUB_STEP_SUMMARY"
          echo 'NO_BACKFILL=true' >> "$GITHUB_STEP_SUMMARY"
          echo 'NO_LATE_SEAL=true' >> "$GITHUB_STEP_SUMMARY"
          echo "MODE=${{ steps.clock.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "SIGNAL_DATE=${{ steps.clock.outputs.signal_date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ENTRY_DATE=${{ steps.clock.outputs.entry_date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "COMPLETE_EXIT_DATE=${{ steps.clock.outputs.exit_date }}" >> "$GITHUB_STEP_SUMMARY"
