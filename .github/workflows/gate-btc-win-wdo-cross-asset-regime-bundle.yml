name: GATE BTC WIN WDO Cross Asset Regime Bundle

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/WIN_WDO_CROSS_ASSET_REGIME_*'
      - 'tools/gate_btc_factory/test_win_wdo_cross_asset_regime_*'
      - '.github/workflows/gate-btc-win-wdo-cross-asset-regime-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bundle invariants
        run: python -m pytest -q tools/gate_btc_factory/test_win_wdo_cross_asset_regime_*.py
