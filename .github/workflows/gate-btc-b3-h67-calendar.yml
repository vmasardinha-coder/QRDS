name: GATE BTC B3 H67 Official Calendar

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_b3_h67_calendar_prereg.md'
      - 'tools/gate_btc_b3_h67_calendar.py'
      - '.github/workflows/gate-btc-b3-h67-calendar.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_NOT_APPROVED: 'true'
  GATE_BTC_ORDERS: '0'
  GATE_BTC_REAL_CAPITAL: '0'
  GATE_BTC_ENGINE_FEED: 'false'

jobs:
  h67-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: Probe official calendars and run only DATA_READY preregistered H67 flags
        run: |
          python tools/gate_btc_b3_h67_calendar.py --out /tmp/B3_H67_CALENDAR.json --cells /tmp/B3_H67_CELLS.csv
      - name: Assert fail-closed scientific boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/B3_H67_CALENDAR.json'))
          assert p['cutoff_exclusive']=='2026-08-10'
          assert p['family']=='H67'
          assert p['state'] in {'SURVIVOR_REPLICATED','REJECTED_FAILED_REPLICATION','REJECTED_DISCOVERY'}
          assert set(p['tested_flags'])=={'MONTH_TURN','WEEKDAY_EDGE'}
          assert set(p['untested_data_gap_flags'])=={'FOMC_DECISION_DAY','COPOM_DECISION_DAY'}
          assert p['flag_status']['MONTH_TURN']['status']=='DATA_READY'
          assert p['flag_status']['WEEKDAY_EDGE']['status']=='DATA_READY'
          assert p['flag_status']['FOMC_DECISION_DAY']['status']=='DATA_GAP'
          assert p['flag_status']['COPOM_DECISION_DAY']['status']=='DATA_GAP'
          assert p['synthetic_backfill'] is False
          assert p['h1_economics_read'] is False and p['survivor_partial_economics_read'] is False
          assert p['orders_generated']==0 and p['real_capital_used']==0 and p['engine_feed'] is False
          print('B3_H67_CALENDAR=PASS_FAIL_CLOSED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b3-h67-calendar-${{ github.run_id }}
          path: |
            /tmp/B3_H67_CALENDAR.json
            /tmp/B3_H67_CELLS.csv
          retention-days: 30
          if-no-files-found: error
