name: GATE BTC WIN WDO Cross Asset Regime Merge Policy

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/WIN_WDO_CROSS_ASSET_REGIME_MERGE_POLICY_20260915.json'
      - 'tools/gate_btc_factory/test_win_wdo_cross_asset_regime_merge_policy.py'
      - '.github/workflows/gate-btc-win-wdo-cross-asset-regime-merge-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-policy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate merge policy
        run: python -m pytest -q tools/gate_btc_factory/test_win_wdo_cross_asset_regime_merge_policy.py
