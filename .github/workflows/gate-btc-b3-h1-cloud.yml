name: GATE BTC B3 H1 Cloud Probe

on:
  push:
    branches: [agent/gate-btc-b3-h1-cloud-backfill]
    paths:
      - .github/workflows/gate-btc-b3-h1-cloud.yml
      - tools/b3_h1_source_probe.py
      - tools/b3_h1_structural_qa.py
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: "true"

jobs:
  b3-h1-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright pandas numpy
          python -m playwright install --with-deps chromium
      - name: Probe 10 11 and 12 August 2026 without economics
        id: probe
        continue-on-error: true
        run: >-
          python tools/b3_h1_source_probe.py
          --dates 2026-08-10 2026-08-11 2026-08-12
          --out-dir artifacts/b3_h1_source_probe
      - name: Run frozen structural QA only
        id: qa
        continue-on-error: true
        run: >-
          python tools/b3_h1_structural_qa.py
          --probe-dir artifacts/b3_h1_source_probe
      - name: Record probe and QA status
        if: always()
        run: |
          mkdir -p artifacts/b3_h1_source_probe
          echo "probe_outcome=${{ steps.probe.outcome }}" > artifacts/b3_h1_source_probe/ACTIONS_STATUS.txt
          echo "qa_outcome=${{ steps.qa.outcome }}" >> artifacts/b3_h1_source_probe/ACTIONS_STATUS.txt
          echo "RESEARCH_ONLY=true" >> artifacts/b3_h1_source_probe/ACTIONS_STATUS.txt
          echo "ECONOMICS_LOCKED=true" >> artifacts/b3_h1_source_probe/ACTIONS_STATUS.txt
          echo "ORDERS=0" >> artifacts/b3_h1_source_probe/ACTIONS_STATUS.txt
          echo "REAL_CAPITAL=0" >> artifacts/b3_h1_source_probe/ACTIONS_STATUS.txt
      - name: Upload B3 source and structural QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-b3-h1-source-probe-${{ github.run_id }}
          path: artifacts/b3_h1_source_probe/
          retention-days: 30
          if-no-files-found: error
