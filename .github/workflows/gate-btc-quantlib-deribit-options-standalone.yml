name: GATE BTC QuantLib Deribit Options Standalone

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gate-btc-quantlib-deribit-options-standalone.yml'
      - 'tools/gate_btc_2_quantlib_deribit_options_runner.py'
      - 'tests/test_gate_btc_2_quantlib_deribit_options_runner.py'
      - 'artifacts/gate_btc_2/quantlib_deribit_research/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_REAL_CAPITAL: '0'

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen external analytics library
        run: |
          python -m pip install --upgrade pip
          pip install 'QuantLib==1.43'
      - name: Unit tests
        run: |
          python -m py_compile tools/gate_btc_2_quantlib_deribit_options_runner.py
          python -m unittest tests.test_gate_btc_2_quantlib_deribit_options_runner -v
      - name: Assert research boundary
        run: |
          test "$GATE_BTC_RESEARCH_ONLY" = "true"
          test "$GATE_BTC_SHADOW_ONLY" = "true"
          test "$GATE_BTC_REAL_CAPITAL" = "0"
      - name: Capture and audit live BTC option chain
        run: >-
          python tools/gate_btc_2_quantlib_deribit_options_runner.py
          --output quantlib_deribit_evidence
      - name: Assert tangible zero-capital artifact
        run: |
          python - <<'PY'
          import json
          x=json.load(open('quantlib_deribit_evidence/SUMMARY.json'))
          assert x['sample_gate_pass'] is True
          assert x['sample_gate']['accepted_total'] >= 30
          assert x['sample_gate']['calls'] >= 10 and x['sample_gate']['puts'] >= 10
          assert x['sample_gate']['distinct_expiries'] >= 2
          assert x['orders'] == 0 and x['real_capital_brl'] == 0
          assert x['research_only'] and x['shadow_only'] and x['no_backfill'] and x['no_retune']
          assert x['factory_runtime_untouched'] is True
          assert x['economic_claim_authorized'] is False
          print('QUANTLIB_DERIBIT_SAMPLE=PASS')
          print(json.dumps(x, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-btc-quantlib-deribit-options-standalone
          path: quantlib_deribit_evidence/
          retention-days: 90
          if-no-files-found: error
