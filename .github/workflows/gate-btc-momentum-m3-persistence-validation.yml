name: GATE BTC Momentum M3 Persistence Validation

on:
  pull_request:
    paths:
      - 'migration/reporting/momentum_m3_persistence_contract.json'
      - 'migration/reporting/momentum_m3_persistence_clarification_20260909.json'
      - 'tools/gate_btc_momentum_m3_persistence.py'
      - 'tests/test_gate_btc_momentum_m3_persistence.py'
      - '.github/workflows/gate-btc-momentum-m3-persistence-validation.yml'
      - '.github/workflows/gate-btc-momentum-m3-prospective-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile frozen M3 implementation
        run: python -m py_compile tools/gate_btc_momentum_m3_persistence.py
      - name: Validate preregistration invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('migration/reporting/momentum_m3_persistence_contract.json').read_text())
          assert c['status']=='FROZEN_EX_ANTE_NO_ECONOMICS_READ'
          assert c['freeze_date']=='2026-09-09'
          assert c['authority_issue']==687
          assert c['design_input_prohibitions']['m1_m2_economic_ledger_read_for_design'] is False
          assert c['design_input_prohibitions']['empiricus_delta_may_tune'] is False
          assert c['prospective_policy']['retrospective_credit']==0
          assert c['prospective_policy']['historical_backfill'] is False
          assert c['safety']['orders']==0 and c['safety']['real_capital']==0
          assert c['safety']['engine_feed'] is False
          q=json.loads(Path('migration/reporting/momentum_m3_persistence_clarification_20260909.json').read_text())
          assert q['economics_read'] is False
          assert q['backfill'] is False
          PY
      - name: Run M3 frozen-contract tests
        run: python -m pytest -q tests/test_gate_btc_momentum_m3_persistence.py
      - name: Assert no economic runtime dependency
        run: |
          ! grep -R "momentum_m1_m2_economics" tools/gate_btc_momentum_m3_persistence.py
          ! grep -R "ECONOMICS_STATUS" tools/gate_btc_momentum_m3_persistence.py
      - name: Validate prospective scheduler safety surface
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/gate-btc-momentum-m3-prospective-shadow.yml').read_text()
          required=[
              'GATE BTC Momentum M1 M2 Shadow Collection',
              'gate-btc-runtime',
              'data_as_of',
              '2026-09-09',
              'economics_activated',
              'retrospective_credit',
              "'orders':0",
              "'real_capital':0",
              'backfill',
              'late_seal',
          ]
          for token in required:
              assert token in p, token
          assert 'schedule:' not in p
          PY
