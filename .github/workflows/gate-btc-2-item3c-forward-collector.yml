name: GATE BTC 2 Item 3C Experimental Forward Collector Contract

# Physical MT5 collection is executed by QRDS-MT5-Bridge on the canonical
# [self-hosted, Windows, X64, mt5, btg, read-only] runner. This QRDS workflow
# preserves and validates the frozen scientific collector contract only.
on:
  pull_request:
    paths:
      - 'artifacts/gate_btc_2/FACTORY_ITEM3C_FORWARD_COLLECTOR_PREREG_20260922.json'
      - 'tools/gate_btc_2_item3c_forward_collector.py'
      - '.github/workflows/gate-btc-2-item3c-forward-collector.yml'
  push:
    branches: [main]
    paths:
      - 'artifacts/gate_btc_2/FACTORY_ITEM3C_FORWARD_COLLECTOR_PREREG_20260922.json'
      - 'tools/gate_btc_2_item3c_forward_collector.py'
      - '.github/workflows/gate-btc-2-item3c-forward-collector.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RESEARCH_ONLY: 'true'
  SHADOW_ONLY: 'true'
  MT5_READ_ONLY: 'true'
  NO_ORDER_SEND: 'true'
  ENGINE_FEED: 'false'
  ORDERS: '0'
  REAL_CAPITAL: '0'
  NO_BACKFILL: 'true'
  NO_RETUNE: 'true'
  H1_H31_RUNTIME_MUTATION: 'false'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install hosted validation timezone data
        shell: powershell
        run: python -m pip install -q tzdata
      - name: Compile collector and dependency
        shell: powershell
        run: |
          python -m py_compile tools/gate_btc_2_item3b_forward_source_probe.py tools/gate_btc_2_item3c_forward_collector.py
      - name: Run embedded deterministic semantics test
        shell: powershell
        run: python tools/gate_btc_2_item3c_forward_collector.py --self-test
      - name: Assert preregistration safety and Bridge relocation
        shell: powershell
        run: |
          python -c "import json; p=json.load(open('artifacts/gate_btc_2/FACTORY_ITEM3C_FORWARD_COLLECTOR_PREREG_20260922.json',encoding='utf-8')); assert p['status']=='PREREGISTERED_BEFORE_FIRST_FORWARD_OBSERVATION'; assert p['session']['no_missed_session_reconstruction'] and p['session']['no_backfill']; assert p['ledger']['survivor_credit']==0 and p['ledger']['promotion_authority'] is False; assert p['future_adjudication']['not_defined_here'] and p['future_adjudication']['direct_survivor_transition'] is False; s=p['safety']; assert s['RESEARCH_ONLY'] and s['SHADOW_ONLY'] and s['MT5_READ_ONLY'] and s['NO_ORDER_SEND'] and s['NO_BACKFILL'] and s['NO_RETUNE']; assert s['ORDERS']==0 and s['REAL_CAPITAL']==0 and s['ENGINE_FEED'] is False and s['H1_H31_RUNTIME_MUTATION'] is False; print('ITEM3C_CONTRACT=PASS')"
          $t=Get-Content tools/gate_btc_2_item3c_forward_collector.py -Raw
          if ($t -match 'order_send\s*\(') { throw 'ORDER_SEND_FORBIDDEN' }
          $wf=Get-Content .github/workflows/gate-btc-2-item3c-forward-collector.yml -Raw
          if ($wf -match 'runs-on:\s*self-hosted') { throw 'PHYSICAL_MT5_RUNNER_MUST_LIVE_ON_BRIDGE' }
          if ($wf -match "cron:\s*'5 22") { throw 'DUPLICATE_ITEM3C_SCHEDULE_FORBIDDEN' }
          Write-Host 'ITEM3C_PHYSICAL_EXECUTION=QRDS-MT5-Bridge'
