name: GATE BTC 2 Stage 9 Bitget Ledger Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-2-stage9-bitget-ledger-bridge.yml
      - tools/gate_btc_2_stage9_bitget_ledger_bridge.py
      - tools/gate_btc_2_stage9_bitget_admission_review.py
      # imported by gate_btc_2_stage9_bitget_admission_review.py
      - tools/gate_btc_2_stage9_source_preregistration.py
      # imported transitively by admission review / source preregistration
      - tools/gate_btc_2_microstructure_shadow_contract.py
      - tools/gate_btc_2_stage9_admission_ledger.py
      - tools/gate_btc_2_prospective_counter_bridge.py
      - tests/test_gate_btc_2_stage9_bitget_ledger_bridge.py
      - tests/test_gate_btc_2_stage9_bitget_admission_review.py
  workflow_run:
    workflows: ["GATE BTC 2 Stage 9 Bitget Forward Adapter"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  GATE_BTC_SHADOW_ONLY: "true"
  GATE_BTC_NOT_APPROVED: "true"
  GATE_BTC_ENGINE_FEED: "false"
  GATE_BTC_ORDERS: "0"
  GATE_BTC_REAL_CAPITAL: "0"
  GATE_BTC_NO_RETUNE: "true"
  GATE_BTC_NO_BACKFILL: "true"
  GATE_BTC_FAIL_CLOSED: "true"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Compile bridge, reviewer and tests
        run: python -m py_compile tools/gate_btc_2_stage9_bitget_ledger_bridge.py tools/gate_btc_2_stage9_bitget_admission_review.py tests/test_gate_btc_2_stage9_bitget_ledger_bridge.py tests/test_gate_btc_2_stage9_bitget_admission_review.py
      - name: Run fail-closed regressions
        run: |
          python -m unittest -v tests.test_gate_btc_2_stage9_bitget_ledger_bridge
          python -m unittest -v tests.test_gate_btc_2_stage9_bitget_admission_review
      - name: Assert immutable scientific boundary
        run: |
          echo "RESEARCH_ONLY=true SHADOW_ONLY=true NOT_APPROVED=true"
          echo "ENGINE_FEED=false ORDERS=0 REAL_CAPITAL_BRL=0"
          echo "NO_RETUNE=true NO_BACKFILL=true FAIL_CLOSED=true"

  scheduled-admission-ledger:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gate-btc-2-stage9-ledger-runtime
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Bind exact scheduled capture run identity
        env:
          CAPTURE_RUN_ID: ${{ github.event.workflow_run.id }}
          CAPTURE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          META="$(gh api repos/${{ github.repository }}/actions/runs/${CAPTURE_RUN_ID})"
          test "$(jq -r .event <<<"$META")" = "schedule"
          test "$(jq -r .head_branch <<<"$META")" = "main"
          test "$(jq -r .head_sha <<<"$META")" = "$CAPTURE_HEAD_SHA"
          test "$(jq -r .conclusion <<<"$META")" = "success"
          echo "CAPTURE_RUN_ID=$CAPTURE_RUN_ID" >> "$GITHUB_ENV"
          echo "CAPTURE_HEAD_SHA=$CAPTURE_HEAD_SHA" >> "$GITHUB_ENV"
      - name: Download exact scheduled capture artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p captured
          gh run download "$CAPTURE_RUN_ID" --repo "${{ github.repository }}" --name "gate-btc-stage9-bitget-forward-${CAPTURE_RUN_ID}" --dir captured
      - name: Execute independent explicit admission review
        run: |
          set -euo pipefail
          mkdir -p admitted
          python -m tools.gate_btc_2_stage9_bitget_admission_review \
            --capture-dir captured \
            --review-out admitted/bitget_stage9_review.json \
            --admission-out admitted/bitget_stage9_admission.json
      - name: Checkout runtime ledger authority
        uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 0
      - name: Restore prior canonical ledger head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence previous
          HEAD=runtime_repo/runtime/system9/CANONICAL_LEDGER_HEAD.json
          test -f "$HEAD"
          PREV_RUN="$(jq -er '.ledger_run_id | select(type == "number" and . > 0)' "$HEAD")"
          gh run download "$PREV_RUN" --repo "${{ github.repository }}" --name "gate-btc-stage9-bitget-ledger-${PREV_RUN}" --dir previous
          LEDGER="$(find previous -name stage9_admission_ledger.jsonl -type f -print -quit)"
          test -n "$LEDGER"
          cp "$LEDGER" evidence/stage9_admission_ledger.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.gate_btc_2_stage9_admission_ledger import parse_ledger, validate_ledger
          head=json.loads(Path('runtime_repo/runtime/system9/CANONICAL_LEDGER_HEAD.json').read_text())
          rows=parse_ledger(Path('evidence/stage9_admission_ledger.jsonl'))
          validate_ledger(rows)
          assert len(rows)==head['record_count'] and rows[-1]['record_sha256']==head['tip_sha256']
          assert rows[-1]['captured_at_utc']==head['latest_captured_at_utc']
          print('CANONICAL_LEDGER_HEAD_VERIFIED='+str(len(rows)))
          PY
      - name: Append at most one canonical capture per UTC hour
        run: |
          set -euo pipefail
          BEFORE="$(wc -l < evidence/stage9_admission_ledger.jsonl)"
          python -m tools.gate_btc_2_stage9_bitget_ledger_bridge \
            --capture-dir captured \
            --admission-dir admitted \
            --run-id "$CAPTURE_RUN_ID" \
            --ledger evidence/stage9_admission_ledger.jsonl \
            --canonical-admission-out evidence/bitget_canonical_admission.json \
            --counter-out evidence/stage9_counter.json
          AFTER="$(wc -l < evidence/stage9_admission_ledger.jsonl)"
          export BEFORE AFTER
          python - <<'PY'
          import json, os
          from pathlib import Path
          before=int(os.environ['BEFORE']); after=int(os.environ['AFTER'])
          assert after in {before, before+1}
          c=json.loads(Path('evidence/stage9_counter.json').read_text())
          candidate=json.loads(Path('evidence/bitget_canonical_admission.json').read_text())
          rows=[json.loads(x) for x in Path('evidence/stage9_admission_ledger.jsonl').read_text().splitlines() if x.strip()]
          if after == before:
              bucket=candidate['captured_at_utc'][:13]
              assert any(r['captured_at_utc'][:13] == bucket for r in rows)
              assert c['canonical_counter']==before
              print('BITGET_STAGE9_SCHEDULED_RETRY=NO_NEW_CREDIT_DUPLICATE_UTC_HOUR')
          else:
              assert c['canonical_counter']==before+1
              print('BITGET_STAGE9_SCHEDULED_CANONICAL_APPEND=PASS')
          assert c['prospective_credit_from_backfill']==0
          assert c['safety']['RESEARCH_ONLY'] is True
          assert c['safety']['SHADOW_ONLY'] is True
          assert c['safety']['NOT_APPROVED'] is True
          assert c['safety']['ENGINE_FEED'] is False
          assert c['safety']['ORDERS']==0 and c['safety']['REAL_CAPITAL']==0
          PY
      - name: Preserve updated canonical ledger and admission evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-stage9-bitget-ledger-${{ github.run_id }}
          path: |
            evidence/
            admitted/
          if-no-files-found: error
          retention-days: 30
      - name: Persist canonical head after artifact upload
        if: ${{ success() }}
        working-directory: runtime_repo
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import sys
          sys.path.insert(0, '..')
          from tools.gate_btc_2_stage9_admission_ledger import parse_ledger, validate_ledger
          ledger=Path('../evidence/stage9_admission_ledger.jsonl')
          rows=parse_ledger(ledger)
          validate_ledger(rows)
          old=json.loads(Path('runtime/system9/CANONICAL_LEDGER_HEAD.json').read_text())
          assert len(rows)>=old['record_count']
          assert rows[old['record_count']-1]['record_sha256']==old['tip_sha256']
          head={'schema':'gate_btc.2_0.stage9_canonical_ledger_head.v1',
                'ledger_run_id':int(os.environ['GITHUB_RUN_ID']),
                'record_count':len(rows),
                'tip_sha256':rows[-1]['record_sha256'],
                'latest_captured_at_utc':rows[-1]['captured_at_utc']}
          Path('runtime/system9/CANONICAL_LEDGER_HEAD.json').write_text(
              json.dumps(head,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          git add runtime/system9/CANONICAL_LEDGER_HEAD.json
          git diff --cached --quiet && exit 0
          git commit -m "Advance Stage 9 canonical ledger head to run ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin gate-btc-runtime && git push origin HEAD:gate-btc-runtime && exit 0
            sleep $((i*2))
          done
          exit 1
