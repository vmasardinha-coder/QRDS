name: GATE BTC External Family Forward Collector

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/gate_btc_2/family_handoffs/EXTERNAL_FORWARD_COLLECTION_PREREG_20260922.json'
      - 'tools/gate_btc_2_external_forward_persist.py'
      - 'tests/test_gate_btc_2_external_forward_persist.py'
      - '.github/workflows/gate-btc-external-family-forward-collector.yml'
  push:
    branches: [main]
    paths:
      - 'artifacts/gate_btc_2/family_handoffs/EXTERNAL_FORWARD_COLLECTION_PREREG_20260922.json'
      - 'tools/gate_btc_2_external_forward_persist.py'
      - '.github/workflows/gate-btc-external-family-forward-collector.yml'
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gate-btc-external-family-forward-collector
  cancel-in-progress: false

env:
  RESEARCH_ONLY: 'true'
  SHADOW_ONLY: 'true'
  NO_RETUNE: 'true'
  NO_BACKFILL: 'true'
  ENGINE_FEED: 'false'
  ORDERS: '0'
  REAL_CAPITAL_BRL: '0'
  SCIENTIFIC_CREDIT: '0'
  SURVIVOR_CREDIT: '0'
  PROMOTION_AUTHORITY: 'false'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test append-only persistence
        run: python -m unittest -v tests/test_gate_btc_2_external_forward_persist.py
      - name: Assert preregistration safety boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/gate_btc_2/family_handoffs/EXTERNAL_FORWARD_COLLECTION_PREREG_20260922.json').read_text())
          assert p['families'][0]['family_id']=='F-XVOL-SURFACE'
          assert p['families'][1]['family_id']=='F-XMM-INVENTORY'
          assert p['economic_claim_authorized'] is False
          assert p['promotion_authority'] is False
          assert p['no_retune'] is True and p['no_backfill'] is True
          assert p['engine_feed'] is False and p['orders']==0 and p['real_capital_brl']==0
          assert p['persistence']['branch']=='runtime/gate-btc-external-forward'
          print('EXTERNAL_FORWARD_PREREG=PASS')
          PY

  collect:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source main
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 1

      - name: Checkout append-only runtime branch
        uses: actions/checkout@v4
        with:
          ref: runtime/gate-btc-external-forward
          path: runtime_branch
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen live dependency
        run: python -m pip install --disable-pip-version-check 'cryptofeed==2.5.0'

      - name: Capture both frozen external feature families
        shell: bash
        run: |
          mkdir -p live/f_xvol_surface live/f_xmm_inventory
          set +e
          python source/tools/gate_btc_2_f_xvol_surface_extractor.py --output live/f_xvol_surface
          XVOL_RC=$?
          python source/tools/gate_btc_2_f_xmm_inventory_extractor.py --duration 60 --output live/f_xmm_inventory
          XMM_RC=$?
          set -e
          echo "XVOL_RC=$XVOL_RC" >> "$GITHUB_ENV"
          echo "XMM_RC=$XMM_RC" >> "$GITHUB_ENV"
          echo "F-XVOL-SURFACE extractor rc=$XVOL_RC"
          echo "F-XMM-INVENTORY extractor rc=$XMM_RC"

      - name: Persist explicit prospective records
        shell: bash
        run: |
          ROOT='runtime_branch/runtime/gate_btc_2/external_family_forward'
          python source/tools/gate_btc_2_external_forward_persist.py \
            --family-id F-XVOL-SURFACE \
            --source-dir live/f_xvol_surface \
            --runtime-root "$ROOT" \
            --extractor-exit-code "$XVOL_RC" \
            --run-id "$GITHUB_RUN_ID" \
            --source-sha "$GITHUB_SHA"
          python source/tools/gate_btc_2_external_forward_persist.py \
            --family-id F-XMM-INVENTORY \
            --source-dir live/f_xmm_inventory \
            --runtime-root "$ROOT" \
            --extractor-exit-code "$XMM_RC" \
            --run-id "$GITHUB_RUN_ID" \
            --source-sha "$GITHUB_SHA"

      - name: Commit append-only runtime history
        shell: bash
        working-directory: runtime_branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/gate_btc_2/external_family_forward
          if git diff --cached --quiet; then
            echo 'No new prospective record to commit.'
            exit 0
          fi
          git commit -m "runtime: external family forward capture ${GITHUB_RUN_ID}"
          git push origin HEAD:runtime/gate-btc-external-forward

      - name: Assert safety and extractor health
        shell: bash
        run: |
          test "$RESEARCH_ONLY" = true
          test "$SHADOW_ONLY" = true
          test "$NO_RETUNE" = true
          test "$NO_BACKFILL" = true
          test "$ENGINE_FEED" = false
          test "$ORDERS" = 0
          test "$REAL_CAPITAL_BRL" = 0
          test "$SCIENTIFIC_CREDIT" = 0
          test "$SURVIVOR_CREDIT" = 0
          test "$PROMOTION_AUTHORITY" = false
          case "$XVOL_RC" in 0|2) ;; *) echo "unexpected F-XVOL extractor failure rc=$XVOL_RC"; exit 1;; esac
          case "$XMM_RC" in 0|2) ;; *) echo "unexpected F-XMM extractor failure rc=$XMM_RC"; exit 1;; esac

      - name: Upload full capture evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-family-forward-${{ github.run_id }}
          path: live/
          if-no-files-found: warn
          retention-days: 90
