name: GATE BTC PR Scope Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  GATE_BTC_RESEARCH_ONLY: "true"

jobs:
  scope-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed on non-GATE files in PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename' > changed_files.txt
          test -s changed_files.txt
          python - <<'PY'
          from pathlib import Path
          import os

          files=[line.strip() for line in Path('changed_files.txt').read_text(encoding='utf-8').splitlines() if line.strip()]
          head_ref=os.environ.get('HEAD_REF', '')
          exact={
              'config/lock25_50_shadow_contract_v1.json',
              'crypto_decision_lab/docs/ARCHITECTURE.md',
              'migration/GATE_BTC_IDENTITY_CONTINUITY_EVIDENCE.md',
              'migration/GATE_BTC_SURVIVORSHIP_PHASE1_CONCLUSION.md',
              'migration/GATE_BTC_PROFIT_RETENTION_PHASE2_PROTOCOL.md',
              'migration/GATE_BTC_PROFIT_RETENTION_PHASE2_RESULT.md',
              'migration/GATE_BTC_QOS_PROSPECTIVE_THREE_TRACK_CONTRACT_V1.json',
              'migration/GATE_BTC_QOS_PROSPECTIVE_THREE_TRACK_DECISION.md',
              'migration/GATE_BTC_INITIATIVE_EXECUTION_STATUS_LATEST.json',
              'migration/GATE_BTC_SHADOW_REPORTING_STANDARD_V1.md',
              'migration/reporting/bull_replay_contract.json',
              'migration/reporting/delta_paper_monitor_contract.json',
              'migration/reporting/delta_v12_structural_audit_contract.json',
              'migration/reporting/delta_v12_universe_expansion_contract.json',
              'migration/reporting/delta_v12_engine_contract.json',
              'migration/reporting/GATE_BTC_DELTA_PAPER_MONITOR_AGENT.md',
              'migration/reporting/shadow_daily_contract.json',
              'migration/reporting/delta_commercial_benchmark_20260808.json',
              'research/b3_h_nextgen_protocol.md',
              'research/b3_h30_h39_prereg.md',
              'research/b3_h30_h39_result_note.md',
              'tests/test_gateway_measurement_status.py',
              'tools/GATE_BTC_DAILY_EXECUTIVE_RECONCILER_V2.py',
              'tools/INSTALL_GATE_BTC_DAILY_EXECUTIVE_V2.ps1',
          }
          prefixes=(
              '.github/workflows/gate-btc-',
              'tools/gate_btc_',
              'tests/test_gate_btc_',
              'artifacts/gate_btc/v16b/',
              'research_freezes/GATE_BTC_V16',
              'research_inputs/V16B_',
              'research_inputs/V9C_',
              'research_protocols/GATE_BTC_V16B_',
          )
          violations=[]
          for path in files:
              runtime_delivery = head_ref == 'gate-btc-runtime' and path.startswith('runtime/')
              allowed = runtime_delivery or path in exact or any(path.startswith(prefix) for prefix in prefixes)
              if not allowed:
                  violations.append(path)
          if 'README.md' in files:
              violations.append('README.md (explicitly forbidden in GATE migration diff)')
          print('CHANGED_FILE_COUNT=' + str(len(files)))
          print('SCOPE_GUARD_RESEARCH_ONLY=true')
          print('SCOPE_GUARD_HEAD_REF=' + head_ref)
          if violations:
              print('SCOPE_GUARD=FAIL')
              for path in sorted(set(violations)):
                  print('VIOLATION=' + path)
              raise SystemExit(1)
          print('SCOPE_GUARD=PASS')
          for path in files:
              print('ALLOWED=' + path)
          PY

      - name: Assert safety boundary
        run: |
          test "$GATE_BTC_RESEARCH_ONLY" = "true"
          echo 'RESEARCH_ONLY=True'
          echo 'ORDERS=0'
          echo 'CAPITAL=0'
          echo 'MAIN_MUTATION=0'
          echo 'MERGE_PERFORMED=0'
