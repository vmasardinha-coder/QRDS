name: GATE BTC Grammar Scout Empty Seed
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/grammar_scout_status.example.json'
      - 'tests/test_gate_btc_grammar_scout_empty_seed.py'
      - '.github/workflows/gate-btc-grammar-scout-empty-seed.yml'
permissions:
  contents: read
jobs:
  empty-is-not-success:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install -q pytest
          pytest -q tests/test_gate_btc_grammar_scout_empty_seed.py
