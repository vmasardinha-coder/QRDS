name: GATE BTC TradingAgents standalone research

on:
  push:
    branches:
      - research/tradingagents-standalone
    paths:
      - 'artifacts/gate_btc_2/tradingagents_research/**'
      - '.github/workflows/gate-btc-tradingagents-standalone.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned upstream
        run: |
          git clone --filter=blob:none https://github.com/TauricResearch/TradingAgents.git /tmp/TradingAgents
          cd /tmp/TradingAgents
          git checkout 2d17df8da1536c121e4d7395ac5a5dcec9e96d6f
          test "$(git rev-parse HEAD)" = "2d17df8da1536c121e4d7395ac5a5dcec9e96d6f"
      - name: Install pinned framework and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install /tmp/TradingAgents pytest
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version('tradingagents') == '0.5.0'
          print('TRADINGAGENTS_VERSION', importlib.metadata.version('tradingagents'))
          PY
      - name: Run upstream PIT and deterministic contract tests
        run: |
          cd /tmp/TradingAgents
          pytest -q \
            tests/test_backtest.py \
            tests/test_memory_pointintime.py \
            tests/test_tool_date_enforcement.py \
            tests/test_fundamentals_lookahead.py \
            tests/test_structured_agents.py \
            tests/test_signal_processing.py \
            tests/test_portfolio_context.py \
            | tee "$GITHUB_WORKSPACE/artifacts/gate_btc_2/tradingagents_research/upstream_tests.txt"
      - name: Run deterministic debate-structure POC
        env:
          PYTHONPATH: /tmp/TradingAgents
        run: |
          python artifacts/gate_btc_2/tradingagents_research/run_structural_poc.py \
            | tee artifacts/gate_btc_2/tradingagents_research/structural_poc_stdout.txt
      - name: Record standalone boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.load(open('artifacts/gate_btc_2/tradingagents_research/runtime_structural/structural_poc.json'))
          assert z['research_only'] is True and z['shadow_only'] is True and z['factory_modified'] is False
          assert z['market_alpha_tested'] is False
          assert z['llm_provider_behavior_tested'] is False
          assert z['independent_bull_bear_channels_present'] is True
          assert z['independent_risk_stance_channels_present'] is True
          out={
            'research_only': True,
            'shadow_only': True,
            'factory_modified': False,
            'upstream_sha': '2d17df8da1536c121e4d7395ac5a5dcec9e96d6f',
            'upstream_version': '0.5.0',
            'package_installed': True,
            'selected_pit_and_contract_tests_passed': True,
            'deterministic_structural_poc_passed': True,
            'api_dependent_multiagent_propagation_tested': False,
            'economic_value_of_disagreement_proven': False,
          }
          Path('artifacts/gate_btc_2/tradingagents_research/standalone_result.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Verify isolation
        run: |
          grep -q 'RESEARCH_ONLY=true' artifacts/gate_btc_2/tradingagents_research/TRADINGAGENTS_DISCOVERY_20260921.md
          grep -q 'SHADOW_ONLY=true' artifacts/gate_btc_2/tradingagents_research/TRADINGAGENTS_DISCOVERY_20260921.md
          git diff --name-only 3ea3a7554bb5d0a822dde703bc0442d9fa7c4b0a...HEAD | grep -v '^artifacts/gate_btc_2/tradingagents_research/' | grep -v '^.github/workflows/gate-btc-tradingagents-standalone.yml$' && exit 1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: gate-btc-tradingagents-standalone
          path: artifacts/gate_btc_2/tradingagents_research/
          if-no-files-found: error
