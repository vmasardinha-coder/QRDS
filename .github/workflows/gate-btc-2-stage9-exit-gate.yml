name: GATE BTC 2 Stage 9 Exit Gate

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-2-stage9-exit-gate.yml
      - tools/gate_btc_2_stage9_exit_gate.py
      - tools/gate_btc_2_stage9_exit_segment_v1.json
      - tests/test_gate_btc_2_stage9_exit_gate.py
      - tools/gate_btc_2_master_plan_16_systems.md
  workflow_run:
    workflows: ["GATE BTC 2 Stage 9 Bitget Ledger Bridge"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  RESEARCH_ONLY: "true"
  SHADOW_ONLY: "true"
  NOT_APPROVED: "true"
  ENGINE_FEED: "false"
  ORDERS: "0"
  REAL_CAPITAL: "0"
  NO_BACKFILL: "true"
  NO_LATE_SEAL: "true"
  NO_COUNTER_RESET: "true"
  NO_RETUNE: "true"
  FAIL_CLOSED: "true"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Compile Stage 9 exit gate
        run: python -m py_compile tools/gate_btc_2_stage9_exit_gate.py tests/test_gate_btc_2_stage9_exit_gate.py
      - name: Run Stage 9 exit gate regressions
        run: python -m unittest -v tests.test_gate_btc_2_stage9_exit_gate
      - name: Assert frozen prospective boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('tools/gate_btc_2_stage9_exit_segment_v1.json').read_text())
          assert p['authority_origin']['prior_canonical_counter']==50
          assert p['authority_origin']['prior_counter_credit_to_exit_segment']==0
          assert p['activation']['eligible_captured_at_utc_gte']=='2026-09-08T00:00:00Z'
          assert p['exit_gate']['required_N']==168
          assert p['exit_gate']['required_distinct_utc_hours']==24
          assert p['exit_gate']['required_distinct_utc_weekdays']==7
          assert p['exit_gate']['required_elapsed_hours']==167
          assert p['safety']['ENGINE_FEED'] is False
          assert p['safety']['ORDERS']==0 and p['safety']['REAL_CAPITAL']==0
          print('STAGE9_EXIT_PREREG=PASS')
          PY

  evaluate-canonical-ledger:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gate-btc-2-stage9-exit-runtime
      cancel-in-progress: false
    steps:
      - name: Checkout main authority
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_repo
      - name: Checkout runtime status branch
        uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Bind triggering canonical ledger run
        env:
          LEDGER_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          META="$(gh api repos/${{ github.repository }}/actions/runs/${LEDGER_RUN_ID})"
          test "$(jq -r .name <<<"$META")" = "GATE BTC 2 Stage 9 Bitget Ledger Bridge"
          test "$(jq -r .event <<<"$META")" = "workflow_run"
          test "$(jq -r .head_branch <<<"$META")" = "main"
          test "$(jq -r .conclusion <<<"$META")" = "success"
          echo "LEDGER_RUN_ID=$LEDGER_RUN_ID" >> "$GITHUB_ENV"
      - name: Download exact canonical ledger artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ledger_artifact
          gh run download "$LEDGER_RUN_ID" --repo "${{ github.repository }}" --name "gate-btc-stage9-bitget-ledger-${LEDGER_RUN_ID}" --dir ledger_artifact
          LEDGER="$(find ledger_artifact -name stage9_admission_ledger.jsonl -type f -print -quit)"
          test -n "$LEDGER"
          echo "LEDGER=$LEDGER" >> "$GITHUB_ENV"
      - name: Evaluate frozen prospective exit gate
        run: |
          set -euo pipefail
          mkdir -p status
          PYTHONPATH=main_repo python -m tools.gate_btc_2_stage9_exit_gate \
            --ledger "$LEDGER" \
            --prereg main_repo/tools/gate_btc_2_stage9_exit_segment_v1.json \
            --output status/STAGE9_EXIT_STATUS.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('status/STAGE9_EXIT_STATUS.json').read_text())
          assert s['pre_activation_exit_credit']==0
          assert s['original_stage9_counter_mutated'] is False
          assert s['completion_effect']['economics_allowed'] is False
          assert s['completion_effect']['engine_feed'] is False
          assert s['completion_effect']['orders']==0 and s['completion_effect']['real_capital']==0
          print('STAGE9_EXIT_GATE_STATUS='+s['decision'])
          PY
      - name: Preserve immutable evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-stage9-exit-${{ github.run_id }}
          path: status/STAGE9_EXIT_STATUS.json
          if-no-files-found: error
          retention-days: 90
      - name: Persist current Stage 9 status and immutable completion marker
        working-directory: runtime_repo
        run: |
          set -euo pipefail
          mkdir -p runtime/system9
          cp ../status/STAGE9_EXIT_STATUS.json runtime/system9/STAGE9_EXIT_STATUS.json
          DECISION="$(jq -r .decision runtime/system9/STAGE9_EXIT_STATUS.json)"
          if [ "$DECISION" = "PASS_STAGE9_EXIT_GATE" ]; then
            if [ -f runtime/system9/SYSTEM9_COMPLETE.json ]; then
              test "$(jq -r .decision runtime/system9/SYSTEM9_COMPLETE.json)" = "PASS_STAGE9_EXIT_GATE"
            else
              cp runtime/system9/STAGE9_EXIT_STATUS.json runtime/system9/SYSTEM9_COMPLETE.json
            fi
          fi
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          git add runtime/system9/STAGE9_EXIT_STATUS.json runtime/system9/SYSTEM9_COMPLETE.json 2>/dev/null || git add runtime/system9/STAGE9_EXIT_STATUS.json
          git diff --cached --quiet && exit 0
          git commit -m "Stage 9 exit status from ledger ${LEDGER_RUN_ID}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin gate-btc-runtime && git push origin HEAD:gate-btc-runtime && exit 0
            sleep $((i*2))
          done
          exit 1
