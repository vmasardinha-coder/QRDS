name: GATE BTC PRL50 Economics

on:
  pull_request:
    branches: [main]
    paths:
      - tools/gate_btc_reporting_operational_overlay.py
      - tools/gate_btc_prl50_position_economics.py
      - tools/gate_btc_prl50_position_shadow_archive.py
      - tools/gate_btc_prl50_position_cycle.py
      - tools/gate_btc_prl_alt_next_epoch.py
      - tools/gate_btc_prl50_position_shadow_contract_20261031.json
      - tools/gate_btc_prl50_cycle_20260930.json
      - tools/gate_btc_prl50_position_shadow_contract_20260930.json
      - tests/test_gate_btc_prl50_position_cycle.py
      - tests/test_gate_btc_prl50_position_economics.py
      - tests/test_gate_btc_prl_alt_next_epoch.py
      - .github/workflows/gate-btc-prl50-economics.yml
  workflow_dispatch:
  workflow_run:
    workflows: ["GATE BTC PRL50 Position Shadow Archive"]
    types: [completed]

concurrency:
  group: gate-btc-prl50-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'canonical' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RESEARCH_ONLY: "true"
  SHADOW_ONLY: "true"
  NOT_APPROVED: "true"
  ENGINE_FEED: "false"
  ORDERS: "0"
  REAL_CAPITAL: "0"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest tests.test_gate_btc_prl50_position_economics tests.test_gate_btc_prl50_position_cycle tests.test_gate_btc_prl_alt_next_epoch
      - run: python -m py_compile tools/gate_btc_prl50_position_shadow_archive.py tools/gate_btc_prl50_position_economics.py tools/gate_btc_prl50_position_cycle.py

  economics:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, path: main_repo}
      - uses: actions/checkout@v4
        with: {ref: gate-btc-runtime, path: runtime_repo, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Audit the active PRL50 epoch without rewriting delivery state
        working-directory: main_repo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools import gate_btc_prl50_position_economics as econ
          root=Path('../runtime_repo/runtime/ledgers/prl50_position')
          state=json.loads((root/'STATUS.json').read_text())
          assert state['research_only'] and state['shadow_only'] and state['not_approved']
          assert state['engine_feed'] is False and state['orders_generated']==0 and state['real_capital_used']==0
          epoch=root/'epochs'/state['current_epoch']
          status=epoch/'ECONOMICS_STATUS.json'
          if status.exists():
              from datetime import datetime, timedelta, timezone
              interrupted=(epoch/'PRESERVED_GAP.json').exists()
              stale_old=(state['current_epoch']=='monthly_20260930'
                         and state.get('last_archived_date')
                         and state['last_archived_date'] <
                             (datetime.now(timezone.utc).date()-timedelta(days=2)).isoformat())
              if not interrupted and not stale_old:
                  contract=(Path('tools/gate_btc_prl50_position_shadow_contract_20261031.json')
                            if state['current_epoch']=='monthly_20261031'
                            else Path('tools/gate_btc_prl50_position_shadow_contract_20260930.json'))
                  econ.audit(epoch,contract)
              result=json.loads(status.read_text())
              assert result['research_only'] and result['shadow_only'] and result['not_approved']
              assert result['engine_feed'] is False and result['orders_generated']==0 and result['real_capital_used']==0
              assert result['retrospective_backfill'] is False
          print('PRL50_ECONOMICS_STATUS_PRESENT='+str(status.exists()))
          PY
      - name: Persist economics only
        working-directory: runtime_repo
        run: |
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          git add runtime/ledgers/prl50_position
          git diff --cached --quiet && exit 0
          git commit -m "Refresh PRL50 economic mirror $GITHUB_RUN_ID"
          git pull --rebase origin gate-btc-runtime
          git push origin HEAD:gate-btc-runtime
