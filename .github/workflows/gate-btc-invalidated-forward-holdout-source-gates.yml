name: GATE BTC Invalidated Forward Holdout Source Gates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/build_invalidated_forward_holdout_gates.py'
      - 'tests/test_gate_btc_invalidated_forward_holdout_gates.py'
      - '.github/workflows/gate-btc-invalidated-forward-holdout-source-gates.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: gate-btc-invalidated-forward-holdout-source-gates
  cancel-in-progress: false

env:
  RESEARCH_ONLY: 'true'
  SHADOW_ONLY: 'true'
  NOT_APPROVED: 'true'
  ENGINE_FEED: 'false'
  ORDERS: '0'
  REAL_CAPITAL: '0'
  NO_RETUNE: 'true'
  NO_BACKFILL: 'true'
  NO_COUNTER_RESET: 'true'
  FAIL_CLOSED: 'true'
  H1_ECONOMICS_READ: 'false'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, path: main_repo}
      - uses: actions/checkout@v4
        with: {ref: gate-btc-runtime, path: runtime_repo, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Assert immutable boundary
        run: |
          test "$RESEARCH_ONLY" = true
          test "$SHADOW_ONLY" = true
          test "$NOT_APPROVED" = true
          test "$ENGINE_FEED" = false
          test "$ORDERS" = 0
          test "$REAL_CAPITAL" = 0
          test "$NO_RETUNE" = true
          test "$NO_BACKFILL" = true
          test "$NO_COUNTER_RESET" = true
          test "$FAIL_CLOSED" = true
          test "$H1_ECONOMICS_READ" = false

      - name: Test holdout gate builder
        run: |
          python -m pip install -q pytest pandas
          cd main_repo
          python -m py_compile tools/gate_btc_factory/build_invalidated_forward_holdout_gates.py
          pytest -q tests/test_gate_btc_invalidated_forward_holdout_gates.py

      - name: Build strict 2025-2026 forward-unseen dataset and 12 scoped gates
        run: |
          python main_repo/tools/gate_btc_factory/build_invalidated_forward_holdout_gates.py \
            --root-cause runtime_repo/runtime/factory_autonomy/ROOT_CAUSE_RUNTIME.json \
            --results-dir runtime_repo/runtime/autonomous_science/results \
            --runtime-root runtime_repo/runtime/factory_autonomy/invalidated_requalification

      - name: Assert complete batch coverage and strict unseen boundary
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('runtime_repo/runtime/factory_autonomy/invalidated_requalification')
          m=json.load(open(root/'FORWARD_HOLDOUT_MANIFEST.json',encoding='utf-8'))
          assert m['schema']=='qrds.factory.invalidated_forward_holdout_manifest.v2', m
          assert m['affected_family_count']==768 and m['batch_count']==12 and m['batch_size']==64, m
          assert m['eligible_session_count'] >= 322, m
          assert m['holdout_start']=='2025-01-01' and m['cutoff_exclusive']=='2026-08-10', m
          assert m['windows']['discovery']['start'] >= '2025-01-01', m
          assert m['windows']['replication']['start'] >= '2025-01-01', m
          assert m['windows']['discovery']['end'] < m['windows']['replication']['start'], m
          assert m['windows']['replication']['end'] < '2026-08-10', m
          assert len(m['sources'])==2
          assert m['forward_unseen_verified_against_original_results'] is True
          assert m['economics_read_during_gate_build'] is False and m['historical_observations_credited']==0
          dataset=Path('runtime_repo')/m['dataset_relative_path']
          assert dataset.is_file() and hashlib.sha256(dataset.read_bytes()).hexdigest()==m['dataset_sha256']
          gates=sorted((root/'source_gates').glob('WIN_M5_STRICT_FORWARD_UNSEEN_2025_2026_BATCH_*.json'))
          assert len(gates)==12
          seen=[]
          for p in gates:
              g=json.load(open(p,encoding='utf-8')); seen += g['family_ids']
              for k in ['qualified','free_or_official_auditable','publication_semantics_proven','revision_semantics_proven','identity_qa_pass','schema_qa_pass','point_in_time_valid','independent_unseen_evaluation_data','no_historical_backfill_credit']:
                  assert g[k] is True, (p,k)
              assert g['source']['holdout_start']=='2025-01-01'
              assert g['source']['cutoff_exclusive']=='2026-08-10'
              assert g['economics_pre_read'] is False and g['historical_observations_credited']==0
              assert g['same_historical_window_rerun'] is False and g['scientific_change_allowed'] is False
              s=g['safety']; assert s['research_only'] and s['shadow_only'] and s['not_approved']
              assert s['engine_feed'] is False and s['orders']==0 and s['real_capital']==0
              assert s['no_retune'] and s['no_backfill'] and s['no_counter_reset'] and s['fail_closed'] and s['h1_economics_read'] is False
          assert len(seen)==768 and len(set(seen))==768
          q=json.load(open(root/'QUEUE.json',encoding='utf-8'))
          assert set(seen)=={x['original_family_id'] for x in q['families']}
          print('INVALIDATED_STRICT_FORWARD_HOLDOUT_GATES=PASS')
          PY

      - name: Persist hash-bound dataset, scoped gates and manifest
        working-directory: runtime_repo
        run: |
          set -euo pipefail
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          git add runtime/factory_autonomy/invalidated_requalification/datasets \
                  runtime/factory_autonomy/invalidated_requalification/source_gates \
                  runtime/factory_autonomy/invalidated_requalification/FORWARD_HOLDOUT_MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m "Factory publish strict 2025-2026 unseen gates for 768 invalidated families"
            for i in 1 2 3 4 5; do
              git pull --rebase origin gate-btc-runtime
              if git push origin HEAD:gate-btc-runtime; then break; fi
              [ "$i" = 5 ] && exit 1
              sleep $((i*2))
            done
          fi

      - name: Start batch-scoped requalification immediately
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gate-btc-invalidated-family-requalification.yml --repo "$GITHUB_REPOSITORY" --ref main
