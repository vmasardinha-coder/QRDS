name: GATE BTC Momentum M1 M2 Shadow Collection

on:
  workflow_dispatch:
  schedule:
    - cron: '10 3 * * *'

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: gate-btc-momentum-m1m2-shadow
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            migration/canonical/v2a/requirements.txt
            migration/canonical/delta/requirements.txt
            migration/canonical/gateway/requirements.txt
      - name: Check out runtime ledger branch
        uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 0
      - name: Install canonical research dependencies
        run: >-
          pip install
          -r migration/canonical/v2a/requirements.txt
          -r migration/canonical/delta/requirements.txt
          -r migration/canonical/gateway/requirements.txt
      - name: Resolve latest completed UTC close
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          cutoff=(datetime.now(timezone.utc).date()-timedelta(days=1)).isoformat()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'MOMENTUM_CUTOFF={cutoff}\n')
          print(cutoff)
          PY
      - name: Build canonical V2A evidence for the cutoff
        run: >-
          python tools/qos_orchestrator.py
          --public-data
          --data-cutoff "$MOMENTUM_CUTOFF"
          --output-dir artifacts/momentum_qos
      - name: Collect M1 and M2 append-only shadow snapshot
        run: >-
          python tools/gate_btc_momentum_shadow_collect.py
          --v2a-zip artifacts/momentum_qos/qos_v2a_outputs.zip
          --cutoff "$MOMENTUM_CUTOFF"
          --ledger-dir runtime_repo/runtime/ledgers/momentum_m1_m2
          --output artifacts/momentum/GATE_BTC_MOMENTUM_M1M2_${MOMENTUM_CUTOFF}.json
      - name: Upload shadow evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-momentum-m1m2-${{ github.run_id }}
          path: artifacts/momentum
          retention-days: 90
          if-no-files-found: error
      - name: Publish append-only runtime ledger snapshot
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C runtime_repo config user.name 'gate-btc-actions'
          git -C runtime_repo config user.email 'gate-btc-actions@users.noreply.github.com'
          git -C runtime_repo add runtime/ledgers/momentum_m1_m2
          if git -C runtime_repo diff --cached --quiet; then
            echo 'Momentum ledger already current'
            exit 0
          fi
          git -C runtime_repo commit -m "Append Momentum M1/M2 shadow snapshot ${MOMENTUM_CUTOFF}"
          git -C runtime_repo push origin HEAD:gate-btc-runtime
