name: GATE BTC Momentum M1 M2 Shadow Collection

on:
  workflow_dispatch:
  schedule:
    # Primary midnight Sao Paulo attempt plus bounded same-day recovery windows.
    # Recovery only admits an actually available completed BTC UTC close; it never
    # fabricates a missing date or mutates a frozen snapshot.
    - cron: '10 3,9,12 * * *'

permissions:
  actions: read
  contents: write

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: gate-btc-momentum-m1m2-shadow
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: migration/canonical/v2a/requirements.txt

      - name: Check out runtime ledger branch
        uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 0

      - name: Validate frozen collector code and contract
        run: |
          python -m py_compile migration/reporting/qrds_momentum_m1.py tools/gate_btc_momentum_shadow_collect.py
          python - <<'PY'
          import json
          for p in (
              'migration/reporting/momentum_m1_contract.json',
              'migration/reporting/momentum_m2_voladj_contract.json',
              'migration/reporting/momentum_m1m2_collection_contract.json',
          ):
              json.load(open(p, encoding='utf-8'))
          print('MOMENTUM_CONTRACTS=PASS')
          PY

      - name: Install canonical V2A dependencies
        run: pip install -r migration/canonical/v2a/requirements.txt

      - name: Resolve requested prior UTC close
        id: requested
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          cutoff=(datetime.now(timezone.utc).date()-timedelta(days=1)).isoformat()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'MOMENTUM_REQUESTED_CUTOFF={cutoff}\n')
              f.write(f'MOMENTUM_CUTOFF={cutoff}\n')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f'cutoff={cutoff}\n')
          print(f'MOMENTUM_REQUESTED_CUTOFF={cutoff}')
          PY

      - name: Skip exact requested snapshot when already immutable
        id: preflight
        run: |
          set -euo pipefail
          target="runtime_repo/runtime/ledgers/momentum_m1_m2/${MOMENTUM_REQUESTED_CUTOFF}.json"
          if [ -s "$target" ]; then
            echo 'requested_present=true' >> "$GITHUB_OUTPUT"
            echo 'MOMENTUM_PREFLIGHT=REQUESTED_SNAPSHOT_ALREADY_PRESENT'
          else
            echo 'requested_present=false' >> "$GITHUB_OUTPUT"
            echo 'MOMENTUM_PREFLIGHT=NEW_DELIVERY_REQUIRED'
          fi

      - name: Collect canonical public V2A input with bounded retry
        id: v2a
        if: steps.preflight.outputs.requested_present != 'true'
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/momentum_qos artifacts/momentum_diagnostics artifacts/momentum
          ok=0
          for attempt in 1 2 3; do
            echo "V2A_ATTEMPT=$attempt"
            if python migration/canonical/v2a/scripts/00_run_all_v2a.py \
              --output-zip artifacts/momentum_qos/qos_v2a_public_collection.zip; then
              ok=1
              break
            fi
            sleep $((attempt * 15))
          done
          if [ "$ok" -eq 1 ] && [ -s artifacts/momentum_qos/qos_v2a_public_collection.zip ]; then
            echo 'source_ok=true' >> "$GITHUB_OUTPUT"
            echo 'V2A_SOURCE=PASS'
          else
            echo 'source_ok=false' >> "$GITHUB_OUTPUT"
            printf '{"status":"BLOCKED_V2A_SOURCE_AFTER_RETRIES","requested_cutoff":"%s","attempts":3,"research_only":true,"shadow_only":true,"not_approved":true,"engine_feed":false,"orders":0,"real_capital":0}\n' "$MOMENTUM_REQUESTED_CUTOFF" > artifacts/momentum_diagnostics/STATUS.json
            echo 'V2A_SOURCE=AMBER_FAIL_CLOSED'
          fi

      - name: Bind effective cutoff to latest completed BTC close actually available
        id: target
        if: steps.v2a.outputs.source_ok == 'true'
        run: |
          python - <<'PY'
          import csv, io, os, zipfile
          from pathlib import Path
          requested=os.environ['MOMENTUM_REQUESTED_CUTOFF']
          zpath=Path('artifacts/momentum_qos/qos_v2a_public_collection.zip')
          candidates=[]
          with zipfile.ZipFile(zpath) as z:
              for name in z.namelist():
                  if not name.lower().endswith('.csv'):
                      continue
                  raw=z.read(name)
                  try:
                      r=csv.DictReader(io.StringIO(raw.decode('utf-8-sig')))
                      fields={str(x).strip().lower() for x in (r.fieldnames or [])}
                  except Exception:
                      continue
                  if {'date','symbol','close_usd'}.issubset(fields):
                      rows=list(r)
                      candidates.append((name, rows))
          masters=[x for x in candidates if 'master' in x[0].lower()]
          pool=masters or candidates
          assert len(pool)==1, 'ambiguous canonical V2A master price CSV'
          _,rows=pool[0]
          btc=sorted({str(row.get('date',''))[:10] for row in rows
                      if str(row.get('symbol','')).strip().upper()=='BTC'
                      and str(row.get('date',''))[:10] <= requested
                      and str(row.get('date',''))[:10]})
          assert btc, f'no completed BTC close available through requested cutoff {requested}'
          effective=btc[-1]
          freeze='2026-08-21'
          assert effective >= freeze, f'effective BTC close {effective} predates prospective freeze {freeze}'
          existing=Path(f'runtime_repo/runtime/ledgers/momentum_m1_m2/{effective}.json').is_file()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'MOMENTUM_CUTOFF={effective}\n')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f'effective_cutoff={effective}\n')
              f.write(f'already_present={str(existing).lower()}\n')
              f.write(f'source_lag={str(effective != requested).lower()}\n')
          print(f'MOMENTUM_SOURCE_CLOCK requested={requested} effective={effective} already_present={existing}')
          PY

      - name: Freeze V2A evidence to effective completed BTC cutoff
        id: freeze
        if: steps.v2a.outputs.source_ok == 'true' && steps.target.outputs.already_present != 'true'
        continue-on-error: true
        run: >-
          python tools/v2a_frozen_replay.py
          artifacts/momentum_qos/qos_v2a_public_collection.zip
          --data-cutoff "$MOMENTUM_CUTOFF"
          --output-zip artifacts/momentum_qos/qos_v2a_outputs.zip
          --evidence-dir artifacts/momentum_qos/v2a_frozen_replay_evidence

      - name: Collect M1 and M2 append-only shadow snapshot
        id: collect_snapshot
        if: steps.v2a.outputs.source_ok == 'true' && steps.target.outputs.already_present != 'true' && steps.freeze.outcome == 'success'
        continue-on-error: true
        run: >-
          python tools/gate_btc_momentum_shadow_collect.py
          --v2a-zip artifacts/momentum_qos/qos_v2a_outputs.zip
          --cutoff "$MOMENTUM_CUTOFF"
          --ledger-dir runtime_repo/runtime/ledgers/momentum_m1_m2
          --output artifacts/momentum/GATE_BTC_MOMENTUM_M1M2_${MOMENTUM_CUTOFF}.json

      - name: Build canonical Momentum status from admitted immutable snapshots
        id: build_status
        if: >-
          steps.preflight.outputs.requested_present == 'true' ||
          steps.target.outputs.already_present == 'true' ||
          steps.collect_snapshot.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('runtime_repo/runtime/ledgers/momentum_m1_m2')
          snaps=sorted(p for p in root.glob('*.json') if p.name != 'STATUS.json')
          assert snaps, 'no momentum snapshots'
          latest=json.loads(snaps[-1].read_text(encoding='utf-8'))
          safety=latest['safety']
          assert safety['research_only'] is True and safety['shadow_only'] is True and safety['not_approved'] is True
          assert safety['engine_feed'] is False and safety['orders'] == 0 and safety['real_capital'] == 0
          requested=os.environ['MOMENTUM_REQUESTED_CUTOFF']
          effective=latest['cutoff']
          if Path(root/f'{requested}.json').is_file():
              run_state='REQUESTED_SNAPSHOT_ADMITTED_OR_ALREADY_PRESENT'
          elif effective < requested:
              run_state='SOURCE_LAG_ACTIVE_ON_LAST_COMPLETED_BTC_CLOSE'
          else:
              run_state='ACTIVE_PROSPECTIVE_SHADOW'
          status={
            'schema':'gate_btc.momentum_m1_m2.status.v1',
            'status':'ACTIVE_PROSPECTIVE_SHADOW',
            'data_as_of':latest['cutoff'],
            'requested_cutoff':requested,
            'last_run_state':run_state,
            'observed_snapshots':len(snaps),
            'latest_snapshot_sha256':latest['snapshot_sha256'],
            'm1_summary':latest['m1']['summary'],
            'm2_summary':latest['m2']['summary'],
            'research_only':True,'shadow_only':True,'not_approved':True,
            'engine_feed':False,'orders_generated':0,'real_capital_used':0,
            'promotion_allowed':False,'automatic_tuning':False,'backfill_allowed':False,
          }
          (root/'STATUS.json').write_text(json.dumps(status,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          Path('artifacts/momentum').mkdir(parents=True,exist_ok=True)
          Path('artifacts/momentum/STATUS.json').write_text(json.dumps(status,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps({'status':status['status'],'data_as_of':status['data_as_of'],'requested_cutoff':requested,'observed_snapshots':status['observed_snapshots']},sort_keys=True))
          PY

      - name: Record AMBER delivery attempt without downgrading admitted snapshot health
        if: steps.preflight.outputs.requested_present != 'true' && steps.v2a.outputs.source_ok != 'true'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('runtime_repo/runtime/ledgers/momentum_m1_m2')
          root.mkdir(parents=True, exist_ok=True)
          diagnostics=root/'diagnostics'
          diagnostics.mkdir(parents=True,exist_ok=True)
          attempt={
            'schema':'gate_btc.momentum_m1_m2.delivery_attempt.v1',
            'status':'AMBER_SOURCE_RETRY_EXHAUSTED',
            'requested_cutoff':os.environ['MOMENTUM_REQUESTED_CUTOFF'],
            'run_id':os.environ['GITHUB_RUN_ID'],
            'methodology_failure':False,
            'repair_scope':'ORCHESTRATION_AND_DATA_DELIVERY_ONLY',
            'research_only':True,'shadow_only':True,'not_approved':True,
            'engine_feed':False,'orders_generated':0,'real_capital_used':0,
            'automatic_tuning':False,'backfill_allowed':False,
          }
          (diagnostics/f"{os.environ['GITHUB_RUN_ID']}.json").write_text(json.dumps(attempt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          snaps=sorted(p for p in root.glob('*.json') if p.name != 'STATUS.json')
          if not snaps:
              (root/'STATUS.json').write_text(json.dumps({**attempt,'schema':'gate_btc.momentum_m1_m2.status.v1','status':'BLOCKED_SOURCE_RETRY_EXHAUSTED','observed_snapshots':0},indent=2,sort_keys=True)+'\n',encoding='utf-8')
          Path('artifacts/momentum').mkdir(parents=True,exist_ok=True)
          Path('artifacts/momentum/DELIVERY_ATTEMPT.json').write_text(json.dumps(attempt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('MOMENTUM_DELIVERY=AMBER_SOURCE_RETRY_EXHAUSTED_CANONICAL_HEALTH_PRESERVED')
          PY

      - name: Record RED processing diagnostic without erasing a prior admitted snapshot
        id: red
        if: >-
          steps.preflight.outputs.requested_present != 'true' &&
          steps.v2a.outputs.source_ok == 'true' &&
          (
            steps.target.outcome != 'success' ||
            (steps.target.outputs.already_present != 'true' && (steps.freeze.outcome != 'success' || steps.collect_snapshot.outcome != 'success')) ||
            steps.build_status.outcome != 'success'
          )
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('runtime_repo/runtime/ledgers/momentum_m1_m2')
          root.mkdir(parents=True, exist_ok=True)
          diagnostics=root/'diagnostics'
          diagnostics.mkdir(parents=True,exist_ok=True)
          attempt={
            'schema':'gate_btc.momentum_m1_m2.delivery_attempt.v1',
            'status':'RED_TRUE_PROCESSING_FAILURE',
            'requested_cutoff':os.environ['MOMENTUM_REQUESTED_CUTOFF'],
            'effective_cutoff':os.environ.get('MOMENTUM_CUTOFF'),
            'run_id':os.environ['GITHUB_RUN_ID'],
            'methodology_failure':False,
            'repair_scope':'ORCHESTRATION_AND_DATA_DELIVERY_ONLY',
            'research_only':True,'shadow_only':True,'not_approved':True,
            'engine_feed':False,'orders_generated':0,'real_capital_used':0,
            'automatic_tuning':False,'backfill_allowed':False,
          }
          (diagnostics/f"{os.environ['GITHUB_RUN_ID']}.json").write_text(json.dumps(attempt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          snaps=sorted(p for p in root.glob('*.json') if p.name != 'STATUS.json')
          if not snaps:
              (root/'STATUS.json').write_text(json.dumps({**attempt,'schema':'gate_btc.momentum_m1_m2.status.v1','observed_snapshots':0},indent=2,sort_keys=True)+'\n',encoding='utf-8')
          Path('artifacts/momentum').mkdir(parents=True,exist_ok=True)
          Path('artifacts/momentum/DELIVERY_ATTEMPT.json').write_text(json.dumps(attempt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('MOMENTUM_DELIVERY=RED_TRUE_PROCESSING_FAILURE_CANONICAL_HEALTH_PRESERVED')
          PY

      - name: Upload shadow evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-momentum-m1m2-${{ github.run_id }}
          path: |
            artifacts/momentum
            artifacts/momentum_qos/v2a_frozen_replay_evidence
            artifacts/momentum_diagnostics
          retention-days: 90
          if-no-files-found: warn

      - name: Publish append-only runtime status, snapshot, and delivery diagnostics
        if: always()
        run: |
          set -euo pipefail
          git -C runtime_repo config user.name 'gate-btc-actions'
          git -C runtime_repo config user.email 'gate-btc-actions@users.noreply.github.com'
          git -C runtime_repo add runtime/ledgers/momentum_m1_m2
          if git -C runtime_repo diff --cached --quiet; then
            echo 'Momentum runtime already current'
            exit 0
          fi
          git -C runtime_repo commit -m "Update Momentum M1/M2 shadow runtime ${MOMENTUM_REQUESTED_CUTOFF}"
          for attempt in 1 2 3 4 5; do
            git -C runtime_repo fetch origin gate-btc-runtime
            if ! git -C runtime_repo rebase origin/gate-btc-runtime; then
              git -C runtime_repo rebase --abort || true
              exit 1
            fi
            if git -C runtime_repo push origin HEAD:gate-btc-runtime; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Enforce true processing failures only
        if: always()
        run: |
          if [ "${{ steps.preflight.outputs.requested_present }}" = "true" ]; then
            echo 'MOMENTUM_COLLECTION=GREEN_REQUESTED_SNAPSHOT_ALREADY_PRESENT'
          elif [ "${{ steps.v2a.outputs.source_ok }}" != "true" ]; then
            echo 'MOMENTUM_COLLECTION=AMBER_SOURCE_BLOCKED_FAIL_CLOSED'
          elif [ "${{ steps.red.outcome }}" = "success" ]; then
            echo 'MOMENTUM_COLLECTION=RED_TRUE_PROCESSING_FAILURE'
            exit 1
          elif [ "${{ steps.build_status.outcome }}" = "success" ]; then
            echo 'MOMENTUM_COLLECTION=GREEN'
          else
            echo 'MOMENTUM_COLLECTION=RED_UNCLASSIFIED_PROCESSING_FAILURE'
            exit 1
          fi
          echo 'RESEARCH_ONLY=true'
          echo 'ORDERS=0'
          echo 'REAL_CAPITAL=0'
