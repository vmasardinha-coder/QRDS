name: GATE BTC Momentum M1 M2 Shadow Collection

on:
  workflow_dispatch:
  schedule:
    - cron: '10 3 * * *'

permissions:
  actions: read
  contents: write

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: gate-btc-momentum-m1m2-shadow
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: migration/canonical/v2a/requirements.txt

      - name: Check out runtime ledger branch
        uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 0

      - name: Validate frozen collector code and contract
        run: |
          python -m py_compile migration/reporting/qrds_momentum_m1.py tools/gate_btc_momentum_shadow_collect.py
          python - <<'PY'
          import json
          for p in (
              'migration/reporting/momentum_m1_contract.json',
              'migration/reporting/momentum_m2_voladj_contract.json',
              'migration/reporting/momentum_m1m2_collection_contract.json',
          ):
              json.load(open(p, encoding='utf-8'))
          print('MOMENTUM_CONTRACTS=PASS')
          PY

      - name: Install canonical V2A dependencies
        run: pip install -r migration/canonical/v2a/requirements.txt

      - name: Resolve latest completed UTC close
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          cutoff=(datetime.now(timezone.utc).date()-timedelta(days=1)).isoformat()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'MOMENTUM_CUTOFF={cutoff}\n')
          print(cutoff)
          PY

      - name: Collect canonical public V2A input with bounded retry
        id: v2a
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/momentum_qos artifacts/momentum_diagnostics artifacts/momentum
          ok=0
          for attempt in 1 2 3; do
            echo "V2A_ATTEMPT=$attempt"
            if python migration/canonical/v2a/scripts/00_run_all_v2a.py \
              --output-zip artifacts/momentum_qos/qos_v2a_public_collection.zip; then
              ok=1
              break
            fi
            sleep $((attempt * 15))
          done
          if [ "$ok" -eq 1 ] && [ -s artifacts/momentum_qos/qos_v2a_public_collection.zip ]; then
            echo 'source_ok=true' >> "$GITHUB_OUTPUT"
            echo 'V2A_SOURCE=PASS'
          else
            echo 'source_ok=false' >> "$GITHUB_OUTPUT"
            printf '{"status":"BLOCKED_V2A_SOURCE_AFTER_RETRIES","cutoff":"%s","attempts":3,"research_only":true,"shadow_only":true,"not_approved":true,"engine_feed":false,"orders":0,"real_capital":0}\n' "$MOMENTUM_CUTOFF" > artifacts/momentum_diagnostics/STATUS.json
            echo 'V2A_SOURCE=AMBER_FAIL_CLOSED'
          fi

      - name: Freeze V2A evidence to the target cutoff
        id: freeze
        if: steps.v2a.outputs.source_ok == 'true'
        continue-on-error: true
        run: >-
          python tools/v2a_frozen_replay.py
          artifacts/momentum_qos/qos_v2a_public_collection.zip
          --data-cutoff "$MOMENTUM_CUTOFF"
          --output-zip artifacts/momentum_qos/qos_v2a_outputs.zip
          --evidence-dir artifacts/momentum_qos/v2a_frozen_replay_evidence

      - name: Collect M1 and M2 append-only shadow snapshot
        id: collect_snapshot
        if: steps.v2a.outputs.source_ok == 'true' && steps.freeze.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          output=$(python tools/gate_btc_momentum_shadow_collect.py \
            --v2a-zip artifacts/momentum_qos/qos_v2a_outputs.zip \
            --cutoff "$MOMENTUM_CUTOFF" \
            --ledger-dir runtime_repo/runtime/ledgers/momentum_m1_m2 \
            --output artifacts/momentum/GATE_BTC_MOMENTUM_M1M2_${MOMENTUM_CUTOFF}.json 2>&1)
          rc=$?
          printf '%s\n' "$output"
          if [ "$rc" -eq 0 ]; then
            echo 'collection_state=collected' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$output" | grep -Eq 'cutoff .* absent from canonical prices'; then
            echo 'collection_state=wait_source_close' >> "$GITHUB_OUTPUT"
            echo 'MOMENTUM_COLLECTION=AMBER_WAIT_SOURCE_CLOSE'
            exit 0
          fi
          echo 'collection_state=processing_failure' >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Build canonical Momentum status
        id: build_status
        if: steps.v2a.outputs.source_ok == 'true' && steps.freeze.outcome == 'success' && steps.collect_snapshot.outcome == 'success' && steps.collect_snapshot.outputs.collection_state == 'collected'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('runtime_repo/runtime/ledgers/momentum_m1_m2')
          snaps=sorted(p for p in root.glob('*.json') if p.name != 'STATUS.json')
          assert snaps, 'no momentum snapshots'
          latest=json.loads(snaps[-1].read_text(encoding='utf-8'))
          safety=latest['safety']
          assert safety['research_only'] is True and safety['shadow_only'] is True and safety['not_approved'] is True
          assert safety['engine_feed'] is False and safety['orders'] == 0 and safety['real_capital'] == 0
          status={
            'schema':'gate_btc.momentum_m1_m2.status.v1',
            'status':'ACTIVE_PROSPECTIVE_SHADOW',
            'data_as_of':latest['cutoff'],
            'observed_snapshots':len(snaps),
            'latest_snapshot_sha256':latest['snapshot_sha256'],
            'm1_summary':latest['m1']['summary'],
            'm2_summary':latest['m2']['summary'],
            'research_only':True,'shadow_only':True,'not_approved':True,
            'engine_feed':False,'orders_generated':0,'real_capital_used':0,
            'promotion_allowed':False,
          }
          (root/'STATUS.json').write_text(json.dumps(status,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          Path('artifacts/momentum/STATUS.json').write_text(json.dumps(status,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps({'status':status['status'],'data_as_of':status['data_as_of'],'observed_snapshots':status['observed_snapshots']},sort_keys=True))
          PY

      - name: Build AMBER runtime status when waiting for public data
        if: steps.v2a.outputs.source_ok != 'true' || steps.collect_snapshot.outputs.collection_state == 'wait_source_close'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('runtime_repo/runtime/ledgers/momentum_m1_m2')
          root.mkdir(parents=True, exist_ok=True)
          p=root/'STATUS.json'
          existing={}
          if p.exists():
              try: existing=json.loads(p.read_text(encoding='utf-8'))
              except Exception: existing={}
          waiting_close='${{ steps.collect_snapshot.outputs.collection_state }}' == 'wait_source_close'
          status={
            'schema':'gate_btc.momentum_m1_m2.status.v1',
            'status':'WAIT_SOURCE_PUBLICATION' if waiting_close else 'BLOCKED_SOURCE_RETRY_EXHAUSTED',
            'requested_cutoff':os.environ['MOMENTUM_CUTOFF'],
            'data_as_of':existing.get('data_as_of'),
            'prospective_freeze_date':existing.get('prospective_freeze_date','2026-08-21'),
            'observed_snapshots':existing.get('observed_snapshots',0),
            'last_run_state':'NO_NEW_SNAPSHOT_CUTOFF_NOT_PUBLISHED' if waiting_close else 'NO_NEW_SNAPSHOT_PUBLIC_SOURCE_UNAVAILABLE',
            'methodology_failure':False,
            'repair_scope':'ORCHESTRATION_AND_DATA_DELIVERY_ONLY',
            'research_only':True,'shadow_only':True,'not_approved':True,
            'engine_feed':False,'allocation_weight':0,'orders_generated':0,'real_capital_used':0,
            'promotion_allowed':False,'automatic_tuning':False,'backfill_allowed':False,
          }
          p.write_text(json.dumps(status,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          Path('artifacts/momentum/STATUS.json').write_text(json.dumps(status,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('MOMENTUM_DELIVERY=AMBER_WAIT_DATA')
          PY

      - name: Build RED diagnostic status on true processing failure
        if: steps.v2a.outputs.source_ok == 'true' && (steps.freeze.outcome != 'success' || steps.collect_snapshot.outcome != 'success' || steps.collect_snapshot.outputs.collection_state == 'processing_failure' || (steps.collect_snapshot.outputs.collection_state == 'collected' && steps.build_status.outcome != 'success'))
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('runtime_repo/runtime/ledgers/momentum_m1_m2')
          root.mkdir(parents=True, exist_ok=True)
          p=root/'STATUS.json'
          existing={}
          if p.exists():
              try: existing=json.loads(p.read_text(encoding='utf-8'))
              except Exception: existing={}
          status={
            'schema':'gate_btc.momentum_m1_m2.status.v1',
            'status':'RED_TRUE_PROCESSING_FAILURE',
            'data_as_of':os.environ['MOMENTUM_CUTOFF'],
            'prospective_freeze_date':existing.get('prospective_freeze_date','2026-08-21'),
            'observed_snapshots':existing.get('observed_snapshots',0),
            'last_run_state':'SOURCE_AVAILABLE_BUT_FREEZE_COLLECT_OR_STATUS_FAILED',
            'methodology_failure':False,
            'repair_scope':'ORCHESTRATION_AND_DATA_DELIVERY_ONLY',
            'research_only':True,'shadow_only':True,'not_approved':True,
            'engine_feed':False,'allocation_weight':0,'orders_generated':0,'real_capital_used':0,
            'promotion_allowed':False,'automatic_tuning':False,'backfill_allowed':False,
          }
          p.write_text(json.dumps(status,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          Path('artifacts/momentum/STATUS.json').write_text(json.dumps(status,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('MOMENTUM_DELIVERY=RED_TRUE_PROCESSING_FAILURE')
          PY

      - name: Upload shadow evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-momentum-m1m2-${{ github.run_id }}
          path: |
            artifacts/momentum
            artifacts/momentum_qos/v2a_frozen_replay_evidence
            artifacts/momentum_diagnostics
          retention-days: 90
          if-no-files-found: warn

      - name: Publish append-only runtime status or snapshot
        if: always()
        run: |
          set -euo pipefail
          git -C runtime_repo config user.name 'gate-btc-actions'
          git -C runtime_repo config user.email 'gate-btc-actions@users.noreply.github.com'
          git -C runtime_repo add runtime/ledgers/momentum_m1_m2
          if git -C runtime_repo diff --cached --quiet; then
            echo 'Momentum runtime already current'
            exit 0
          fi
          git -C runtime_repo commit -m "Update Momentum M1/M2 shadow status ${MOMENTUM_CUTOFF}"
          for attempt in 1 2 3 4 5; do
            git -C runtime_repo fetch origin gate-btc-runtime
            if ! git -C runtime_repo rebase origin/gate-btc-runtime; then
              git -C runtime_repo rebase --abort || true
              exit 1
            fi
            if git -C runtime_repo push origin HEAD:gate-btc-runtime; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Enforce true processing failures only
        if: always()
        run: |
          if [ "${{ steps.v2a.outputs.source_ok }}" = "true" ] && \
             { [ "${{ steps.freeze.outcome }}" != "success" ] || [ "${{ steps.collect_snapshot.outputs.collection_state }}" = "processing_failure" ] || { [ "${{ steps.collect_snapshot.outputs.collection_state }}" = "collected" ] && [ "${{ steps.build_status.outcome }}" != "success" ]; }; }; then
            echo 'MOMENTUM_COLLECTION=RED_TRUE_PROCESSING_FAILURE'
            exit 1
          fi
          if [ "${{ steps.collect_snapshot.outputs.collection_state }}" = "wait_source_close" ]; then
            echo 'MOMENTUM_COLLECTION=AMBER_WAIT_SOURCE_PUBLICATION'
          elif [ "${{ steps.v2a.outputs.source_ok }}" = "true" ]; then
            echo 'MOMENTUM_COLLECTION=GREEN'
          else
            echo 'MOMENTUM_COLLECTION=AMBER_SOURCE_BLOCKED_FAIL_CLOSED'
          fi
          echo 'RESEARCH_ONLY=true'
          echo 'ORDERS=0'
          echo 'REAL_CAPITAL=0'
