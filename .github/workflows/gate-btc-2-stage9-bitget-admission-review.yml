name: GATE BTC 2 Stage 9 Bitget Admission Review

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-2-stage9-bitget-admission-review.yml
      - tools/gate_btc_2_stage9_bitget_admission_review.py
      - tools/gate_btc_2_stage9_bitget_preregistration_v1.json
      - tools/gate_btc_2_stage9_source_preregistration.py
      - tools/gate_btc_2_microstructure_shadow_contract_v1.json
      - tests/test_gate_btc_2_stage9_bitget_admission_review.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  GATE_BTC_SHADOW_ONLY: "true"
  GATE_BTC_NOT_APPROVED: "true"
  GATE_BTC_ENGINE_FEED: "false"
  GATE_BTC_ORDERS: "0"
  GATE_BTC_REAL_CAPITAL: "0"
  GATE_BTC_NO_RETUNE: "true"
  GATE_BTC_NO_BACKFILL: "true"
  GATE_BTC_FAIL_CLOSED: "true"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  explicit-admission-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Compile reviewer and tests
        run: python -m py_compile tools/gate_btc_2_stage9_bitget_admission_review.py tests/test_gate_btc_2_stage9_bitget_admission_review.py
      - name: Run fail-closed regression suite
        run: python -m unittest -v tests.test_gate_btc_2_stage9_bitget_admission_review
      - name: Download exact first-forward artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p captured
          gh run download 33287403941 --repo "${{ github.repository }}" --name gate-btc-stage9-bitget-first-forward-33287403941 --dir captured
      - name: Verify artifact identity and explicit admission
        run: |
          python -m tools.gate_btc_2_stage9_bitget_admission_review \
            --capture-dir captured \
            --review-out review/bitget_stage9_review.json \
            --admission-out review/bitget_stage9_admission.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('review/bitget_stage9_admission.json').read_text())
          assert a['decision']=='ADMITTED_FORWARD_ONLY'
          assert a['source_admitted_for_shadow_collection'] is True
          assert a['prospective_observations_admitted']==1
          assert a['forward_only'] is True and a['backfill'] is False
          assert a['silent_source_substitution'] is False
          assert a['research_only'] and a['shadow_only'] and a['not_approved']
          assert a['no_retune'] and a['no_backfill'] and a['fail_closed']
          assert a['stage_9_complete'] is False and a['economics_allowed'] is False
          assert a['engine_feed'] is False and a['orders_generated']==0 and a['real_capital_used']==0
          print('BITGET_STAGE9_EXPLICIT_ADMISSION=PASS')
          PY
      - name: Preserve admission evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-stage9-bitget-admission-${{ github.run_id }}
          path: review/
          if-no-files-found: error
          retention-days: 30
