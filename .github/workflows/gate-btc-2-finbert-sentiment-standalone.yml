name: GATE BTC FinBERT Sentiment Standalone

on:
  pull_request:
    paths:
      - 'artifacts/gate_btc_2/finbert_research/**'
      - 'tools/gate_btc_2_finbert_sentiment_runner.py'
      - 'tests/test_gate_btc_2_finbert_sentiment_runner.py'
      - '.github/workflows/gate-btc-2-finbert-sentiment-standalone.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESEARCH_ONLY: 'true'
      SHADOW_ONLY: 'true'
      REAL_CAPITAL_BRL: '0'
      ORDERS: '0'
      NO_RETUNE: 'true'
      NO_BACKFILL: 'true'
      FACTORY_RUNTIME_UNTOUCHED: 'true'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests
        run: python -m unittest tests.test_gate_btc_2_finbert_sentiment_runner -v

      - name: Assert research boundary
        shell: bash
        run: |
          test "$RESEARCH_ONLY" = true
          test "$SHADOW_ONLY" = true
          test "$REAL_CAPITAL_BRL" = 0
          test "$ORDERS" = 0
          test "$NO_RETUNE" = true
          test "$NO_BACKFILL" = true
          test "$FACTORY_RUNTIME_UNTOUCHED" = true

      - name: Install frozen capability dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=4.56,<5' 'datasets>=3,<5' 'huggingface_hub>=0.34,<2'

      - name: Run full frozen benchmark
        run: |
          python tools/gate_btc_2_finbert_sentiment_runner.py \
            --output artifacts_live/finbert_sentiment

      - name: Assert tangible zero-capital artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts_live/finbert_sentiment/SUMMARY.json')
          assert p.exists(), p
          s = json.loads(p.read_text())
          assert s['qa']['pass'] is True
          assert s['research_only'] is True
          assert s['shadow_only'] is True
          assert s['orders'] == 0
          assert s['real_capital_brl'] == 0
          assert s['integrated_economic_comparison_authorized'] is False
          assert s['timestamped_crypto_news_corpus_proven'] is False
          assert s['economic_claim_authorized'] is False
          assert s['factory_migration_authorized'] is False
          assert s['factory_runtime_untouched'] is True
          assert s['no_retune'] is True
          assert s['no_backfill'] is True
          assert Path('artifacts_live/finbert_sentiment/PREDICTIONS.jsonl').exists()
          print(json.dumps(s, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-btc-finbert-sentiment-standalone
          path: artifacts_live/finbert_sentiment
          if-no-files-found: error
          retention-days: 90
