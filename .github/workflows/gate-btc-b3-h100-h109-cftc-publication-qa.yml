name: GATE BTC B3 H100-H109 CFTC Publication QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_b3_h100_h109_cftc_publication_contract.json'
      - 'tools/gate_btc_b3_h100_h109_cftc_publication_qa.py'
      - '.github/workflows/gate-btc-b3-h100-h109-cftc-publication-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_NOT_APPROVED: 'true'
  GATE_BTC_ORDERS: '0'
  GATE_BTC_REAL_CAPITAL: '0'
  GATE_BTC_ENGINE_FEED: 'false'

jobs:
  publication-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate conservative publication availability contract
        run: python tools/gate_btc_b3_h100_h109_cftc_publication_qa.py
      - name: Assert no economics or unsafe activation
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/b3_h100_h109/B3_H100_H109_CFTC_PUBLICATION_QA.json'))
          assert p['status']=='PASS_CONSERVATIVE_PUBLICATION_CONTRACT_FROZEN'
          assert p['economics_run'] is False
          assert p['h1_economics_read'] is False
          assert p['survivor_partial_economics_read'] is False
          assert p['orders_generated']==0 and p['real_capital_used']==0
          assert p['engine_feed'] is False and p['not_approved'] is True
          print('PASS H100-H109 publication timing remains pre-economics and fail-closed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b3-h100-h109-cftc-publication-qa-${{ github.run_id }}
          path: artifacts/b3_h100_h109/B3_H100_H109_CFTC_PUBLICATION_QA.json
          if-no-files-found: error
          retention-days: 30
