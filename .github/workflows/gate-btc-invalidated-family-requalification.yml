name: GATE BTC Invalidated Family Requalification

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  workflow_run:
    workflows: ["GATE BTC Factory Root Cause Audit"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/finalize_invalidated_gap.py'
      - 'tools/gate_btc_factory/INVALIDATED_DEFINITIVE_GAP_POLICY.v1.json'
      - '.github/workflows/gate-btc-invalidated-family-requalification.yml'
  pull_request:
    paths:
      - 'tools/gate_btc_factory/invalidated_family_requalification_runner.py'
      - 'tools/gate_btc_factory/finalize_invalidated_gap.py'
      - 'tools/gate_btc_factory/INVALIDATED_FAMILY_REQUALIFICATION.v1.json'
      - 'tools/gate_btc_factory/INVALIDATED_REQUALIFICATION_SOURCE_GATE.v1.json'
      - 'tools/gate_btc_factory/INVALIDATED_DEFINITIVE_GAP_POLICY.v1.json'
      - 'tests/test_gate_btc_invalidated_family_requalification_runner.py'
      - '.github/workflows/gate-btc-invalidated-family-requalification.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: gate-btc-invalidated-family-requalification
  cancel-in-progress: false

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_NOT_APPROVED: 'true'
  GATE_BTC_ENGINE_FEED: 'false'
  GATE_BTC_ORDERS: '0'
  GATE_BTC_REAL_CAPITAL: '0'
  GATE_BTC_NO_RETUNE: 'true'
  GATE_BTC_NO_BACKFILL: 'true'
  GATE_BTC_NO_COUNTER_RESET: 'true'
  GATE_BTC_FAIL_CLOSED: 'true'
  H1_ECONOMICS_READ: 'false'

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy pandas
      - run: python -m pytest -q tests/test_gate_btc_invalidated_family_requalification_runner.py
      - run: python -m py_compile tools/gate_btc_factory/finalize_invalidated_gap.py

  requalify-all:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out canonical main code
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_repo

      - name: Check out append-only runtime
        uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evaluator dependencies
        run: python -m pip install numpy pandas

      - name: Validate requalification policy and root-cause scope
        run: |
          set -euo pipefail
          test -f main_repo/tools/gate_btc_factory/INVALIDATED_FAMILY_REQUALIFICATION.v1.json
          test -f main_repo/tools/gate_btc_factory/INVALIDATED_DEFINITIVE_GAP_POLICY.v1.json
          test -f runtime_repo/runtime/factory_autonomy/ROOT_CAUSE_RUNTIME.json
          test -d runtime_repo/runtime/autonomous_science/results
          python - <<'PY'
          import json
          r=json.load(open('runtime_repo/runtime/factory_autonomy/ROOT_CAUSE_RUNTIME.json',encoding='utf-8'))
          assert r['root_cause_classification']=='SOURCE_DATA_GAP'
          assert r['root_cause_unresolved'] is False
          a=r['affected_scope']
          assert int(a['family_count'])==len(a['family_ids']) and len(a['family_ids'])>0
          assert r['historical_integrity_status']=='HISTORICAL_RESULT_INVALIDATED_BY_MECHANICAL_DEFECT'
          print('AFFECTED_FAMILY_COUNT='+str(a['family_count']))
          PY

      - name: Resolve legacy global source gate and independent dataset
        id: source
        run: |
          set -euo pipefail
          GATE='runtime_repo/runtime/factory_autonomy/invalidated_requalification/SOURCE_GATE.json'
          echo "gate=$GATE" >> "$GITHUB_OUTPUT"
          if [ ! -f "$GATE" ]; then
            echo 'dataset=' >> "$GITHUB_OUTPUT"
            echo 'source_gate_present=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REL=$(python - <<'PY'
          import json
          g=json.load(open('runtime_repo/runtime/factory_autonomy/invalidated_requalification/SOURCE_GATE.json',encoding='utf-8'))
          print(g.get('dataset_relative_path',''))
          PY
          )
          if [ -n "$REL" ]; then
            echo "dataset=runtime_repo/$REL" >> "$GITHUB_OUTPUT"
          else
            echo 'dataset=' >> "$GITHUB_OUTPUT"
          fi
          echo 'source_gate_present=true' >> "$GITHUB_OUTPUT"

      - name: Build or advance independently source-gated family queue
        working-directory: main_repo
        env:
          SOURCE_GATE: ../${{ steps.source.outputs.gate }}
          DATASET: ../${{ steps.source.outputs.dataset }}
          SCOPED_SOURCE_GATES: ../runtime_repo/runtime/factory_autonomy/invalidated_requalification/source_gates
        run: |
          set -euo pipefail
          OUT='../runtime_repo/runtime/factory_autonomy/invalidated_requalification/QUEUE.json'
          EXISTING=()
          [ -f "$OUT" ] && EXISTING=(--existing "$OUT")
          SG=()
          [ -f "$SOURCE_GATE" ] && SG=(--source-gate "$SOURCE_GATE")
          SGS=()
          [ -d "$SCOPED_SOURCE_GATES" ] && SGS=(--source-gates-dir "$SCOPED_SOURCE_GATES")
          DS=()
          [ -n "${DATASET:-}" ] && [ -f "$DATASET" ] && DS=(--dataset "$DATASET")
          python -m tools.gate_btc_factory.invalidated_family_requalification_runner \
            --root-cause ../runtime_repo/runtime/factory_autonomy/ROOT_CAUSE_RUNTIME.json \
            --policy tools/gate_btc_factory/INVALIDATED_FAMILY_REQUALIFICATION.v1.json \
            --results-dir ../runtime_repo/runtime/autonomous_science/results \
            "${SG[@]}" \
            "${SGS[@]}" \
            "${DS[@]}" \
            "${EXISTING[@]}" \
            --runtime-dir ../runtime_repo/runtime/factory_autonomy/invalidated_requalification \
            --output "$OUT"

      - name: Close exhausted source gap without erasing future reactivation
        run: |
          set -euo pipefail
          SEARCH='runtime_repo/runtime/factory_autonomy/invalidated_requalification/SOURCE_SEARCH_RUNTIME.json'
          QUEUE='runtime_repo/runtime/factory_autonomy/invalidated_requalification/QUEUE.json'
          if [ -f "$SEARCH" ]; then
            python main_repo/tools/gate_btc_factory/finalize_invalidated_gap.py \
              --queue "$QUEUE" \
              --search "$SEARCH" \
              --policy main_repo/tools/gate_btc_factory/INVALIDATED_DEFINITIVE_GAP_POLICY.v1.json
          fi

      - name: Validate no historical mutation and no live trading
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='runtime_repo/runtime/factory_autonomy/invalidated_requalification/QUEUE.json'
          q=json.load(open(p,encoding='utf-8'))
          assert q['affected_family_count']==q['queued_family_count']
          assert len(q['families'])==q['affected_family_count']
          ids=[x['original_family_id'] for x in q['families']]
          assert len(ids)==len(set(ids))
          s=q['safety']
          assert s['research_only'] and s['shadow_only'] and s['not_approved']
          assert s['engine_feed'] is False and s['orders']==0 and s['real_capital']==0
          assert s['no_retune'] and s['no_backfill'] and s['no_counter_reset'] and s['fail_closed']
          assert s['h1_economics_read'] is False
          if q.get('legacy_passive_backlog_closed') is True:
              assert q.get('waiting_source_count') == 0
              assert q.get('definitive_external_data_gap_count') == q['affected_family_count']
          print('REQUALIFICATION_SAFETY=PASS')
          PY

      - name: Publish append-only requalification runtime
        working-directory: runtime_repo
        run: |
          set -euo pipefail
          git config user.name gate-btc-actions
          git config user.email gate-btc-actions@users.noreply.github.com
          git add runtime/factory_autonomy/invalidated_requalification
          git diff --cached --quiet && exit 0
          git commit -m 'Advance invalidated-family requalification queue'
          for attempt in 1 2 3 4 5; do
            git fetch origin gate-btc-runtime
            if ! git rebase origin/gate-btc-runtime; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:gate-btc-runtime; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
