name: GATE BTC Invalidated 512 Partial Triage

on:
  push:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/**'
      - '.github/workflows/gate-btc-crypto-grammar-scout.yml'
      - '.github/workflows/gate-btc-invalidated-512-partial-triage.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/gate_btc_factory/invalidated_partial_triage.py'
      - 'tools/gate_btc_factory/INVALIDATED_PARTIAL_TRIAGE_CONTRACT.v1.json'
      - 'tools/gate_btc_factory/INVALIDATED_PARTIAL_SOURCE_EVIDENCE_20260911.json'
      - 'tests/test_gate_btc_invalidated_partial_triage.py'
      - '.github/workflows/gate-btc-invalidated-512-partial-triage.yml'

permissions:
  contents: write

jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      RESEARCH_ONLY: 'true'
      SHADOW_ONLY: 'true'
      NOT_APPROVED: 'true'
      ENGINE_FEED: 'false'
      ORDERS: '0'
      REAL_CAPITAL: '0'
      NO_BACKFILL: 'true'
      NO_LATE_SEAL: 'true'
      NO_COUNTER_RESET: 'true'
      NO_RETUNE: 'true'
      FAIL_CLOSED: 'true'
      H1_ECONOMICS_READ: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test immutable partial-triage boundary
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_gate_btc_invalidated_partial_triage.py
      - name: Run structural/priority triage only
        run: |
          python tools/gate_btc_factory/invalidated_partial_triage.py \
            --queue runtime_repo/runtime/factory_autonomy/invalidated_requalification/QUEUE.json \
            --evidence tools/gate_btc_factory/INVALIDATED_PARTIAL_SOURCE_EVIDENCE_20260911.json \
            --output INVALIDATED_512_PARTIAL_TRIAGE_RESULT.json
      - name: Assert no scientific authority
        run: |
          python - <<'PY'
          import json
          d=json.load(open('INVALIDATED_512_PARTIAL_TRIAGE_RESULT.json'))
          assert d['strict_v2_unchanged'] is True
          assert d['source_admission_pass'] is False
          assert d['economics_feedback_allowed'] is False
          assert d['promotion_allowed'] is False
          assert d['scientific_rejection_from_partial_performance_allowed'] is False
          PY
      - name: Persist triage audit and latest pointer
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p runtime_repo/runtime/factory_autonomy/invalidated_requalification/partial_triage_audits
          cp INVALIDATED_512_PARTIAL_TRIAGE_RESULT.json "runtime_repo/runtime/factory_autonomy/invalidated_requalification/partial_triage_audits/${{ github.run_id }}.json"
          cp INVALIDATED_512_PARTIAL_TRIAGE_RESULT.json runtime_repo/runtime/factory_autonomy/invalidated_requalification/PARTIAL_TRIAGE_RUNTIME.json
          cd runtime_repo
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          git add runtime/factory_autonomy/invalidated_requalification/partial_triage_audits runtime/factory_autonomy/invalidated_requalification/PARTIAL_TRIAGE_RUNTIME.json
          git commit -m "Factory partial triage ${{ github.run_id }}" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin gate-btc-runtime && git push origin HEAD:gate-btc-runtime && exit 0
            sleep $((i*2))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: invalidated-512-partial-triage-${{ github.run_id }}
          path: INVALIDATED_512_PARTIAL_TRIAGE_RESULT.json
