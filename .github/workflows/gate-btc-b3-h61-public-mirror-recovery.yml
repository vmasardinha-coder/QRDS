name: GATE BTC B3 H61 Public Mirror Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_b3_h61_public_mirror_prereg.md'
      - 'tools/gate_btc_b3_h61_public_mirror_recovery.py'
      - '.github/workflows/gate-btc-b3-h61-public-mirror-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_NOT_APPROVED: 'true'
  GATE_BTC_ORDERS: '0'
  GATE_BTC_REAL_CAPITAL: '0'
  GATE_BTC_ENGINE_FEED: 'false'

jobs:
  recover-h61:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy requests
      - name: Run fail-closed mirror QA and frozen H61 economics only if QA passes
        run: |
          python tools/gate_btc_b3_h61_public_mirror_recovery.py \
            --out /tmp/B3_H61_PUBLIC_MIRROR_RECOVERY.json \
            --cells /tmp/B3_H61_PUBLIC_MIRROR_CELLS.csv \
            --ledger /tmp/B3_H61_PUBLIC_MIRROR_LEDGER.jsonl
      - name: Assert invariants and admissible scientific states
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/B3_H61_PUBLIC_MIRROR_RECOVERY.json'))
          assert p['cutoff_exclusive']=='2026-08-10'
          assert p['result']['state'] in {'SURVIVOR_REPLICATED','REJECTED_FAILED_REPLICATION','REJECTED_DISCOVERY','DATA_GAP'}
          assert p['h1_economics_read'] is False
          assert p['survivor_partial_economics_read'] is False
          assert p['synthetic_backfill'] is False
          assert p['orders_generated']==0 and p['real_capital_used']==0 and p['engine_feed'] is False
          if p['result']['state']=='DATA_GAP':
              assert p['result']['source']['economics_run'] is False
          else:
              s=p['result']['source']
              assert s['status']=='PASS' and s['economics_run'] is True
              assert s['sanity']['status']=='PASS'
              assert s['discovery_join_coverage']>=0.90 and s['replication_join_coverage']>=0.90
          print('B3_H61_PUBLIC_MIRROR_RECOVERY=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b3-h61-public-mirror-recovery-${{ github.run_id }}
          path: |
            /tmp/B3_H61_PUBLIC_MIRROR_RECOVERY.json
            /tmp/B3_H61_PUBLIC_MIRROR_CELLS.csv
            /tmp/B3_H61_PUBLIC_MIRROR_LEDGER.jsonl
          retention-days: 30
          if-no-files-found: error
