name: GATE BTC Factory 008 Freqtrade Industrial Prereg

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/GRAMMAR_008_FREQTRADE_INDUSTRIAL_PREREG_20260921.json'
      - 'tests/test_gate_btc_grammar_008_freqtrade_industrial_prereg.py'
      - '.github/workflows/gate-btc-factory-008-freqtrade-prereg.yml'
  push:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/GRAMMAR_008_FREQTRADE_INDUSTRIAL_PREREG_20260921.json'
      - 'tests/test_gate_btc_grammar_008_freqtrade_industrial_prereg.py'
      - '.github/workflows/gate-btc-factory-008-freqtrade-prereg.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test frozen finite batch
        run: python -m unittest -v tests/test_gate_btc_grammar_008_freqtrade_industrial_prereg.py
      - name: Assert no Grammar 008 outcome read at freeze
        run: |
          python - <<'PY'
          import json
          p='tools/gate_btc_factory/GRAMMAR_008_FREQTRADE_INDUSTRIAL_PREREG_20260921.json'
          x=json.load(open(p))
          assert x['status']=='FROZEN_BEFORE_SOURCE_OUTCOME_READ'
          assert x['candidate_count']==24
          assert x['target_boundary_at_freeze']['grammar_008_market_data_fetched'] is False
          assert x['target_boundary_at_freeze']['outcomes_read'] is False
          assert x['target_boundary_at_freeze']['economics_read'] is False
          assert x['safety']['ENGINE_FEED'] is False and x['safety']['ORDERS']==0 and x['safety']['REAL_CAPITAL']==0
          print('GRAMMAR_008_PREREG=FROZEN_24_CANDIDATES_NO_OUTCOME_READ')
          PY
      - name: Persist canonical prereg evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git fetch origin gate-btc-runtime
          git worktree add runtime-tree origin/gate-btc-runtime
          mkdir -p runtime-tree/runtime/factory_autonomy
          cp tools/gate_btc_factory/GRAMMAR_008_FREQTRADE_INDUSTRIAL_PREREG_20260921.json runtime-tree/runtime/factory_autonomy/GRAMMAR_008_FREQTRADE_INDUSTRIAL_PREREG_RUNTIME.json
          cd runtime-tree
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          git add runtime/factory_autonomy/GRAMMAR_008_FREQTRADE_INDUSTRIAL_PREREG_RUNTIME.json
          git commit -m "Persist Grammar 008 industrial prereg" || exit 0
          for n in 1 2 3 4 5; do
            git pull --rebase origin gate-btc-runtime && git push origin HEAD:gate-btc-runtime && exit 0
            sleep $((n*2))
          done
          exit 1
