name: GATE BTC B3 H70-H79 Data QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_b3_h70_h79_prereg.md'
      - 'tools/gate_btc_b3_h70_h79_data_probe.py'
      - '.github/workflows/gate-btc-b3-h70-h79-data-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_NOT_APPROVED: 'true'
  GATE_BTC_ORDERS: '0'
  GATE_BTC_REAL_CAPITAL: '0'
  GATE_BTC_ENGINE_FEED: 'false'

jobs:
  data-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy requests xlrd
      - name: Probe official sources before any H70-H79 economics
        run: python tools/gate_btc_b3_h70_h79_data_probe.py --out /tmp/B3_H70_H79_DATA_QA.json
      - name: Assert pre-result safety and fail-closed family states
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/B3_H70_H79_DATA_QA.json'))
          assert p['economics_run'] is False
          assert p['cutoff_exclusive']=='2026-08-10'
          assert p['h1_economics_read'] is False and p['survivor_partial_economics_read'] is False
          assert p['synthetic_backfill'] is False
          assert p['orders_generated']==0 and p['real_capital_used']==0 and p['engine_feed'] is False
          assert set(p['families'])=={f'H{i}' for i in range(70,80)}
          assert all(v['status'] in {'DATA_READY','DATA_GAP'} for v in p['families'].values())
          print({k:v['status'] for k,v in p['families'].items()})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b3-h70-h79-data-qa-${{ github.run_id }}
          path: /tmp/B3_H70_H79_DATA_QA.json
          retention-days: 30
          if-no-files-found: error
