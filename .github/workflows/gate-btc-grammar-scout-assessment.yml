name: GATE BTC Grammar Scout Assessment
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  assessment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install -q pytest
          pytest -q tests/test_gate_btc_grammar_scout_current_assessment.py
