name: GATE BTC pending batch23 validation
on:
  pull_request:
    branches: [main]
    paths:
      - tools/gate_btc_usx_pool_history.py
      - tests/test_gate_btc_usx_pool_history.py
      - tools/gate_btc_momentum_m3_economics.py
      - tools/gate_btc_momentum_m3_persistence.py
      - tools/gate_btc_momentum_required_prices.py
      - tools/gate_btc_momentum_economic_shadow.py
      - tools/gate_btc_pit150_qualified_history.py
      - tools/gate_btc_hash_settlement_history.py
      - tools/gate_btc_pit150_figure_history_audit.py
      - tools/gate_btc_a7a5_swap_history.py
      - tools/gate_btc_reusd_swap_history.py
      - tools/gate_btc_xagent_spot_experiment.py
      - tools/gate_btc_system13_governed_bars.py
      - tools/gate_btc_system13_source_readiness.py
      - tools/gate_btc_system13_native_capture.py
      - tests/test_gate_btc_system13_native_capture.py
      - tools/gate_btc_factory/SYSTEM13_EXACT_IDENTITY_DISCOVERY_20261023.json
      - tools/gate_btc_factory/SYSTEM13_EXACT_IDENTITY_EXTENSION_20261023_XT.json
      - tests/test_gate_btc_system13_source_readiness.py
      - tests/test_gate_btc_momentum_m3_economics.py
      - tests/test_gate_btc_research_progress22.py
      - tests/test_gate_btc_system13_governed_bars.py
      - .github/workflows/gate-btc-pending-batch23-validation.yml
      - .github/workflows/gate-btc-research-progress22.yml
  push:
    branches: [main]
    paths:
      - tools/gate_btc_usx_pool_history.py
      - tests/test_gate_btc_usx_pool_history.py
      - tools/gate_btc_momentum_m3_economics.py
      - tools/gate_btc_momentum_m3_persistence.py
      - tools/gate_btc_momentum_required_prices.py
      - tools/gate_btc_momentum_economic_shadow.py
      - tools/gate_btc_pit150_qualified_history.py
      - tools/gate_btc_hash_settlement_history.py
      - tools/gate_btc_pit150_figure_history_audit.py
      - tools/gate_btc_a7a5_swap_history.py
      - tools/gate_btc_reusd_swap_history.py
      - tools/gate_btc_xagent_spot_experiment.py
      - tools/gate_btc_system13_governed_bars.py
      - tools/gate_btc_system13_source_readiness.py
      - tools/gate_btc_system13_native_capture.py
      - tests/test_gate_btc_system13_native_capture.py
      - tools/gate_btc_factory/SYSTEM13_EXACT_IDENTITY_DISCOVERY_20261023.json
      - tools/gate_btc_factory/SYSTEM13_EXACT_IDENTITY_EXTENSION_20261023_XT.json
      - tests/test_gate_btc_system13_source_readiness.py
      - .github/workflows/gate-btc-pending-batch23-validation.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_gate_btc_momentum_m3_economics.py -v
      - run: python -m unittest discover -s tests -p test_gate_btc_research_progress22.py -v
      - run: python -m unittest discover -s tests -p test_gate_btc_system13_governed_bars.py -v
      - run: python -m unittest discover -s tests -p test_gate_btc_system13_source_readiness.py -v
      - run: python -m unittest discover -s tests -p test_gate_btc_system13_native_capture.py -v


