name: GATE BTC XAWINWDO MT5 Safety Matrix
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/XAWINWDO_MT5_PRIMARY_EXPERIMENT.v1.json'
      - 'tools/gate_btc_factory/XAWINWDO_MT5_PROMOTION_GATE.v1.json'
      - 'tests/test_gate_btc_xawinwdo_mt5_safety_matrix.py'
      - '.github/workflows/gate-btc-xawinwdo-mt5-safety-matrix.yml'
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install -q pytest
          pytest -q tests/test_gate_btc_xawinwdo_mt5_safety_matrix.py
