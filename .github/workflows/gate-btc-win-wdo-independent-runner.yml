name: GATE BTC WIN WDO Independent Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/win_wdo_mt5_qualify.py'
      - 'tools/gate_btc_factory/win_wdo_mt5_materialize.py'
      - 'tools/gate_btc_factory/win_wdo_regime_002_materialize.py'
      - 'tools/gate_btc_factory/xawinwdo_regime_003_capacity_audit.py'
      - 'tools/gate_btc_factory/xawinwdo_regime_004_capacity_audit.py'
      - 'tools/gate_btc_factory/xawinwdo_regime_005_capacity_audit.py'
      - 'tools/gate_btc_factory/xawinwdo_regime_005_materialize.py'
      - 'tools/gate_btc_factory/xawinwdo_regime_005_discovery.py'
      - '.github/workflows/gate-btc-win-wdo-independent-runner.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/win_wdo_mt5_qualify.py'
      - 'tools/gate_btc_factory/win_wdo_mt5_materialize.py'
      - 'tests/test_gate_btc_win_wdo_mt5_qualify.py'
      - '.github/workflows/gate-btc-win-wdo-independent-runner.yml'
permissions:
  contents: write
env:
  RESEARCH_ONLY: 'true'
  SHADOW_ONLY: 'true'
  NOT_APPROVED: 'true'
  ENGINE_FEED: 'false'
  ORDERS: '0'
  REAL_CAPITAL: '0'
  NO_RETUNE: 'true'
  NO_BACKFILL: 'true'
  NO_COUNTER_RESET: 'true'
  FAIL_CLOSED: 'true'
  H1_ECONOMICS_READ: 'false'
concurrency:
  group: gate-btc-win-wdo-independent-runner-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {path: source_repo}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Assert immutable boundary
        run: |
          test "$RESEARCH_ONLY" = true; test "$SHADOW_ONLY" = true; test "$NOT_APPROVED" = true
          test "$ENGINE_FEED" = false; test "$ORDERS" = 0; test "$REAL_CAPITAL" = 0
          test "$NO_RETUNE" = true; test "$NO_BACKFILL" = true; test "$NO_COUNTER_RESET" = true
          test "$FAIL_CLOSED" = true; test "$H1_ECONOMICS_READ" = false
      - name: Regression tests
        run: |
          python -m pip install -q pytest
          cd source_repo
          python -m py_compile tools/gate_btc_factory/win_wdo_mt5_qualify.py tools/gate_btc_factory/win_wdo_mt5_materialize.py tools/gate_btc_factory/win_wdo_regime_002_materialize.py tools/gate_btc_factory/xawinwdo_regime_003_capacity_audit.py tools/gate_btc_factory/xawinwdo_regime_004_capacity_audit.py tools/gate_btc_factory/xawinwdo_regime_005_capacity_audit.py tools/gate_btc_factory/xawinwdo_regime_005_materialize.py tools/gate_btc_factory/xawinwdo_regime_005_discovery.py
          pytest -q tests/test_gate_btc_win_wdo_mt5_qualify.py
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 0
      - name: Qualify authorized MT5 source and materialize frozen family
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          PACKET=runtime_repo/runtime/factory_sources/mt5/xawinwdo/DEEP_HISTORY_PACKET.json
          test -f "$PACKET"
          mkdir -p runtime_repo/runtime/factory_autonomy/win_wdo
          python source_repo/tools/gate_btc_factory/win_wdo_mt5_qualify.py --packet "$PACKET" --out runtime_repo/runtime/factory_autonomy/win_wdo/MT5_QUALIFICATION.json
          python source_repo/tools/gate_btc_factory/win_wdo_mt5_materialize.py --packet "$PACKET" --out runtime_repo/runtime/factory_autonomy/win_wdo/WIN_WDO_MATERIALIZED_SPLITS.json
          python - <<'PY'
          import json
          q=json.load(open('runtime_repo/runtime/factory_autonomy/win_wdo/MT5_QUALIFICATION.json'))
          m=json.load(open('runtime_repo/runtime/factory_autonomy/win_wdo/WIN_WDO_MATERIALIZED_SPLITS.json'))
          assert q['family']=='XAWINWDO_REGIME_001' and q['status']=='QUALIFIED_FOR_XAWINWDO_PRIMARY_EXPERIMENT_ONLY'
          assert m['family_id']=='XAWINWDO_REGIME_001'
          assert m['safety']['ORDERS']==0 and m['safety']['REAL_CAPITAL']==0 and m['safety']['ENGINE_FEED'] is False
          print('XAWINWDO_MT5_QUALIFICATION=PASS')
          print('XAWINWDO_NEXT_STAGE='+m['next_stage'])
          print('XAWINWDO_SPLIT_COUNTS='+json.dumps(m['split_counts'],sort_keys=True))
          PY
      - name: Materialize preregistered XAWINWDO_REGIME_002
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          PACKET=runtime_repo/runtime/factory_sources/mt5/xawinwdo/XAWINWDO_REGIME_002_DEEP_HISTORY_PACKET.json
          test -f "$PACKET"
          mkdir -p runtime_repo/runtime/factory_autonomy/win_wdo/regime_002
          python source_repo/tools/gate_btc_factory/win_wdo_regime_002_materialize.py --packet "$PACKET" --out runtime_repo/runtime/factory_autonomy/win_wdo/regime_002/WIN_WDO_MATERIALIZED_SPLITS.json
          python - <<'PY'
          import json
          m=json.load(open('runtime_repo/runtime/factory_autonomy/win_wdo/regime_002/WIN_WDO_MATERIALIZED_SPLITS.json'))
          assert m['family_id']=='XAWINWDO_REGIME_002'
          assert m['split_rule']=='50_30_20_chronological' and m['embargo_sessions']==60
          assert m['roll_rule']=='t_minus_1_liquidity'
          assert m['safety']['NO_RETUNE'] and m['safety']['NO_BACKFILL'] and m['safety']['NO_COUNTER_RESET'] and m['safety']['FAIL_CLOSED']
          assert m['safety']['ORDERS']==0 and m['safety']['REAL_CAPITAL']==0 and m['safety']['ENGINE_FEED'] is False
          print('XAWINWDO_REGIME_002_MATERIALIZATION=PASS')
          print('XAWINWDO_REGIME_002_NEXT_STAGE='+m['next_stage'])
          print('XAWINWDO_REGIME_002_SPLIT_COUNTS='+json.dumps(m['split_counts'],sort_keys=True))
          PY
      - name: Audit preregistered XAWINWDO_REGIME_003 physical capacity only
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          PACKET=runtime_repo/runtime/factory_sources/mt5/xawinwdo/XAWINWDO_REGIME_002_DEEP_HISTORY_PACKET.json
          mkdir -p runtime_repo/runtime/factory_autonomy/win_wdo/regime_003
          python source_repo/tools/gate_btc_factory/xawinwdo_regime_003_capacity_audit.py --packet "$PACKET" --out runtime_repo/runtime/factory_autonomy/win_wdo/regime_003/CAPACITY_AUDIT.json
          python -c "import json; d=json.load(open('runtime_repo/runtime/factory_autonomy/win_wdo/regime_003/CAPACITY_AUDIT.json')); assert d['economics_read'] is False and d['safety']['NO_RETUNE'] and d['safety']['NO_BACKFILL']; print('XAWINWDO_REGIME_003_CAPACITY='+d['next_stage'])"
      - name: Audit preregistered XAWINWDO_REGIME_004 physical capacity before economics
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          PACKET=runtime_repo/runtime/factory_sources/mt5/xawinwdo/XAWINWDO_REGIME_002_DEEP_HISTORY_PACKET.json
          mkdir -p runtime_repo/runtime/factory_autonomy/win_wdo/regime_004
          python source_repo/tools/gate_btc_factory/xawinwdo_regime_004_capacity_audit.py --packet "$PACKET" --out runtime_repo/runtime/factory_autonomy/win_wdo/regime_004/CAPACITY_AUDIT.json
          python -c "import json; d=json.load(open('runtime_repo/runtime/factory_autonomy/win_wdo/regime_004/CAPACITY_AUDIT.json')); assert d['economics_read'] is False and d['frozen_rolling_dependence_windows']==[20,60]; print('XAWINWDO_REGIME_004_CAPACITY='+d['next_stage'])"
      - name: Audit preregistered XAWINWDO_REGIME_005 physical capacity before economics
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          PACKET=runtime_repo/runtime/factory_sources/mt5/xawinwdo/XAWINWDO_REGIME_002_DEEP_HISTORY_PACKET.json
          mkdir -p runtime_repo/runtime/factory_autonomy/win_wdo/regime_005
          python source_repo/tools/gate_btc_factory/xawinwdo_regime_005_capacity_audit.py --packet "$PACKET" --out runtime_repo/runtime/factory_autonomy/win_wdo/regime_005/CAPACITY_AUDIT.json
          python -c "import json; d=json.load(open('runtime_repo/runtime/factory_autonomy/win_wdo/regime_005/CAPACITY_AUDIT.json')); assert d['economics_read'] is False and d['embargo_sessions']==20; print('XAWINWDO_REGIME_005_CAPACITY='+d['next_stage']); print('XAWINWDO_REGIME_005_SPLITS='+json.dumps(d['post_embargo_split_capacity'],sort_keys=True))"
      - name: Materialize frozen XAWINWDO_REGIME_005 partitions
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          PACKET=runtime_repo/runtime/factory_sources/mt5/xawinwdo/XAWINWDO_REGIME_002_DEEP_HISTORY_PACKET.json
          mkdir -p runtime_repo/runtime/factory_autonomy/win_wdo/regime_005
          python source_repo/tools/gate_btc_factory/xawinwdo_regime_005_materialize.py --packet "$PACKET" --out runtime_repo/runtime/factory_autonomy/win_wdo/regime_005/MATERIALIZED_SPLITS.json
          python -c "import json; d=json.load(open('runtime_repo/runtime/factory_autonomy/win_wdo/regime_005/MATERIALIZED_SPLITS.json')); assert d['family_id']=='XAWINWDO_REGIME_005' and d['embargo_sessions']==20 and d['safety']['ORDERS']==0 and d['safety']['ENGINE_FEED'] is False; print('XAWINWDO_REGIME_005_MATERIALIZED='+d['next_stage']); print('COUNTS='+json.dumps(d['split_counts'],sort_keys=True))"
      - name: Freeze XAWINWDO_REGIME_005 candidate from discovery only
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python source_repo/tools/gate_btc_factory/xawinwdo_regime_005_discovery.py \
            --splits runtime_repo/runtime/factory_autonomy/win_wdo/regime_005/MATERIALIZED_SPLITS.json \
            --rule source_repo/tools/gate_btc_factory/XAWINWDO_REGIME_005_DISCOVERY_VALIDATION_RULE_20260918.json \
            --semantics source_repo/tools/gate_btc_factory/XAWINWDO_REGIME_005_INTRADAY_SEMANTICS_AUTH_20260918.json \
            --out runtime_repo/runtime/factory_autonomy/win_wdo/regime_005/CANDIDATE_FREEZE.json
          python -c "import json; d=json.load(open('runtime_repo/runtime/factory_autonomy/win_wdo/regime_005/CANDIDATE_FREEZE.json')); assert d['candidate_frozen' if 'candidate_frozen' in d else 'validation_read'] is False if 'candidate_frozen' in d else d['validation_read'] is False; assert d['validation_read'] is False and d['holdout_read'] is False and d['safety']['ORDERS']==0; print('XAWINWDO_REGIME_005_DISCOVERY='+d['status'])"
      - name: Persist runtime
        if: github.event_name != 'pull_request'
        run: |
          cd runtime_repo
          git config user.name gate-btc-research-bot; git config user.email gate-btc-research-bot@users.noreply.github.com
          git add runtime/factory_autonomy/win_wdo
          git commit -m "Activate XAWINWDO MT5 materialization ${{ github.run_id }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin gate-btc-runtime && git push origin HEAD:gate-btc-runtime && exit 0; sleep $((i*2)); done
          exit 1
