name: GATE BTC V16B CMC Prospective Snapshot

on:
  schedule:
    # Two independent pre-close captures every day. Thursday is the V16B signal day;
    # daily capture keeps the evidence chain healthy without relying on a single cron.
    - cron: "15 21,23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-v16b-cmc-snapshot.yml
      - tools/gate_btc_v16b_cmc_snapshot.py
      - tools/gate_btc_v16b_cmc_persist.py
      - tools/gate_btc_v16b1_universe_corpus.py
      - tools/gate_btc_v16b_signal_source.py
      - tests/test_gate_btc_v16b1_universe_corpus.py
      - tests/test_gate_btc_v16b_signal_source.py
      - artifacts/gate_btc/v16b/GATE_BTC_V16B1_UNIVERSE_CUTOVER_20260926.json
      - tests/test_gate_btc_v16b_cmc_persist.py
      - artifacts/gate_btc/v16b/GATE_BTC_V16B_CMC_DURABLE_COLLECTION_CONTRACT_20260925.json
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-v16b-cmc-snapshot.yml
      - tools/gate_btc_v16b_cmc_snapshot.py
      - tools/gate_btc_v16b_cmc_persist.py
      - tools/gate_btc_v16b1_universe_corpus.py
      - tools/gate_btc_v16b_signal_source.py
      - tests/test_gate_btc_v16b1_universe_corpus.py
      - tests/test_gate_btc_v16b_signal_source.py
      - artifacts/gate_btc/v16b/GATE_BTC_V16B1_UNIVERSE_CUTOVER_20260926.json
      - tests/test_gate_btc_v16b_cmc_persist.py
      - artifacts/gate_btc/v16b/GATE_BTC_V16B_CMC_DURABLE_COLLECTION_CONTRACT_20260925.json

permissions:
  contents: write

concurrency:
  group: gate-btc-v16b-cmc-prospective-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  GATE_BTC_SHADOW_ONLY: "true"
  GATE_BTC_NOT_APPROVED: "true"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  capture-cmc-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install capture dependency
        run: pip install 'requests>=2.31,<3' pytest pandas

      - name: Validate durable persistence contract
        run: python -m pytest -q tests/test_gate_btc_v16b_cmc_persist.py tests/test_gate_btc_v16b1_universe_corpus.py tests/test_gate_btc_v16b_signal_source.py

      - name: Capture raw CMC Top-150 and availability manifest
        run: |
          set -euo pipefail
          python tools/gate_btc_v16b_cmc_snapshot.py \
            --out-dir artifacts/gate_btc/v16b/cmc_snapshots

      - name: Qualify live Top-150 in isolated corpus
        run: |
          python -m tools.gate_btc_v16b1_universe_corpus \
            --capture-dir artifacts/gate_btc/v16b/cmc_snapshots \
            --runtime-root "$RUNNER_TEMP/v16b1-corpus-qualification" \
            --run-id "${{ github.run_id }}" --code-sha "$(git rev-parse HEAD)"

      - name: Verify adjacent provenance and fail closed
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root=Path('artifacts/gate_btc/v16b/cmc_snapshots')
          evidence=list(root.glob('*.evidence.json'))
          raw=list(root.glob('*.raw.json'))
          assert len(evidence)==1, f'expected one evidence manifest, found {len(evidence)}'
          assert len(raw)==1, f'expected one raw snapshot, found {len(raw)}'
          ev=json.loads(evidence[0].read_text(encoding='utf-8'))
          digest=hashlib.sha256(raw[0].read_bytes()).hexdigest()
          assert ev['raw_snapshot_sha256']==digest
          assert ev['rows'] >= 100
          assert ev['available_at_utc'].endswith('Z')
          assert ev['source_ref'].startswith('https://pro-api.coinmarketcap.com/public-api/v1/cryptocurrency/map')
          assert ev['research_only'] is True
          assert ev['shadow_only'] is True
          assert ev['not_approved'] is True
          assert ev['engine_feed'] is False
          assert ev['orders'] == 0 and ev['real_capital'] == 0
          print('V16B_CMC_PROSPECTIVE_SNAPSHOT=PASS snapshot_id='+ev['snapshot_id'])
          PY

      - name: Upload immutable prospective evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-v16b-cmc-snapshot-${{ github.run_id }}
          path: artifacts/gate_btc/v16b/cmc_snapshots/
          retention-days: 90
          if-no-files-found: error

      - name: Checkout canonical runtime branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: canonical-runtime
          fetch-depth: 0

      - name: Persist Thursday evidence into append-only runtime corpus
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python tools/gate_btc_v16b_cmc_persist.py \
            --capture-dir artifacts/gate_btc/v16b/cmc_snapshots \
            --runtime-root canonical-runtime \
            --run-id "${{ github.run_id }}"

      - name: Preserve post-cutover live universe evidence
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python -m tools.gate_btc_v16b1_universe_corpus \
            --capture-dir artifacts/gate_btc/v16b/cmc_snapshots \
            --runtime-root canonical-runtime \
            --run-id "${{ github.run_id }}" --code-sha "$(git rev-parse HEAD)"

      - name: Publish durable CMC corpus atomically
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: canonical-runtime
        run: |
          set -euo pipefail
          git add -- runtime/evidence/v16b1/prospective_universe
          if [ -d runtime/evidence/v16b/cmc_weekly ]; then
            git add -- runtime/evidence/v16b/cmc_weekly
          fi
          if git diff --cached --quiet; then
            echo "No durable universe corpus change."
            exit 0
          fi
          git config user.name "gate-btc-research-bot"
          git config user.email "gate-btc-research-bot@users.noreply.github.com"
          git commit -m "Persist V16B CMC live universe evidence run ${{ github.run_id }}"
          git pull --rebase origin gate-btc-runtime
          git push origin HEAD:gate-btc-runtime

      - name: Verify newly captured evidence on canonical remote
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: canonical-runtime
        run: |
          set -euo pipefail
          git fetch origin gate-btc-runtime
          CAPTURE="runtime/evidence/v16b1/prospective_universe/captures/run_${{ github.run_id }}"
          git ls-tree -r --name-only HEAD -- "$CAPTURE" > "$RUNNER_TEMP/cmc-capture-paths"
          test -s "$RUNNER_TEMP/cmc-capture-paths"
          while IFS= read -r path; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "origin/gate-btc-runtime:$path")"
          done < "$RUNNER_TEMP/cmc-capture-paths"
          echo "V16B1_LIVE_CAPTURE_CANONICAL_PERSISTENCE=PASS"

      - name: Confirm execution safety boundaries
        run: |
          test "$GATE_BTC_RESEARCH_ONLY" = true
          test "$GATE_BTC_SHADOW_ONLY" = true
          test "$GATE_BTC_NOT_APPROVED" = true
          echo "ENGINE_FEED=false ORDERS=0 REAL_CAPITAL=0 NO_BACKFILL=true NO_RETUNE=true"
