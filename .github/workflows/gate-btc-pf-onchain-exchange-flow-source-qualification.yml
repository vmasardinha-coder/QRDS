name: GATE BTC PF Onchain Exchange Flow Source Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/gate_btc_2/PF_ONCHAIN_EXCHANGE_FLOW_SOURCE_QUALIFICATION_20260923.json'
      - 'tools/gate_btc_factory/pf_onchain_exchange_flow_source_qualification.py'
      - 'tests/test_gate_btc_pf_onchain_exchange_flow_source_qualification.py'
      - '.github/workflows/gate-btc-pf-onchain-exchange-flow-source-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'artifacts/gate_btc_2/PF_ONCHAIN_EXCHANGE_FLOW_SOURCE_QUALIFICATION_20260923.json'
      - 'tools/gate_btc_factory/pf_onchain_exchange_flow_source_qualification.py'
      - 'tests/test_gate_btc_pf_onchain_exchange_flow_source_qualification.py'
      - '.github/workflows/gate-btc-pf-onchain-exchange-flow-source-qualification.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  RESEARCH_ONLY: 'true'
  SHADOW_ONLY: 'true'
  ENGINE_FEED: 'false'
  ORDERS: '0'
  REAL_CAPITAL: '0'
  NO_RETUNE: 'true'
  NO_BACKFILL: 'true'

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: source_repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate qualification boundary
        run: |
          python -m pip install -q requests pytest
          cd source_repo
          python -m py_compile tools/gate_btc_factory/pf_onchain_exchange_flow_source_qualification.py
          pytest -q tests/test_gate_btc_pf_onchain_exchange_flow_source_qualification.py
          python tools/gate_btc_factory/pf_onchain_exchange_flow_source_qualification.py --self-test
      - name: Assert frozen no-economics contract
        run: |
          cd source_repo
          python - <<'PY'
          import json
          d=json.load(open('artifacts/gate_btc_2/PF_ONCHAIN_EXCHANGE_FLOW_SOURCE_QUALIFICATION_20260923.json'))
          assert d['economic_parameters_defined'] is False
          assert d['direction_defined'] is False
          assert d['thresholds_defined'] is False
          assert d['lookbacks_defined'] is False
          assert d['return_horizon_defined'] is False
          assert d['historical_backfill_allowed'] is False
          assert d['required_semantics']['homegrown_address_labels_allowed'] is False
          assert d['required_semantics']['raw_public_blockchain_without_exchange_labels_is_sufficient'] is False
          s=d['safety']
          assert s['RESEARCH_ONLY'] and s['SHADOW_ONLY'] and s['NO_RETUNE'] and s['NO_BACKFILL']
          assert s['ENGINE_FEED'] is False and s['ORDERS']==0 and s['REAL_CAPITAL']==0
          assert s['CANONICAL_580_UNTOUCHED'] is True
          print('PF_ONCHAIN_EXCHANGE_FLOW_SOURCE_CONTRACT=PASS')
          PY
      - name: Probe live anonymous Coin Metrics Community source
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p live
          python source_repo/tools/gate_btc_factory/pf_onchain_exchange_flow_source_qualification.py --output live/PF_ONCHAIN_EXCHANGE_FLOW_SOURCE_QUALIFICATION_RUNTIME.json
      - name: Validate live adjudication class
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          p='live/PF_ONCHAIN_EXCHANGE_FLOW_SOURCE_QUALIFICATION_RUNTIME.json'
          d=json.load(open(p))
          status=d['qualification']['status']
          allowed={
            'QUALIFIED_COMMUNITY_PUBLIC_SOURCE',
            'BLOCKED_AUTHORIZATION_OR_PRODUCT_TIER_REQUIRED',
            'BLOCKED_REQUIRED_METRIC_NOT_PUBLICLY_AVAILABLE',
            'FAIL_CLOSED_SOURCE_UNVERIFIED',
          }
          assert status in allowed
          assert d['api_key_supplied'] is False
          assert d['homegrown_exchange_labels_used'] is False
          assert d['raw_public_blockchain_treated_as_equivalent'] is False
          assert d['economic_outcomes_read'] is False
          assert d['historical_backfill_started'] is False
          assert d['safety']['canonical_580_untouched'] is True
          print('PF_ONCHAIN_EXCHANGE_FLOW_LIVE_STATUS='+status)
          PY
      - name: Persist source qualification result to canonical runtime
        if: github.event_name != 'pull_request'
        run: |
          git clone --depth 1 --branch gate-btc-runtime "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" runtime_repo
          mkdir -p runtime_repo/runtime/factory_autonomy/parallel_frontier_source_qualifications
          cp live/PF_ONCHAIN_EXCHANGE_FLOW_SOURCE_QUALIFICATION_RUNTIME.json runtime_repo/runtime/factory_autonomy/PF_ONCHAIN_EXCHANGE_FLOW_SOURCE_QUALIFICATION_RUNTIME.json
          cp live/PF_ONCHAIN_EXCHANGE_FLOW_SOURCE_QUALIFICATION_RUNTIME.json runtime_repo/runtime/factory_autonomy/parallel_frontier_source_qualifications/07712a5ee7505e458bf426cebe935762a46d5e3a12f4b970d13db3c6bb34e95d.json
          git -C runtime_repo config user.name gate-btc-research-bot
          git -C runtime_repo config user.email gate-btc-research-bot@users.noreply.github.com
          git -C runtime_repo add runtime/factory_autonomy/PF_ONCHAIN_EXCHANGE_FLOW_SOURCE_QUALIFICATION_RUNTIME.json runtime/factory_autonomy/parallel_frontier_source_qualifications
          git -C runtime_repo diff --cached --quiet || git -C runtime_repo commit -m "PF onchain exchange-flow source qualification ${{ github.run_id }}"
          if ! git -C runtime_repo diff HEAD^ --quiet 2>/dev/null; then
            for i in 1 2 3 4 5; do
              git -C runtime_repo fetch origin gate-btc-runtime
              git -C runtime_repo rebase origin/gate-btc-runtime || { git -C runtime_repo rebase --abort; exit 1; }
              git -C runtime_repo push origin HEAD:gate-btc-runtime && break
              sleep $((i*2))
            done
          fi
      - name: Fail only if source could not be adjudicated
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          d=json.load(open('live/PF_ONCHAIN_EXCHANGE_FLOW_SOURCE_QUALIFICATION_RUNTIME.json'))
          status=d['qualification']['status']
          if status=='FAIL_CLOSED_SOURCE_UNVERIFIED':
              raise SystemExit('SOURCE_UNVERIFIED_FAIL_CLOSED')
          print('PF_ONCHAIN_EXCHANGE_FLOW_ADJUDICATED='+status)
          PY
