name: Pressure Valve Expanded Validation
on:
  pull_request:
    paths: ['tools/pressure_valve_expanded/**', '.github/workflows/pressure-valve-expanded-validation.yml']
  push:
    branches: [main, pressure-valve-expanded-20261022]
    paths: ['tools/pressure_valve_expanded/**', '.github/workflows/pressure-valve-expanded-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tools/pressure_valve_expanded/tests -v
