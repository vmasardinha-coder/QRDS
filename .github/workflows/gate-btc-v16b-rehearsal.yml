name: GATE BTC V16B One-Day Rehearsal

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Rehearsal stage to execute
        required: true
        type: choice
        options: [signal, entry]
      signal_date:
        description: SIGNAL as-of UTC date (YYYY-MM-DD); required for signal stage
        required: false
        type: string
      research_run_id:
        description: Run containing frozen panel/strictly-prior shortability
        required: false
        type: string
      research_artifact_name:
        description: Exact research artifact name
        required: false
        type: string
      cmc_run_id:
        description: Run containing raw CMC snapshot/evidence
        required: false
        type: string
      cmc_artifact_name:
        description: Exact CMC artifact name
        required: false
        type: string
      signal_run_id:
        description: Rehearsal SIGNAL run for ENTRY stage
        required: false
        type: string
      signal_artifact_name:
        description: Exact rehearsal SIGNAL artifact name
        required: false
        type: string
      binance_run_id:
        description: Run containing post-signal Binance Spot/USD-M exchangeInfo
        required: false
        type: string
      binance_artifact_name:
        description: Exact Binance evidence artifact name
        required: false
        type: string
      panel_path:
        description: Relative path inside research artifact to frozen V16B panel
        required: false
        type: string
      historical_shortability_path:
        description: Relative path inside research artifact to strictly-prior shortability ledger
        required: false
        type: string
      universe_snapshot_path:
        description: Relative path inside CMC artifact to raw snapshot
        required: false
        type: string
      universe_snapshot_evidence_path:
        description: Relative path inside CMC artifact to evidence manifest
        required: false
        type: string
      signal_event_path:
        description: Relative path inside rehearsal SIGNAL artifact
        required: false
        type: string
      usdm_exchange_info_path:
        description: Relative path inside Binance artifact to USD-M exchangeInfo
        required: false
        type: string
      spot_exchange_info_path:
        description: Relative path inside Binance artifact to Spot exchangeInfo
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  GATE_BTC_SHADOW_ONLY: "true"
  GATE_BTC_NOT_APPROVED: "true"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen V16B dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas numpy scikit-learn requests
      - name: Prove rehearsal isolation contract
        run: python -m pytest -q tests/test_gate_btc_v16b_rehearsal.py tests/test_gate_btc_v16b_prospective_pipeline.py

      - name: Download research evidence for SIGNAL
        if: inputs.stage == 'signal'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.research_artifact_name }}
          run-id: ${{ inputs.research_run_id }}
          github-token: ${{ github.token }}
          path: research_evidence
      - name: Download CMC evidence for SIGNAL
        if: inputs.stage == 'signal'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.cmc_artifact_name }}
          run-id: ${{ inputs.cmc_run_id }}
          github-token: ${{ github.token }}
          path: cmc_evidence
      - name: Download rehearsal SIGNAL for ENTRY
        if: inputs.stage == 'entry'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.signal_artifact_name }}
          run-id: ${{ inputs.signal_run_id }}
          github-token: ${{ github.token }}
          path: signal_evidence
      - name: Download Binance evidence for ENTRY
        if: inputs.stage == 'entry'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.binance_artifact_name }}
          run-id: ${{ inputs.binance_run_id }}
          github-token: ${{ github.token }}
          path: binance_evidence

      - name: Validate requested source paths fail-closed
        shell: bash
        env:
          STAGE: ${{ inputs.stage }}
          SIGNAL_DATE: ${{ inputs.signal_date }}
          PANEL: ${{ inputs.panel_path }}
          SHORT: ${{ inputs.historical_shortability_path }}
          SNAP: ${{ inputs.universe_snapshot_path }}
          SNAPEV: ${{ inputs.universe_snapshot_evidence_path }}
          SIGEVENT: ${{ inputs.signal_event_path }}
          USDM: ${{ inputs.usdm_exchange_info_path }}
          SPOT: ${{ inputs.spot_exchange_info_path }}
        run: |
          set -euo pipefail
          req() { test -n "$2" && test -f "$1/$2" || { echo "missing $1/$2" >&2; exit 2; }; }
          if [ "$STAGE" = signal ]; then
            test -n "$SIGNAL_DATE" || { echo "signal_date required" >&2; exit 2; }
            req research_evidence "$PANEL"
            req research_evidence "$SHORT"
            req cmc_evidence "$SNAP"
            req cmc_evidence "$SNAPEV"
          else
            req signal_evidence "$SIGEVENT"
            req binance_evidence "$USDM"
            req binance_evidence "$SPOT"
          fi

      - name: Execute isolated SIGNAL rehearsal
        if: inputs.stage == 'signal'
        env:
          SIGNAL_DATE: ${{ inputs.signal_date }}
          PANEL: ${{ inputs.panel_path }}
          SHORT: ${{ inputs.historical_shortability_path }}
          SNAP: ${{ inputs.universe_snapshot_path }}
          SNAPEV: ${{ inputs.universe_snapshot_evidence_path }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/gate_btc/v16b/rehearsal
          python tools/gate_btc_v16b_rehearsal.py signal \
            --panel "research_evidence/$PANEL" \
            --historical-shortability "research_evidence/$SHORT" \
            --signal-date "$SIGNAL_DATE" \
            --universe-snapshot "cmc_evidence/$SNAP" \
            --universe-snapshot-evidence "cmc_evidence/$SNAPEV" \
            --code-commit "$GITHUB_SHA" \
            --ledger artifacts/gate_btc/v16b/rehearsal/V16B_REHEARSAL_LEDGER.jsonl \
            --output artifacts/gate_btc/v16b/rehearsal/V16B_SIGNAL_REHEARSAL.json

      - name: Execute isolated ENTRY rehearsal
        if: inputs.stage == 'entry'
        env:
          SIGEVENT: ${{ inputs.signal_event_path }}
          USDM: ${{ inputs.usdm_exchange_info_path }}
          SPOT: ${{ inputs.spot_exchange_info_path }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/gate_btc/v16b/rehearsal
          cp "signal_evidence/$SIGEVENT" artifacts/gate_btc/v16b/rehearsal/V16B_SIGNAL_REHEARSAL.json
          python tools/gate_btc_v16b_rehearsal.py entry \
            --signal-event artifacts/gate_btc/v16b/rehearsal/V16B_SIGNAL_REHEARSAL.json \
            --usdm-exchange-info "binance_evidence/$USDM" \
            --spot-exchange-info "binance_evidence/$SPOT" \
            --ledger artifacts/gate_btc/v16b/rehearsal/V16B_REHEARSAL_LEDGER.jsonl \
            --output artifacts/gate_btc/v16b/rehearsal/V16B_ENTRY_REHEARSAL.json

      - name: Verify zero-count safety boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('artifacts/gate_btc/v16b/rehearsal').glob('V16B_*_REHEARSAL.json'))
          assert files, 'no rehearsal event generated'
          for p in files:
              x=json.loads(p.read_text())
              assert x['REHEARSAL'] is True
              assert x['PROSPECTIVE_COUNT'] == 0
              assert x['CANONICAL_LEDGER'] is False
              assert x['RESEARCH_ONLY'] is True and x['SHADOW_ONLY'] is True and x['NOT_APPROVED'] is True
              assert x['ENGINE_FEED'] is False and x['ORDERS'] == 0 and x['REAL_CAPITAL'] == 0
          print('V16B_REHEARSAL_ISOLATION=PASS')
          PY
      - name: Upload rehearsal evidence only
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-v16b-rehearsal-${{ github.run_id }}
          path: artifacts/gate_btc/v16b/rehearsal/
          retention-days: 30
          if-no-files-found: error
