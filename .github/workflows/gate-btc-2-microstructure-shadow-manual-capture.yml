name: GATE BTC 2 Microstructure Shadow Manual Capture

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CAPTURE_FORWARD_ONLY to authorize one public-data capture
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: gate-btc-2-microstructure-shadow-manual-capture
  cancel-in-progress: false

jobs:
  capture:
    if: github.event.inputs.confirmation == 'CAPTURE_FORWARD_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GATE_BTC_RESEARCH_ONLY: "true"
      GATE_BTC_SHADOW_ONLY: "true"
      GATE_BTC_NOT_APPROVED: "true"
      GATE_BTC_ENGINE_FEED: "false"
      GATE_BTC_ORDERS: "0"
      GATE_BTC_REAL_CAPITAL: "0"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reprove capture and manifest fail-closed boundaries
        run: >-
          python -m unittest -v
          tests/test_gate_btc_2_microstructure_shadow_contract.py
          tests/test_gate_btc_2_microstructure_shadow_manifest.py
          tests/test_gate_btc_2_microstructure_shadow_capture.py
      - name: Capture one forward-only public snapshot or defer safely
        run: >-
          python -m tools.gate_btc_2_microstructure_shadow_capture
          --repository "${GITHUB_REPOSITORY}"
          --run-id "${GITHUB_RUN_ID}"
          --output-dir artifacts/gate_btc_2/microstructure_shadow/${GITHUB_RUN_ID}
      - name: Verify no self-promotion
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('artifacts/gate_btc_2/microstructure_shadow')/os.environ['GITHUB_RUN_ID']
          p=json.loads((root/'capture_decision.json').read_text())
          assert p['status'] in {
            'CAPTURED_READY_FOR_FORWARD_CAPTURE_REVIEW',
            'DEFER_NETWORK_CAPTURE_ACTIVE_SCHEDULE_OR_PROTECTED_WORKFLOW',
          }
          assert p['stage_9_complete'] is False
          assert p['economics_allowed'] is False
          assert p['engine_feed'] is False
          assert p['orders_generated']==0 and p['real_capital_used']==0
          if p['status'].startswith('DEFER_'):
              assert p['market_network_requests']==0
              assert not (root/'capture_manifest.json').exists()
          else:
              assert p['market_network_requests']==4
              assert (root/'capture_manifest.json').is_file()
          PY
      - name: Upload capture or deferral evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-2-microstructure-shadow-${{ github.run_id }}
          path: artifacts/gate_btc_2/microstructure_shadow/${{ github.run_id }}/
          retention-days: 90
          if-no-files-found: error
