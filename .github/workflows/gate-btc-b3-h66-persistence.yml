name: GATE BTC B3 H66 Persistence

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_b3_h66_persistence.py'
      - '.github/workflows/gate-btc-b3-h66-persistence.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_NOT_APPROVED: 'true'
  GATE_BTC_ORDERS: '0'
  GATE_BTC_REAL_CAPITAL: '0'
  GATE_BTC_ENGINE_FEED: 'false'

jobs:
  h66-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: Run frozen H66 persistence budget
        run: |
          python tools/gate_btc_b3_h66_persistence.py \
            --out /tmp/B3_H66_PERSISTENCE.json \
            --ledger /tmp/B3_H66_LEDGER.jsonl \
            --cells /tmp/B3_H66_CELLS.csv
      - name: Assert frozen scientific and safety boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/B3_H66_PERSISTENCE.json'))
          assert p['family']=='H66' and p['cutoff_exclusive']=='2026-08-10'
          assert p['thresholds']==[0.75,1.0]
          assert set(p['mappings'])=={'CONTINUE','REVERSE'}
          assert p['horizons']==[60,120]
          assert set(p['sources'])=={'USDBRL','VIX','US10Y'}
          assert p['state'] in {'SURVIVOR_REPLICATED','REJECTED_FAILED_REPLICATION','REJECTED_DISCOVERY'}
          assert p['synthetic_backfill'] is False
          assert p['h1_economics_read'] is False and p['survivor_partial_economics_read'] is False
          assert p['orders_generated']==0 and p['real_capital_used']==0 and p['engine_feed'] is False
          print('B3_H66_PERSISTENCE=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b3-h66-persistence-${{ github.run_id }}
          path: |
            /tmp/B3_H66_PERSISTENCE.json
            /tmp/B3_H66_LEDGER.jsonl
            /tmp/B3_H66_CELLS.csv
          retention-days: 30
          if-no-files-found: error
