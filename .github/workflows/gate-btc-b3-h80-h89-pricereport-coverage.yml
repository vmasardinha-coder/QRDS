name: GATE BTC B3 H80-H89 PriceReport Coverage

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_b3_h80_h89_pricereport_coverage_probe.py'
      - '.github/workflows/gate-btc-b3-h80-h89-pricereport-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_NOT_APPROVED: 'true'
  GATE_BTC_ORDERS: '0'
  GATE_BTC_REAL_CAPITAL: '0'
  GATE_BTC_ENGINE_FEED: 'false'

jobs:
  coverage-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'requests>=2.31,<3'
      - name: Probe stratified official SPRD history
        run: python tools/gate_btc_b3_h80_h89_pricereport_coverage_probe.py
      - name: Assert source-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/b3_h80_h89_pricereport_coverage/B3_H80_H89_PRICEREPORT_COVERAGE.json').read_text())
          assert p['economics_run'] is False and p['h1_economics_read'] is False and p['survivor_partial_economics_read'] is False
          assert p['orders']==0 and p['real_capital']==0 and p['engine_feed'] is False
          assert all(d<'2026-08-10' for d in p['sample_dates'])
          print('H80_H89_PRICEREPORT_COVERAGE',p['status'],p['passed'],p['total'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b3-h80-h89-pricereport-coverage-${{ github.run_id }}
          path: artifacts/b3_h80_h89_pricereport_coverage/
          retention-days: 30
          if-no-files-found: error
