name: GATE BTC QUANT_DEATH coverage

on:
  push:
    branches:
      - agent/gate-btc-quant-death-coverage
    paths:
      - "crypto_decision_lab/research/quant_death/**"
      - ".github/workflows/gate_btc_quant_death_coverage.yml"
  workflow_dispatch:
    inputs:
      only_cohort25:
        description: "Run only prioritized 25-name collection, retaining V3 denominator"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  RESEARCH_ONLY: "True"
  NOT_APPROVED: "True"
  ORDERS: "0"
  REAL_CAPITAL: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  safety-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.2.6" "pandas==2.2.3" "requests==2.32.4" "beautifulsoup4==4.13.4" "pytest==8.4.1"
      - name: Assert immutable safety boundary
        shell: bash
        run: |
          test "$RESEARCH_ONLY" = "True"
          test "$NOT_APPROVED" = "True"
          test "$ORDERS" = "0"
          test "$REAL_CAPITAL" = "0"
      - name: Materialize frozen research source and registries
        working-directory: crypto_decision_lab/research/quant_death
        shell: bash
        run: |
          set -euo pipefail
          for target in collect_multisource.py quant_death_candidates_202.csv quant_death_priority_cohort_25.csv quant_death_v3_baseline_202.csv; do
            cat "$target".gz.b64.part-* | base64 -d | gzip -dc > "$target"
          done
      - name: Apply fail-closed NaT serialization repair
        working-directory: crypto_decision_lab/research/quant_death
        run: python apply_nat_hotfix.py collect_multisource.py
      - name: Unit tests
        working-directory: crypto_decision_lab/research/quant_death
        run: pytest -q

  collect-multisource-coverage:
    needs: safety-and-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.2.6" "pandas==2.2.3" "requests==2.32.4" "beautifulsoup4==4.13.4"
      - name: Materialize frozen research source and registries
        working-directory: crypto_decision_lab/research/quant_death
        shell: bash
        run: |
          set -euo pipefail
          for target in collect_multisource.py quant_death_candidates_202.csv quant_death_priority_cohort_25.csv quant_death_v3_baseline_202.csv; do
            cat "$target".gz.b64.part-* | base64 -d | gzip -dc > "$target"
          done
      - name: Apply fail-closed NaT serialization repair
        working-directory: crypto_decision_lab/research/quant_death
        run: python apply_nat_hotfix.py collect_multisource.py
      - name: Materialize public fallback collectors
        working-directory: crypto_decision_lab/research/quant_death
        shell: bash
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE"/.gate_staging/augment_gate_kucoin.py.gz.b64.part-* | base64 -d | gzip -dc > augment_gate_kucoin.py
          cat "$GITHUB_WORKSPACE"/.gate_staging/augment_ccdata.py.gz.b64.part-* | base64 -d | gzip -dc > augment_ccdata.py
          cat "$GITHUB_WORKSPACE"/.gate_staging/augment_okx_bybit_mexc.py.gz.b64.part-* | base64 -d | gzip -dc > augment_okx_bybit_mexc.py
          python -m py_compile augment_gate_kucoin.py augment_ccdata.py augment_okx_bybit_mexc.py
      - name: Collect public price histories and evaluate frozen rule
        working-directory: crypto_decision_lab/research/quant_death
        env:
          GATE_BTC_ONLY_COHORT25: ${{ inputs.only_cohort25 && '1' || '0' }}
          GATE_BTC_LIST_WORKERS: "24"
          GATE_BTC_DOWNLOAD_WORKERS: "20"
          GATE_BTC_CG_WEB_CHUNK_DAYS: "20"
          GATE_BTC_CG_WEB_SLEEP: "0.35"
        run: |
          python collect_multisource.py \
            --output "$GITHUB_WORKSPACE/quant_death_multisource_output" \
            --asof "$(date -u +%F)"
      - name: Augment unresolved rows from public Gate and KuCoin spot history
        working-directory: crypto_decision_lab/research/quant_death
        run: |
          python augment_gate_kucoin.py \
            --output "$GITHUB_WORKSPACE/quant_death_multisource_output" \
            --asof "$(date -u +%F)" \
            --workers 12
      - name: Augment unresolved rows from public OKX Bybit and MEXC spot history
        working-directory: crypto_decision_lab/research/quant_death
        run: |
          python augment_okx_bybit_mexc.py \
            --output "$GITHUB_WORKSPACE/quant_death_multisource_output" \
            --asof "$(date -u +%F)" \
            --workers 8
      - name: Augment unresolved rows from public CCData CCCAGG history
        working-directory: crypto_decision_lab/research/quant_death
        run: |
          python augment_ccdata.py \
            --output "$GITHUB_WORKSPACE/quant_death_multisource_output" \
            --asof "$(date -u +%F)" \
            --workers 6
      - name: Finalize complete audit manifest and checksums
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path('quant_death_multisource_output')
          coverage = json.loads((root / 'COVERAGE_SUMMARY.json').read_text(encoding='utf-8'))
          manifest_path = root / 'MANIFEST.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          if coverage['cagr_eligible_v4'] >= coverage['coverage_gate_minimum']:
              overall = 'PASS_CAGR_GATE_REACHED_RESEARCH_ONLY'
          elif coverage['series_testable_v4'] >= coverage['coverage_gate_minimum']:
              overall = 'PARTIAL_PASS_RAW_TESTABILITY_TARGET_MET__CAGR_GATE_FAIL_CLOSED'
          else:
              overall = 'PARTIAL_PASS_COVERAGE_GATE_NOT_REACHED_FAIL_CLOSED'

          finalized_utc = datetime.now(timezone.utc).isoformat()
          audit_note = root / 'AUDIT_MANIFEST_FINALIZATION.txt'
          audit_note.write_text(
              '\n'.join([
                  'GATE BTC — FINAL AUDIT MANIFEST',
                  f'OVERALL_STATUS={overall}',
                  f'SERIES_TESTABLE={coverage["series_testable_v4"]}/{coverage["candidate_denominator"]}',
                  f'MORTALITY_RESOLVED={coverage["mortality_resolved_v4"]}/{coverage["candidate_denominator"]}',
                  f'CAGR_ELIGIBLE={coverage["cagr_eligible_v4"]}/{coverage["candidate_denominator"]}',
                  f'CAGR_GATE_MINIMUM={coverage["coverage_gate_minimum"]}',
                  f'CAGR_RECALIBRATION_EXECUTED={coverage["cagr_recalibration_executed"]}',
                  f'GITHUB_RUN_ID={os.environ.get("GITHUB_RUN_ID", "")}',
                  f'GITHUB_SHA={os.environ.get("GITHUB_SHA", "")}',
                  f'FINALIZED_UTC={finalized_utc}',
                  'RESEARCH_ONLY=True',
                  'NOT_APPROVED=True',
                  'ORDERS=0',
                  'REAL_CAPITAL=0',
              ]) + '\n',
              encoding='utf-8',
          )

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          file_rows = []
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name not in {'MANIFEST.json', 'SHA256SUMS.txt'}:
                  file_rows.append({
                      'path': path.relative_to(root).as_posix(),
                      'bytes': path.stat().st_size,
                      'sha256': sha256(path),
                  })

          manifest.update({
              'overall_status': overall,
              'evidence_finalized_utc': finalized_utc,
              'coverage': coverage,
              'workflow': {
                  'github_run_id': os.environ.get('GITHUB_RUN_ID', ''),
                  'github_run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT', ''),
                  'github_sha': os.environ.get('GITHUB_SHA', ''),
                  'github_ref': os.environ.get('GITHUB_REF', ''),
              },
              'files': file_rows,
          })
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          sum_paths = [p for p in sorted(root.rglob('*')) if p.is_file() and p.name != 'SHA256SUMS.txt']
          sums = ''.join(f'{sha256(path)}  {path.relative_to(root).as_posix()}\n' for path in sum_paths)
          (root / 'SHA256SUMS.txt').write_text(sums, encoding='utf-8')

          assert manifest['coverage']['series_testable_v4'] == coverage['series_testable_v4']
          assert manifest['coverage']['mortality_resolved_v4'] == coverage['mortality_resolved_v4']
          assert len(manifest['files']) == len(file_rows)
          for row in manifest['files']:
              path = root / row['path']
              assert path.stat().st_size == row['bytes']
              assert sha256(path) == row['sha256']
          print(f'FINAL_MANIFEST_FILES={len(file_rows)}')
          print(f'OVERALL_STATUS={overall}')
          PY
      - name: Create evidence ZIP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('quant_death_multisource_output')
          out=Path('GATE_BTC_QUANT_DEATH_MULTISOURCE_COVERAGE.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      z.write(p,Path(root.name)/p.relative_to(root))
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
          print(out, out.stat().st_size)
          PY
      - name: Upload immutable research evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-quant-death-multisource-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            quant_death_multisource_output/**
            GATE_BTC_QUANT_DEATH_MULTISOURCE_COVERAGE.zip
          if-no-files-found: error
          retention-days: 30
