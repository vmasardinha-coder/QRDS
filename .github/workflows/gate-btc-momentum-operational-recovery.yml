name: GATE BTC Momentum Operational Recovery

on:
  workflow_dispatch:
  schedule:
    - cron: '35 * * * *'
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-momentum-operational-recovery.yml
      - tools/gate_btc_momentum_recovery_policy.py
      - tests/test_gate_btc_momentum_recovery_policy.py

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: gate-btc-momentum-operational-recovery-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'canonical' }}
  cancel-in-progress: false

jobs:
  validate-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest tests.test_gate_btc_momentum_recovery_policy -v

  recover:
    if: github.event_name != 'pull_request'
    needs: validate-recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Assess current cutoff, overlap and actual daily run budget
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gate-btc-runtime
          git show origin/gate-btc-runtime:runtime/ledgers/momentum_m1_m2/STATUS.json > /tmp/momentum_status.json
          gh run list --repo "${{ github.repository }}" --workflow gate-btc-momentum-shadow.yml --limit 100 \
            --json databaseId,createdAt,status,conclusion > /tmp/momentum_runs.json
          python tools/gate_btc_momentum_recovery_policy.py \
            --state /tmp/momentum_status.json --runs /tmp/momentum_runs.json | tee /tmp/momentum_recovery.json
      - name: Dispatch safe current-cutoff rerun
        if: steps.decision.outputs.dispatch == 'true'
        run: |
          gh workflow run gate-btc-momentum-shadow.yml --repo "${{ github.repository }}" --ref main
          echo 'MOMENTUM_RECOVERY=DISPATCHED_SAFE_MECHANICAL_RERUN'
      - name: Publish bounded recovery decision
        run: |
          cat /tmp/momentum_recovery.json >> "$GITHUB_STEP_SUMMARY"
          echo 'The daily budget counts successful wait runs too. No backfill or scientific change is authorized.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: momentum-recovery-${{ github.run_id }}
          path: /tmp/momentum_recovery.json
          retention-days: 30
