name: GATE BTC WIN WDO Cross Asset Regime Pre Execution

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/WIN_WDO_CROSS_ASSET_REGIME_PRE_EXECUTION_CHECKLIST_20260915.md'
      - 'tools/gate_btc_factory/test_win_wdo_cross_asset_regime_pre_execution_checklist.py'
      - '.github/workflows/gate-btc-win-wdo-cross-asset-regime-pre-execution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-execution-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pre-execution checklist
        run: python -m pytest -q tools/gate_btc_factory/test_win_wdo_cross_asset_regime_pre_execution_checklist.py
