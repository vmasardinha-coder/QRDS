name: GATE BTC ALT Trail40 10 Forward Retrial

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Eligible Daily Research workflow run ID
        required: true
        type: string
  workflow_run:
    workflows: ["GATE BTC Daily Research Collection"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: gate-btc-alt-trail40-10-forward-retrial
  cancel-in-progress: false

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  GATE_BTC_SHADOW_ONLY: "true"
  GATE_BTC_NOT_APPROVED: "true"

jobs:
  append-forward-retrial:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test retrial fail-closed boundary
        run: python -m unittest -v tests/test_gate_btc_alt_trail40_10_retrial.py

      - name: Resolve and validate Daily Research source run
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RUN_ID: ${{ inputs.run_id || '' }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          SOURCE_RUN_ID="${MANUAL_RUN_ID:-$EVENT_RUN_ID}"
          test -n "$SOURCE_RUN_ID"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > source_run.json
          python - <<'PY'
          import json
          run=json.load(open('source_run.json'))
          assert run['name'] == 'GATE BTC Daily Research Collection'
          assert run['head_branch'] == 'main'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          print(run['id'])
          PY
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"

      - name: Download immutable V2A daily evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source_artifact extracted/v2a
          artifact_id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("gate-btc-daily-research-")) | .id' | head -1)
          test -n "$artifact_id"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > artifact.zip
          unzip -q artifact.zip -d source_artifact
          test -f source_artifact/daily_handoff/GATE_BTC_DAILY_RESEARCH_MANIFEST.json
          test -f source_artifact/qos_daily/qos_v2a_outputs.zip
          unzip -q source_artifact/qos_daily/qos_v2a_outputs.zip -d extracted/v2a
          test -f extracted/v2a/outputs/v2a_run_manifest.json
          test -f extracted/v2a/outputs/qos_v2a_current_portfolios.csv
          test -f extracted/v2a/data/processed/qos_v2a_master_daily.csv

      - name: Verify source safety and resolve snapshot
        run: |
          python - <<'PY'
          import json
          m=json.load(open('source_artifact/daily_handoff/GATE_BTC_DAILY_RESEARCH_MANIFEST.json',encoding='utf-8-sig'))
          assert m['status'] in {'PASS','PASS_WITH_DATA_WARNINGS'}
          assert m['research_only'] is True and m['operational_status'] == 'NOT_APPROVED'
          assert m['orders_generated'] == 0 and m['real_capital_used'] == 0 and m['methodology_changes'] == 0
          v=json.load(open('extracted/v2a/outputs/v2a_run_manifest.json',encoding='utf-8-sig'))
          assert v['technical_status'] == 'PASS' and v['real_orders'] == 0 and v['capital_used'] == 0
          assert v['lookahead_guard'] == 'signals execute on next daily bar'
          open('snapshot_id.txt','w').write(v['data_as_of'])
          PY
          echo "ALT_RETRIAL_SNAPSHOT_ID=$(cat snapshot_id.txt)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 0

      - name: Initialize separate retrial namespace
        run: >-
          python tools/gate_btc_alt_trail40_10_retrial_archive.py initialize
          --contract tools/gate_btc_alt_trail40_10_shadow_contract_v1.json
          --ledger-dir runtime_repo/runtime/ledgers/alt_trail40_10_retrial_v1

      - name: Append only an untouched post-freeze cycle
        run: >-
          python tools/gate_btc_alt_trail40_10_retrial_archive.py append
          --contract tools/gate_btc_alt_trail40_10_shadow_contract_v1.json
          --ledger-dir runtime_repo/runtime/ledgers/alt_trail40_10_retrial_v1
          --current-portfolios extracted/v2a/outputs/qos_v2a_current_portfolios.csv
          --master-daily extracted/v2a/data/processed/qos_v2a_master_daily.csv
          --snapshot-id "$ALT_RETRIAL_SNAPSHOT_ID"
          --source-run-id "$SOURCE_RUN_ID"

      - name: Assert original ledger untouched and retrial safe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          old=json.load(open('runtime_repo/runtime/ledgers/alt_trail40_10/STATUS.json'))
          new=json.load(open('runtime_repo/runtime/ledgers/alt_trail40_10_retrial_v1/STATUS.json'))
          assert old['snapshot_count'] == 1 and old['latest_snapshot_date'] == '2026-08-31'
          assert new['original_ledger_preserved'] is True and new['original_counter_reset'] is False
          assert new['historical_backfill_credit'] == 0 and new['no_retune'] is True and new['no_backfill'] is True
          assert new['orders_generated'] == 0 and new['real_capital_used'] == 0 and new['engine_feed'] is False
          assert new['status'] in {'WAITING_FIRST_UNTOUCHED_SIGNAL_CYCLE','ACTIVE_FORWARD_ONLY_RETRIAL'}
          PY

      - name: Publish append-only retrial runtime
        shell: bash
        run: |
          set -euo pipefail
          cd runtime_repo
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          git add runtime/ledgers/alt_trail40_10_retrial_v1
          if git diff --cached --quiet; then echo ALT_RETRIAL_RUNTIME_ALREADY_CURRENT; exit 0; fi
          git commit -m "ALT Trail40 10 forward-only retrial state"
          for i in 1 2 3 4 5; do
            git pull --rebase origin gate-btc-runtime && git push origin HEAD:gate-btc-runtime && exit 0
            sleep $((i*2))
          done
          exit 1
