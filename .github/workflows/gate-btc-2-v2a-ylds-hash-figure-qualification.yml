name: GATE BTC 2 V2A YLDS HASH Figure Qualification

on:
  pull_request:
    paths:
      - tools/gate_btc_2_v2a_ylds_hash_figure_qualification.py
      - .github/workflows/gate-btc-2-v2a-ylds-hash-figure-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-ylds-hash-figure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile qualifier
        run: python -m py_compile tools/gate_btc_2_v2a_ylds_hash_figure_qualification.py
      - name: Physically qualify YLDS and HASH Figure routes
        run: python tools/gate_btc_2_v2a_ylds_hash_figure_qualification.py --end 2026-09-02 --output artifacts/ylds_hash_figure
      - name: Assert qualification-only zero-credit boundary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/ylds_hash_figure/SUMMARY.json'); assert p.exists()
          x=json.loads(p.read_text())
          assert x['research_only'] and x['shadow_only'] and x['not_approved'] and x['fail_closed']
          assert x['engine_feed'] is False and x['orders']==0 and x['real_capital_brl']==0
          assert x['no_retune'] and x['no_backfill'] and x['no_counter_reset'] and x['no_silent_source_substitution']
          assert x['source_admitted'] is False and x['scientific_credit'] is False and x['prospective_credit'] is False and x['d0_credit']==0
          print('YLDS_HASH_FIGURE_QUALIFICATION_BOUNDARY=PASS_ZERO_CREDIT')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-btc-v2a-ylds-hash-figure-${{ github.run_id }}
          path: artifacts/ylds_hash_figure
