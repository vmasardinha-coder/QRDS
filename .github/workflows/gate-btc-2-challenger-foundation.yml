name: GATE BTC 2 Challenger Foundation

on:
  pull_request:
    branches: [main]
    paths:
      - tools/gate_btc_2_challenger_foundation.py
      - tests/test_gate_btc_2_challenger_foundation.py
      - .github/workflows/gate-btc-2-challenger-foundation.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  GATE_BTC_SHADOW_ONLY: "true"
  GATE_BTC_NOT_APPROVED: "true"
  GATE_BTC_ENGINE_FEED: "false"
  GATE_BTC_ORDERS: "0"
  GATE_BTC_REAL_CAPITAL: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  foundation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile foundation contract
        run: python -m py_compile tools/gate_btc_2_challenger_foundation.py

      - name: Run fail-closed foundation tests
        run: python -m unittest -v tests/test_gate_btc_2_challenger_foundation.py

      - name: Build deterministic 13-stage contract
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: >-
          python tools/gate_btc_2_challenger_foundation.py
          --baseline-sha "$BASELINE_SHA"
          --output artifacts/gate_btc_2/foundation/gate_btc_2_challenger_foundation.json

      - name: Verify artifact remains non-operational
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('artifacts/gate_btc_2/foundation/gate_btc_2_challenger_foundation.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          contract = payload['contract']
          readiness = payload['readiness']
          assert contract['schema'] == 'gate_btc.2_0.challenger_foundation.v1'
          assert len(contract['stage_registry']) == 13
          assert contract['safety']['engine_feed'] is False
          assert contract['safety']['orders_generated'] == 0
          assert contract['safety']['real_capital_used'] == 0
          assert contract['safety']['promotion_allowed'] is False
          assert readiness['official_challenger_runs_allowed'] is False
          assert readiness['microstructure_shadow_capture_allowed'] is True
          print('GATE_BTC_2_FOUNDATION=PASS_RESEARCH_ONLY')
          print('OFFICIAL_COMPARISON=BLOCKED_WAITING_DATASET_SEAL_BASELINE_AND_AUDITS')
          print('ORDERS=0')
          print('REAL_CAPITAL=0')
          PY

      - name: Upload immutable foundation evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-2-challenger-foundation-${{ github.run_id }}
          path: artifacts/gate_btc_2/foundation/
          retention-days: 90
          if-no-files-found: error
