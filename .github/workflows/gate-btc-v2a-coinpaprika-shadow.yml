name: GATE BTC V2A CoinPaprika Keyless Shadow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-v2a-coinpaprika-shadow.yml
      - tools/gate_btc_v2a_coinpaprika_shadow.py
      - tools/gate_btc_v2a_coinpaprika_epoch.py
      - tools/gate_btc_v2a_coinpaprika_market_identity.py
      - tools/gate_btc_v2a_coinpaprika_closed_candles.py
      - tools/gate_btc_v2a_coinpaprika_publish_ledger.py
      - tools/gate_btc_v2a_coinpaprika_epoch_genesis_v1.json
  pull_request:
    branches: [main]
    paths:
      - tools/gate_btc_v2a_coinpaprika_shadow.py
      - tools/gate_btc_v2a_coinpaprika_epoch.py
      - tools/gate_btc_v2a_coinpaprika_market_identity.py
      - tools/gate_btc_v2a_coinpaprika_closed_candles.py
      - tools/gate_btc_v2a_coinpaprika_publish_ledger.py
      - tools/gate_btc_v2a_coinpaprika_epoch_genesis_v1.json
      - tests/test_gate_btc_v2a_coinpaprika_shadow.py
      - tests/test_gate_btc_v2a_coinpaprika_epoch.py
      - tests/test_gate_btc_v2a_coinpaprika_market_identity.py
      - tests/test_gate_btc_v2a_coinpaprika_closed_candles.py
      - tests/test_gate_btc_v2a_coinpaprika_publish_ledger.py
      - .github/workflows/gate-btc-v2a-coinpaprika-shadow.yml
  schedule:
    - cron: '17 14 * * *'

permissions:
  contents: read

concurrency:
  group: gate-btc-v2a-coinpaprika-shadow-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false

env:
  RESEARCH_ONLY: 'true'
  SHADOW_ONLY: 'true'
  ENGINE_FEED: 'false'
  ORDERS: '0'
  REAL_CAPITAL: '0'
  NO_BACKFILL: 'true'

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test keyless shadow contract without market calls
        run: python -m unittest -v tests.test_gate_btc_v2a_coinpaprika_shadow tests.test_gate_btc_v2a_coinpaprika_epoch tests.test_gate_btc_v2a_coinpaprika_market_identity tests.test_gate_btc_v2a_coinpaprika_closed_candles tests.test_gate_btc_v2a_coinpaprika_publish_ledger
      - name: Assert isolation
        run: |
          test "$RESEARCH_ONLY" = true
          test "$SHADOW_ONLY" = true
          test "$ENGINE_FEED" = false
          test "$ORDERS" = 0
          test "$REAL_CAPITAL" = 0
          test "$NO_BACKFILL" = true

  capture-shadow:
    needs: offline-contract
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: canonical_runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture independent candidate and compare with hashed last admitted universe
        run: >-
          python source/tools/gate_btc_v2a_coinpaprika_shadow.py
          --baseline-snapshot canonical_runtime/runtime/data_quality/v2a/snapshots/2026-09-27-run-36381563210.json
          --baseline-archive canonical_runtime/runtime/data_quality/v2a/archives/2026-09-27-run-36381563210.coingecko_current_universe.csv.gz
          --output evidence
      - name: Start approved prospective source epoch with explicit identity gaps
        run: >-
          python source/tools/gate_btc_v2a_coinpaprika_epoch.py
          --raw evidence/COINPAPRIKA_RAW.json
          --baseline-snapshot canonical_runtime/runtime/data_quality/v2a/snapshots/2026-09-27-run-36381563210.json
          --baseline-archive canonical_runtime/runtime/data_quality/v2a/archives/2026-09-27-run-36381563210.coingecko_current_universe.csv.gz
          --registry source/tools/gate_btc_2_v2a_complete_qualified_source_registry_v1.json
          --output evidence/coinpaprika_epoch_v1
      - name: Check proposed CoinPaprika IDs against qualified spot instruments
        run: >-
          python source/tools/gate_btc_v2a_coinpaprika_market_identity.py
          --identity-gaps evidence/coinpaprika_epoch_v1/IDENTITY_GAPS.json
          --raw-tickers evidence/COINPAPRIKA_RAW.json
          --series evidence/coinpaprika_epoch_v1/SERIES.json
          --output evidence/coinpaprika_epoch_v1/market_identity
      - name: Observe only latest completed full prospective UTC close
        run: >-
          python source/tools/gate_btc_v2a_coinpaprika_closed_candles.py
          --genesis source/tools/gate_btc_v2a_coinpaprika_epoch_genesis_v1.json
          --market-identity evidence/coinpaprika_epoch_v1/market_identity/MARKET_IDENTITY.json
          --output evidence/coinpaprika_epoch_v1/closed_candles
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2a-coinpaprika-shadow-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90

  publish-closed-candle-ledger:
    needs: capture-shadow
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: v2a-coinpaprika-shadow-${{ github.run_id }}
          path: evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and seal only complete latest prospective close
        run: >-
          python source/tools/gate_btc_v2a_coinpaprika_publish_ledger.py
          --evidence evidence
          --runtime runtime_repo
          --genesis source/tools/gate_btc_v2a_coinpaprika_epoch_genesis_v1.json
      - name: Publish immutable candle archive without touching canonical pointer
        run: |
          set -euo pipefail
          ledger=runtime/data_quality/v2a/coinpaprika_v1/closed_candles
          if [[ ! -d "runtime_repo/$ledger" ]]; then
            echo 'No full prospective candle close to publish'
            exit 0
          fi
          git -C runtime_repo config user.name 'gate-btc-actions'
          git -C runtime_repo config user.email 'gate-btc-actions@users.noreply.github.com'
          git -C runtime_repo add "$ledger"
          if git -C runtime_repo diff --cached --quiet; then
            echo 'Prospective candle close already sealed'
            exit 0
          fi
          git -C runtime_repo commit -m 'Append isolated CoinPaprika prospective candle close'
          for attempt in 1 2 3 4 5; do
            git -C runtime_repo fetch origin gate-btc-runtime
            if ! git -C runtime_repo rebase origin/gate-btc-runtime; then
              git -C runtime_repo rebase --abort || true
              exit 1
            fi
            if git -C runtime_repo push origin HEAD:gate-btc-runtime; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
