name: GATE BTC XAGENT Schedule Fallback Validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gate-btc-xagent-schedule-fallback.yml'
      - '.github/workflows/gate-btc-xagent-schedule-fallback-validation.yml'
      - 'artifacts/gate_btc_2/XAGENT_SCHEDULE_FALLBACK_PREREG_20260923.json'
      - 'artifacts/gate_btc_2/XAGENT_SCHEDULE_FALLBACK_SCOPE_20260923.json'
      - 'artifacts/gate_btc_2/XAGENT_SCHEDULE_FALLBACK_EXPECTED_BEHAVIOR_20260923.md'
      - 'tests/test_gate_btc_xagent_schedule_fallback_boundary.py'
      - 'tests/test_gate_btc_xagent_schedule_fallback_scope.py'
      - 'tests/test_gate_btc_xagent_schedule_fallback_workflow.py'
      - 'tests/test_gate_btc_xagent_schedule_fallback_validation_workflow.py'
      - 'tests/test_gate_btc_xagent_schedule_fallback_expected_behavior.py'
      - 'tools/gate_btc_factory/crypto_forward_schedule_guard.py'
      - 'tests/test_gate_btc_crypto_forward_schedule_guard.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gate-btc-xagent-schedule-fallback.yml'
      - '.github/workflows/gate-btc-xagent-schedule-fallback-validation.yml'
      - 'artifacts/gate_btc_2/XAGENT_SCHEDULE_FALLBACK_PREREG_20260923.json'
      - 'artifacts/gate_btc_2/XAGENT_SCHEDULE_FALLBACK_SCOPE_20260923.json'
      - 'artifacts/gate_btc_2/XAGENT_SCHEDULE_FALLBACK_EXPECTED_BEHAVIOR_20260923.md'
      - 'tests/test_gate_btc_xagent_schedule_fallback_boundary.py'
      - 'tests/test_gate_btc_xagent_schedule_fallback_scope.py'
      - 'tests/test_gate_btc_xagent_schedule_fallback_workflow.py'
      - 'tests/test_gate_btc_xagent_schedule_fallback_validation_workflow.py'
      - 'tests/test_gate_btc_xagent_schedule_fallback_expected_behavior.py'

permissions:
  contents: read

env:
  RESEARCH_ONLY: 'true'
  SHADOW_ONLY: 'true'
  ENGINE_FEED: 'false'
  ORDERS: '0'
  REAL_CAPITAL: '0'
  NO_RETUNE: 'true'
  NO_BACKFILL: 'true'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q pytest
      - run: >-
          pytest -q
          tests/test_gate_btc_xagent_schedule_fallback_boundary.py
          tests/test_gate_btc_xagent_schedule_fallback_scope.py
          tests/test_gate_btc_xagent_schedule_fallback_workflow.py
          tests/test_gate_btc_xagent_schedule_fallback_validation_workflow.py
          tests/test_gate_btc_xagent_schedule_fallback_expected_behavior.py
          tests/test_gate_btc_crypto_forward_schedule_guard.py
      - run: python -m py_compile tools/gate_btc_factory/crypto_forward_schedule_guard.py
      - name: Assert immutable safety boundary
        run: |
          test "$RESEARCH_ONLY" = true
          test "$SHADOW_ONLY" = true
          test "$ENGINE_FEED" = false
          test "$ORDERS" = 0
          test "$REAL_CAPITAL" = 0
          test "$NO_RETUNE" = true
          test "$NO_BACKFILL" = true
