name: GATE BTC B3 H90-H99 Source QA
on:
  pull_request:
    paths:
      - 'tools/gate_btc_b3_h90_h99_prereg.md'
      - 'tools/gate_btc_b3_h90_h99_source_qa.py'
      - '.github/workflows/gate-btc-b3-h90-h99-source-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_NOT_APPROVED: 'true'
  GATE_BTC_ORDERS: '0'
  GATE_BTC_REAL_CAPITAL: '0'
  GATE_BTC_ENGINE_FEED: 'false'
jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: Probe official/public macro-financial sources without economics
        run: python tools/gate_btc_b3_h90_h99_source_qa.py
      - name: Assert isolation and source-only boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/b3_h90_h99/B3_H90_H99_SOURCE_QA.json'))
          assert p['cutoff_exclusive']=='2026-08-10'
          assert p['economics_run'] is False
          assert p['h1_economics_read'] is False
          assert p['survivor_partial_economics_read'] is False
          assert p['orders']==0 and p['real_capital']==0 and p['engine_feed'] is False
          assert p['not_approved'] is True
          print({k:v for k,v in p['families'].items()})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b3-h90-h99-source-qa-${{ github.run_id }}
          path: artifacts/b3_h90_h99/B3_H90_H99_SOURCE_QA.json
          retention-days: 30
          if-no-files-found: error
