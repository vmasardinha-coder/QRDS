name: GATE BTC WIN WDO Cross Asset Regime Bias Guard

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/WIN_WDO_CROSS_ASSET_REGIME_BIAS_GUARD_20260915.json'
      - 'tools/gate_btc_factory/test_win_wdo_cross_asset_regime_bias_guard.py'
      - '.github/workflows/gate-btc-win-wdo-cross-asset-regime-bias-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bias-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bias guards
        run: python -m pytest -q tools/gate_btc_factory/test_win_wdo_cross_asset_regime_bias_guard.py
