name: GATE BTC Profit Retention Execution Audit v1.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-profit-retention-execution-audit.yml
      - tools/gate_btc_profit_retention_execution_protocol_v11.json
      - tools/gate_btc_profit_retention_execution_audit.py
      - tests/test_gate_btc_profit_retention_execution_audit.py

concurrency:
  group: gate-btc-profit-retention-execution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  execution-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: pip install 'pandas>=2,<3' 'numpy>=1.24,<3'
      - name: Verify predeclared v1.1 protocol
        run: |
          python - <<'PY'
          import json
          p=json.load(open('tools/gate_btc_profit_retention_execution_protocol_v11.json', encoding='utf-8'))
          assert p['schema'] == 'gate_btc.profit_retention_execution_protocol.v1_1'
          assert p['lock_activation_gain'] == 0.20
          assert p['lock_giveback_fraction'] == 0.50
          assert p['entry_selection'] == 'UNCHANGED_FROM_PINNED_PHASE1_SELECTIONS_PIT'
          assert p['entry_execution'] == 'FIRST_VALIDATED_DAILY_CLOSE_STRICTLY_AFTER_SIGNAL_DATE'
          assert p['lock_exit_execution'] == 'FIRST_VALIDATED_DAILY_CLOSE_STRICTLY_AFTER_TRIGGER_CLOSE'
          assert p['existing_lock50_name_collision_guard']
          assert p['research_only'] is True and p['engine_feed'] is False
          print('PHASE2_V11_PREDECLARED_PROTOCOL=PASS')
          PY
      - name: Test execution contracts
        run: python -m unittest -v tests/test_gate_btc_profit_retention_execution_audit.py
      - name: Download pinned Phase-1 evidence
        uses: actions/download-artifact@v4
        with:
          name: gate-btc-survivorship-definitive-31276127634
          path: artifacts/phase1_input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31276127634
      - name: Execute v1.1 audit
        run: >-
          python tools/gate_btc_profit_retention_execution_audit.py
          --input-dir artifacts/phase1_input
          --output-dir artifacts/profit_retention_v11
          --protocol tools/gate_btc_profit_retention_execution_protocol_v11.json
          --bootstrap-reps 10000
          --seed 20260808
      - name: Verify safety and output contract
        run: |
          python - <<'PY'
          import json, pandas as pd
          p=json.load(open('artifacts/profit_retention_v11/PHASE2_V11_SUMMARY.json', encoding='utf-8'))
          b=pd.read_csv('artifacts/profit_retention_v11/EXECUTION_BOOTSTRAP.csv')
          d=pd.read_csv('artifacts/profit_retention_v11/EXECUTION_DIAGNOSTIC.csv')
          assert p['status'] == 'PASS_RESEARCH_ONLY'
          assert p['complete_signal_months'] == 62
          assert p['baseline_trades'] == 1240
          assert p['entry_execution'] == 'NEXT_DAILY_BAR'
          assert p['lock_activation_gain'] == 0.20 and p['lock_giveback_fraction'] == 0.50
          assert p['research_only'] is True and p['shadow_only'] is True
          assert p['not_approved'] is True and p['engine_feed'] is False
          assert p['orders_generated'] == 0 and p['real_capital_used'] == 0
          assert p['methodology_changes_phase1'] == 0
          assert set(b['variant']) == {'lock50_exec','lock50_same_close'}
          assert set(d['strategy']) == {'QOS_Moderada','QOS_Ultra'}
          print('PHASE2_V11_EXECUTION_AUDIT_CONTRACT=PASS')
          PY
      - name: Upload v1.1 research package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-profit-retention-execution-${{ github.run_id }}
          path: artifacts/profit_retention_v11/
          retention-days: 30
          if-no-files-found: warn
