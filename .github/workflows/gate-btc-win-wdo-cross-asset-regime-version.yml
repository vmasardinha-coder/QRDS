name: GATE BTC WIN WDO Cross Asset Regime Version

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/WIN_WDO_CROSS_ASSET_REGIME_VERSION_20260915.txt'
      - 'tools/gate_btc_factory/test_win_wdo_cross_asset_regime_version.py'
      - '.github/workflows/gate-btc-win-wdo-cross-asset-regime-version.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version boundary
        run: python -m pytest -q tools/gate_btc_factory/test_win_wdo_cross_asset_regime_version.py
