name: GATE BTC PF Term Structure Source Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/gate_btc_2/PF_TERM_STRUCTURE_CARRY_SOURCE_QUALIFICATION_20260923.json'
      - 'tools/gate_btc_factory/pf_term_structure_carry_source_qualification.py'
      - 'tests/test_gate_btc_pf_term_structure_carry_source_qualification.py'
      - '.github/workflows/gate-btc-pf-term-structure-source-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'artifacts/gate_btc_2/PF_TERM_STRUCTURE_CARRY_SOURCE_QUALIFICATION_20260923.json'
      - 'tools/gate_btc_factory/pf_term_structure_carry_source_qualification.py'
      - 'tests/test_gate_btc_pf_term_structure_carry_source_qualification.py'
      - '.github/workflows/gate-btc-pf-term-structure-source-qualification.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  RESEARCH_ONLY: 'true'
  SHADOW_ONLY: 'true'
  ENGINE_FEED: 'false'
  ORDERS: '0'
  REAL_CAPITAL: '0'
  NO_RETUNE: 'true'
  NO_BACKFILL: 'true'

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: source_repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source qualification boundary
        run: |
          python -m pip install -q requests pytest
          cd source_repo
          python -m py_compile tools/gate_btc_factory/pf_term_structure_carry_source_qualification.py
          pytest -q tests/test_gate_btc_pf_term_structure_carry_source_qualification.py
          python tools/gate_btc_factory/pf_term_structure_carry_source_qualification.py --self-test
      - name: Assert frozen pre-outcome failover contract
        run: |
          cd source_repo
          python - <<'PY'
          import json
          d=json.load(open('artifacts/gate_btc_2/PF_TERM_STRUCTURE_CARRY_SOURCE_QUALIFICATION_20260923.json'))
          assert d['economic_parameters_defined'] is False
          assert d['carry_formula_defined'] is False
          assert d['direction_defined'] is False
          assert d['thresholds_defined'] is False
          assert d['lookbacks_defined'] is False
          assert d['return_horizon_defined'] is False
          assert d['historical_backfill_allowed'] is False
          f=d['preoutcome_transport_failover']
          assert f['allowed'] is True
          assert f['fallback_provider']=='OKX_PUBLIC_API'
          assert f['economics_may_be_read_before_failover'] is False
          assert f['performance_may_influence_failover'] is False
          assert f['mechanism_change_allowed'] is False
          assert f['required_observables_change_allowed'] is False
          assert f['provenance_must_preserve_original_primary_failure'] is True
          assert f['silent_substitution_for_missing_semantic_fields'] is False
          s=d['safety']
          assert s['RESEARCH_ONLY'] and s['SHADOW_ONLY'] and s['NO_RETUNE'] and s['NO_BACKFILL']
          assert s['ENGINE_FEED'] is False and s['ORDERS']==0 and s['REAL_CAPITAL']==0
          assert s['CANONICAL_580_UNTOUCHED'] is True
          print('PF_TERM_STRUCTURE_FAILOVER_CONTRACT=PASS')
          PY
      - name: Probe live public derivative sources
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p live
          python source_repo/tools/gate_btc_factory/pf_term_structure_carry_source_qualification.py --output live/PF_TERM_STRUCTURE_CARRY_SOURCE_QUALIFICATION_RUNTIME.json
      - name: Validate live adjudication
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          d=json.load(open('live/PF_TERM_STRUCTURE_CARRY_SOURCE_QUALIFICATION_RUNTIME.json'))
          assert d['economic_outcomes_read'] is False
          assert d['carry_formula_defined'] is False
          assert d['historical_backfill_started'] is False
          assert d['safety']['canonical_580_untouched'] is True
          assert d['original_primary']['status'] in {'QUALIFIED_PUBLIC_SOURCE','BLOCKED_REQUIRED_PUBLIC_TERM_STRUCTURE_FIELD_MISSING','FAIL_CLOSED_SOURCE_UNVERIFIED'}
          if d['transport_failover']['activated']:
              assert d['fallback']['status']=='PASS'
              assert d['operational_primary']['provider']=='OKX_PUBLIC_API'
              assert d['transport_failover']['economic_outcomes_read_before_failover'] is False
              assert d['transport_failover']['performance_used_for_failover'] is False
          print('PF_TERM_STRUCTURE_LIVE_STATUS='+d['status'])
          print('PF_TERM_STRUCTURE_ORIGINAL_PRIMARY='+d['original_primary']['status'])
          print('PF_TERM_STRUCTURE_FALLBACK='+d['fallback']['status'])
          print('PF_TERM_STRUCTURE_OPERATIONAL_PRIMARY='+str((d.get('operational_primary') or {}).get('provider')))
          PY
      - name: Persist source qualification to canonical runtime
        if: github.event_name != 'pull_request'
        run: |
          git clone --depth 1 --branch gate-btc-runtime "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" runtime_repo
          mkdir -p runtime_repo/runtime/factory_autonomy/parallel_frontier_source_qualifications
          cp live/PF_TERM_STRUCTURE_CARRY_SOURCE_QUALIFICATION_RUNTIME.json runtime_repo/runtime/factory_autonomy/PF_TERM_STRUCTURE_CARRY_SOURCE_QUALIFICATION_RUNTIME.json
          cp live/PF_TERM_STRUCTURE_CARRY_SOURCE_QUALIFICATION_RUNTIME.json runtime_repo/runtime/factory_autonomy/parallel_frontier_source_qualifications/5c6294637c3b4e7f61f9f4419a68671e6b3503314b6520e093b1301d504b3503.json
          git -C runtime_repo config user.name gate-btc-research-bot
          git -C runtime_repo config user.email gate-btc-research-bot@users.noreply.github.com
          git -C runtime_repo add runtime/factory_autonomy/PF_TERM_STRUCTURE_CARRY_SOURCE_QUALIFICATION_RUNTIME.json runtime/factory_autonomy/parallel_frontier_source_qualifications
          git -C runtime_repo diff --cached --quiet && exit 0
          git -C runtime_repo commit -m "PF term-structure source qualification ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            git -C runtime_repo fetch origin gate-btc-runtime
            git -C runtime_repo rebase origin/gate-btc-runtime || { git -C runtime_repo rebase --abort; exit 1; }
            git -C runtime_repo push origin HEAD:gate-btc-runtime && exit 0
            sleep $((i*2))
          done
          exit 1
      - name: Fail only if no operational primary was adjudicated
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          d=json.load(open('live/PF_TERM_STRUCTURE_CARRY_SOURCE_QUALIFICATION_RUNTIME.json'))
          if d.get('operational_primary') is None:
              raise SystemExit('NO_OPERATIONAL_PRIMARY_FAIL_CLOSED')
          print('PF_TERM_STRUCTURE_ADJUDICATED='+d['status'])
          PY
