name: GATE BTC MT5 Shared Family Source

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * 1-5'
  push:
    branches:
      - 'factory/mt5-shared-family-source-*'
    paths:
      - 'tools/gate_btc_factory/mt5_shared_family_source.py'
      - 'tests/test_gate_btc_mt5_shared_family_source.py'
      - '.github/workflows/gate-btc-mt5-shared-family-source.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/mt5_shared_family_source.py'
      - 'tests/test_gate_btc_mt5_shared_family_source.py'
      - 'tools/gate_btc_factory/autonomous_grammar_scout.py'
      - 'tools/gate_btc_2_evidence_factory.py'
      - '.github/workflows/gate-btc-mt5-shared-family-source.yml'
      - '.github/workflows/gate-btc-factory-grammar-scout.yml'

env:
  RESEARCH_ONLY: 'true'
  SHADOW_ONLY: 'true'
  NOT_APPROVED: 'true'
  MT5_READ_ONLY: 'true'
  NO_ORDER_SEND: 'true'
  ENGINE_FEED: 'false'
  ORDERS: '0'
  REAL_CAPITAL: '0'
  NO_RETUNE: 'true'
  NO_BACKFILL: 'true'
  H1_ECONOMICS_READ: 'false'

concurrency:
  group: gate-btc-mt5-shared-family-source
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert immutable research boundary
        run: |
          test "$RESEARCH_ONLY" = true
          test "$SHADOW_ONLY" = true
          test "$NOT_APPROVED" = true
          test "$MT5_READ_ONLY" = true
          test "$NO_ORDER_SEND" = true
          test "$ENGINE_FEED" = false
          test "$ORDERS" = 0
          test "$REAL_CAPITAL" = 0
          test "$NO_RETUNE" = true
          test "$NO_BACKFILL" = true
          test "$H1_ECONOMICS_READ" = false
      - run: python -m pip install -q pytest
      - run: python -m py_compile tools/gate_btc_factory/mt5_shared_family_source.py
      - run: pytest -q tests/test_gate_btc_mt5_shared_family_source.py

  collect:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push'
    runs-on: [self-hosted, Windows, X64, mt5, btg, read-only]
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_repo
      - name: Check out append-only runtime
        uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install read-only MT5 binding
        shell: powershell
        run: python -m pip install --disable-pip-version-check --no-input MetaTrader5
      - name: Assert collector contains no order path
        shell: powershell
        run: |
          $text = Get-Content main_repo/tools/gate_btc_factory/mt5_shared_family_source.py -Raw
          $forbidden = 'order' + '_send' + '('
          if ($text.ToLower().Contains($forbidden)) { throw 'FORBIDDEN_ORDER_SEND_CALL' }
      - name: Capture sanitized MT5 source packet
        shell: powershell
        run: |
          python main_repo/tools/gate_btc_factory/mt5_shared_family_source.py `
            --output runtime_repo/runtime/factory_sources/mt5/SOURCE_PACKET.json `
            --btc2-output runtime_repo/runtime/gate_btc_2/source_discovery/MT5_SOURCE_CANDIDATE.json `
            --max-symbols 200 --bars-per-symbol 96
      - name: Assert shared-source safety and zero scientific credit
        shell: powershell
        run: |
          python -c "import json; p=json.load(open(r'runtime_repo/runtime/factory_sources/mt5/SOURCE_PACKET.json',encoding='utf-8')); s=p['safety']; assert s['MT5_READ_ONLY'] and s['NO_ORDER_SEND']; assert s['ORDERS']==0 and s['REAL_CAPITAL']==0 and s['ENGINE_FEED'] is False; assert p['primary_scientific_truth'] is False; assert p['canonical_prospective_credit']==0 and p['scientific_promotion_credit']==0 and p['historical_backfill_credit']==0; assert p['factory_economics_feedback_allowed'] is False; print('MT5_SHARED_SOURCE_SAFETY=PASS')"
          python -c "import json; p=json.load(open(r'runtime_repo/runtime/gate_btc_2/source_discovery/MT5_SOURCE_CANDIDATE.json',encoding='utf-8')); assert p['may_satisfy_source_admission_without_separate_review'] is False; assert p['may_replace_canonical_source_silently'] is False; assert p['prospective_credit']==0; print('BTC2_MT5_SOURCE_DISCOVERY=PASS')"
      - name: Persist append-only runtime source state
        shell: powershell
        working-directory: runtime_repo
        run: |
          New-Item -ItemType Directory -Force -Path runtime/factory_sources/mt5/audits | Out-Null
          Copy-Item runtime/factory_sources/mt5/SOURCE_PACKET.json ("runtime/factory_sources/mt5/audits/${{ github.run_id }}.json") -Force
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          git add runtime/factory_sources/mt5 runtime/gate_btc_2/source_discovery/MT5_SOURCE_CANDIDATE.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "Append MT5 shared family research source ${{ github.run_id }}"
            for ($i=1; $i -le 5; $i++) {
              git pull --rebase origin gate-btc-runtime
              git push origin HEAD:gate-btc-runtime
              if ($LASTEXITCODE -eq 0) { exit 0 }
              Start-Sleep -Seconds ($i * 2)
            }
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: mt5-shared-family-source-${{ github.run_id }}
          path: |
            runtime_repo/runtime/factory_sources/mt5/SOURCE_PACKET.json
            runtime_repo/runtime/gate_btc_2/source_discovery/MT5_SOURCE_CANDIDATE.json
          if-no-files-found: error
          retention-days: 30
