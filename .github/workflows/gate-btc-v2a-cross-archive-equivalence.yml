name: GATE BTC V2A Candidate Cross-Archive Equivalence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-v2a-cross-archive-equivalence.yml
      - tools/gate_btc_binance_spot_cross_archive_equivalence.py
      - tests/test_gate_btc_binance_spot_cross_archive_equivalence.py

permissions:
  actions: read
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  candidate-cross-archive-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test candidate cross-archive fail-closed boundary
        run: python -m unittest -v tests/test_gate_btc_binance_spot_cross_archive_equivalence.py

      - name: Resolve latest successful source-probe evidence for branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          RUN_ID=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/gate-btc-source-redundancy-probes.yml/runs?branch=${BRANCH}&status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | .[0].id // empty')
          test -n "$RUN_ID"
          ARTIFACT_ID=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("gate-btc-source-probes-")) | .id' | head -1)
          test -n "$ARTIFACT_ID"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > source_probe.zip
          mkdir -p source_probe artifacts/cross_archive
          unzip -q source_probe.zip -d source_probe
          test -f source_probe/binance_spot_v2a_history_depth.json
          echo "SOURCE_PROBE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Run candidate-specific daily-vs-monthly equivalence audit
        run: >-
          python tools/gate_btc_binance_spot_cross_archive_equivalence.py
          --history-report source_probe/binance_spot_v2a_history_depth.json
          --months 3
          --samples-per-month 2
          --output artifacts/cross_archive/binance_spot_candidate_cross_archive_equivalence.json

      - name: Verify audit cannot change frozen engine
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/cross_archive/binance_spot_candidate_cross_archive_equivalence.json', encoding='utf-8'))
          assert p['engine_feed'] is False
          assert p['feeds_frozen_engine'] is False
          assert p['source_substitution_performed'] is False
          assert p['strategy_inputs_changed'] is False
          assert p['denominator_changed'] is False
          assert p['universe_changed'] is False
          assert p['methodology_changes'] == 0
          assert p['orders_generated'] == 0
          assert p['real_capital_used'] == 0
          assert p['promotion_allowed'] is False
          if p['total_mismatches']:
              raise SystemExit('candidate cross-archive mismatch detected')
          print('CANDIDATE_CROSS_ARCHIVE_SAFETY=PASS')
          print('STATUS=' + p['status'])
          print('TOTAL_COMPARED_SAMPLES=' + str(p['total_compared_samples']))
          print('FULLY_PASSED_SYMBOLS=' + ','.join(p['fully_passed_symbols']))
          PY

      - name: Upload candidate equivalence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-v2a-cross-archive-${{ github.run_id }}
          path: artifacts/cross_archive/
          retention-days: 30
          if-no-files-found: error
