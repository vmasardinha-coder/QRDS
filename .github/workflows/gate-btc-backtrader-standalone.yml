name: GATE BTC Backtrader standalone research
on:
  push:
    branches: [research/backtrader-standalone]
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: pip install 'ccxt==4.5.81' 'backtrader==1.9.78.123'
      - name: Run fill-semantics audit
        shell: bash
        run: |
          set -o pipefail
          python artifacts/gate_btc_2/backtrader_research/fill_semantics_audit.py | tee artifacts/gate_btc_2/backtrader_research/fill_semantics_result.json
      - name: Verify isolation
        run: git diff --exit-code origin/main...HEAD -- ':!artifacts/gate_btc_2/backtrader_research/**' ':!.github/workflows/gate-btc-backtrader-standalone.yml'
      - uses: actions/upload-artifact@v4
        with:
          name: gate-btc-backtrader-standalone
          path: artifacts/gate_btc_2/backtrader_research/
