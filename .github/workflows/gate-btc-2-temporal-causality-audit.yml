name: GATE BTC 2 Temporal Causality Audit

on:
  pull_request:
    branches: [main]
    paths:
      - tools/gate_btc_2_challenger_foundation.py
      - tools/gate_btc_2_temporal_causality_audit.py
      - tests/test_gate_btc_2_challenger_foundation.py
      - tests/test_gate_btc_2_temporal_causality_audit.py
      - .github/workflows/gate-btc-2-temporal-causality-audit.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  GATE_BTC_SHADOW_ONLY: "true"
  GATE_BTC_NOT_APPROVED: "true"
  GATE_BTC_ENGINE_FEED: "false"
  GATE_BTC_ORDERS: "0"
  GATE_BTC_REAL_CAPITAL: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  synthetic-causality-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile temporal audit contract
        run: >-
          python -m py_compile
          tools/gate_btc_2_challenger_foundation.py
          tools/gate_btc_2_temporal_causality_audit.py

      - name: Run temporal false-green tests
        run: >-
          python -m unittest -v
          tests/test_gate_btc_2_challenger_foundation.py
          tests/test_gate_btc_2_temporal_causality_audit.py

      - name: Build deterministic synthetic evidence
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: >-
          python tools/gate_btc_2_temporal_causality_audit.py
          --baseline-sha "$BASELINE_SHA"
          --output artifacts/gate_btc_2/temporal_causality/audit.json

      - name: Verify synthetic pass cannot self-promote
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path(
              'artifacts/gate_btc_2/temporal_causality/audit.json'
          ).read_text(encoding='utf-8'))
          assert payload['schema'] == 'gate_btc.2_0.temporal_causality_audit.v1'
          assert payload['status'] == 'PASS_SYNTHETIC_CONFORMANCE_ONLY'
          assert payload['audit_scope'] == 'SYNTHETIC_TRACE_CONFORMANCE_ONLY'
          assert payload['official_dataset_audited'] is False
          assert payload['predictive_validity_established'] is False
          assert payload['stage_5_core_audits_passed'] is False
          assert payload['official_challenger_runs_allowed'] is False
          assert payload['safety']['engine_feed'] is False
          assert payload['safety']['orders_generated'] == 0
          assert payload['safety']['real_capital_used'] == 0
          assert payload['safety']['promotion_allowed'] is False
          print('GATE_BTC_2_TEMPORAL_CAUSALITY=PASS_SYNTHETIC_ONLY')
          print('OFFICIAL_DATASET_AUDIT=NOT_EXECUTED')
          print('OFFICIAL_CHALLENGERS=BLOCKED')
          PY

      - name: Upload synthetic audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-2-temporal-causality-${{ github.run_id }}
          path: artifacts/gate_btc_2/temporal_causality/
          retention-days: 90
          if-no-files-found: error
