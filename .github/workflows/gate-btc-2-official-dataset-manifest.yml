name: GATE BTC 2 Official Dataset Manifest Contract

on:
  pull_request:
    branches: [main]
    paths:
      - tools/gate_btc_2_challenger_foundation.py
      - tools/gate_btc_2_dataset_seal_readiness.py
      - tools/gate_btc_2_official_dataset_contract_v1.json
      - tools/gate_btc_2_official_dataset_manifest.py
      - tools/gate_btc_2_checkpoint6_dataset_contract_decision_v1.json
      - tests/test_gate_btc_2_challenger_foundation.py
      - tests/test_gate_btc_2_adapter_contract.py
      - tests/test_gate_btc_2_dataset_seal_readiness.py
      - tests/test_gate_btc_2_temporal_causality_audit.py
      - tests/test_gate_btc_2_item2_checkpoint4_decision.py
      - tests/test_gate_btc_2_official_dataset_manifest.py
      - tests/test_gate_btc_2_checkpoint6_dataset_contract_decision.py
      - .github/workflows/gate-btc-2-official-dataset-manifest.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-btc-2-official-dataset-manifest-${{ github.ref }}
  cancel-in-progress: false

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  GATE_BTC_SHADOW_ONLY: "true"
  GATE_BTC_NOT_APPROVED: "true"
  GATE_BTC_ENGINE_FEED: "false"
  GATE_BTC_ORDERS: "0"
  GATE_BTC_REAL_CAPITAL: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  exact-manifest-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile data-readiness admission layer
        run: >-
          python -m py_compile
          tools/gate_btc_2_challenger_foundation.py
          tools/gate_btc_2_dataset_seal_readiness.py
          tools/gate_btc_2_official_dataset_manifest.py

      - name: Run complete GATE BTC 2.0 contract suite
        run: >-
          python -m unittest -v
          tests.test_gate_btc_2_challenger_foundation
          tests.test_gate_btc_2_adapter_contract
          tests.test_gate_btc_2_dataset_seal_readiness
          tests.test_gate_btc_2_temporal_causality_audit
          tests.test_gate_btc_2_item2_checkpoint4_decision
          tests.test_gate_btc_2_official_dataset_manifest
          tests.test_gate_btc_2_checkpoint6_dataset_contract_decision

      - name: Verify frozen contract and non-promotion boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.gate_btc_2_official_dataset_manifest import validate_contract

          contract = json.loads(Path(
              'tools/gate_btc_2_official_dataset_contract_v1.json'
          ).read_text(encoding='utf-8'))
          assert validate_contract(contract) == []
          assert contract['policies']['economic_calibration_allowed'] is False
          assert contract['policies']['retrospective_backfill_allowed'] is False
          assert contract['policies']['late_seal_allowed'] is False
          assert contract['policies']['partial_scope_seal_allowed'] is False
          assert contract['policies']['seal_requires_explicit_review'] is True
          assert contract['safety']['engine_feed'] is False
          assert contract['safety']['orders_generated'] == 0
          assert contract['safety']['real_capital_used'] == 0
          print('GATE_BTC_2_OFFICIAL_DATASET_CONTRACT=FROZEN_DATA_READINESS_ONLY')
          PY

  current-runtime-remains-fail-closed:
    needs: exact-manifest-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout baseline tools
        uses: actions/checkout@v4

      - name: Checkout read-only runtime evidence
        uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recompute current official readiness without sealing
        run: |
          python tools/gate_btc_2_dataset_seal_readiness.py \
            --pointer runtime_repo/runtime/GATE_BTC_LATEST_ELIGIBLE_RUN.json \
            --measurement runtime_repo/runtime/GATE_BTC_MEASUREMENT_STATUS.json \
            --reporting runtime_repo/runtime/GATE_BTC_REPORTING_CURRENT_STATE.json \
            --v2a runtime_repo/runtime/data_quality/v2a/STATUS.json \
            --lock runtime_repo/runtime/ledgers/lock25_50/STATUS.json \
            --gateway runtime_repo/runtime/ledgers/gateway_dynamics/STATUS.json \
            --output artifacts/gate_btc_2/checkpoint6/current_readiness.json

      - name: Verify actual evidence cannot be relabeled as a seal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path(
              'artifacts/gate_btc_2/checkpoint6/current_readiness.json'
          ).read_text(encoding='utf-8'))
          assert payload['assessment_kind'] == 'READINESS_ONLY_NOT_A_DATASET_SEAL'
          assert payload['stage_3_dataset_sealed'] is False
          assert payload['official_challenger_runs_allowed'] is False
          assert payload['promotion_allowed'] is False
          assert payload['orders_generated'] == 0
          assert payload['real_capital_used'] == 0
          print('GATE_BTC_2_CURRENT_RUNTIME=FAIL_CLOSED_READINESS_ONLY')
          PY

      - name: Upload read-only checkpoint evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-2-checkpoint6-readiness-${{ github.run_id }}
          path: artifacts/gate_btc_2/checkpoint6/
          retention-days: 90
          if-no-files-found: error
