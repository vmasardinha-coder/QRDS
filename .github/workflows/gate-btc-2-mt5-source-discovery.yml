name: GATE BTC 2 MT5 Source Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '31 * * * 1-5'
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_2_mt5_source_discovery.py'
      - 'tests/test_gate_btc_2_mt5_source_discovery.py'
      - 'tools/gate_btc_factory/mt5_shared_family_source.py'
      - '.github/workflows/gate-btc-2-mt5-source-discovery.yml'

env:
  RESEARCH_ONLY: 'true'
  SHADOW_ONLY: 'true'
  NOT_APPROVED: 'true'
  ENGINE_FEED: 'false'
  ORDERS: '0'
  REAL_CAPITAL: '0'
  NO_BACKFILL: 'true'
  NO_RETUNE: 'true'
  H1_ECONOMICS_READ: 'false'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q pytest
      - run: python -m py_compile tools/gate_btc_2_mt5_source_discovery.py
      - run: pytest -q tests/test_gate_btc_2_mt5_source_discovery.py tests/test_gate_btc_mt5_shared_family_source.py

  consume:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, path: main_repo}
      - uses: actions/checkout@v4
        with: {ref: gate-btc-runtime, path: runtime_repo, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Consume MT5 candidate if available
        run: |
          set -euo pipefail
          P=runtime_repo/runtime/factory_sources/mt5/SOURCE_PACKET.json
          C=runtime_repo/runtime/gate_btc_2/source_discovery/MT5_SOURCE_CANDIDATE.json
          O=runtime_repo/runtime/gate_btc_2/source_discovery/MT5_EVIDENCE_RECORD.json
          if [ -f "$P" ] && [ -f "$C" ]; then
            python main_repo/tools/gate_btc_2_mt5_source_discovery.py --packet "$P" --candidate "$C" --output "$O"
          else
            mkdir -p "$(dirname "$O")"
            printf '%s\n' '{"schema":"gate_btc.2_0.mt5_source_discovery_evidence.v1","status":"MT5_UNAVAILABLE_FAIL_OPEN_TO_OTHER_SOURCES","blocks_other_sources":false,"source_admission_pass":false,"prospective_credit":0,"scientific_promotion_credit":0,"historical_backfill_credit":0,"economics_feedback_allowed":false}' > "$O"
          fi
      - name: Assert non-blocking auxiliary boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('runtime_repo/runtime/gate_btc_2/source_discovery/MT5_EVIDENCE_RECORD.json'))
          assert d['blocks_other_sources'] is False
          assert d['source_admission_pass'] is False
          assert d['prospective_credit']==0 and d['scientific_promotion_credit']==0 and d['historical_backfill_credit']==0
          assert d['economics_feedback_allowed'] is False
          PY
      - name: Persist
        working-directory: runtime_repo
        run: |
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          git add runtime/gate_btc_2/source_discovery/MT5_EVIDENCE_RECORD.json
          git diff --cached --quiet && exit 0
          git commit -m "BTC2 consume MT5 auxiliary source ${{ github.run_id }}"
          for i in 1 2 3 4 5; do git pull --rebase origin gate-btc-runtime && git push origin HEAD:gate-btc-runtime && exit 0; sleep $((i*2)); done
          exit 1
