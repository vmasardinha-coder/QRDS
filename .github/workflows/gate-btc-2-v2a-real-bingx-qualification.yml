name: GATE BTC 2 V2A REAL BingX Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gate-btc-2-v2a-real-bingx-qualification.yml'
      - 'tools/gate_btc_2_v2a_bingx_spot_qualification_runner.py'
      - 'tests/test_gate_btc_2_v2a_bingx_spot_qualification_runner.py'
      - 'artifacts/gate_btc_2/v2a_real_bingx_qualification/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_REAL_CAPITAL: '0'

jobs:
  physical-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test qualifier
        run: |
          python -m py_compile tools/gate_btc_2_v2a_bingx_spot_qualification_runner.py
          python -m unittest tests.test_gate_btc_2_v2a_bingx_spot_qualification_runner -v
      - name: Assert frozen safety boundary
        run: |
          test "$GATE_BTC_RESEARCH_ONLY" = "true"
          test "$GATE_BTC_SHADOW_ONLY" = "true"
          test "$GATE_BTC_REAL_CAPITAL" = "0"
      - name: Capture preregistered exact candidate source
        run: >-
          python tools/gate_btc_2_v2a_bingx_spot_qualification_runner.py
          --symbol REAL --coin-id reallink
          --pair REAL-USDT --base-asset REAL --quote-asset USDT
          --cutoff 2026-09-20
          --output bingx_qualification_evidence
      - name: Assert qualification-only contract
        run: |
          python - <<'PY'
          import json
          x=json.load(open('bingx_qualification_evidence/SUMMARY.json'))
          assert x['provider']=='BINGX_SPOT'
          assert x['symbol']=='REAL' and x['coin_id']=='reallink' and x['pair']=='REAL-USDT'
          assert x['qa_pass'] is True
          assert x['admission_scope']=='NONE'
          assert x['scientific_credit'] is False and x['prospective_credit'] is False
          assert x['engine_feed'] is False and x['orders']==0 and x['real_capital_brl']==0
          assert x['no_backfill'] and x['no_counter_reset'] and x['no_silent_source_substitution'] and x['fail_closed']
          assert x['source_qualification_outcome']=='ELIGIBLE_FOR_SEPARATE_PROSPECTIVE_ONLY_ADJUDICATION'
          print('REAL_BINGX_PHYSICAL_QUALIFICATION=PASS_ZERO_CREDIT')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-btc-2-v2a-real-bingx-qualification
          path: bingx_qualification_evidence/
          retention-days: 90
          if-no-files-found: error
