name: GATE BTC MUB3 Acervo Transport Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gate-btc-mub3-acervo-transport-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RESEARCH_ONLY: 'true'
  SHADOW_ONLY: 'true'
  NOT_APPROVED: 'true'
  ENGINE_FEED: 'false'
  ORDERS: '0'
  REAL_CAPITAL: '0'
  NO_RETUNE: 'true'
  NO_BACKFILL: 'true'
  NO_LATE_SEAL: 'true'
  NO_COUNTER_RESET: 'true'
  FAIL_CLOSED: 'true'
  H1_ECONOMICS_READ: 'false'

jobs:
  probe-public-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Assert immutable research boundary
        run: |
          test "$RESEARCH_ONLY" = true
          test "$SHADOW_ONLY" = true
          test "$NOT_APPROVED" = true
          test "$ENGINE_FEED" = false
          test "$ORDERS" = 0
          test "$REAL_CAPITAL" = 0
          test "$NO_RETUNE" = true
          test "$NO_BACKFILL" = true
          test "$NO_LATE_SEAL" = true
          test "$NO_COUNTER_RESET" = true
          test "$FAIL_CLOSED" = true
          test "$H1_ECONOMICS_READ" = false

      - name: Probe public MUB3 Acervo transport contract only
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, re, urllib.parse, urllib.request
          from datetime import datetime, timezone

          ROOT='https://mub3.org.br/centro-referencia/acervo'
          UA='QRDS-research-source-transport-probe/1.0'

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
                  return {
                      'url':url,
                      'final_url':r.geturl(),
                      'status':getattr(r,'status',200),
                      'content_type':str(r.headers.get('Content-Type','')),
                      'bytes':len(raw),
                      'sha256':hashlib.sha256(raw).hexdigest(),
                      'raw':raw,
                  }

          report={
              'schema':'qrds.factory.mub3_acervo_transport_probe.v1',
              'generated_at_utc':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'purpose':'REVERSE_ENGINEER_PUBLIC_MUB3_ARCHIVE_SEARCH_DOWNLOAD_TRANSPORT_ONLY',
              'source_gate_change':'NONE',
              'scientific_credit':0,
              'historical_backfill_credit':0,
              'economics_read':False,
              'safety':{
                  'RESEARCH_ONLY':True,'SHADOW_ONLY':True,'NOT_APPROVED':True,
                  'ENGINE_FEED':False,'ORDERS':0,'REAL_CAPITAL':0,
                  'NO_RETUNE':True,'NO_BACKFILL':True,'NO_LATE_SEAL':True,
                  'NO_COUNTER_RESET':True,'FAIL_CLOSED':True,'H1_ECONOMICS_READ':False,
              },
              'page':{},
              'scripts':[],
              'candidate_endpoints':[],
          }

          page=fetch(ROOT)
          html=page.pop('raw').decode('utf-8','replace')
          report['page']=page
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          srcs=list(dict.fromkeys(urllib.parse.urljoin(ROOT,s) for s in srcs))

          patterns=[
              r'https?://[^"\'\s)]+',
              r'["\'](/[^"\']*(?:api|acervo|search|download|arquivo|document|record|item)[^"\']*)["\']',
          ]
          seen=set()
          for src in srcs[:40]:
              row={'url':src}
              try:
                  obj=fetch(src); raw=obj.pop('raw'); text=raw.decode('utf-8','replace')
                  row.update(obj)
                  hits=[]
                  for pat in patterns:
                      for m in re.findall(pat,text,re.I):
                          val=m if isinstance(m,str) else ''.join(m)
                          if not val: continue
                          u=urllib.parse.urljoin(src,val)
                          if 'mub3.org.br' not in u and not any(k in u.lower() for k in ('api','acervo','search','download')):
                              continue
                          if u not in seen:
                              seen.add(u); hits.append(u)
                  row['candidate_hits']=hits[:200]
                  report['candidate_endpoints'].extend(hits[:200])
              except Exception as exc:
                  row['error']=f'{type(exc).__name__}: {exc}'
              report['scripts'].append(row)

          report['candidate_endpoints']=list(dict.fromkeys(report['candidate_endpoints']))

          # Capture public bundle context around the discovered MUB3 search API
          report['api_search_contexts']=[]
          report['webdav_contexts']=[]
          for row in report['scripts']:
              if 'candidate_hits' not in row or 'https://mub3.org.br/api/search' not in row.get('candidate_hits',[]):
                  continue
              try:
                  obj=fetch(row['url']); text=obj.pop('raw').decode('utf-8','replace')
                  for m in re.finditer(r'/api/search',text,re.I):
                      a=max(0,m.start()-1800); b=min(len(text),m.end()+2600)
                      snippet=text[a:b]
                      report['api_search_contexts'].append({
                          'script_url':row['url'],
                          'snippet_sha256':hashlib.sha256(snippet.encode('utf-8','replace')).hexdigest(),
                          'snippet':snippet,
                      })
              except Exception as exc:
                  report['api_search_contexts'].append({'script_url':row['url'],'error':f'{type(exc).__name__}: {exc}'})
              try:
                  obj=fetch(row['url']); text=obj.pop('raw').decode('utf-8','replace')
                  for pat in (r'GetWebDavUrl', r'/api/File/', r'urlWebDav'):
                      for m in re.finditer(pat,text,re.I):
                          a=max(0,m.start()-2200); b=min(len(text),m.end()+3200)
                          snippet=text[a:b]
                          report['webdav_contexts'].append({
                              'script_url':row['url'],'pattern':pat,
                              'snippet_sha256':hashlib.sha256(snippet.encode('utf-8','replace')).hexdigest(),
                              'snippet':snippet,
                          })
              except Exception as exc:
                  report['webdav_contexts'].append({'script_url':row['url'],'error':f'{type(exc).__name__}: {exc}'})

          # Probe the public API contract with only UI-derived candidate page names.
          report['api_contract_probes']=[]
          for page_name in ('Acervo','Museu','Depoimentos'):
              base_state={
                  'currentPage':0,'itemsPerPage':8,'orderBy':4,'nextPage':False,
                  'totalPage':1,'totalItems':8,'searchTerm':'','selectedAttribute':None,
                  'startDate':None,'endDate':None,'loadAttributes':True,
                  'blocked':False,'loading':False,'error':None,'selectedDocument':None,
              }
              payload={'pageName':page_name,'searchParams':base_state,'selectedDocumentType':None}
              data=json.dumps(payload,separators=(',',':')).encode()
              req=urllib.request.Request(
                  urllib.parse.urljoin(ROOT,'/api/search'),
                  data=data,
                  headers={'User-Agent':UA,'Accept':'application/json','Content-Type':'application/json'},
                  method='POST',
              )
              row={'pageName':page_name,'request_sha256':hashlib.sha256(data).hexdigest()}
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read()
                      row.update({
                          'status':getattr(r,'status',200),
                          'content_type':str(r.headers.get('Content-Type','')),
                          'bytes':len(raw),
                          'sha256':hashlib.sha256(raw).hexdigest(),
                          'json_keys':sorted((json.loads(raw.decode('utf-8')) or {}).keys()) if raw else [],
                          'sample':raw[:2000].decode('utf-8','replace'),
                      })
              except urllib.error.HTTPError as exc:
                  raw=exc.read()
                  row.update({
                      'status':exc.code,
                      'bytes':len(raw),
                      'sha256':hashlib.sha256(raw).hexdigest() if raw else None,
                      'sample':raw[:2000].decode('utf-8','replace'),
                  })
              except Exception as exc:
                  row['error']=f'{type(exc).__name__}: {exc}'
              report['api_contract_probes'].append(row)

          # Qualify Acervo document types and representative 2025 BDI metadata.
          report['acervo_document_types']={}
          try:
              req=urllib.request.Request(
                  urllib.parse.urljoin(ROOT,'/api/document-type?pageName=Acervo'),
                  headers={'User-Agent':UA,'Accept':'application/json'},
              )
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
                  report['acervo_document_types']={
                      'status':getattr(r,'status',200),
                      'content_type':str(r.headers.get('Content-Type','')),
                      'bytes':len(raw),
                      'sha256':hashlib.sha256(raw).hexdigest(),
                      'sample':raw[:8000].decode('utf-8','replace'),
                  }
          except Exception as exc:
              report['acervo_document_types']={'error':f'{type(exc).__name__}: {exc}'}

          report['bdi_2025_search_probes']=[]
          for term in (
              'Boletim Diário de Informações Unificado - 02/01/2025',
              '02/01/2025',
              'Boletim Diário de Informações Unificado',
          ):
              state={
                  'currentPage':0,'itemsPerPage':64,'orderBy':4,'nextPage':False,
                  'totalPage':1,'totalItems':64,'searchTerm':term,'selectedAttribute':None,
                  'startDate':None,'endDate':None,'loadAttributes':True,
                  'blocked':False,'loading':False,'error':None,'selectedDocument':None,
              }
              payload={'pageName':'Acervo','searchParams':state,'selectedDocumentType':None}
              data=json.dumps(payload,separators=(',',':')).encode()
              req=urllib.request.Request(
                  urllib.parse.urljoin(ROOT,'/api/search'),
                  data=data,
                  headers={'User-Agent':UA,'Accept':'application/json','Content-Type':'application/json'},
                  method='POST',
              )
              row={'searchTerm':term,'request_sha256':hashlib.sha256(data).hexdigest()}
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read(); obj=json.loads(raw.decode('utf-8')) if raw else {}
                      coll=obj.get('Collection') or []
                      row.update({
                          'status':getattr(r,'status',200),
                          'content_type':str(r.headers.get('Content-Type','')),
                          'bytes':len(raw),
                          'sha256':hashlib.sha256(raw).hexdigest(),
                          'total':obj.get('Total'),
                          'matches':[{
                              'Key':x.get('Key'),'EntityId':x.get('EntityId'),'Title':x.get('Title'),
                              'PublishDate':x.get('PublishDate'),'CreatedDate':x.get('CreatedDate'),
                              'LastUpdatedDate':x.get('LastUpdatedDate'),'Files':x.get('Files'),
                              'FilesId':x.get('FilesId'),'FilesFull':x.get('FilesFull'),
                              'DocumentType':x.get('DocumentType'),'Storage':x.get('Storage'),
                          } for x in coll[:20]],
                      })
                      # Fetch public document metadata for exact/2025-looking matches only.
                      row['document_metadata']=[]
                      for x in coll[:20]:
                          title=str(x.get('Title') or '')
                          if '2025' not in title and '02/01/2025' not in title:
                              continue
                          key=str(x.get('Key') or '')
                          if not key:
                              continue
                          u=urllib.parse.urljoin(ROOT,'/api/document/?key='+urllib.parse.quote(key))
                          try:
                              rq=urllib.request.Request(u,headers={'User-Agent':UA,'Accept':'application/json'})
                              with urllib.request.urlopen(rq,timeout=30) as dr:
                                  draw=dr.read()
                                  row['document_metadata'].append({
                                      'key':key,'url':u,'status':getattr(dr,'status',200),
                                      'content_type':str(dr.headers.get('Content-Type','')),
                                      'bytes':len(draw),'sha256':hashlib.sha256(draw).hexdigest(),
                                      'sample':draw[:12000].decode('utf-8','replace'),
                                  })
                          except Exception as exc:
                              row['document_metadata'].append({'key':key,'url':u,'error':f'{type(exc).__name__}: {exc}'})
              except Exception as exc:
                  row['error']=f'{type(exc).__name__}: {exc}'
              report['bdi_2025_search_probes'].append(row)

          # Resolve and fetch one exact public BDI physical sample from 2025.
          report['bdi_2025_physical_sample']={}
          exact_key='4a2eebb2c1f949909f1a80af9f0abcf5'
          try:
              # Re-query exact record to obtain FilesFull deterministically.
              state={
                  'currentPage':0,'itemsPerPage':8,'orderBy':4,'nextPage':False,
                  'totalPage':1,'totalItems':8,
                  'searchTerm':'Boletim Diário de Informações Unificado - 02/01/2025',
                  'selectedAttribute':None,'startDate':None,'endDate':None,
                  'loadAttributes':True,'blocked':False,'loading':False,
                  'error':None,'selectedDocument':None,
              }
              payload={'pageName':'Acervo','searchParams':state,'selectedDocumentType':None}
              data=json.dumps(payload,separators=(',',':')).encode()
              req=urllib.request.Request(
                  urllib.parse.urljoin(ROOT,'/api/search'),
                  data=data,
                  headers={'User-Agent':UA,'Accept':'application/json','Content-Type':'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(req,timeout=30) as r:
                  obj=json.loads(r.read().decode('utf-8'))
              rec=next((x for x in (obj.get('Collection') or []) if str(x.get('Key'))==exact_key),None)
              if rec is None:
                  raise RuntimeError('EXACT_2025_BDI_RECORD_NOT_FOUND')
              files=json.loads(rec.get('FilesFull') or '[]')
              if not files:
                  raise RuntimeError('EXACT_2025_BDI_NO_FILES')
              file0=files[0]
              webdav=str(file0.get('urlWebDav') or '')
              if not webdav:
                  raise RuntimeError('EXACT_2025_BDI_NO_WEBDAV_URL')
              resolve_url=urllib.parse.urljoin(ROOT,urllib.parse.quote(webdav,safe='/:?=&%'))
              rq=urllib.request.Request(resolve_url,headers={'User-Agent':UA,'Accept':'application/json,*/*'})
              with urllib.request.urlopen(rq,timeout=30) as rr:
                  rraw=rr.read()
                  rct=str(rr.headers.get('Content-Type',''))
                  rfinal=rr.geturl()
              resolve_text=rraw.decode('utf-8','replace')
              try:
                  resolved_obj=json.loads(resolve_text)
              except Exception:
                  resolved_obj=None

              candidates=[]
              def walk(x):
                  if isinstance(x,dict):
                      for v in x.values(): walk(v)
                  elif isinstance(x,list):
                      for v in x: walk(v)
                  elif isinstance(x,str) and x.startswith(('http://','https://')):
                      candidates.append(x)
              if resolved_obj is not None:
                  walk(resolved_obj)
              else:
                  candidates.extend(re.findall(r'https?://[^"\\\s]+',resolve_text))

              sample={
                  'record_key':exact_key,
                  'title':rec.get('Title'),
                  'publish_date':rec.get('PublishDate'),
                  'last_updated_date':rec.get('LastUpdatedDate'),
                  'created_date':rec.get('CreatedDate'),
                  'file_name':file0.get('name'),
                  'file_key':file0.get('key'),
                  'url_webdav':webdav,
                  'resolve_url':resolve_url,
                  'resolve_status':200,
                  'resolve_content_type':rct,
                  'resolve_final_url':rfinal,
                  'resolve_bytes':len(rraw),
                  'resolve_sha256':hashlib.sha256(rraw).hexdigest(),
                  'resolved_candidates':candidates[:20],
              }

              if candidates:
                  furl=candidates[0]
                  fq=urllib.request.Request(furl,headers={'User-Agent':UA,'Accept':'application/pdf,*/*'})
                  with urllib.request.urlopen(fq,timeout=90) as fr:
                      praw=fr.read()
                      sample.update({
                          'physical_url':furl,
                          'physical_final_url':fr.geturl(),
                          'physical_status':getattr(fr,'status',200),
                          'physical_content_type':str(fr.headers.get('Content-Type','')),
                          'physical_bytes':len(praw),
                          'physical_sha256':hashlib.sha256(praw).hexdigest(),
                          'pdf_signature':praw.startswith(b'%PDF-'),
                      })
              report['bdi_2025_physical_sample']=sample
          except Exception as exc:
              report['bdi_2025_physical_sample']={'error':f'{type(exc).__name__}: {exc}'}

          report['adjudication']='PUBLIC_MACHINE_RETRIEVAL_CONTRACT_DISCOVERED' if report['candidate_endpoints'] else 'PUBLIC_UI_REACHABLE_MACHINE_RETRIEVAL_CONTRACT_NOT_EXPOSED'
          with open('MUB3_ACERVO_TRANSPORT_PROBE.json','w',encoding='utf-8') as f:
              json.dump(report,f,ensure_ascii=False,indent=2,sort_keys=True)
              f.write('\n')
          print(json.dumps({
              'adjudication':report['adjudication'],
              'page_status':report['page'].get('status'),
              'script_count':len(report['scripts']),
              'candidate_endpoint_count':len(report['candidate_endpoints']),
          },sort_keys=True))
          PY

      - name: Assert transport-only safety
        run: |
          python - <<'PY'
          import json
          d=json.load(open('MUB3_ACERVO_TRANSPORT_PROBE.json',encoding='utf-8'))
          assert d['source_gate_change']=='NONE'
          assert d['scientific_credit']==0
          assert d['historical_backfill_credit']==0
          assert d['economics_read'] is False
          s=d['safety']
          assert s['RESEARCH_ONLY'] and s['SHADOW_ONLY'] and s['NOT_APPROVED']
          assert s['ENGINE_FEED'] is False and s['ORDERS']==0 and s['REAL_CAPITAL']==0
          assert s['NO_RETUNE'] and s['NO_BACKFILL'] and s['NO_LATE_SEAL']
          assert s['NO_COUNTER_RESET'] and s['FAIL_CLOSED']
          assert s['H1_ECONOMICS_READ'] is False
          print('MUB3_ACERVO_TRANSPORT_SAFETY=PASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mub3-acervo-transport-probe-${{ github.run_id }}
          path: MUB3_ACERVO_TRANSPORT_PROBE.json
          if-no-files-found: error
          retention-days: 30
