name: GATE BTC B3 H31 Intraday Shadow Plumbing

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "tools/gate_btc_b3_h31_intraday_shadow.py"
      - "windows_local_verifier/Invoke-GateBtcH31IntradayShadow.ps1"
      - ".github/workflows/gate-btc-b3-h31-intraday-shadow.yml"
  push:
    branches:
      - "factory/h31-intraday-shadow-*"
    paths:
      - "tools/gate_btc_b3_h31_intraday_shadow.py"
      - "windows_local_verifier/Invoke-GateBtcH31IntradayShadow.ps1"
      - ".github/workflows/gate-btc-b3-h31-intraday-shadow.yml"

env:
  RESEARCH_ONLY: "true"
  SHADOW_ONLY: "true"
  MT5_READ_ONLY: "true"
  PAPER_CALCULATION: "true"
  NO_ORDER_SEND: "true"
  ORDERS: "0"
  REAL_CAPITAL: "0"
  ENGINE_FEED: "false"
  NO_RETUNE: "true"
  NO_BACKFILL: "true"

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert immutable shadow boundary
        shell: powershell
        run: |
          if ($env:MT5_READ_ONLY -ne 'true') { throw 'MT5_READ_ONLY' }
          if ($env:SHADOW_ONLY -ne 'true') { throw 'SHADOW_ONLY' }
          if ($env:PAPER_CALCULATION -ne 'true') { throw 'PAPER_CALCULATION' }
          if ($env:NO_ORDER_SEND -ne 'true') { throw 'NO_ORDER_SEND' }
          if ($env:ORDERS -ne '0' -or $env:REAL_CAPITAL -ne '0' -or $env:ENGINE_FEED -ne 'false') { throw 'SAFETY' }
          if ($env:NO_RETUNE -ne 'true' -or $env:NO_BACKFILL -ne 'true') { throw 'SCIENTIFIC_BOUNDARY' }
      - name: Python compile
        run: python -m py_compile tools/gate_btc_b3_h31_intraday_shadow.py
      - name: PowerShell 5.1 parser check
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'windows_local_verifier/Invoke-GateBtcH31IntradayShadow.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if (@($errors).Count -ne 0) { $errors | Format-List * | Out-String | Write-Error }
      - name: Assert no order API in runner
        shell: powershell
        run: |
          $text = Get-Content tools/gate_btc_b3_h31_intraday_shadow.py -Raw
          if ($text -match 'order_send\s*\(') { throw 'ORDER_SEND_CODEPATH_FORBIDDEN' }
