name: GATE BTC B3 H31 Intraday Shadow

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 12-21 * * 1-5"
  pull_request:
    branches: [main]
    paths:
      - "tools/gate_btc_b3_h31_intraday_shadow.py"
      - "tools/gate_btc_b3_h31_economics.py"
      - "tools/gate_btc_b3_h31_intraday_shadow_agent.ps1"
      - ".github/workflows/gate-btc-b3-h31-intraday-shadow.yml"

permissions:
  contents: write

env:
  RESEARCH_ONLY: "true"
  SHADOW_ONLY: "true"
  MT5_READ_ONLY: "true"
  PAPER_CALCULATION: "true"
  NO_ORDER_SEND: "true"
  ORDERS: "0"
  REAL_CAPITAL: "0"
  ENGINE_FEED: "false"
  NO_RETUNE: "true"
  NO_BACKFILL: "true"

concurrency:
  group: gate-btc-b3-h31-intraday-shadow-live
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert immutable shadow boundary
        shell: powershell
        run: |
          if ($env:MT5_READ_ONLY -ne 'true') { throw 'MT5_READ_ONLY' }
          if ($env:SHADOW_ONLY -ne 'true') { throw 'SHADOW_ONLY' }
          if ($env:PAPER_CALCULATION -ne 'true') { throw 'PAPER_CALCULATION' }
          if ($env:NO_ORDER_SEND -ne 'true') { throw 'NO_ORDER_SEND' }
          if ($env:ORDERS -ne '0' -or $env:REAL_CAPITAL -ne '0' -or $env:ENGINE_FEED -ne 'false') { throw 'SAFETY' }
          if ($env:NO_RETUNE -ne 'true' -or $env:NO_BACKFILL -ne 'true') { throw 'SCIENTIFIC_BOUNDARY' }
      - name: Python compile
        run: python -m py_compile tools/gate_btc_b3_h31_intraday_shadow.py tools/gate_btc_b3_h31_economics.py
      - name: PowerShell 5.1 parser check
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'tools/gate_btc_b3_h31_intraday_shadow_agent.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if (@($errors).Count -ne 0) { $errors | Format-List * | Out-String | Write-Error }
      - name: Assert no order API in runner
        shell: powershell
        run: |
          $text = (Get-Content tools/gate_btc_b3_h31_intraday_shadow.py -Raw) + (Get-Content tools/gate_btc_b3_h31_economics.py -Raw)
          if ($text -match 'order_send\s*\(') { throw 'ORDER_SEND_CODEPATH_FORBIDDEN' }

  intraday-shadow:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    timeout-minutes: 4
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_repo

      - name: Check out append-only runtime
        uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 0

      - name: Assert local safety boundary and Python MT5 availability
        shell: powershell
        run: |
          if ($env:MT5_READ_ONLY -ne 'true') { throw 'MT5_READ_ONLY' }
          if ($env:SHADOW_ONLY -ne 'true') { throw 'SHADOW_ONLY' }
          if ($env:PAPER_CALCULATION -ne 'true') { throw 'PAPER_CALCULATION' }
          if ($env:NO_ORDER_SEND -ne 'true') { throw 'NO_ORDER_SEND' }
          if ($env:ORDERS -ne '0' -or $env:REAL_CAPITAL -ne '0' -or $env:ENGINE_FEED -ne 'false') { throw 'SAFETY' }
          python -m pip install -q MetaTrader5 pandas requests numpy
          python -c "import MetaTrader5 as mt5; print('MT5_PYTHON_MODULE=READY')"

      - name: Observe current H31 session from local MT5 read-only
        shell: powershell
        working-directory: main_repo
        run: |
          python tools/gate_btc_b3_h31_intraday_shadow.py `
            --canonical-dir ..\runtime_repo\runtime\ledgers\b3_h31_prospective `
            --shadow-dir ..\runtime_repo\runtime\ledgers\b3_h31_shadow_paper
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 2) { throw "H31 intraday runner failed: $LASTEXITCODE" }

      - name: Aggregate H31 paper economics
        shell: powershell
        working-directory: main_repo
        run: |
          python tools/gate_btc_b3_h31_economics.py `
            --shadow-dir ..\runtime_repo\runtime\ledgers\b3_h31_shadow_paper
          if ($LASTEXITCODE -ne 0) { throw "H31 economics aggregation failed: $LASTEXITCODE" }

      - name: Prove live current-session monitoring
        shell: powershell
        run: |
          $p = 'runtime_repo\runtime\ledgers\b3_h31_shadow_paper\INTRADAY_STATUS.json'
          if (-not (Test-Path $p)) { throw 'H31_INTRADAY_STATUS_MISSING' }
          $s = Get-Content $p -Raw | ConvertFrom-Json
          Write-Host "H31_INTRADAY_SHADOW_STATUS=$($s.H31_INTRADAY_SHADOW_STATUS)"
          Write-Host "H31_INTRADAY_SESSION=$($s.H31_INTRADAY_SESSION)"
          Write-Host "H31_INTRADAY_MONITORING=$($s.H31_INTRADAY_MONITORING)"
          Write-Host "H31_30M_WINDOW_COMPLETE=$($s.H31_30M_WINDOW_COMPLETE)"
          Write-Host "H31_TRIGGER_STATE=$($s.H31_TRIGGER_STATE)"
          Write-Host "H31_PAPER_POSITION=$($s.H31_PAPER_POSITION)"
          Write-Host "H31_MT5_READY=$($s.H31_MT5_READY)"
          Write-Host "H31_CANONICAL_ELIGIBLE_OBSERVATIONS=$($s.H31_CANONICAL_ELIGIBLE_OBSERVATIONS)"
          $e = Get-Content 'runtime_repo\runtime\ledgers\b3_h31_shadow_paper\ECONOMICS_STATUS.json' -Raw | ConvertFrom-Json
          Write-Host "H31_ECONOMICS_STATUS=$($e.status)"
          Write-Host "H31_PAPER_TRADES=$($e.paper_trades)"
          Write-Host "H31_REFERENCE_NET_BPS_SUM=$($e.reference_net_bps_sum)"
          if ($s.SHADOW_CREDIT_TO_CANONICAL -ne 0 -or $s.ORDERS -ne 0 -or $s.REAL_CAPITAL -ne 0 -or $s.ENGINE_FEED -ne $false) { throw 'H31_SAFETY_BOUNDARY_BROKEN' }

      - name: Publish append-only H31 intraday shadow runtime
        shell: powershell
        working-directory: runtime_repo
        run: |
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          git add runtime/ledgers/b3_h31_shadow_paper
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'H31_RUNTIME_NO_CHANGE=true'; exit 0 }
          git commit -m "Append H31 MT5 intraday shadow $env:GITHUB_RUN_ID"
          git pull --rebase origin gate-btc-runtime
          git push origin HEAD:gate-btc-runtime
