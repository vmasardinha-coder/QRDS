name: GATE BTC B3 V3 Physical Archive Extent Probe
on:
  pull_request:
    paths:
      - tools/gate_btc_factory/b3_v3_physical_archive_extent_probe.py
      - tests/test_gate_btc_b3_v3_physical_archive_extent_probe.py
      - .github/workflows/gate-btc-b3-v3-physical-archive-extent-probe.yml
  push:
    branches: [main]
    paths:
      - tools/gate_btc_factory/b3_v3_physical_archive_extent_probe.py
      - .github/workflows/gate-btc-b3-v3-physical-archive-extent-probe.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  RESEARCH_ONLY: 'true'
  SHADOW_ONLY: 'true'
  NOT_APPROVED: 'true'
  ENGINE_FEED: 'false'
  ORDERS: '0'
  REAL_CAPITAL: '0'
  NO_RETUNE: 'true'
  NO_BACKFILL: 'true'
  NO_COUNTER_RESET: 'true'
  FAIL_CLOSED: 'true'
  H1_ECONOMICS_READ: 'false'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Assert immutable boundary
        run: |
          test "$RESEARCH_ONLY" = true && test "$SHADOW_ONLY" = true && test "$NOT_APPROVED" = true
          test "$ENGINE_FEED" = false && test "$ORDERS" = 0 && test "$REAL_CAPITAL" = 0
          test "$NO_RETUNE" = true && test "$NO_BACKFILL" = true && test "$NO_COUNTER_RESET" = true
          test "$FAIL_CLOSED" = true && test "$H1_ECONOMICS_READ" = false
      - name: Test executor
        run: |
          python -m pip install -q requests pytest
          python -m py_compile tools/gate_btc_factory/b3_v3_physical_archive_extent_probe.py
          pytest -q tests/test_gate_btc_b3_v3_physical_archive_extent_probe.py
      - name: Execute merged preregistered matrix
        if: github.event_name != 'pull_request'
        run: python tools/gate_btc_factory/b3_v3_physical_archive_extent_probe.py --output artifacts/gate_btc_factory/b3_v3_physical_archive_extent_probe.json
      - name: Assert zero-credit fail-closed result
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/gate_btc_factory/b3_v3_physical_archive_extent_probe.json'))
          assert d['source_gate_green'] is False and d['source_gate_credit']==0
          assert d['historical_backfill_credit']==0 and d['prospective_credit']==0
          assert d['economics_read'] is False and d['data_gap_definitive'] is False
          s=d['safety']; assert s['FAIL_CLOSED'] and s['RESEARCH_ONLY'] and s['SHADOW_ONLY'] and s['NOT_APPROVED']
          assert s['ENGINE_FEED'] is False and s['ORDERS']==0 and s['REAL_CAPITAL']==0
          assert s['NO_RETUNE'] and s['NO_BACKFILL'] and s['NO_COUNTER_RESET'] and s['H1_ECONOMICS_READ'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: gate-btc-b3-v3-physical-archive-extent-${{ github.run_id }}
          path: artifacts/gate_btc_factory/b3_v3_physical_archive_extent_probe.json
          retention-days: 30
          if-no-files-found: error
