name: GATE BTC Momentum M2 Repair Validation

on:
  pull_request:
    paths:
      - tools/gate_btc_momentum_shadow_collect.py
      - tools/gate_btc_factory/operational_repair_loop.py
      - tests/test_gate_btc_momentum_m2_coverage.py
      - tests/test_gate_btc_factory_operational_repair.py
      - .github/workflows/gate-btc-factory-operational-repair.yml
      - .github/workflows/gate-btc-momentum-m2-repair-validation.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  frozen-live-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: migration/canonical/v2a/requirements.txt
      - name: Install frozen dependencies
        run: pip install -r migration/canonical/v2a/requirements.txt
      - name: Run mechanical regression guards
        run: |
          python -m unittest tests.test_gate_btc_momentum_m2_coverage tests.test_gate_btc_factory_operational_repair -v
          python -m py_compile tools/gate_btc_momentum_shadow_collect.py tools/gate_btc_factory/operational_repair_loop.py
      - name: Resolve same completed UTC cutoff
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          cutoff=(datetime.now(timezone.utc).date()-timedelta(days=1)).isoformat()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'MOMENTUM_CUTOFF={cutoff}\n')
          print(cutoff)
          PY
      - name: Collect canonical public V2A input
        run: |
          mkdir -p validation/qos validation/evidence validation/momentum validation/ledger
          python migration/canonical/v2a/scripts/00_run_all_v2a.py --output-zip validation/qos/qos_v2a_public_collection.zip
      - name: Run frozen replay
        run: >-
          python tools/v2a_frozen_replay.py
          validation/qos/qos_v2a_public_collection.zip
          --data-cutoff "$MOMENTUM_CUTOFF"
          --output-zip validation/qos/qos_v2a_outputs.zip
          --evidence-dir validation/evidence
      - name: Reexecute frozen M1/M2 collector
        run: >-
          python tools/gate_btc_momentum_shadow_collect.py
          --v2a-zip validation/qos/qos_v2a_outputs.zip
          --cutoff "$MOMENTUM_CUTOFF"
          --ledger-dir validation/ledger
          --output validation/momentum/GATE_BTC_MOMENTUM_M1M2_${MOMENTUM_CUTOFF}.json
          --m2-diagnostic-output validation/momentum/M2_COVERAGE_DIAGNOSTIC.json
      - name: Prove complete BTC M2 reference coverage
        run: |
          python - <<'PY'
          import json
          d=json.load(open('validation/momentum/M2_COVERAGE_DIAGNOSTIC.json',encoding='utf-8'))
          assert d['status']=='PASS_COVERAGE', d
          assert d['btc_reference_window_count']==31, d
          assert d['btc_reference_window'][-1]==d['cutoff'], d
          assert d['scientific_changes']==0, d
          assert d['synthetic_backfill'] is False, d
          print(json.dumps({
              'M2_COVERAGE':'PASS',
              'cutoff':d['cutoff'],
              'btc_reference_window_start':d['btc_reference_window'][0],
              'btc_reference_window_end':d['btc_reference_window'][-1],
              'btc_reference_window_count':d['btc_reference_window_count'],
              'union_last_31_missing_from_btc':d['union_last_31_missing_from_btc'],
              'eligible_assets':d['eligible_assets'],
              'excluded_incomplete_history':d['excluded_incomplete_history'],
              'scientific_changes':0,
              'synthetic_backfill':False,
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentum-m2-repair-validation-${{ github.run_id }}
          path: |
            validation/momentum
            validation/evidence
          retention-days: 90
