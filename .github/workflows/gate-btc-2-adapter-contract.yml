name: GATE BTC 2 Adapter Contract

on:
  pull_request:
    branches: [main]
    paths:
      - tools/gate_btc_2_challenger_foundation.py
      - tools/gate_btc_2_adapter_contract.py
      - tests/test_gate_btc_2_challenger_foundation.py
      - tests/test_gate_btc_2_adapter_contract.py
      - .github/workflows/gate-btc-2-adapter-contract.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  GATE_BTC_SHADOW_ONLY: "true"
  GATE_BTC_NOT_APPROVED: "true"
  GATE_BTC_ENGINE_FEED: "false"
  GATE_BTC_ORDERS: "0"
  GATE_BTC_REAL_CAPITAL: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile engine-neutral adapter
        run: >-
          python -m py_compile
          tools/gate_btc_2_challenger_foundation.py
          tools/gate_btc_2_adapter_contract.py

      - name: Run fail-closed adapter tests
        run: >-
          python -m unittest -v
          tests/test_gate_btc_2_challenger_foundation.py
          tests/test_gate_btc_2_adapter_contract.py

      - name: Build synthetic conformance artifact
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: >-
          python tools/gate_btc_2_adapter_contract.py
          --baseline-sha "$BASELINE_SHA"
          --output artifacts/gate_btc_2/adapter/gate_btc_2_adapter_conformance.json

      - name: Verify no external engine or economics ran
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path(
              'artifacts/gate_btc_2/adapter/gate_btc_2_adapter_conformance.json'
          ).read_text(encoding='utf-8'))
          assert payload['matched_batch']['matched'] is True
          assert payload['external_engines_installed'] == 0
          assert payload['official_experiments_executed'] == 0
          assert payload['economic_results_generated'] == 0
          assert payload['engine_feed'] is False
          assert payload['orders_generated'] == 0
          assert payload['real_capital_used'] == 0
          assert payload['promotion_allowed'] is False
          print('GATE_BTC_2_ADAPTER_CONTRACT=PASS_SYNTHETIC_ONLY')
          print('OFFICIAL_PERFORMANCE=NOT_EXECUTED')
          PY

      - name: Upload synthetic-only conformance evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-2-adapter-contract-${{ github.run_id }}
          path: artifacts/gate_btc_2/adapter/
          retention-days: 90
          if-no-files-found: error
