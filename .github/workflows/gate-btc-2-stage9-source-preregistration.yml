name: GATE BTC 2 Stage 9 Source Preregistration

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-2-stage9-source-preregistration.yml
      - tools/gate_btc_2_stage9_source_preregistration.py
      - tools/gate_btc_2_stage9_bitget_preregistration_v1.json
      - tools/gate_btc_2_microstructure_shadow_contract.py
      - tools/gate_btc_2_microstructure_shadow_contract_v1.json
      - tests/test_gate_btc_2_stage9_source_preregistration.py
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  GATE_BTC_SHADOW_ONLY: "true"
  GATE_BTC_NOT_APPROVED: "true"
  GATE_BTC_ENGINE_FEED: "false"
  GATE_BTC_ORDERS: "0"
  GATE_BTC_REAL_CAPITAL: "0"
  GATE_BTC_NO_RETUNE: "true"
  GATE_BTC_NO_BACKFILL: "true"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  preregistration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Compile preregistration validator
        run: python -m py_compile tools/gate_btc_2_stage9_source_preregistration.py tests/test_gate_btc_2_stage9_source_preregistration.py
      - name: Run preregistration regression suite
        run: python -m unittest -v tests.test_gate_btc_2_stage9_source_preregistration
      - name: Validate canonical Bitget preregistration
        run: python tools/gate_btc_2_stage9_source_preregistration.py
      - name: Assert safety boundary remains closed
        run: |
          python - <<'PY'
          import json
          p=json.load(open('tools/gate_btc_2_stage9_bitget_preregistration_v1.json', encoding='utf-8'))
          assert p['capture_boundary']['source_admitted'] is False
          assert p['capture_boundary']['capture_started'] is False
          assert p['capture_boundary']['historical_rows_backfilled'] == 0
          assert p['capture_boundary']['qualification_rows_receive_prospective_credit'] is False
          s=p['safety']
          assert s['research_only'] is True and s['shadow_only'] is True and s['not_approved'] is True
          assert s['engine_feed'] is False and s['orders_generated'] == 0 and s['real_capital_used'] == 0
          assert s['no_retune'] is True and s['no_backfill'] is True and s['fail_closed'] is True
          assert p['methodology_changes'] == p['clock_changes'] == p['economics_changes'] == 0
          print('STAGE9_SOURCE_PREREGISTRATION_SAFETY=PASS')
          PY
