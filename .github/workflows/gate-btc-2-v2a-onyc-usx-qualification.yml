name: GATE BTC 2 V2A ONYC USX Qualification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_2_v2a_onyc_usx_qualification.py'
      - '.github/workflows/gate-btc-2-v2a-onyc-usx-qualification.yml'
      - 'artifacts/gate_btc_2/v2a_onyc_usx_onchain_prereg_20260905.json'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify preregistration is present
        run: |
          test -f artifacts/gate_btc_2/v2a_onyc_usx_onchain_prereg_20260905.json
      - name: Run physical qualification
        run: |
          python tools/gate_btc_2_v2a_onyc_usx_qualification.py --out runtime/qualification/v2a_onyc_usx_20260905
      - name: Assert safety envelope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('runtime/qualification/v2a_onyc_usx_20260905/BATCH_SUMMARY.json')
          x=json.loads(p.read_text())
          assert x['source_admission'] is False
          assert x['d0_credit'] == 0
          assert x['research_only'] is True
          assert x['shadow_only'] is True
          assert x['not_approved'] is True
          assert x['engine_feed'] is False
          assert x['orders'] == 0
          assert x['real_capital_brl'] == 0
          assert x['no_retune'] is True
          assert x['no_backfill'] is True
          assert x['no_counter_reset'] is True
          assert x['no_silent_source_substitution'] is True
          assert x['fail_closed'] is True
          PY
      - name: Upload immutable qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-2-v2a-onyc-usx-qualification-${{ github.run_id }}
          path: runtime/qualification/v2a_onyc_usx_20260905
          if-no-files-found: error
