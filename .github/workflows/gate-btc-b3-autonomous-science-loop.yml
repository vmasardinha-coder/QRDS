name: GATE BTC B3 Autonomous Science Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - 'research/b3_h_autonomous_science_protocol_v1.md'
      - 'tools/gate_btc_factory/autonomous_family_generator.py'
      - 'tools/gate_btc_factory/autonomous_family_evaluator.py'
      - '.github/workflows/gate-btc-b3-autonomous-science-loop.yml'

permissions:
  contents: write
  actions: write

env:
  GH_TOKEN: ${{ github.token }}
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_NOT_APPROVED: 'true'

concurrency:
  group: gate-btc-b3-autonomous-science-loop
  cancel-in-progress: false

jobs:
  produce-one-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert immutable safety boundary
        run: |
          test "$GATE_BTC_RESEARCH_ONLY" = true
          test "$GATE_BTC_SHADOW_ONLY" = true
          test "$GATE_BTC_NOT_APPROVED" = true
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Validate frozen autonomous grammar
        run: |
          python -m py_compile tools/gate_btc_factory/autonomous_family_generator.py
          python -m py_compile tools/gate_btc_factory/autonomous_family_evaluator.py
          python tools/gate_btc_factory/autonomous_family_generator.py --start 170 --out /tmp/h170.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/h170.json'))
          assert d['generation']=='H170-H179' and len(d['families'])==10
          assert d['h1_economics_read'] is False and d['orders']==0 and d['real_capital']==0 and d['engine_feed'] is False
          assert len({(x['feature'],x['direction'],x['decision_window_minutes'],x['abs_z_threshold']) for x in d['families']})==10
          print('AUTONOMOUS_SCIENCE_GRAMMAR=PASS')
          PY
      - name: Plan next generation from append-only runtime state
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime_repo/runtime/autonomous_science/contracts runtime_repo/runtime/autonomous_science/results
          start=$(python - <<'PY'
          import json,re
          from pathlib import Path
          rx=re.compile(r'gate_btc_b3_h(\d+)_h(\d+)_result\.json$')
          ends=[]
          for p in Path('runtime_repo/runtime/autonomous_science/results').glob('gate_btc_b3_h*_h*_result.json'):
              m=rx.match(p.name)
              if not m: continue
              try: d=json.load(open(p,encoding='utf-8'))
              except Exception: continue
              if str(d.get('status','')).startswith(('CLOSED_','SURVIVORS_')):
                  ends.append(int(m.group(2)))
          print(170 if not ends else ((max(ends)//10)+1)*10)
          PY
          )
          if ! python tools/gate_btc_factory/autonomous_family_generator.py --start "$start" --out /tmp/next_contract.json 2>/tmp/generator.err; then
            if grep -q 'AUTONOMOUS_SCIENCE_GRAMMAR_EXHAUSTED' /tmp/generator.err; then
              echo 'action=grammar_exhausted' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat /tmp/generator.err >&2
            exit 1
          fi
          gen=$(python -c "import json; print(json.load(open('/tmp/next_contract.json'))['generation'])")
          lo=${gen%%-*}; hi=${gen##*-}; lo=${lo#H}; hi=${hi#H}
          contract="runtime_repo/runtime/autonomous_science/contracts/b3_h${lo}_h${hi}_autogen_prereg.json"
          result="runtime_repo/runtime/autonomous_science/results/gate_btc_b3_h${lo}_h${hi}_result.json"
          echo "generation=$gen" >> "$GITHUB_OUTPUT"
          echo "contract=$contract" >> "$GITHUB_OUTPUT"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ -f "$result" ]; then echo 'action=already_closed' >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -f "$contract" ]; then echo 'action=evaluate' >> "$GITHUB_OUTPUT"; exit 0; fi
          echo 'action=materialize_and_evaluate' >> "$GITHUB_OUTPUT"
      - name: Persist frozen prereg append-only
        if: steps.plan.outputs.action == 'materialize_and_evaluate'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/next_contract.json '${{ steps.plan.outputs.contract }}'
          cd runtime_repo
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          git add runtime/autonomous_science/contracts
          git commit -m "B3 ${{ steps.plan.outputs.generation }} freeze autonomous contract"
          for i in 1 2 3 4 5; do
            git pull --rebase origin gate-btc-runtime && git push origin HEAD:gate-btc-runtime && exit 0
            sleep $((i*2))
          done
          exit 1
      - name: Assert persisted prereg boundary
        if: steps.plan.outputs.action != 'grammar_exhausted' && steps.plan.outputs.action != 'already_closed'
        run: |
          python - <<'PY'
          import json
          d=json.load(open('${{ steps.plan.outputs.contract }}'))
          assert d['frozen_before_economics'] is True and len(d['families'])==10
          assert d['h1_economics_read'] is False and d['orders']==0 and d['real_capital']==0 and d['engine_feed'] is False
          print('AUTONOMOUS_PREREG=PASS')
          PY
      - name: Build guarded pre-H1 source
        if: steps.plan.outputs.action != 'grammar_exhausted' && steps.plan.outputs.action != 'already_closed'
        run: python tools/gate_btc_b3_h_free_github_ingest.py
      - name: Revalidate Stage1 anti-contamination boundary
        if: steps.plan.outputs.action != 'grammar_exhausted' && steps.plan.outputs.action != 'already_closed'
        run: |
          python tools/gate_btc_b3_h_stage1_adapter.py \
            --csv artifacts/b3_h_nextgen/WIN_M5_PRE_H1_GITHUB.csv \
            --metadata artifacts/b3_h_nextgen/WIN_M5_PRE_H1_GITHUB.metadata.json \
            --out artifacts/b3_h_nextgen/AUTONOMOUS_STAGE1_ATTESTATION.json
      - name: Execute frozen generation
        if: steps.plan.outputs.action != 'grammar_exhausted' && steps.plan.outputs.action != 'already_closed'
        run: |
          python tools/gate_btc_factory/autonomous_family_evaluator.py \
            --contract '${{ steps.plan.outputs.contract }}' \
            --csv artifacts/b3_h_nextgen/WIN_M5_PRE_H1_GITHUB.csv \
            --out /tmp/generation_result.json
      - name: Assert terminal safety
        if: steps.plan.outputs.action != 'grammar_exhausted' && steps.plan.outputs.action != 'already_closed'
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/generation_result.json'))
          assert len(d['survivors']) <= 2
          assert d['h1_economics_read'] is False and d['orders']==0 and d['real_capital']==0 and d['engine_feed'] is False
          assert d['research_only'] is True and d['shadow_only'] is True and d['not_approved'] is True
          print('AUTONOMOUS_GENERATION_TERMINAL=PASS')
          PY
      - name: Persist canonical runtime terminal and pointer
        if: steps.plan.outputs.action != 'grammar_exhausted' && steps.plan.outputs.action != 'already_closed'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/generation_result.json '${{ steps.plan.outputs.result }}'
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/generation_result.json'))
          p=Path('runtime_repo/runtime/autonomous_science/CURRENT.json')
          p.write_text(json.dumps({
              'schema':'gate_btc.b3.autonomous_science_pointer.v1',
              'generation':d['generation'], 'status':d['status'],
              'survivors':d['survivors'], 'research_only':True,
              'orders':0, 'real_capital':0, 'engine_feed':False,
              'next_generation_start':int(d['generation'].split('-')[1][1:])+1,
          },indent=2)+'\n',encoding='utf-8')
          PY
          cd runtime_repo
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          git add runtime/autonomous_science
          git commit -m "B3 ${{ steps.plan.outputs.generation }} autonomous terminal"
          for i in 1 2 3 4 5; do
            git pull --rebase origin gate-btc-runtime && git push origin HEAD:gate-btc-runtime && exit 0
            sleep $((i*2))
          done
          exit 1
      - name: Dispatch next generation immediately
        if: steps.plan.outputs.action != 'grammar_exhausted' && steps.plan.outputs.action != 'already_closed'
        run: |
          gh workflow run gate-btc-b3-autonomous-science-loop.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'AUTONOMOUS_SCIENCE_NEXT_CYCLE=DISPATCHED'
      - name: Report terminal loop state
        if: steps.plan.outputs.action == 'grammar_exhausted' || steps.plan.outputs.action == 'already_closed'
        run: echo "AUTONOMOUS_SCIENCE=${{ steps.plan.outputs.action }}"
