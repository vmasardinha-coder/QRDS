name: GATE BTC WIN WDO Cross Asset Regime Candidate Limit

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/WIN_WDO_CROSS_ASSET_REGIME_CANDIDATE_LIMIT_20260915.json'
      - 'tools/gate_btc_factory/test_win_wdo_cross_asset_regime_candidate_limit.py'
      - '.github/workflows/gate-btc-win-wdo-cross-asset-regime-candidate-limit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-limit-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate candidate complexity
        run: python -m pytest -q tools/gate_btc_factory/test_win_wdo_cross_asset_regime_candidate_limit.py
