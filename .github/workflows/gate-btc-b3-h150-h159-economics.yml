name: GATE BTC B3 H150-H159 Economics

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_b3_h150_h159_economics.py'
      - 'tools/gate_btc_b3_h150_h159_focus_join_qa.py'
      - 'tests/test_gate_btc_b3_h150_h159_economics.py'
      - 'research/b3_h150_h159_focus_prereg.md'
      - '.github/workflows/gate-btc-b3-h150-h159-economics.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-btc-b3-h150-h159-economics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GATE_BTC_RESEARCH_ONLY: 'true'
  GATE_BTC_SHADOW_ONLY: 'true'
  GATE_BTC_NOT_APPROVED: 'true'

jobs:
  historical-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.31,<3' pandas numpy
      - name: Contract tests before economics
        run: python -m unittest -v tests/test_gate_btc_b3_h150_h159_economics.py
      - name: Reproduce pre-economics causal join gate
        run: |
          python tools/gate_btc_b3_h150_h159_focus_join_qa.py
          python - <<'PY'
          import json
          p=json.load(open('artifacts/b3_h150_h159_focus_join_qa.json',encoding='utf-8'))
          assert p['status']=='JOIN_QA_PASS_ECONOMICS_STILL_NOT_RUN'
          assert p['discovery']['all_families_pass'] is True
          assert p['replication']['all_families_pass'] is True
          assert p['economics_executed'] is False and p['h1_economics_read'] is False
          assert p['survivor_partial_economics_read'] is False
          assert p['orders']==0 and p['real_capital']==0 and p['engine_feed'] is False
          PY
      - name: Run preregistered H150-H159 historical validation
        run: |
          mkdir -p artifacts/b3_h150_h159
          python tools/gate_btc_b3_h150_h159_economics.py \
            --join-qa artifacts/b3_h150_h159_focus_join_qa.json \
            --out artifacts/b3_h150_h159/B3_H150_H159_ECONOMICS.json \
            --ledger artifacts/b3_h150_h159/H150_H159_RESULT_LEDGER.jsonl \
            --cells artifacts/b3_h150_h159/H150_H159_CELLS.csv \
            --manifest artifacts/b3_h150_h159/H150_H159_MANIFEST.json
      - name: Assert frozen result and safety boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/b3_h150_h159/B3_H150_H159_ECONOMICS.json',encoding='utf-8'))
          m=json.load(open('artifacts/b3_h150_h159/H150_H159_MANIFEST.json',encoding='utf-8'))
          assert p['cutoff_exclusive']=='2026-08-10'
          assert set(p['states'])=={f'H{i}' for i in range(150,160)}
          assert len(p['survivors'])<=2
          assert set(p['survivors']).issubset(set(p['independently_replicated']))
          assert p['join_qa_status']=='JOIN_QA_PASS_ECONOMICS_STILL_NOT_RUN'
          assert p['h1_economics_read'] is False and p['survivor_partial_economics_read'] is False
          assert p['orders_generated']==0 and p['real_capital_used']==0 and p['engine_feed'] is False and p['not_approved'] is True
          assert m['h1_economics_read'] is False and m['survivor_partial_economics_read'] is False
          assert m['orders']==0 and m['capital']==0 and m['engine_feed'] is False and m['not_approved'] is True
          print('H150_H159_HISTORICAL_VALIDATION=PASS_RESEARCH_ONLY')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-btc-b3-h150-h159-economics-${{ github.run_id }}
          path: |
            artifacts/b3_h150_h159_focus_join_qa.json
            artifacts/b3_h150_h159/B3_H150_H159_ECONOMICS.json
            artifacts/b3_h150_h159/H150_H159_RESULT_LEDGER.jsonl
            artifacts/b3_h150_h159/H150_H159_CELLS.csv
            artifacts/b3_h150_h159/H150_H159_MANIFEST.json
          if-no-files-found: warn
          retention-days: 90
