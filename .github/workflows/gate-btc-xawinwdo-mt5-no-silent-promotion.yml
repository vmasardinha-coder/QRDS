name: GATE BTC XAWINWDO MT5 No Silent Promotion
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gate_btc_factory/XAWINWDO_MT5_PRIMARY_EXPERIMENT.v1.json'
      - 'tools/gate_btc_factory/mt5_shared_family_source.py'
      - 'tests/test_gate_btc_xawinwdo_mt5_no_silent_promotion.py'
      - '.github/workflows/gate-btc-xawinwdo-mt5-no-silent-promotion.yml'
permissions:
  contents: read
jobs:
  no-silent-promotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install -q pytest
          pytest -q tests/test_gate_btc_xawinwdo_mt5_no_silent_promotion.py
