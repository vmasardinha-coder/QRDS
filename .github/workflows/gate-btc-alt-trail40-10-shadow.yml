name: GATE BTC ALT Trail40 10 Shadow Archive

on:
  push:
    branches: [main]
    paths:
      - tools/gate_btc_prl_alt_same_source_recovery.py
      - tests/test_gate_btc_prl_alt_same_source_recovery.py
      - .github/workflows/gate-btc-alt-trail40-10-shadow.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-alt-trail40-10-shadow.yml
      - tools/gate_btc_prl_alt_same_source_recovery.py
      - tools/gate_btc_alt_trail40_10_shadow_contract_v1.json
      - tools/gate_btc_alt_trail40_10_shadow_archive.py
      - tools/gate_btc_alt_trail40_10_rollover_guard.py
      - tools/gate_btc_alt_trail40_10_shadow_evaluator.py
      - tools/gate_btc_alt_trail40_10_delivery_audit.py
      - tools/gate_btc_alt_trail40_10_cycle.py
      - tools/gate_btc_alt_trail40_10_cycle_20260930.json
      - tools/gate_btc_alt_trail40_10_shadow_contract_20260930.json
      - tests/test_gate_btc_alt_trail40_10_cycle.py
      - tests/test_gate_btc_prl_alt_same_source_recovery.py
      - tools/gate_btc_prl_alt_same_source_recovery.py
      - tests/test_gate_btc_prl_alt_same_source_recovery.py
      - tools/gate_btc_reporting_operational_overlay.py
      - tests/test_gate_btc_alt_trail40_10_delivery_audit.py
      - tests/test_gate_btc_alt_trail40_10_shadow_archive.py
      - tests/test_gate_btc_alt_trail40_10_rollover_guard.py
      - tests/test_gate_btc_alt_trail40_10_shadow_evaluator.py
  schedule:
    # Retry after QOS hourly same-source recovery, while the UTC cutoff is current.
    - cron: '25 15,19,22 * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: Eligible Daily Research workflow run ID
        required: false
        type: string
  workflow_run:
    workflows: ["GATE BTC Daily Research Collection", "GATE BTC QOS Three-Track Prospective Shadow"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: gate-btc-alt-trail40-10-shadow-${{ github.event_name }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  ALT_TRAIL_FIRST_SIGNAL: "2026-09-30"

jobs:
  upstream-daily-delivery:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'GATE BTC Daily Research Collection' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Propagate failed eligible Daily collection
        env:
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          test "$UPSTREAM_BRANCH" = "main"
          test "$UPSTREAM_CONCLUSION" = "success"

  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen candidate contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('tools/gate_btc_alt_trail40_10_shadow_contract_v1.json', encoding='utf-8'))
          assert p['candidate_name'] == 'ALT_TRAIL40_10_CLOSE_LAG1_V1'
          d=p['candidate_definition']
          assert d['activation_gain'] == 0.40
          assert d['trailing_buffer_fraction_of_running_close_high'] == 0.10
          assert d['same_bar_arm_and_exit'] is False
          assert d['parameter_retuning_before_gate'] is False
          assert p['eligible_assets'] == 'ALT_PICKS_ONLY_EXCLUDING_BTC_ETH_BNB_CASH'
          assert p['first_eligible_signal_date'] == '2026-08-31'
          assert p['first_eligible_execution_date'] == '2026-09-01'
          assert p['retrospective_backfill'] == 'PROHIBITED'
          h=p['historical_evidence_freeze']['qos_crosscheck']
          assert h['protocol_sha256'] == 'd1d7eceb8325e141e73aafe8645a8ed671e2e549ea81e41b04ec52f756f01cd7'
          assert h['result_sha256'] == 'c3e2139b33c537c791633d2b5a3605b6f773baf8ab5b64a5f96b51ab52d654cf'
          assert h['decision'] == 'HISTORICALLY_REJECTED_OR_INSUFFICIENT_FOR_PROMOTION'
          assert h['rule_search_status'] == 'CLOSED_NO_RETUNING_ON_THIS_SAMPLE'
          g=p['prospective_gate']
          assert g['freeze_date'] == '2026-08-12'
          assert g['evaluation_cohort'] == 'ARMED_COMPLETED_JOURNEYS'
          assert g['minimum_armed_completed_journeys'] == 30
          assert g['minimum_calendar_days_since_freeze'] == 120
          assert g['bootstrap_reps'] == 20000 and g['bootstrap_seed'] == 20260812
          assert g['trim_top_positive_fraction'] == 0.05
          assert g['max_single_case_positive_benefit_share'] == 0.20
          assert p['research_only'] is True and p['shadow_only'] is True
          assert p['not_approved'] is True and p['engine_feed'] is False
          assert p['orders_generated'] == 0 and p['real_capital_used'] == 0
          print('ALT_TRAIL40_10_CONTRACT=PASS')
          PY
      - name: Test fail-closed archive, rollover and evaluator
        run: >-
          python -m unittest -v
          tests/test_gate_btc_alt_trail40_10_shadow_archive.py
          tests/test_gate_btc_alt_trail40_10_rollover_guard.py
          tests/test_gate_btc_alt_trail40_10_shadow_evaluator.py
          tests/test_gate_btc_alt_trail40_10_delivery_audit.py
          tests/test_gate_btc_alt_trail40_10_cycle.py

  append-prospective-path:
    needs: contract-tests
    # Sem exigir a run inteira verde. A conclusao da run de coleta carrega jobs
    # irmaos com outros datasets -- entre eles o prospective-v2a-pit, que roda sem
    # needs e falha sozinho. Exigir a run verde aqui deixava este registro sem
    # rodar nos dias em que o dado que ele le estava perfeito: foi assim que um
    # simbolo delistado segurou o V11 por quatro dias. O portao real esta no passo
    # que resolve a run, sobre o job daily-research-collection, e falha fechado.
    if: >-
      (github.event_name == 'schedule') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out canonical merged code
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out immutable runtime branch
        uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo
          fetch-depth: 0

      - name: Audit original path before any append
        id: plan
        run: python -m tools.gate_btc_alt_trail40_10_cycle --mode plan --ledger-dir runtime_repo/runtime/ledgers/alt_trail40_10

      - name: Check sealed QOS evidence for current cutoff
        id: qos_ready
        if: steps.plan.outputs.can_append == 'true'
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          target=(dt.datetime.now(dt.timezone.utc).date()-dt.timedelta(days=1)).isoformat()
          root=Path('runtime_repo/runtime/ledgers/qos_three_track')
          state=json.loads((root/'STATUS.json').read_text())
          active=sorted(p.parent for p in (root/'cycles').glob('*/SIGNAL_STATE.json')
                        if p.parent.name<=target and not (p.parent/'BLOCKED.json').exists())
          ready=(state.get('status')=='ACTIVE_PROSPECTIVE_THREE_TRACK'
                 and state.get('latest_snapshot_date')==target
                 and bool(active)
                 and (root/'source_evidence'/active[-1].name/target/'PRICES.json').is_file())
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('ready='+str(ready).lower()+'\n')
          print('QOS_SAME_SOURCE_CURRENT='+str(ready), 'cutoff='+target)
          PY
      - name: Resolve and validate Daily Research source run
        if: steps.plan.outputs.can_append == 'true' && steps.qos_ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RUN_ID: ${{ inputs.run_id || '' }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.name == 'GATE BTC Daily Research Collection' && github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          SOURCE_RUN_ID="${MANUAL_RUN_ID:-$EVENT_RUN_ID}"
          if [[ -z "$SOURCE_RUN_ID" ]]; then
            SOURCE_RUN_ID=$(python -c 'import json; from datetime import datetime, timedelta, timezone; p=json.load(open("runtime_repo/runtime/data_quality/v2a/STATUS.json")); assert p["latest_source_data_as_of"] == (datetime.now(timezone.utc).date()-timedelta(days=1)).isoformat(), "V2A_RUNTIME_SOURCE_NOT_CURRENT"; print(p["latest_source_run_id"])')
          fi
          test -n "$SOURCE_RUN_ID"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > source_run.json
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100" > source_jobs.json
          python - <<'PY'
          import json
          run=json.load(open('source_run.json', encoding='utf-8'))
          assert run['name'] == 'GATE BTC Daily Research Collection'
          assert run['head_branch'] == 'main'
          assert run['status'] == 'completed'

          # O artefato consumido aqui e gate-btc-daily-research-<run_id>, produzido
          # exclusivamente pelo job daily-research-collection. A conclusao da run
          # inteira carrega tambem jobs irmaos com outros datasets -- entre eles o
          # prospective-v2a-pit, que roda sem needs e portanto pode falhar sozinho.
          # Exigir a run verde acoplava esta sombra a falhas de dados que ela nunca
          # le: foi assim que um simbolo delistado segurou o V11 por quatro dias.
          # O portao fica sobre o job que de fato produz o dado, e os passos
          # seguintes continuam verificando manifesto, research_only e NOT_APPROVED
          # dentro do proprio artefato.
          jobs=json.load(open('source_jobs.json', encoding='utf-8'))['jobs']
          producer=[j for j in jobs if j['name'] == 'daily-research-collection']
          assert len(producer) == 1, f"expected exactly one producer job, got {len(producer)}"
          assert producer[0]['status'] == 'completed'
          assert producer[0]['conclusion'] == 'success', (
              f"daily-research-collection concluded {producer[0]['conclusion']!r}")
          PY
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"

      - name: Download V2A daily evidence
        if: steps.plan.outputs.can_append == 'true' && steps.qos_ready.outputs.ready == 'true'
        id: daily_source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source_artifact extracted/v2a
          artifact_id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("gate-btc-daily-research-")) | .id' | head -1)
          test -n "$artifact_id"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > artifact.zip
          unzip -q artifact.zip -d source_artifact
          if [[ ! -f source_artifact/daily_handoff/GATE_BTC_DAILY_RESEARCH_MANIFEST.json ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "ALT_TRAIL40_10=FAILED_MISSING_DAILY_HANDOFF"
            exit 1
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          test -f source_artifact/qos_daily/qos_v2a_outputs.zip
          unzip -q source_artifact/qos_daily/qos_v2a_outputs.zip -d extracted/v2a
          test -f extracted/v2a/outputs/v2a_run_manifest.json
          test -f extracted/v2a/outputs/qos_v2a_current_portfolios.csv
          test -f extracted/v2a/data/processed/qos_v2a_master_daily.csv

      - name: Verify Daily Research safety and resolve snapshot
        if: steps.daily_source.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          m=json.load(open('source_artifact/daily_handoff/GATE_BTC_DAILY_RESEARCH_MANIFEST.json', encoding='utf-8-sig'))
          assert m['status'] in {'PASS','PASS_WITH_DATA_WARNINGS'}
          assert m['research_only'] is True
          assert m['operational_status'] == 'NOT_APPROVED'
          assert m['orders_generated'] == 0 and m['real_capital_used'] == 0
          assert m['methodology_changes'] == 0
          assert m['components']['v2a']['status'] == 'PASS'
          v=json.load(open('extracted/v2a/outputs/v2a_run_manifest.json', encoding='utf-8-sig'))
          assert v['operational_status'] == 'NOT_APPROVED'
          assert v['technical_status'] == 'PASS'
          assert v['real_orders'] == 0 and v['capital_used'] == 0
          assert v['evidence_status'] == 'RESEARCH_ONLY_NOT_PROMOTED'
          assert v['lookahead_guard'] == 'signals execute on next daily bar'
          open('snapshot_id.txt','w',encoding='utf-8').write(v['data_as_of'])
          PY
          echo "ALT_TRAIL_SNAPSHOT_ID=$(cat snapshot_id.txt)" >> "$GITHUB_ENV"

      - name: Recover selected same-source exact closes from sealed QOS evidence
        if: steps.daily_source.outputs.eligible == 'true'
        run: >-
          python -m tools.gate_btc_prl_alt_same_source_recovery
          --master extracted/v2a/data/processed/qos_v2a_master_daily.csv
          --qos-root runtime_repo/runtime/ledgers/qos_three_track
          --day "$ALT_TRAIL_SNAPSHOT_ID"
          --output recovered/qos_v2a_master_daily.csv
          --receipt runtime_repo/runtime/ledgers/alt_trail40_10/source_evidence/"$ALT_TRAIL_SNAPSHOT_ID".json

      - name: Append approved independent monthly path
        if: steps.daily_source.outputs.eligible == 'true'
        run: >-
          python -m tools.gate_btc_alt_trail40_10_cycle --mode process
          --ledger-dir runtime_repo/runtime/ledgers/alt_trail40_10
          --current-portfolios extracted/v2a/outputs/qos_v2a_current_portfolios.csv
          --master-daily recovered/qos_v2a_master_daily.csv
          --snapshot-id "$ALT_TRAIL_SNAPSHOT_ID"
          --source-run-id "$SOURCE_RUN_ID"

      - name: Verify archive and evaluation safety state
        if: steps.daily_source.outputs.eligible == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('runtime_repo/runtime/ledgers/alt_trail40_10')
          p=json.load(open(root / 'DELIVERY_STATUS.json', encoding='utf-8'))
          assert p['authorization_id'] == 'ALT_TRAIL40_10_20260930_USER_20260928'
          assert p['first_eligible_signal_date'] == '2026-09-30'
          assert p['first_eligible_execution_date'] == '2026-10-01'
          assert p['legacy_economic_credit'] == 0
          epoch=root / 'epochs/monthly_20260930'
          assert p['research_only'] is True and p['shadow_only'] is True
          assert p['not_approved'] is True and p['engine_feed'] is False
          assert p['orders_generated'] == 0 and p['real_capital_used'] == 0
          latest=p.get('latest_snapshot_date')
          if latest:
              row=json.load(open(epoch / 'snapshots' / f'{latest}.json', encoding='utf-8'))
              assert row['row_sha256'] == json.load(open(epoch / 'STATUS.json'))['latest_row_sha256']
              assert row['economics_opened'] is False
          e=json.load(open(epoch / 'EVALUATION.json', encoding='utf-8'))
          assert e['candidate_name'] == 'ALT_TRAIL40_10_CLOSE_LAG1_V1'
          assert e['evaluation_cohort'] == 'ARMED_COMPLETED_JOURNEYS'
          assert e['decision'] in {'WAITING_PROSPECTIVE_GATE','PROMOTION_CANDIDATE_RESEARCH_ONLY','NO_PROMOTION'}
          assert e['research_only'] is True and e['shadow_only'] is True
          assert e['not_approved'] is True and e['engine_feed'] is False
          assert e['orders_generated'] == 0 and e['real_capital_used'] == 0
          print('ALT_TRAIL40_10_ARCHIVE_AND_EVALUATION_SAFETY=PASS')
          PY

      - name: Record failed current source without retrospective fill
        if: failure() && steps.plan.outcome == 'success' && steps.plan.outputs.can_append == 'true'
        run: python -m tools.gate_btc_alt_trail40_10_cycle --mode failure --ledger-dir runtime_repo/runtime/ledgers/alt_trail40_10

      - name: Commit ALT trail runtime evidence only
        if: always() && steps.plan.outcome == 'success'
        working-directory: runtime_repo
        run: |
          set -euo pipefail
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          git add runtime/ledgers/alt_trail40_10
          git diff --cached --quiet && exit 0
          git commit -m "Audit ALT trail40 10 shadow ${ALT_TRAIL_SNAPSHOT_ID:-diagnostic}"
          for attempt in 1 2 3 4 5; do
            git fetch origin gate-btc-runtime
            if ! git rebase origin/gate-btc-runtime; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:gate-btc-runtime; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
