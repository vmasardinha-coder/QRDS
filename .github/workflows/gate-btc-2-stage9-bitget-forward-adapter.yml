name: GATE BTC 2 Stage 9 Bitget Forward Adapter

on:
  schedule:
    - cron: "0 * * * *"
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gate-btc-2-stage9-bitget-forward-adapter.yml
      - tools/gate_btc_2_stage9_bitget_forward_capture.py
      - tools/gate_btc_2_stage9_source_preregistration.py
      - tools/gate_btc_2_stage9_bitget_preregistration_v1.json
      - tools/gate_btc_2_stage9_bitget_collection_clock_v1.json
      - tools/gate_btc_2_microstructure_shadow_contract_v1.json
      - tests/test_gate_btc_2_stage9_bitget_forward_capture.py
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  GATE_BTC_SHADOW_ONLY: "true"
  GATE_BTC_NOT_APPROVED: "true"
  GATE_BTC_ENGINE_FEED: "false"
  GATE_BTC_ORDERS: "0"
  GATE_BTC_REAL_CAPITAL: "0"
  GATE_BTC_NO_RETUNE: "true"
  GATE_BTC_NO_BACKFILL: "true"
  GATE_BTC_FAIL_CLOSED: "true"
  GATE_BTC_STAGE9_CAPTURE_CADENCE_MINUTES: "60"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Compile adapter and tests
        run: python -m py_compile tools/gate_btc_2_stage9_bitget_forward_capture.py tests/test_gate_btc_2_stage9_bitget_forward_capture.py
      - name: Revalidate merged preregistration
        run: python -m tools.gate_btc_2_stage9_source_preregistration
      - name: Validate authorized collection clock
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('tools/gate_btc_2_stage9_bitget_collection_clock_v1.json')
          d=json.loads(p.read_text())
          assert d['schema']=='gate_btc.2_0.stage9_bitget_collection_clock.v1'
          assert d['stage_id']==9 and d['provider']=='BITGET_PUBLIC_V2' and d['venue']=='BITGET' and d['instrument']=='BTCUSDT'
          assert d['authorization']['human_authorized'] is True
          c=d['clock']
          assert c['cadence_minutes']==60 and c['cron_utc']=='0 * * * *'
          assert c['first_scheduled_capture_must_postdate_clock_merge'] is True
          assert c['missed_runs_backfilled'] is False and c['schedule_delay_does_not_trigger_timestamp_repair'] is True
          b=d['scientific_boundary']
          assert b['required_n_changed'] is False and b['statistical_independence_claimed'] is False
          assert b['qualification_or_prior_capture_receives_new_credit'] is False
          s=d['safety']
          assert s['research_only'] and s['shadow_only'] and s['not_approved']
          assert s['engine_feed'] is False and s['orders_generated']==0 and s['real_capital_brl']==0
          assert s['no_retune'] and s['no_backfill'] and s['fail_closed']
          assert s['promotion_allowed'] is False and s['economics_allowed'] is False and s['stage_9_complete'] is False
          print('STAGE9_BITGET_COLLECTION_CLOCK=AUTHORIZED_HOURLY_FAIL_CLOSED')
          PY
      - name: Run adapter boundary tests
        run: python -m unittest -v tests.test_gate_btc_2_stage9_bitget_forward_capture
      - name: Assert no admission or economics path
        run: |
          python - <<'PY'
          from tools.gate_btc_2_stage9_bitget_forward_capture import safety
          s=safety()
          assert s['research_only'] and s['shadow_only'] and s['not_approved']
          assert s['engine_feed'] is False and s['orders_generated']==0 and s['real_capital_used']==0
          assert s['no_retune'] and s['no_backfill'] and s['fail_closed']
          assert s['source_admitted'] is False and s['prospective_credit']==0
          assert s['stage_9_complete'] is False and s['promotion_allowed'] is False
          print('STAGE9_BITGET_FORWARD_ADAPTER_SAFETY=PASS')
          PY

  first-forward-capture:
    needs: adapter-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Execute bounded post-preregistration Bitget capture
        run: |
          mkdir -p runtime_capture
          set -o pipefail
          python -m tools.gate_btc_2_stage9_bitget_forward_capture --output-dir runtime_capture | tee runtime_capture/console_result.json
      - name: Require captured-but-not-admitted boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('runtime_capture/capture_decision.json')
          assert p.exists(), 'capture_decision.json missing; live source did not reach captured boundary'
          d=json.loads(p.read_text())
          assert d['status']=='CAPTURED_AWAITING_ADMISSION_REVIEW'
          assert d['forward_only'] is True and d['historical_rows_backfilled']==0
          assert d['source_admitted'] is False and d['prospective_credit']==0
          assert d['research_only'] and d['shadow_only'] and d['not_approved']
          assert d['engine_feed'] is False and d['orders_generated']==0 and d['real_capital_used']==0
          assert d['no_retune'] and d['no_backfill'] and d['fail_closed']
          assert d['stage_9_complete'] is False and d['promotion_allowed'] is False
          assert set(d['roles'])=={'FUNDING','OPEN_INTEREST','PERP_VOLUME','SPOT_VOLUME'}
          print('STAGE9_BITGET_FORWARD_CAPTURE=PASS')
          PY
      - name: Preserve forward-capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-stage9-bitget-forward-${{ github.run_id }}
          path: runtime_capture/
          if-no-files-found: error
          retention-days: 30
