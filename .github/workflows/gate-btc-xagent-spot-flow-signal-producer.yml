name: GATE BTC XAGENT Spot Flow Signal Producer

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/gate_btc_2/family_handoffs/S_XSPOT_FLOW_01_PREREG_20260923.json'
      - 'tools/gate_btc_factory/xagent_spot_flow_signal_producer.py'
      - 'tests/test_gate_btc_xagent_spot_flow_signal_producer.py'
      - '.github/workflows/gate-btc-xagent-spot-flow-signal-producer.yml'
  push:
    branches: [main]
    paths:
      - 'artifacts/gate_btc_2/family_handoffs/S_XSPOT_FLOW_01_PREREG_20260923.json'
      - 'tools/gate_btc_factory/xagent_spot_flow_signal_producer.py'
      - 'tests/test_gate_btc_xagent_spot_flow_signal_producer.py'
      - '.github/workflows/gate-btc-xagent-spot-flow-signal-producer.yml'
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  RESEARCH_ONLY: 'true'
  SHADOW_ONLY: 'true'
  ENGINE_FEED: 'false'
  ORDERS: '0'
  REAL_CAPITAL: '0'
  NO_RETUNE: 'true'
  NO_BACKFILL: 'true'

concurrency:
  group: gate-btc-xagent-spot-flow-signal-producer
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: source_repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate prereg and deterministic transform
        run: |
          python -m pip install -q requests pytest
          cd source_repo
          python -m py_compile tools/gate_btc_factory/xagent_spot_flow_signal_producer.py
          pytest -q tests/test_gate_btc_xagent_spot_flow_signal_producer.py
          python tools/gate_btc_factory/xagent_spot_flow_signal_producer.py --self-test
          python - <<'PY'
          import json
          d=json.load(open('artifacts/gate_btc_2/family_handoffs/S_XSPOT_FLOW_01_PREREG_20260923.json'))
          assert d['producer_id']=='S-XSPOT-FLOW-01'
          assert d['signal_semantics']['range']==[-1.0,1.0]
          assert d['signal_semantics']['economic_return_direction_claim'] is False
          assert d['signal_semantics']['alpha_claim'] is False
          assert d['signal_semantics']['threshold'] is None
          assert d['signal_semantics']['smoothing'] is None
          assert d['availability']['same_bar_reaction_forbidden'] is True
          assert d['prospective_collection']['historical_backfill'] is False
          assert d['prospective_collection']['missed_observation_reconstruction'] is False
          s=d['safety']
          assert s['RESEARCH_ONLY'] and s['SHADOW_ONLY'] and s['NO_RETUNE'] and s['NO_BACKFILL']
          assert s['ENGINE_FEED'] is False and s['ORDERS']==0 and s['REAL_CAPITAL']==0
          assert s['CANONICAL_580_UNTOUCHED'] is True
          print('S_XSPOT_FLOW_01_PREREG=PASS')
          PY
      - name: Produce live prospective signal
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p live
          python source_repo/tools/gate_btc_factory/xagent_spot_flow_signal_producer.py --output live/S_XSPOT_FLOW_01.json
      - name: Persist append-only producer observation
        if: github.event_name != 'pull_request'
        run: |
          git clone --depth 1 --branch gate-btc-runtime "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" runtime_repo
          python - <<'PY'
          import json, pathlib, shutil
          src=pathlib.Path('live/S_XSPOT_FLOW_01.json')
          d=json.loads(src.read_text())
          assert d['producer_id']=='S-XSPOT-FLOW-01'
          assert -1.0 <= d['signal'] <= 1.0
          assert d['economic_outcomes_read'] is False and d['survivor_credit']==0
          root=pathlib.Path('runtime_repo/runtime/factory_autonomy/xagent_signal_producers/S-XSPOT-FLOW-01')
          root.mkdir(parents=True,exist_ok=True)
          target=root/f"{d['close_time_ms']}.json"
          if target.exists():
              old=json.loads(target.read_text())
              if old.get('record_sha256') != d.get('record_sha256'):
                  raise SystemExit('APPEND_ONLY_HASH_CONFLICT')
          else:
              shutil.copy2(src,target)
          shutil.copy2(src,root/'LATEST.json')
          summary={
              'schema':'gate_btc_2.xagent_signal_producer_status.v1',
              'producer_id':'S-XSPOT-FLOW-01',
              'status':'PROSPECTIVE_SIGNAL_PRODUCER_ACTIVE',
              'latest_close_time_ms':d['close_time_ms'],
              'latest_signal':d['signal'],
              'record_sha256':d['record_sha256'],
              'eligible_xagent_input_after_runtime_validation':True,
              'economic_credit':0,'survivor_credit':0,'promotion_authority':False,
              'engine_feed':False,'orders':0,'real_capital':0,'no_backfill':True,'no_retune':True
          }
          (root/'STATUS.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY
          git -C runtime_repo config user.name gate-btc-research-bot
          git -C runtime_repo config user.email gate-btc-research-bot@users.noreply.github.com
          git -C runtime_repo add runtime/factory_autonomy/xagent_signal_producers/S-XSPOT-FLOW-01
          git -C runtime_repo diff --cached --quiet && exit 0
          git -C runtime_repo commit -m "S-XSPOT-FLOW-01 prospective observation ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            git -C runtime_repo fetch origin gate-btc-runtime
            git -C runtime_repo rebase origin/gate-btc-runtime || { git -C runtime_repo rebase --abort; exit 1; }
            git -C runtime_repo push origin HEAD:gate-btc-runtime && exit 0
            sleep $((i*2))
          done
          exit 1
