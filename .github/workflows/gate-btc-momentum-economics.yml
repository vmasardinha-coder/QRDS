name: GATE BTC Momentum M1 M2 Economics

on:
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * *'
  workflow_run:
    workflows: ['GATE BTC Momentum M1 M2 Shadow Collection']
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - tools/gate_btc_momentum_economic_shadow.py
      - tools/gate_btc_momentum_hold_epoch.py
      - tools/gate_btc_momentum_required_prices.py
      - tests/test_gate_btc_momentum_economics.py
      - tests/test_gate_btc_momentum_hold_economics.py
      - migration/reporting/momentum_m1m2_hold_epoch_20260928.json
      - migration/reporting/momentum_m1m2_economic_contract_v1.json
      - migration/reporting/momentum_m1m2_interruption_20260927.md
      - .github/workflows/gate-btc-momentum-economics.yml

permissions:
  contents: read

concurrency:
  group: momentum-economics-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'canonical' }}
  cancel-in-progress: false

env:
  RESEARCH_ONLY: 'true'
  SHADOW_ONLY: 'true'
  NOT_APPROVED: 'true'
  ENGINE_FEED: 'false'
  ORDERS: '0'
  REAL_CAPITAL: '0'

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.2.3 numpy==2.1.3
      - run: python -m unittest discover -s tests -p 'test_gate_btc_momentum_*economics.py' -v
      - run: |
          python - <<'PY'
          import json
          p=json.load(open('migration/reporting/momentum_m1m2_economic_contract_v1.json'))
          assert p['strategies']['M1_TOP10']['selection']=='TOP_10'
          assert p['strategies']['M2_TOP10']['selection']=='TOP_10'
          assert p['strategies']['M1_TOP10']['weighting']=='EQUAL_WEIGHT'
          assert p['rebalance']['cadence'].startswith('EVERY_7_COMPLETED')
          assert p['historical_backfill'] is False and p['retune'] is False
          assert p['orders']==0 and p['real_capital']==0
          PY

  economics:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, path: main_repo}
      - uses: actions/checkout@v4
        with: {ref: gate-btc-runtime, path: runtime_repo, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install canonical source dependencies
        working-directory: main_repo
        run: pip install -r migration/canonical/v2a/requirements.txt
      - name: Resolve latest Momentum cutoff and preserve ledger seals
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('runtime_repo/runtime/ledgers/momentum_m1_m2')
          snaps=sorted(root.glob('20*.json'))
          if not snaps: raise SystemExit('NO_MOMENTUM_SNAPSHOT')
          latest=json.loads(snaps[-1].read_text())
          eroot=Path('runtime_repo/runtime/ledgers/momentum_m1_m2_economics')
          seals={n:hashlib.sha256((eroot/n).read_bytes()).hexdigest() for n in ('STATE.json','HISTORY.json') if (eroot/n).exists()}
          Path('economic_pre_run_seals.json').write_text(json.dumps(seals))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f"MOMENTUM_CUTOFF={latest['cutoff']}\nMOMENTUM_SNAPSHOT={snaps[-1]}\n")
          PY
      - name: Capture prices for held positions and frozen current selections
        id: prices
        continue-on-error: true
        working-directory: main_repo
        run: |
          python tools/gate_btc_momentum_hold_epoch.py --phase prepare \
            --snapshot "../$MOMENTUM_SNAPSHOT" \
            --ledger-dir ../runtime_repo/runtime/ledgers/momentum_m1_m2_economics \
            --output-zip ../momentum_required_prices.zip
      - name: Validate economic continuity and explicit scientific boundary
        id: append
        if: steps.prices.outcome == 'success'
        continue-on-error: true
        working-directory: main_repo
        run: |
          python tools/gate_btc_momentum_hold_epoch.py --phase append \
            --snapshot "../$MOMENTUM_SNAPSHOT" --output-zip ../momentum_required_prices.zip \
            --ledger-dir ../runtime_repo/runtime/ledgers/momentum_m1_m2_economics
      - name: Verify preserved history and diagnostic safety
        id: integrity
        if: always() && steps.prices.outcome != 'skipped'
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('runtime_repo/runtime/ledgers/momentum_m1_m2_economics')
          seals=json.loads(Path('economic_pre_run_seals.json').read_text())
          for n,h in seals.items(): assert hashlib.sha256((root/n).read_bytes()).hexdigest()==h, n
          paths=[root/n for n in ('PRICE_COVERAGE_STATUS.json','DELIVERY_STATUS.json')]
          paths+=list((root/'epochs').glob('*/DELIVERY_STATUS.json'))
          for p in paths:
              if p.exists():
                  s=json.loads(p.read_text())
                  assert s['research_only'] is True and s['shadow_only'] is True
                  assert s['orders']==s['real_capital']==0
          import sys
          sys.path.insert(0,'main_repo')
          from tools.gate_btc_momentum_hold_epoch import setup,validate_ledger,APPROVAL,CONTRACT,load_json
          config,contract=load_json(APPROVAL),load_json(CONTRACT)
          epoch=setup(root,config,contract)
          if (epoch/'LEDGER.json').exists():validate_ledger(load_json(epoch/'LEDGER.json'),config,contract)
          print('MOMENTUM_ORIGINAL_ECONOMIC_HISTORY_UNCHANGED=PASS')
          PY
      - name: Publish source evidence and actual economic blockage
        if: always() && steps.integrity.outcome == 'success'
        working-directory: runtime_repo
        run: |
          set -euo pipefail
          git config user.name gate-btc-research-bot
          git config user.email gate-btc-research-bot@users.noreply.github.com
          git add runtime/ledgers/momentum_m1_m2_economics
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Momentum held-price coverage and economic disposition ${MOMENTUM_CUTOFF}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin gate-btc-runtime && git push origin HEAD:gate-btc-runtime && exit 0
            sleep $((i*2))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentum-economic-evidence-${{ github.run_id }}
          path: runtime_repo/runtime/ledgers/momentum_m1_m2_economics
          retention-days: 90
          if-no-files-found: error
      - name: Propagate source or economic failure after evidence publication
        if: always() && (steps.prices.outcome != 'success' || steps.append.outcome != 'success')
        run: |
          echo 'MOMENTUM_ECONOMICS_BLOCKED — inspect preserved delivery status; no economic row fabricated'
          exit 1
