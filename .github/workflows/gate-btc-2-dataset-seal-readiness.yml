name: GATE BTC 2 Dataset Seal Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - tools/gate_btc_2_challenger_foundation.py
      - tools/gate_btc_2_dataset_seal_readiness.py
      - tools/gate_btc_2_prospective_dataset_epoch_cutover.py
      - tools/gate_btc_2_prospective_dataset_epoch_prereg_2026_09_03.md
      - tools/gate_btc_2_item2_checkpoint4_decision_v1.json
      - tools/gate_btc_reporting_current_state.py
      - tools/gate_btc_reporting_operational_overlay.py
      - tools/gate_btc_health_dimensions.py
      - tests/test_gate_btc_2_challenger_foundation.py
      - tests/test_gate_btc_2_dataset_seal_readiness.py
      - tests/test_gate_btc_2_prospective_dataset_epoch_cutover.py
      - tests/test_gate_btc_2_item2_checkpoint4_decision.py
      - .github/workflows/gate-btc-2-dataset-seal-readiness.yml
  schedule:
    # Daily collection starts at 00:15 UTC and has historically published its
    # runtime pointer around 02:00 UTC. This assessment follows it and reuses
    # the same runtime evidence; no duplicate collector is created.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      expected_cutoff:
        description: Optional exact runtime cutoff (YYYY-MM-DD); empty derives it from the pointer
        required: false
        type: string
      min_d50_economic:
        description: Minimum immutable D50 economic count for this assessment
        required: true
        default: "0"
        type: string

permissions:
  contents: write

concurrency:
  group: gate-btc-2-dataset-seal-readiness-${{ github.ref }}
  cancel-in-progress: false

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  GATE_BTC_SHADOW_ONLY: "true"
  GATE_BTC_NOT_APPROVED: "true"
  GATE_BTC_ENGINE_FEED: "false"
  GATE_BTC_ORDERS: "0"
  GATE_BTC_REAL_CAPITAL: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  readiness-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile readiness gates
        run: >-
          python -m py_compile
          tools/gate_btc_2_challenger_foundation.py
          tools/gate_btc_2_dataset_seal_readiness.py
          tools/gate_btc_2_prospective_dataset_epoch_cutover.py
          tools/gate_btc_reporting_current_state.py
          tools/gate_btc_reporting_operational_overlay.py

      - name: Run false-green and track-isolation tests
        run: >-
          python -m unittest -v
          tests/test_gate_btc_2_challenger_foundation.py
          tests/test_gate_btc_2_dataset_seal_readiness.py
          tests/test_gate_btc_2_prospective_dataset_epoch_cutover.py
          tests/test_gate_btc_2_item2_checkpoint4_decision.py

  runtime-readiness-assessment:
    needs: readiness-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout baseline tools
        uses: actions/checkout@v4

      - name: Checkout canonical runtime evidence
        uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build coherent read-only reporting snapshot from same runtime checkout
        run: |
          mkdir -p artifacts/gate_btc_2/dataset_seal
          python tools/gate_btc_reporting_current_state.py \
            --runtime-root runtime_repo/runtime \
            --output artifacts/gate_btc_2/dataset_seal/reporting_current_state.json
          python tools/gate_btc_reporting_operational_overlay.py \
            --runtime-root runtime_repo/runtime \
            --state artifacts/gate_btc_2/dataset_seal/reporting_current_state.json

      - name: Assess original historical readiness without sealing
        env:
          EXPECTED_CUTOFF: ${{ inputs.expected_cutoff }}
          MIN_D50_ECONOMIC: ${{ inputs.min_d50_economic || '0' }}
        run: |
          args=(
            --pointer runtime_repo/runtime/GATE_BTC_LATEST_ELIGIBLE_RUN.json
            --measurement runtime_repo/runtime/GATE_BTC_MEASUREMENT_STATUS.json
            --reporting artifacts/gate_btc_2/dataset_seal/reporting_current_state.json
            --v2a runtime_repo/runtime/data_quality/v2a/STATUS.json
            --lock runtime_repo/runtime/ledgers/lock25_50/STATUS.json
            --gateway runtime_repo/runtime/ledgers/gateway_dynamics/STATUS.json
            --min-d50-economic "$MIN_D50_ECONOMIC"
            --output artifacts/gate_btc_2/dataset_seal/readiness.json
          )
          if [[ -n "$EXPECTED_CUTOFF" ]]; then
            args+=(--expected-cutoff "$EXPECTED_CUTOFF")
          fi
          python tools/gate_btc_2_dataset_seal_readiness.py "${args[@]}"

      - name: Assess replacement epoch cutover gate
        run: |
          python tools/gate_btc_2_prospective_dataset_epoch_cutover.py \
            --v2a-status runtime_repo/runtime/data_quality/v2a/STATUS.json \
            --snapshots-dir runtime_repo/runtime/data_quality/v2a/snapshots \
            --qualified-source-registry runtime_repo/runtime/data_quality/v2a/QUALIFIED_SOURCE_REGISTRY.json \
            --output artifacts/gate_btc_2/dataset_seal/prospective_epoch_cutover.json

      - name: Verify assessments cannot self-promote economics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          historical = json.loads(Path(
              'artifacts/gate_btc_2/dataset_seal/readiness.json'
          ).read_text(encoding='utf-8'))
          cutover = json.loads(Path(
              'artifacts/gate_btc_2/dataset_seal/prospective_epoch_cutover.json'
          ).read_text(encoding='utf-8'))
          assert historical['assessment_kind'] == 'READINESS_ONLY_NOT_A_DATASET_SEAL'
          assert historical['stage_3_dataset_sealed'] is False
          assert historical['official_challenger_runs_allowed'] is False
          assert historical['orders_generated'] == 0
          assert historical['real_capital_used'] == 0
          assert historical['promotion_allowed'] is False
          assert cutover['assessment_kind'] == 'CUTOVER_READINESS_ONLY_NO_ECONOMIC_CREDIT'
          assert cutover['historical_credit'] == 0
          assert cutover['prospective_credit_before_d0'] == 0
          assert cutover['backfill_performed'] is False
          assert cutover['counter_reset_performed'] is False
          assert cutover['engine_feed'] is False
          assert cutover['orders'] == 0
          assert cutover['real_capital_brl'] == 0
          assert cutover['promotion_allowed'] is False
          print('GATE_BTC_2_DATASET_READINESS=FAIL_CLOSED')
          PY

      - name: Materialize immutable D0 only on a passing native cutover gate
        if: github.event_name != 'pull_request'
        run: |
          python tools/gate_btc_2_prospective_dataset_epoch_cutover.py \
            --v2a-status runtime_repo/runtime/data_quality/v2a/STATUS.json \
            --snapshots-dir runtime_repo/runtime/data_quality/v2a/snapshots \
            --qualified-source-registry runtime_repo/runtime/data_quality/v2a/QUALIFIED_SOURCE_REGISTRY.json \
            --output artifacts/gate_btc_2/dataset_seal/prospective_epoch_cutover.json \
            --write-d0 runtime_repo/runtime/dataset_epochs/GATE_BTC_2_V2A_PROSPECTIVE_EPOCH_2026_09_03/D0.json

          if git -C runtime_repo status --porcelain -- runtime/dataset_epochs/GATE_BTC_2_V2A_PROSPECTIVE_EPOCH_2026_09_03/D0.json | grep -q .; then
            git -C runtime_repo config user.name "github-actions[bot]"
            git -C runtime_repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C runtime_repo add runtime/dataset_epochs/GATE_BTC_2_V2A_PROSPECTIVE_EPOCH_2026_09_03/D0.json
            git -C runtime_repo commit -m "GATE BTC 2.0: freeze prospective Dataset Epoch D0"
            git -C runtime_repo push origin HEAD:gate-btc-runtime
          else
            echo "No D0 mutation: cutover remains waiting or D0 is already frozen."
          fi

      - name: Upload readiness and cutover evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-2-dataset-seal-readiness-${{ github.run_id }}
          path: artifacts/gate_btc_2/dataset_seal/
          retention-days: 90
          if-no-files-found: error
