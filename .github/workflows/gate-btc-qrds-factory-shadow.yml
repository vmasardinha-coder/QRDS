name: GATE BTC QRDS Factory Shadow

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

concurrency:
  group: gate-btc-qrds-factory-shadow
  cancel-in-progress: false

env:
  RESEARCH_ONLY: "true"
  SHADOW_ONLY: "true"
  NOT_APPROVED: "true"
  ORDERS: "0"
  REAL_CAPITAL: "0"
  ENGINE_FEED: "false"

jobs:
  factory-shadow-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository read-only
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert immutable safety boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$RESEARCH_ONLY" = "true"
          test "$SHADOW_ONLY" = "true"
          test "$NOT_APPROVED" = "true"
          test "$ORDERS" = "0"
          test "$REAL_CAPITAL" = "0"
          test "$ENGINE_FEED" = "false"

      - name: Validate factory contracts
        run: python tools/gate_btc_factory/validate_factory_contracts.py

      - name: Execute factory shadow cycle
        run: python tools/gate_btc_factory/run_factory_ci.py

      - name: Assert no tracked repository mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':(exclude)tools/gate_btc_factory/FACTORY_STATUS_RUNTIME.json'
          git diff --cached --exit-code
          test -f tools/gate_btc_factory/FACTORY_STATUS_RUNTIME.json

      - name: Upload factory status artifact
        uses: actions/upload-artifact@v4
        with:
          name: qrds-factory-shadow-status-${{ github.run_id }}
          path: tools/gate_btc_factory/FACTORY_STATUS_RUNTIME.json
          if-no-files-found: error
          retention-days: 30
