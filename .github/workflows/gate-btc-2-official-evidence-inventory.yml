name: GATE BTC 2 Official Evidence Inventory

on:
  pull_request:
    branches: [main]
    paths:
      - tools/gate_btc_2_challenger_foundation.py
      - tools/gate_btc_2_dataset_seal_readiness.py
      - tools/gate_btc_2_official_dataset_contract_v1.json
      - tools/gate_btc_2_official_dataset_manifest.py
      - tools/gate_btc_2_official_evidence_inventory.py
      - tools/gate_btc_2_checkpoint6_dataset_contract_decision_v1.json
      - tools/gate_btc_2_checkpoint7_evidence_inventory_decision_v1.json
      - tests/test_gate_btc_2_*.py
      - .github/workflows/gate-btc-2-official-dataset-manifest.yml
      - .github/workflows/gate-btc-2-official-evidence-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-btc-2-official-evidence-inventory-${{ github.ref }}
  cancel-in-progress: false

env:
  GATE_BTC_RESEARCH_ONLY: "true"
  GATE_BTC_SHADOW_ONLY: "true"
  GATE_BTC_NOT_APPROVED: "true"
  GATE_BTC_ENGINE_FEED: "false"
  GATE_BTC_ORDERS: "0"
  GATE_BTC_REAL_CAPITAL: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  deterministic-preflight-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile GATE BTC 2.0 data-readiness layers
        run: >-
          python -m py_compile
          tools/gate_btc_2_challenger_foundation.py
          tools/gate_btc_2_dataset_seal_readiness.py
          tools/gate_btc_2_official_dataset_manifest.py
          tools/gate_btc_2_official_evidence_inventory.py

      - name: Run complete GATE BTC 2.0 contract suite
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_gate_btc_2_*.py'
          -v

  current-committed-evidence-remains-fail-closed:
    needs: deterministic-preflight-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout baseline tools
        uses: actions/checkout@v4

      - name: Checkout read-only committed evidence
        uses: actions/checkout@v4
        with:
          ref: gate-btc-runtime
          path: runtime_repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify clean runtime checkout
        run: |
          test -z "$(git -C runtime_repo status --porcelain)"
          git -C runtime_repo rev-parse HEAD | tee runtime_commit.txt
          test "$(wc -c < runtime_commit.txt)" -eq 41

      - name: Recompute current official readiness
        run: |
          python tools/gate_btc_2_dataset_seal_readiness.py \
            --pointer runtime_repo/runtime/GATE_BTC_LATEST_ELIGIBLE_RUN.json \
            --measurement runtime_repo/runtime/GATE_BTC_MEASUREMENT_STATUS.json \
            --reporting runtime_repo/runtime/GATE_BTC_REPORTING_CURRENT_STATE.json \
            --v2a runtime_repo/runtime/data_quality/v2a/STATUS.json \
            --lock runtime_repo/runtime/ledgers/lock25_50/STATUS.json \
            --gateway runtime_repo/runtime/ledgers/gateway_dynamics/STATUS.json \
            --output artifacts/gate_btc_2/checkpoint7/current_readiness.json

      - name: Inventory exact committed physical evidence
        run: |
          python tools/gate_btc_2_official_evidence_inventory.py \
            --runtime-root runtime_repo \
            --runtime-commit "$(tr -d '\n' < runtime_commit.txt)" \
            --readiness artifacts/gate_btc_2/checkpoint7/current_readiness.json \
            --contract tools/gate_btc_2_official_dataset_contract_v1.json \
            --output artifacts/gate_btc_2/checkpoint7/current_evidence_inventory.json

      - name: Verify commit binding and non-promotion boundary
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          commit = Path('runtime_commit.txt').read_text().strip()
          payload = json.loads(Path(
              'artifacts/gate_btc_2/checkpoint7/current_evidence_inventory.json'
          ).read_text(encoding='utf-8'))
          assert payload['runtime_commit'] == commit
          assert payload['status'] == 'BLOCKED_NO_ADMISSIBLE_OFFICIAL_DATASET_CANDIDATE'
          assert payload['admissible_candidate_count'] == 0
          assert payload['tabular_discovery']['unclassified_paths'] == []
          assert payload['manual_market_evidence']['file_count'] == 12
          assert payload['manual_market_evidence']['btc_nonempty_source_count'] == 3
          assert payload['manual_market_evidence']['btc_empty_sources'] == ['BYBIT_LINEAR']
          assert payload['v2a_latest']['survivorship_bias_present'] is True
          assert payload['d50']['source_paths_present'] is False
          safety = payload['safety']
          assert safety['official_dataset_descriptor_created'] is False
          assert safety['official_dataset_sealed'] is False
          assert safety['official_challenger_runs_executed'] == 0
          assert safety['economic_calibration_performed'] is False
          assert safety['engine_feed'] is False
          assert safety['orders_generated'] == 0
          assert safety['real_capital_used'] == 0
          for item in payload['physical_evidence']:
              observed = subprocess.check_output(
                  ['git', '-C', 'runtime_repo', 'rev-parse', f"{commit}:{item['path']}"],
                  text=True,
              ).strip()
              assert observed == item['git_blob_sha1'], item['path']
          assert subprocess.check_output(
              ['git', '-C', 'runtime_repo', 'status', '--porcelain'], text=True
          ) == ''
          print('GATE_BTC_2_PHYSICAL_EVIDENCE=VERIFIED_FAIL_CLOSED_NO_SEAL')
          PY

      - name: Upload read-only checkpoint evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-2-checkpoint7-evidence-${{ github.run_id }}
          path: artifacts/gate_btc_2/checkpoint7/
          retention-days: 90
          if-no-files-found: error
